 قضایی میتواند پیشنهادهای خود را در موارد مزبور به رئیس قوه قضائیه ارائه نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 574, "category": "other", "chapter": "", "text": "معاونان و مدیران کل سازمان قضایی میتوانند با ابلاغ رئیس قوه قضائیه ،عضو دادگاههای نظامی یک و یا تجدیدنظر نظامی تهران نیز باشند. تبصره -مقررات این ماده فقط درباره دارندگان پایه قضایی و یا قضات نظامی قابل اجرا است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 575, "category": "other", "chapter": "", "text": "هرگاه در اثر وقوع جرم ،ضرر و زیان مادی به نیروهای مسلح وارد شود ،یگان مربوط مکلف است تمام ادله و مدارک خود را به مرجع تعقیب تسلیم کند و نیز تا قبل از اعلام ختم دادرسی ،دادخواست ضرر و زیان خود را تسلیم دادگاه کند .مطالبه ضرر و زیان و رسیدگی به آن ،مستلزم رعایت تشریفات آیین دادرسی مدنی است اما نیازی به پرداخت هزینه دادرسی ندارد. تبصره –۱ دعوای اعسار از پرداخت محکومبه موضوع این ماده ،باید به طرفیت یگان محکومله دعوای اصلی اقامه شود. تبصره –۲ یگان متضرر از جرم ،حق طرح دعوی ،دفاع و پیگیری دعوی ،اعتراض و تجدیدنظرخواهی را مطابق مقررات مربوط دارد و گذشت یگان مذکور مسموع نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 576, "category": "other", "chapter": "", "text": "رسی دگی به دعوای خصوصی اشخاص حقیقی و حقوقی که به تبع امر کیفری در دادگاههای نظامی مطرح میشود، مستلزم تقدیم دادخواست و رعایت تشریفات آیین دادرسی مدنی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 577, "category": "other", "chapter": "", "text": "تخلف از مقررات مواد ( )۶۱۳( ،)۶۰۷( ،)۶۰۶( ،)۵۷۵ و تبصره ( )۳ ماده ( )۶۰۳ این قانون ،به حکم دادگاه نظامی ،موجب محکومیت به انفصال از شغل از سه ماه تا یکسال میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 578, "category": "other", "chapter": "", "text": "در مرکز هر استان ،سازمان قضایی استان متشکل از دادسرا و دادگاههای نظامی است .در شهرستانها در صورت نیاز، دادسرای نظامی ناحیه تشکیل میشود .حوزه قضایی دادسرای نظامی نواحی به تشخیص رئیس قوه قضائیه تعیین میشود. تبصره –۱ دادستان نظامی استان بر اقدامات قضات دادسرای نظامی ناحیه از حیث وظایفی که بر عهده دارند ،نظارت دارد و تعلیمات لازم را ارائه مینماید. تبصره –۲ رئیس دادسرای نظامی ناحیه که معاون دادستان نظامی مرکز استان است ،علاوه بر نظارت قضائی ،بر امور اداری نیز ریاست دارد. تبصره –۳ حوزه قضایی هر استان به تعداد لازم شعب دادگاه و دادسرا و نیز تشکیلات مورد نیاز از قبیل واحد ابلاغ ،اجرای احکام و واحد ارشاد و معاضدت قضایی دارد و در صورت تعدد شعب دادگاه و دادسرا ،هر یک دارای دفتر کل نیز میباشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 579, "category": "other", "chapter": "", "text": "رئیس سازمان قضایی استان ،رئیس شعبه اول دادگاه تجدیدنظر نظامی است و بر کلیه شعب دادگاه و دادسرای نظامی استان نظارت و ریاست اداری دارد .تصدی امور اداری در غیاب رئیس سازمان با معاون وی و در غیاب آنها با دادستان نظامی استان است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 580, "category": "other", "chapter": "", "text": "در صورت نیاز به تشخیص رئیس قوه قضائیه ،یک یا چند شعبه از دادگاههای نظامی استان در دادسرای نواحی موضوع ماده ( )۵۷۸ این قانون مستقر میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 581, "category": "other", "chapter": "", "text": "اختیارات و وظایف رئیس ،دادستان و دیگر مقامات قضایی سازمان قضایی استان با رعایت مقررات این بخش ،همان اختیارات و وظایفی است که حسب مورد برای رؤسای کل دادگستریها ،دادستان های عمومی و انقلاب و سایر مقامات قضایی دادگستری مقرر شده است. تبصره -گروه شغلی ،حقوق و مزایای قضات شاغل در سازمان قضایی همان است که برای همتراز آنان در دادگستری پیشبینی شده است .ولیکن با توجه به معافیت قضات نظامی از پرداخت مالیات ،همترازی آنان با محاسبه کسر مالیات میباشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 582, "category": "other", "chapter": "", "text": "دادگاههای نظامی که به موجب این قانون تشکیل میشوند ،عبارتند از: الف -دادگاه نظامی دو ب -دادگاه نظامی یک پ -دادگاه تجدیدنظر نظامی ت -دادگاه نظامی دو زمان جنگ ث -دادگاه نظامی یک زمان جنگ ج -دادگاه تجدیدنظر نظامی زمان جنگ", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 583, "category": "other", "chapter": "", "text": "وظایف ،اختیارات ،صلاحیت و تعداد اعضای دادگاههای نظامی دو ،نظامی یک و تجدیدنظر نظامی همان است که در مورد دادگاههای کیفری دو ،کیفری یک و تجدیدنظر استان مقرر شده است مگر مواردی که در این بخش به نحو دیگری درباره آن تعیین تکلیف شود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 584, "category": "other", "chapter": "", "text": "دادگاه نظامی یک در مرکز هر استان تشکیل میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 585, "category": "other", "chapter": "", "text": "به جرایم نظامیان زیر در دادگاه و دادسرای نظامی مرکز استان رسیدگی میشود: الف -نظامیان دارای درجه سرهنگی که در محل سرتیپ دومی و بالاتر شاغل میباشند. ب -نظامیان دارای درجه سرتیپ دومی در صورتی که مشمول مقررات ماده ( )۳۰۷ قانون آیین دادرسی کیفری مصوب ۱۳۹۲٫۱۲٫۴ نباشند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 586, "category": "other", "chapter": "", "text": "با انتخاب رئیس سازمان قضایی استان عضویت مستشاران دادگاه تجدیدنظر نظامی در دادگاه نظامی یک استان بلامانع است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 587, "category": "other", "chapter": "", "text": "هرگاه در محلی دادگاه نظامی دو تش کیل نشده یا بالتصدی باشد و یا تشکیل شده ولی با تراکم پرونده روبرو باشد، دادگاه نظامی یک حسب ارجاع ،به پرونده هایی که در صلاحیت دادگاه نظامی دو است نیز رسیدگی مینماید .در این صورت دادگاه مزبور با تصدی یکی از اعضا تشکیل میشود. تبصره -هرگاه در استانی دادگاه نظامی یک یا تجدیدنظر نظامی تشکیل نشده یا بالتصدی باشد یا به جهاتی از قبیل ر ّد دادرس، امکان رسیدگی در استان فراهم نبوده و اعزام قاضی مأمور نیز مقدور نباشد ،رسیدگی به پروندههای مربوط ،حسب مورد در نزدیکترین حوزه قضایی به عمل میآید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 588, "category": "other", "chapter": "", "text": "دادگاه نظامی یک ،پس از شروع به رسیدگی نمی تواند به اعتبار صلاحیت دادگاه نظامی دو ،قرار عدم صلاحیت صادر کند و به هر حال باید رأی مقتضی را صادر نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 589, "category": "other", "chapter": "", "text": "در صورت ضرورت ،برای رسیدگی به جرایم ارتکابی نظامیان که در صلاحیت سازمان قضایی است ،با تصویب رئیس قوه قضائیه ،ش عبه یا شعبی از دادسرای نظامی در محل استقرار تیپهای مستقل رزمی و بالاتر و یا رده همتراز آنها در سایر نیروها برای مدت معین تشکیل میشود .تأمین محل مناسب و امکانات مورد نیاز به عهده یگان مربوطه است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 590, "category": "other", "chapter": "", "text": "در زمان جنگ دادگاههای نظامی زمان جنگ با تصویب رئیس قوه قضائیه ،به تعداد مورد نیاز و به منظور رسیدگی به جرایم مربوط به جنگ با رعایت ماده ( )۵۹۱ این قانون در محل قرارگاههای عملیاتی ،مراکز استانها یا سایر مناطق مورد نیاز تشکیل میشود. تبصره –۱ حوزه قضایی دادگاههای نظامی زمان جنگ ،حسب مقتضیات و شرایط جنگی با تصویب رئیس قوه قضائیه تعیین میشود. تبصره –۲ دادگاههای نظامی دو ،نظامی یک و تجدیدنظر نظامی تا هنگام تشکیل دادگاههای نظامی زمان جنگ ،حسب مورد برابر مقررات دادرسی زمان جنگ ،به جرایم مربوط به جنگ رسیدگی میکنند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 591, "category": "other", "chapter": "", "text": "جرایم مربوط به جنگ که توسط نظامیان ارتکاب مییابد و در دادگاه زمان جنگ رسیدگی میشود ،عبارتند از: الف -کلیه جرایم ارتکابی در مناطق عملیاتی در حدود صلاحیت سازمان قضائی ب -جرایم علیه امنیت داخلی و خارجی در حدود صلاحیت سازمان قضائی پ -جرایم مربوط به امور جنگی مرتبط با اقدامات عملیاتی ،گر چه محل وقوع آن خارج از مناطق عملیاتی باشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 592, "category": "other", "chapter": "", "text": "ترکیب ،صلاحیت و آیین دادرسی دادسرا و دادگاههای نظامی زمان جنگ به ترتیب تعیینشده برای سایر دادگاههای نظامی است مگر آنکه در این قانون به نحو دیگری مقرر شود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 593, "category": "other", "chapter": "", "text": "دادسرای نظامی زمان جنگ در معیت دادگاههای نظامی زمان جنگ تشکیل می شود و در صورت عدم تشکیل ،دادسرای نظامی مرکز استان محل وقوع جرم ،وظایف آن را انجام میدهد. تبصره -قضات سازمان قضایی با ابلاغ رئیس قوه قضائیه می توانند با حفظ سمت ،حسب مورد به عنوان قضات دادسرا یا دادگاه نظامی زمان جنگ نیز انجام وظیفه نمایند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 594, "category": "other", "chapter": "", "text": "رئیس شعبه اول دادگاه تجدیدنظر نظامی زمان جنگ ،بر کلیه شعب دادگاهها و دادسرای نظامی زمان جنگ ،نظارت و ریاست اداری دارد و در غیاب وی ریاست اداری به عهده معاون وی و در غیاب آنان با دادستان نظامی زمان جنگ حوزه قضایی مربوط است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 595, "category": "other", "chapter": "", "text": "پس از انحلال دادسرا و دادگاههای نظامی زمان جنگ ،پروندههای مربوط حسب مورد در دادسرا و دادگاههای نظامی صالح برابر مقررات دادرسی زمان صلح رسیدگی میشود. تبصره -دادگاههای نظامی زمان جنگ ،با تصویب رئیس قوه قضائیه منحل میشوند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 596, "category": "other", "chapter": "", "text": "پشتیبانی و تأمین کلیه امکانات مورد نیاز دادگاههای نظامی زمان جنگ بر عهده قرارگاه عملیاتی محل تشکیل دادگاههای مزبور است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 597, "category": "other", "chapter": "", "text": "به جرایم مربوط به وظایف خاص نظامی و انتظامی اعضای نیروهای مسلح به جز جرایم در مقام ضابط دادگستری در سازمان قضایی رسیدگی میشود. تبصره –۱ رسیدگی به جرایمی که امام خمینی(ره) و مقام معظم رهبری اجازه فرمودهاند در دادگاهها و دادسراهای سازمان قضایی نیروهای مسلح رسیدگی شود ،مادامی که از آن عدول نشده در صلاحیت این سازمان است. تبصره –۲ منظور از جرایم مربوط به وظایف خاص نظامی و انتظام ی ،جرایمی است که اعضای نیروهای مسلح در ارتباط با وظایف و مسئولیتهای نظامی و انتظامی که طبق قانون و مقررات به عهده آنان است مرتکب گردند. تبصره –۳ رهایی از خدمت مانع رسیدگی به جرایم زمان اشتغال در دادگاه نظامی نمیشود. تبصره –۴ جرم در مقام ضابط دادگستری ،جرمی است که ضابطان در حین انجام وظایف قانونی خود در ارتباط با جرایم مشهود و یا در راستای اجرای دستور مقام قضایی دادگستری مرتکب میشوند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 598, "category": "other", "chapter": "", "text": "به اتهامات نظامیانی که در خارج از قلمرو حاکمیت جمهوری اسلامی ایران مرتکب جرم شوند و مطابق قانون ،دادگاههای ایران صلاحیت رسیدگی به آن ها را داشته باشند ،چنانچه از جرایمی باشد که در صلاحیت سازمان قضایی است ،در دادسرا و دادگاه نظامی تهران رسیدگی میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 599, "category": "other", "chapter": "", "text": "به جرایم نظامیان کمتر از هجده سال تمام شمسی که در صلاحیت سازمان قضایی است با رعایت مقررات مربوط به رسیدگی به جرایم اطفال و نوجوانان در دادسرا و دادگاههای نظامی رسیدگی میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 600, "category": "other", "chapter": "", "text": "در صورت اختلاف در صلاحیت بین دادگاه نظامی یک و دادگاه نظامی دو در حوزه قضایی یک استان ،نظر دادگاه نظامی یک متّبع است .در صورت اختلاف در صلاحیت بین دادگاه نظامی یک زمان جنگ و دادگاه نظامی دو زمان جنگ در حوزه قضایی یک استان ،نظر دادگاه نظامی یک زمان جنگ الزماالتباع است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 601, "category": "other", "chapter": "", "text": "در صورت اختلاف در صلاحیت بین دادگاه نظامی زمان جنگ با سایر مراجع قضایی نظامی در یک حوزه قضائی ،نظر دادگاه نظامی زمان جنگ متّبع است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 602, "category": "other", "chapter": "", "text": "ضابطان نظامی مأمورانی هستند که تحت نظارت و تعلیمات دادستان نظامی و دیگر مقامات قضایی مربوط در کشف جرم ،حفظ آثار و علائم و جمع آوری ادله وقوع جرم ،شناسایی ،یافتن متهم و جلوگیری از فرار و یا مخفی شدن او ،تحقیقات مقدماتی ،ابلاغ اوراق و اجرای تصمیمات قضایی به موجب قانون اقدام میکنند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 603, "category": "other", "chapter": "", "text": "مأموران زیر پس از کسب مهارتهای لازم و اخذ کارت مربوط ضابط نظامی میباشند: الف -مأموران دژبان نیروهای مسلح ب -مأموران حفاظت اطلاعات نیروهای مسلح در چهارچوب مأموریتها و وظایف قانونی پ -مأموران بازرسی و قضایی نیروهای مسلح ت -فرماندهان ،افسران و درجهداران آموزشدیده نیروی انتظامی ث -افسران و درجه داران نیروهای مسلح در جرایم مشهود در صورت عدم حضور سایر ضابطان نظامی ج -مقامات و مأمورانی که به موجب قوانین خاص در حدود وظایف محوله ضابط نظامی محسوب میشوند. تبصره –۱ رؤسا ،معاونان و مأموران زندانها و بازداشتگاههای نظامی در امور مربوط به زندانیان نظامی و همچنین مأموران حفاظت اطلاعات وزارت اطلاعات نسبت به جرایم کارکنان وزارت مزبور که در صلاحیت رسیدگی سازمان قضایی است ،ضابط نظامی محسوب میشوند. تبصره –۲ کارکنان وظیفه ،ضابط نظامی محسوب نمی شوند ،اما تحت نظارت ضابطان مربوط در این مورد انجام وظیفه میکنند و مسؤولیت اقدامات انجام شده در این رابطه با ضابطان نظامی است و این مسؤولیت نافی مسؤولیت کارکنان وظیفه نیست. تبصره –۳ ا جرای تصمیمات و دستورهای مراجع قضایی عمومی در یگان های نظامی و انتظامی به عهده ضابطان نظامی مربوط است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 604, "category": "other", "chapter": "", "text": "سازمان قضایی مکلف است به طور مستمر دورههای آموزشی حین خدمت را جهت کسب مهارتهای لازم و ایفای وظایف قانونی برای ضابطان نظامی برگزار نماید. تبصره -آییننامه اجرائی این ماده ظرف سه ماه از تاریخ لازم‌الاجرا شدن این قانون توسط رئیس سازمان قضایی و با هماهنگی ستاد کل نیروهای مسلح تهیه و به تصویب رئیس قوه قضائیه میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 605, "category": "other", "chapter": "", "text": "در غیاب ضابطان نظامی در محل وقوع جرم ،وظایف آنان به وسیله ضابطان دادگستری انجام میشود و پس از حضور ضابطان نظامی ،ادامه تحقیقات به آنان محول می شود ،مگر اینکه مقام قضایی ترتیب دیگری اتخاذ نماید .در این مورد ریاست و نظارت بر ضابطان به عهده دادستان نظامی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 606, "category": "other", "chapter": "", "text": "در موارد ضروری که به تشخیص قاضی رسیدگیکننده ،انجام تحقیقات مقدماتی ،جمعآوری دلایل ،بررسی صحنه جرم یا انجام کارشناسی به ضابطان یا کارشناسان خارج از یگان محول میشود ،فرمانده یگان محل وقوع جرم ،مکلف به همکاری با آنان است .همچنین وی میتواند به منظور رعایت مقررات و نظاما ت راجع به اسرار نظامی ،یک نفر نماینده برای همراهی با مأموران یا کارشناسان معرفی نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 607, "category": "other", "chapter": "", "text": "دادستان نظامی به منظور نظارت بر حسن اجرای وظایف ضابطان ،واحدهای مربوط را حداقل هر دو ماه یک بار مورد بازرسی قرار می دهد و در هر مورد ،مراتب را در دفتر مخصوصی که به این منظور تهیه می شود ،قید و دستورهای لازم را صادر میکند .مسؤولان یگان مربوط مکلف به همکاری هستند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 608, "category": "other", "chapter": "", "text": "فرماندهان و مسؤولان نظامی و انتظامی مکلفند به محض اطلاع از وقوع جرم در حوزه مسؤولیت خود ،مراتب را به مرجع قضایی صالح گزارش کنند .متخلف از مقررات این ماده به مجازات جرم کتمان حقیقت مقرر در قانون مجازات جرایم نیروهای مسلح محکوم میشود. تبصره -تعرفه خدمتی متهمان مانند سوابق کیفری ،انضباطی ،تشویقات ،آموزش های طی شده ،سوابق پزشکی و سایر اموری که میتواند در تصمیم مقام قضایی مؤثر باشد به مراجع قضایی ارسال میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 609, "category": "other", "chapter": "", "text": "ریاست و نظارت بر ضابطان نظامی از حیث وظایفی که به عنوان ضابط بر عهده دارند ،با دادستان نظامی است .سایر قضات دادسرا و دادگاه نظامی نیز در اموری که به ضابطان ارجاع میدهند ،حق نظارت و ارائه تعلیمات لازم را دارند. تبصره -ارجاع امر از س وی مقام قضایی به مأموران یا مقاماتی که حسب قانون ،ضابط تلقی نمیشوند ،موجب محکومیت انتظامی تا درجه چهار است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 610, "category": "other", "chapter": "", "text": "نقل و انتقال متهمان و محکومان دادسرا و دادگاههای نظامی به عهده دژبان یگانهای نیروهای مسلح ذیربط است و در صورتی که یگان مربوط در محل ،دژبان نداشته باشد ،توسط نیروی انتظامی صورت می گیرد ،مگر اینکه مرجع قضایی دستور خاصی صادر نماید که در این صورت برابر دستور انجام می شود .در هر صورت هزینه نقل و انتقال به عهده یگان بدرقه کننده است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 611, "category": "other", "chapter": "", "text": "یگانهای نظامی و انتظامی مکلفند گزارش فرار کارکنان وظیفه تحت امر خود را بلافاصله به حوزه وظیفه عمومی اعزامکننده ،دژبان مربوط و فرماندهی انتظامی محل سکونت افراد مزبور اعلام نمایند. تبصره -مأموران انتظامی و دژبان نظامی مربوط موظفند کارکنان وظیفه فراری موضوع این ماده را پس از شناسایی ،برابر مقررات دستگیر و به دادسرای نظامی محل دستگیری تحویل دهند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 612, "category": "other", "chapter": "", "text": "سایر وظایف ،اختیارات و مسئولیت های ضابطان نظامی در محدوده صلاحیت دادسرا و دادگاههای نظامی به شرحی است که برای ضابطان دادگستری مقرر شده است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 613, "category": "other", "chapter": "", "text": "قضات سازمان قضایی میتوانند در یگانهای نظامی و انتظامی با اطلاع فرمانده یگان یا رئیس یا مسؤول قسمت مربوط، تحقیقات و اقدامات لازم را درباره جرایمی که در صلاحیت آنان است خود یا از طریق ضابطان نظامی انجام دهند .مسؤولان و فرماندهان نظامی و انتظامی در این رابطه مکلف به همکاری میباشند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 614, "category": "other", "chapter": "", "text": "در مواردی که رسیدگی به امری از نظر علمی ،فنی ،مالی ،نظامی و یا سایر جهات نیاز به کارشناسی داشته باشد ،مرجع رسیدگیکننده از کارشناس یا هیئت کارشناسی کسب نظر مینماید. تبصره –۱ در مواردی که موضوع کارشناسی از امور نظامی باشد یا به تشخیص مرجع قضائی ،اظهارنظر کارشناسان نیروهای مسلح ضروری باشد ،نیروهای مسلح مکلفند نسبت به تأمین کارشناسان مورد نیاز و پرداخت هزینه کارشناسی اقدام نمایند. تبصره –۲ شرایط و نحوه تعیین کارشناس در موارد مربوط به امور نظامی ،تعداد و ترکیب هیأتهای کارشناسی ،نحوه رسیدگی به تخلفات و پرداخت هزینه آنان به موجب آییننامهای است که ظرف سه ماه از تاریخ لازم االجرا شدن این قانون توسط ستاد کل نیروهای مسلح با همکاری سازمان قضایی تهیه میشود و به تصویب فرماندهی کل قوا میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 615, "category": "other", "chapter": "", "text": "احضار متهمان نظامی و متهمان وزارت اطلاعات از طریق فرمانده یا مسؤول مافوق انجام میگیرد ،اما در موارد ضروری یا در صورتی که به متهم در یگان مربوطه دسترسی نباشد ،احضار از محل اقامت صورت می گیرد و مراتب به اطلاع فرمانده یا مسؤول مافوق میرسد. تبصره –۱ نحوه احضار و جلب فرماندهان و مسؤولان نیروهای مسلح بر اساس دستورالعملی است که به تصویب فرماندهی کل قوا میرسد. تبصره –۲ ابالغ احضاریه توسط مأموران ابلاغ در محل اقامت ،بدون استفاده از لباس رسمی و با ارائه کارت شناسایی انجام میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 616, "category": "other", "chapter": "", "text": "هرگاه ابلاغ احضاریه به علت معلوم نبودن محل اقامت متهم ممکن نباشد و این امر به طریق دیگری هم مقدور نباشد با موافقت رئیس سازمان قضایی استان یا معاون وی ،متهم یک نوبت به وسیله یکی از روزنامههای کثیرالانتشار کشوری یا محلی و با درج مهلت یک ماه از تاریخ نشر آگهی ،احضار می شود ،چنانچه متهم پس از انقضای مهلت مقرر حضور نیابد ،رسیدگی طبق مقررات ادامه مییابد. تبصره -در جرم فرار از خدمت ،ابلاغ احضاریه به آخرین نشانی محل اقامت متهم که در پرونده کارگزینی وی موجود است ،ابلاغ قانونی محسوب میشود و رسیدگی بر طبق مقررات و بدون رعایت تشریفات نشر آگهی ادامه مییابد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 617, "category": "other", "chapter": "", "text": "در صورتی که به تشخیص قاضی پرونده به لحاظ مصالح نیروهای مسلح ،حیثیت اجتماعی متهم ،عفت و یا امنیت عمومی ،ذکر درجه یا موضوع اتهام و یا نتیجه عدم حضور در احضارنامه و یا روزنامه به مصلحت نباشد ،درجه یا موضوع اتهام و یا نتیجه عدم حضور ذکر نمیشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 618, "category": "other", "chapter": "", "text": "در زمان جنگ ،صدور قرار بازداشت موقت با رعایت مقررات مندرج در این قانون در موارد زیر الزامی است: الف -جرایم موجب مجازات محارب یا مفسد فیاالرض ب -جرایم عمدی علیه امنیت داخلی و خارجی موجب مجازات تعزیری درجه پنج و بالاتر پ -شورش مسلحانه ت -لغو دستور حرکت به طرف دشمن یا محاربان و مفسدان یا در ناحیهای با شرایط جنگی و یا محدودیتهای ضروری اعلامشده ث -ایراد ضرب و یا جرح عمدی با سلاح ،نسبت به مافوق ج -قتل عمدی چ -فرار از جبهه ح -فرار از محل مأموریت یا منطقه درگیری در جریان عملیات علیه عوامل خرابکار ،ضدانقالب ،اشرار و قاچاقچیان مسلح خ -فرار همراه با سلاح گرم یا توسط هواپیما ،بالگرد ،کشتی ،ناوچه ،تانک و وسایل موتوری جنگی یا مجهز به سلاح جنگی د -فرار به سوی دشمن ذ -فرار با تبانی یا توطئه ر -سرقت سلاح و مهمات و وسایل نظامی در هنگام اردوکشی یا مأموریت آمادهباش یا عملیات رزمی یا در منطقه جنگی در صورت اخلال در مأموریت یگان و یا حمل سلاح ظاهر یا مخفی توسط یک یا چند نفر از مرتکبان در حین سرقت ز -تخریب ،آتش زدن ،از بین بردن و اتلاف عمدی تأسیسات ،ساختمانها ،استحکامات نظامی ،کشتی ،هواپیما و امثال آنها ،انبارها، راهها ،وسایل دیگر ارتباطی و مخابراتی یا الکترونیکی ،مراکز نگهداری اسناد طبقهبندیشده مورد استفاده نیروهای مسلح ،وسایل دفاعی ،تمام یا قسمتی از ملزومات جنگی ،مهمات و مواد منفجره اعم از اینکه مرتکب شخصا ً اقدام نماید یا دیگری را وادار به آن کند. تبصره -در مواردی که مجازات قانونی جرم حبس باشد ،مدت بازداشت موقت نباید از حداقل مجازات قانونی آن جرم تجاوز کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 619, "category": "other", "chapter": "", "text": "در خصوص قرار بازداشت موقت و سایر قرارهای تأمین که منتهی به بازداشت متهم میشود ،مرجع قضایی نظامی رسیدگیکننده مکلف است مراتب را در اسرع وقت به یگان مربوط اعلام نماید. تبصره -مفاد این ماده نسبت به سایر موارد سالب آزادی که در اجرای آرای دادگاهها صورت میگیرد نیز لازم‌الاجرا است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 620, "category": "other", "chapter": "", "text": "ک ارکنان فراری نیروهای مسلح تا به طور رسمی خود را برای ادامه خدمت به یگان مربوط معرفی ننمایند ،فرار آنان مستمر محسوب می شود و مشمول مقررات مرور زمان تعقیب نمیشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 621, "category": "other", "chapter": "", "text": "مقررات مرور زمان تعقیب نسبت به جرم فرار از خدمت کارکنان پایور (کادر) نیروهای مسلح در مواردی که ارتکاب این جرم برابر مقررات استخدامی مربوط ،مستلزم اخراج آنان از خدمت باشد ،قابل اعمال نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 622, "category": "other", "chapter": "", "text": "صدور قرار موقوفی تعقیب به لحاظ فوت یا عفو متهمان فراری یا شمول مرور زمان نسبت به جرم فرار از خدمت کارکنان پایور نیروهای مسلح که به طور رسمی خود را برای ادامه خدمت به یگان مربوط معرفی مینمایند یا دستگیر میشوند ،موجب تبدیل ایام فرار به انتساب نمی شود و از این جهت حقوق و مزایایی به آنان تعلق نمیگیرد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 623, "category": "other", "chapter": "", "text": "در خصوص جرایمی که رسیدگی به آن ها در صلاحیت دادسرا و دادگاه نظامی است ،ایامی که متهم یا محکومعلیه برخلاف قوانین و مقررات در کشور حضور نداشته است ،جزء مدت مرور زمان محسوب نمیشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 624, "category": "other", "chapter": "", "text": "ابتدای مرور زمان نسبت به جرایم در صلاحیت دادگاه نظامی دو زمان جنگ ،یک سال پس از اعلام پایان جنگ و در مورد جرایم در صلاحیت دادگاه نظامی یک زمان جنگ ،سه سال پس از اعلام پایان آن است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 625, "category": "other", "chapter": "", "text": "در جرایم علیه امنیت کشور یا در مواردی که پرونده مشتمل بر اسناد و اطلاعات سری و به کلی سری است و رسیدگی به آن ها در صلاحیت سازمان قضایی نیروهای مسلح است ،طرفین دعوی ،وکیل یا وکلای خود را از بین وکلای رسمی دادگستری که مورد تأیید سازمان قضایی نیروهای مسلح باشد ،انتخاب مینمایند. تبصره -تعیین وکیل در دادگاه نظامی زمان جنگ تابع مقررات مذکور در این ماده است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 626, "category": "other", "chapter": "", "text": "وکلای دارای تابعیت خارجی نمیتوانند برای دفاع در دادگاه نظامی حاضر شوند ،مگر اینکه در تعهدات بینالمللی به این موضوع تصریح شده باشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 627, "category": "other", "chapter": "", "text": "رئیس سازمان قضایی میتواند ارجاع پرونده ها را به رئیس شعبه دوم دادگاه تجدیدنظر نظامی استان تهران تفویض کند .ارجاع پروندهها در غیاب رئیس شعبه دوم دادگاه تجدیدنظر نظامی استان تهران بر عهده رؤسای دادگاههای تجدیدنظر نظامی به ترتیب شماره شعبه است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 628, "category": "other", "chapter": "", "text": "ارجاع پرونده ها در دادگاه نظامی در غیاب رئیس سازمان قضایی استان ،به عهده معاون و در غیاب وی به عهده رؤسای دادگاههای تجدیدنظر و نظامی یک و دو به ترتیب شماره شعبه است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 629, "category": "other", "chapter": "", "text": "هرگاه پس از صدور کیفرخواست معلوم شود که متهم مرتکب جرم دیگری از همان نوع شده است ،دادگاه میتواند به جرم مزبور نیز رسیدگی کند یا پرونده را جهت تکمیل تحقیقات به دادسرا ارسال نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 630, "category": "other", "chapter": "", "text": "در جرم فرار از خدمت تا زمانی که استمرار آن قطع نشده است ،رسیدگی غیابی صورت نمیگیرد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 631, "category": "other", "chapter": "", "text": "چنانچه در اجرای مأموریتهای نیروهای مسلح در اثر تیراندازی یا غیر آن ،شخص یا اشخاص بیگناهی مقتول یا مجروح شوند یا خسارت مالی به آنان وارد شود و درباره اتهام مأموران قرار منع تعقیب صادر شود ،بنا به تقاضای اولیای دم یا متضرر بدون تقدیم دادخواست ،پرونده جهت تعیین تکلیف در خصوص پرداخت دیه و خسارت توسط سازمان متبوع به دادگاه نظامی ارسال میشود .دادگاه نماینده یگان مربوط را برای شرکت در جلسه رسیدگی دعوت مینماید .عدم حضور نماینده مانع رسیدگی و صدور رأی نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 632, "category": "other", "chapter": "", "text": "دادگاه نظامی زمان جنگ پس از وصول پرونده برابر مقررات رسیدگی را آغاز و پس از اعلام ختم دادرسی با استعانت از خداوند متعال ،با تکیه بر شرف و وجدان و توجه به محتویات پرونده و ادله موجود ،در همان جلسه و در صورت عدم امکان در اولین فرصت و حدا کثر ظرف سه روز مبادرت به انشای رأی میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 633, "category": "other", "chapter": "", "text": "انتشار اطلاعات مربوط به آرای دادگاههای نظامی ممنوع است .اما رئیس سازمان قضایی در موارد ضروری و در صورت اقتضای مصلحت ،می تواند اطلاعات مربوط به آرای قطعی دادگاههای نظامی را جهت انتشار در اختیار پایگاه اطلاعرسانی قوه قضائیه و سازمان قضایی قرار دهد. تبصره -در مواردی که به تشخیص دادستان نظامی یا رئیس سازمان قضائی ،جهت پیشگیری از جرم آموزش ضروری باشد ،به میزان لازم اطلاعات مربوط به احکام و فرآیند رسیدگی به جرم در اختیار یگانها قرار میگیرد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 634, "category": "other", "chapter": "", "text": "آرای دادگاههای نظامی جز در مواردی که قطعی محسوب میشود حسب مورد در دادگاه تجدیدنظر نظامی همان استان و یا دیوان عالی کشور قابل تجدیدنظر یا فرجامخواهی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 635, "category": "other", "chapter": "", "text": "آرای دادگاههای نظامی از حیث قطعیت یا قابلیت تجدیدنظر یا فرجامخواهی مانند آرای سایر دادگاههای کیفری است، مگر آنکه در این بخش ترتیب دیگری مقرر شده باشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 636, "category": "other", "chapter": "", "text": "آرای قابل تجدیدنظر یا فرجامخواهی دادگاههای نظامی زمان جنگ ،ظرف هفتاد و دو ساعت از زمان ابلاغ ،قابل تجدیدنظر یا فرجام خواهی است و دادگاه تجدیدنظر یا دیوان عالی کشور باید حداکثر ظرف هفت روز پس از وصول پرونده، رسیدگی و رأی مقتضی را صادر نماید ،مگر آنکه صدور رأی در مدت مزبور به دلایل قانونی از قبیل نقص تحقیقات مقدور نباشد که در این صورت باید علت تأخیر به طور مستدل در پرونده قید شود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 637, "category": "other", "chapter": "", "text": "علاوه بر اشخاص مندرج در ماده ( )۴۷۵ قانون آیین دادرسی کیفری رئیس سازمان قضایی نیز نسبت به احکام قطعی دادگاههای نظامی حق درخواست اعاده دادرسی را دارد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 638, "category": "other", "chapter": "", "text": "در صورتی که مجازات مندرج در حکم دادگاه به لحاظ وضعیت خاص خدمتی محکومعلیه مانند محرومیت از ترفیع کارکنان بازنشسته ،قابل اجرا نباشد ،دادستان نظامی مطابق ضوابط ،حسب مورد حق درخواست تجدیدنظر یا فرجام را دارد .در این صورت مرجع تجدیدنظر یا فرجام جهت تعیین مجازات قانونی دیگر اقدام میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 639, "category": "other", "chapter": "", "text": "اجرای احکام دادگاههای نظامی مطابق مقررات قانون آیین دادرسی کیفری به عهده دادسرای نظامی صادرکننده کیفرخواست است .در موارد احاله و عدم صلاحیت ،اجرای احکام دادگاهها ،به ترتیب بر عهده دادسرای مرجع محالالیه و مرجع صالح به رسیدگی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 640, "category": "other", "chapter": "", "text": "پس از قطعیت آرای دادگاهها ،قاضی اجرای احکام مکلف است خلاصهای از رأی را به یگان مربوط ابلاغ نماید. تبصره -مفاد این ماده در مورد قرارهای نهائی دادسرا نیز توسط بازپرس لازم‌الاجرا است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 641, "category": "other", "chapter": "", "text": "علاوه بر موارد پیشبینیشده در قانون ،در مورد محکومیت به مجازاتهای زیر ،ایام بازداشت قبلی به شرح زیر محاسبه میشود: الف -کسر سه روز از مدت اضافه خدمت به ازای هر روز بازداشت قبلی ب -کسر چهار روز از مدت انفصال موقت از خدمت به ازای هر روز بازداشت قبلی پ -کسر پنج روز از مدت محرومیت از ترفیع به ازای هر روز بازداشت قبلی تبصره -در مورد محکومیت به کسر حقوق ،احتساب ایام بازداشت قبلی ،برابر مقررات مربوط به محکومیت به جزای نقدی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 642, "category": "other", "chapter": "", "text": "اجرای دستورها و آرای لازم‌الاجرای دادگاههای نظامی در مورد اخذ وجه التزام ،وجهالکفاله یا وثیقه و نیز جزای نقدی، وصول دیه ،رد مال و یا ضرر و زیان ناشی از جرم و سایر عملیات مربوط از قبیل توقیف یا فروش اموال ،در سازمان قضایی بر عهده قاضی اجرای احکام است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 643, "category": "other", "chapter": "", "text": "متهمان و محکومان دادسرا و دادگاههای نظامی با رعایت مقررات اجرائی سازمان زندانها و اقدامات تأمینی و تربیتی کشور در بازداشتگاههای رسمی و زندانها ی مستقل از سایر متهمان و زندانیان نگهداری میشوند .نگهداری محکومان و متهمان در یک مکان ممنوع است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 644, "category": "other", "chapter": "", "text": "در صورت تقاضای متهمان و محکومان نظامی سایر مراجع قضایی و موافقت دادستان مربوط و دادستان نظامی استان، این افراد مدت بازداشت یا محکومیت حبس خود را در بازداشتگاهها و زندانهای نظامی سپری مینمایند. تبصره -محکومان غیر نظامی دادگاه های نظامی و محکومان نظامی که محکومیت آنان منجر به اخراج میشود ،با رعایت مقررات فوق جهت تحمل محکومیت حبس به زندانهای عمومی معرفی میشوند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 645, "category": "other", "chapter": "", "text": "تا زمانی که بازداشتگاهها و زندانها ی نظامی احداث نگردیده است و یا ظرفیت پذیرش آنها متناسب با تعداد متهمان و محکومان نظامی نباشد ،سازمان زندان ها و اقدامات تأمینی و تربیتی مکلف است افراد مزبور را در بند اختصاصی نظامیان نگهداری نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 646, "category": "other", "chapter": "", "text": "نحوه نگهداری محکومان و متهمان دادسراها و دادگاههای نظامی با رعایت آییننامه اجرائی سازمان زندانها و اقدامات تأمینی و تربیتی کشور برابر آییننامهای است که ظرف سه ماه از تاریخ لازم‌الاجرا شدن این قانون توسط سازمان زندانها و اقدامات تأمینی و تربیتی کشور با همکاری سازمان قضایی تهیه میشود و به تصویب رئیس قوه قضائیه میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 647, "category": "other", "chapter": "", "text": "دادستان نظامی بر امور بازداشتگاهها و زندانها ی نظامی حوزه قضایی خود نظارت کامل دارد .اجرای این ماده نافی اختیارات قانونی سازمان زندانها و اقدامات تأمینی و تربیتی کشور نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 648, "category": "other", "chapter": "", "text": "مواردی که مقررات ویژهای برای دادرسی جرایم نیروهای مسلح مقرر نگردیده است ،تابع مقررات عمومی آیین دادرسی کیفری است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 649, "category": "other", "chapter": "", "text": "به منظور سیاستگذاری و تدوین راهبردهای ملی ،برنامهریزی میانمدت و بلندمدت و تدوین آییننامههای لازم برای توسعه و ارتقای دادرسی الکترونیکی و نظارت بر حسن اجرای آنها« ،شورای راهبری دادرسی الکترونیکی» که در این بخش به اختصار شورا نامیده میشود به ریاست رئیس قوه قضائیه و عضویت افراد زیر تشکیل میشود: الف -رئیس مرکز آمار و فناوری اطلاعات قوه قضائیه (دبیر شورا) ب -معاون حقوقی قوه قضائیه پ -رئیس دیوان عالی کشور ت -دادستان کل کشور ث -رئیس دیوان عدالت اداری ج -رئیس سازمان قضایی نیروهای مسلح چ -رئیس سازمان زندانها و اقدامات تأمینی و تربیتی کشور ح -رئیس سازمان ثبت اسناد و املاک کشور خ -رئیس سازمان بازرسی کل کشور د -رئیس سازمان پزشکی قانونی کشور ذ -معاون آموزش و تحقیقات قوه قضائیه ر -معاون راهبردی قوه قضائیه ز -مسؤول حفاظت و اطلاعات قوه قضائیه ژ -وزیر دادگستری س -وزیر ارتباطات و فناوری اطلاعات ش -فرمانده نیروی انتظامی کشور ص -یک نفر نماینده عضو کمیسیون قضایی و حقوقی به انتخاب مجلس شورای اسلامی به عنوان عضو ناظر ض -سه نفر به انتخاب رئیس قوه قضائیه تبصره –۱ شورا با اکثریت اعضا رسمیت می یابد و مصوبات آن با اکثریت آرای حاضران و پس از تصویب رئیس قوه قضائیه قابل اجرا است و نافی اختیارات رئیس قوه قضائیه نیست. تبصره –۲ دبیر شورا می تواند حسب مورد از مسؤولان مرتبط و کارشناسان برای حضور در جلسه دعوت به عمل آورد. تبصره –۳ دبیرخانه شورا در مرکز آمار و فناوری اطلاعات قوه قضائیه تشکیل میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 650, "category": "other", "chapter": "", "text": "به منظور ساماندهی پرونده ها و اسناد قضایی و ارائه بهتر خدمات قضایی و دستیابی روزآمد به آمار و گردش کار قضایی در سراسر کشور و همچنین ارائه آمار و اطلاعات دقیق و تفصیلی در خصوص جرایم ،متهمان ،بزهدیدگان و مجرمان و سایر اطلاعات قضائی« ،مرکز ملی دادههای قوه قضائیه» در مرکز آمار و فناوری اطلاعات قوه قضائیه با استفاده از افراد موثق راهاندازی میشود. تبصره –۱ نحوه و میزان دسترسی مراجع ذیصلاح قضایی به اطلاعات این مرکز به موجب آییننامهای است که ظرف سه ماه از تاریخ لازم‌الاجرا شدن این قانون توسط شورا تهیه میشود و به تصویب رئیس قوه قضائیه میرسد. تبصره –۲ اسناد ،مدارک و اطلاعات این مرکز با رعایت قوانین و مقررات به موجب آییننامهای که ظرف سه ماه از تاریخ تصویب این قانون توسط شورا تهیه و به تصویب رئیس قوه قضائیه میرسد ،در اختیار مراکز علمی ،پژوهشکدهها و پژوهشگران قرار می گیرد .استفاده از اسناد ،مدارک و اطلاعات مزبور نباید موجب هتک حرمت و حیثیت اشخاص شود .انتشار اطلاعات مربوط به هویت افراد مرتبط با دادرسی از قبیل نام ،نام خانوادگی ،شماره پستی و شماره ملی آنان جز در مواردی که قانون تجویز کند ،ممنوع است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 651, "category": "other", "chapter": "", "text": "کلیه دستگاه های تابعه قوه قضائیه ،نظیر دیوان عدالت اداری ،سازمان بازرسی کل کشور ،سازمان زندانها و اقدامات تأمینی و تربیتی کشور ،سازمان ثبت اسناد و املاک کشور ،سازمان پزشکی قانونی ،سازمان قضایی نیروهای مسلح و مراجع ذیربط در عفو و بخشودگی و سجل کیفری ،و روزنامه رسمی جمهوری اسلامی ،موظفند کلیه اطلاعات خود را در مرکز ملی دادههای قوه قضائیه قرار دهند و آنها را روزآمد نگه دارند. تبصره –۱ آییننامه اجرائی نحوه دسترسی به اطلاعات محرمانه و سری در مرکز ملی دادههای قوه قضائیه توسط آن قوه تهیه میشود و به تصویب رئیس قوه قضائیه میرسد. تبصره –۲ مراجع انتظامی و سایر ضابطان و دستگاهها ،هیئت ها و کمیسیونهای ذیربط موظفند اطلاعات مرتبط با امور قضایی خود را در مرکز ملی دادههای قوه قضائیه قرار دهند و آنها را روزآمد نگه دارند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 652, "category": "other", "chapter": "", "text": "قوه قضائیه موظف است به منظور ساماندهی ارتباطات الکترونیکی بین محاکم ،ضابطان و دستگاههای تابعه خود و نیز سایر اشخاص حقیقی و حقوقی که در جریان دادرسی به اطلاعات آنها نیاز است« ،شبکه ملی عدالت» را با به کارگیری تمهیدات امنیتی مطمئن از قبیل امضای الکترونیکی راهاندازی کند. تبصره -مراجع قضایی می توانند استعلامات قضایی و کسب اطلاعات لازم را از طریق شبکه ملی عدالت به عمل آورند .در این صورت دستگاه های دولتی ،نهادهای عمومی غیردولتی و شخصیتهای حقوقی موظفند پاسخ لازم را از طریق شبکه مزبور اعلام کنند. مستنکف از مفاد این تبصره مشمول ماده ( )۵۷۶ قانون مجازات اسلامی -کتاب پنجم تعزیرات -مصوب ۱۳۷۵٫۳٫۲ است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 653, "category": "other", "chapter": "", "text": "قوه قضائیه موظف است اطلاعات زیر را از طریق «درگاه ملی قوه قضائیه» ارائه کند و آنها را روزآمد نگه دارد. الف -اهداف ،وظایف ،سیاستها ،خط مشی ها و ساختار کالن مدیریتی و اجرائی قوه قضائیه به همراه معرفی مسؤولان و شرح وظایف و نحوه ارتباط با آنان ب -نشانی ،شماره تماس و پیوند به تارنمای (وبسایت) تمامی معاونتها و دادگستریهای استانها ،دستگاههای تابعه قوه قضائیه، وزارت دادگستری ،کانونهای وکلای دادگستری و کارشناسان رسمی دادگستری پ -کلیه قوانین لازم االجرا ،آرای وحدت رویه هیئت عمومی دیوان عالی کشور و آرای هیئت عمومی دیوان عدالت اداری، بخشنامههای رئیس قوه قضائیه و نظریات مشورتی اداره حقوقی قوه قضائیه ت -آرای صادره از سوی محاکم در صورتی که به تشخیص قاضی اجرای احکام خلاف عفت عمومی یا امنیت ملی نباشد به صورت برخط (آنالین) برای تحلیل و نقد صاحبنظران و متخصصان با حفظ حریم خصوصی اشخاص ث -خدمات معاضدت قضایی به مقامات ذیصلاح سایر کشورها بر پایه اسناد و معاهدههای همکاری حقوقی بینالمللی و اطلاعات راجع به خدمات حقوقی و قضایی به اتباع سایر کشورها ج -آموزش آسان و قابل درک عمومی چگونگی اقامه دعوی برای شهروندان چ -اطلاعات پژوهشی و علمی حقوقی -قضائی", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 654, "category": "other", "chapter": "", "text": "قوه قضائیه موظف است برای دادگستری استانهای سراسر کشور ،و دستگاههای تابعه قوه قضائیه ،تارنمای (وبسایت) اختصاصی راه اندازی کند و مراجع مزبور موظفند اطلاعات ذیل را در آن ارائه کنند و آنها را روزآمد نگه دارند: الف -نمودار تشکیلاتی دادگاه ها ،به تفکیک تخصص و سلسله مراتب قضائی ،به همراه معرفی مسؤولان و شرح وظایف و نحوه ارتباط با آنان ب -نشانی و شماره تماس دادگاهها ،سایر دستگاههای تابعه قوه قضائیه و مراجع انتظامی در سطح استان پ -پیوند به تارنماهای سایر مراجع قضایی و دستگاههای ذیربط ت -کلیه اطلاعات مورد نیاز برای محاسبه هزینه دادرسی ،مانند بهای منطقهای املاک ث -آموزش آسان و قابل درک عمومی چگونگی اقامه دعوی برای شهروندان ج -سمینارها یا نشستهای الکترونیکی استانی قضایی زنده یا ضبطشده چ -اطلاعات پژوهشی و علمی حقوقی -قضائی", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 655, "category": "other", "chapter": "", "text": "در هر مورد که به موجب قوانین آیین دادرسی و سایر قوانین و مقررات موضوعه اعم از حقوقی و کیفری ،سند ،مدرک، نوشته ،برگه اجرائیه ،اوراق رأی ،امضا ،اثر انگشت ،ابلاغ اوراق قضائی ،نشانی و مانند آن لازم باشد صورت الکترونیکی یا محتوای الکترونیکی آن حسب مورد با رعایت ساز و کارهای امنیتی مذکور در مواد این قانون و تبصرههای آن کافی و معتبر است. تبصره –۱ در کلیه م راحل تحقیق و رسیدگی حقوقی و کیفری و ارائه خدمات الکترونیک قضائی ،نمیتوان صرفا ً به لحاظ شکل یا نحوه تبادل اطلاعات الکترونیکی از اعتبار بخشیدن به محتوا و آثار قانونی آن خودداری نمود .قوه قضائیه موظف است سامانههای امنیتی لازم را جهت تبادل امن اطلاعات و ارتب اطات بین اصحاب دعوی ،کارشناسان ،دفاتر خدمات الکترونیک قضائی ،ضابطان و مراجع قضایی و سازمانهای وابسته به قوه قضائیه ایجاد نماید. تبصره –۲ قوه قضائیه می تواند جهت طرح و پیگیری امور قضایی مراجعان موضوع این قانون در فضای مجازی نسبت به ایجاد دفاتر خدمات الکترو نیک قضایی و جهت هماهنگی فعالیت دفاتر ،نسبت به ایجاد کانون دفاتر خدمات الکترونیک قضائی ،با استفاده از ظرفیت بخش خصوصی اقدام نماید .دفاتر خدمات الکترونیک قضایی می توانند از بین دفاتر اسناد رسمی و غیر آن انتخاب یا تأسیس شوند .آییننامه اجرائی این ماده ظرف سه ماه از تاریخ لازم‌الاجرا شدن این قانون توسط شورا تهیه میشود و به تصویب رئیس قوه قضائیه میرسد. تبصره –۳ مراجعان به قوه قضائیه موظفند پست الکترونیکی و شماره تلفن همراه خود را در اختیار قوه قضائیه قرار دهند ،و در صورت عدم دسترسی به پست الکترونیک ،مرکز آمار موظف است برای شهروندان و متقاضیان امکانات لازم برای دسترسی به پست الکترونیکی ملی قضایی جهت امور قضایی ایجاد کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 656, "category": "other", "chapter": "", "text": "به منظور حفظ صحت و تمامیت ،اعتبار و انکارناپذیری اطلاعات مبادله شده میان شهروندان و محاکم قضائی ،قوه قضائیه موظف است تمهیدات امنیتی مطمئن برای امضای الکترونیکی ،احراز هویت و احراز اصالت را فراهم آورد. تبصره -قوه قضائیه موظف است مرکز صدور گواهی ریشه برای امضای الکترونیکی را جهت ایجاد ارتباطات و مبادله اطلاعات امن راهاندازی نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 657, "category": "other", "chapter": "", "text": "مرکز آمار و فناوری اطلاعات قوه قضائیه موظف است به منظور اجرا و توسعه خدمات پرداخت الکترونیکی هزینههای دادرسی و سایر پرداختهای مربوط به دادرسی و اجرای حکم توسط شهروندان ،اقدام و راهنمایی لازم را به عمل آورد. تبصره -در راستای ترغیب شهروندان به بهرهبرداری از دادرسی الکترونیکی ،در مرحله بدوی هزینه دادرسی آنان پنج درصد ( )۵ ٪و حداکثر تا سقف ده میلیون ریال کمتر خواهد بود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 658, "category": "other", "chapter": "", "text": "قوه قضائیه موظف است تمهیدات فنی و قانونی لازم را برای حفظ حریم خصوصی افراد و تأمین امنیت دادههای شخصی آنان ،در چهارچوب اقدامات این بخش فراهم آورد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 659, "category": "other", "chapter": "", "text": "به کارگیری سامانههای ویدئو کنفرانس و سایر سامانه های ارتباطات الکترونیکی به منظور تحقیق از اصحاب دعوی، اخذ شهادت از شهود یا نظرات کارشناسی در صورتی مجاز است که احراز هویت ،اعتبار اظهارات فرد مورد نظر و ثبت مطمئن سوابق صورت پذیرد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 660, "category": "other", "chapter": "", "text": "چنانچه اشخاصی که دادههای موضوع این بخش را در اخت یار دارند ،موجبات نقض حریم خصوصی افراد یا محرمانگی اطلاعات را فراهم آورند یا به طور غیرمجاز آنها را افشاء کرده یا در دسترس اشخاص فاقد صلاحیت قرار دهند ،به حبس از دو تا پنج سال یا جزای نقدی از بیست تا دویست میلیون ریال و انفصال از خدمت از دو تا ده سال محکوم خواهند شد. جزای نقدی مندرج در این ماده به موجب مصوبه مورخ ۱۴۰۳٫۴٫۴ هیات وزیران به ۱۰۰٫۰۰۰٫۰۰۰ تا ۱٫۰۰۰٫۰۰۰٫۰۰۰ ریال تعدیل شد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 661, "category": "other", "chapter": "", "text": "چنانچه اشخاصی که مسؤول حفظ امنیت مراکز ،سامانههای رایانهای و مخابراتی و اطلاعات موضوع این بخش هستند یا دادهها یا سامانه(سیستم)های مذکور در اختیار آنان قرار گرفته است بر اثر بیاحتیاطی یا بیمبالاتی یا عدم مهارت یا عدم رعایت تدابیر متعارف امنیتی موجبات ارتکاب جرائم رایانهای به وسیله یا علیه دادهها و سامانههای رایانهای و مخابراتی را فراهم آورند ،به حبس از شش ماه تا دو سال یا انفصال ازخدمت تا پنج سال یا جزاینقدی از ده تا صدمیلیون ریال محکوم خواهند شد. جزای نقدی مندرج در این ماده به موجب مصوبه مورخ ۱۴۰۳٫۴٫۴ هیات وزیران به ۵۰٫۰۰۰٫۰۰۰ تا ۵۰۰٫۰۰۰٫۰۰۰ ریال تعدیل شد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 662, "category": "other", "chapter": "", "text": "قوه قضائیه موظف است برای آموزش دادرسی الکترونیکی به قضات ،کارکنان قضائی ،دستگاههای تابعه قضایی و مراجع انتظامی اقدام کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 663, "category": "other", "chapter": "", "text": "آییننامه های اجرائی این بخش ،ظرف سه ماه از تاریخ تصویب این قانون توسط شورا تهیه و به تصویب رئیس قوه قضائیه میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 664, "category": "other", "chapter": "", "text": "علاوه بر موارد پیشبینیشده در دیگر قوانین ،دادگاههای ایران صلاحیت رسیدگی به موارد زیر را دارند: الف -دادههای مجرمانه یا دادههایی که برای ارتکاب جرم به کار رفتهاند که به هر نحو در سامانههای رایانهای و مخابراتی یا حامل های داده موجود در قلمرو حاکمیت زمینی ،دریایی و هوایی جمهوری اسلامی ایران ذخیره شود. ب -جرم از طریق تارنماهای دارای دامنه مرتبه بالای کد کشوری ایران ) )irارتکاب یابد. پ -جرم توسط تبعه ایران یا غیر آن در خارج از ایران علیه سامانههای رایانهای و مخابراتی و تارنماهای مورد استفاده یا تحت کنترل قوای سهگانه یا نهاد رهبری یا نمایندگیهای رسمی دولت یا هر نهاد یا مؤسسهای که خدمات عمومی ارائه میدهد یا علیه تارنماهای دارای دامنه مرتبه بالای کد کشوری ایران در سطح گسترده ارتکاب یابد. ت -جرایم رایانهای متضمن سوءاستفاده از اشخاص کمتر از هجده سال ،اعم از اینکه بزهدیده یا مرتکب ایرانی یا غیر ایرانی باشد و مرتکب در ایران یافت شود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 665, "category": "other", "chapter": "", "text": "چنانچه جرم رایانهای در صلاحیت دادگاه های ایران در محلی کشف یا گزارش شود ،ولی محل وقوع آن معلوم نباشد، دادسرای محل کشف مکلف است تحقیقات مقدماتی را انجام دهد .در صورتی که محل وقوع جرم مشخص نشود ،دادسرا پس از اتمام تحقیقات مبادرت به صدور قرار و در صورت اقتضا صدور کیفرخواست می کند و دادگاه مربوط نیز رأی مقتضی را صادر میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 666, "category": "other", "chapter": "", "text": "قوه قضائیه موظف است به تناسب ضرورت ،شعبه یا شعبی از دادسراها ،دادگاههای کیفری یک ،کیفری دو ،اطفال و نوجوانان ،نظامی و تجدیدنظر را برای رسیدگی به جرایم رایانهای اختصاص دهد. تبصره -مقامات قضایی دادسراها و دادگاههای مذکور از میان قضاتی که آشنایی لازم به امور رایانه دارند انتخاب میشوند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 667, "category": "other", "chapter": "", "text": "ارائهدهندگان خدمات دسترسی موظفند دادههای ترافیک را حداقل تا شش ماه پس از ایجاد حفظ نمایند و اطلاعات کاربران را حداقل تا شش ماه پس از خاتمه اشتراک نگهداری کنند. تبصره –۱ داده ترافیک ،هرگونه دادهای است که سامانههای رایانهای در زنجیره ارتباطات رایانهای و مخابراتی تولید میکنند تا امکان ردیابی آنها از مبدأ تا مقصد وجود داشته باشد .این دادهها شامل اطلاعاتی از قبیل مبدأ ،مسیر ،تاریخ ،زمان ،مدت و حجم ارتباط و نوع خدمات مربوطه میشود. تبصره –۲ اطالعات کاربر ،هرگونه اطلاعات راجع به کاربر خدمات دسترسی از قبیل نوع خدمات ،امکانات فنی مورد استفاده و مدت زمان آن ،هویت ،نشانی جغرافیایی یا پستی یا قرارداد اینترنت ( ،)IPشماره تلفن و سایر مشخصات فردی را شامل میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 668, "category": "other", "chapter": "", "text": "ارائه دهندگان خدمات میزبانی داخلی موظفند اطلاعات کاربران خود را حداقل تا شش ماه پس از خاتمه اشتراک و محتوای ذخیره شده و داده ترافیک حاصل از تغییرات ایجادشده را حداقل تا پانزده روز نگهداری کنند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 669, "category": "other", "chapter": "", "text": "هرگاه حفظ داده های رایانه ای ذخیره شده برای تحقیق یا دادرسی لازم باشد ،مقامقضائی می تواند دستور حفاظت از آنها را برای اشخاصی که به نحوی تحت تصرف یا کنترل دارند صادر کند .در شرایط فوری ،نظیر خطر آسیب دیدن یا تغییر یا از بین رفتن داده ها ،ضابطان قضائی می توانند دستور حفاظت را صادر کنند و مراتب را حداکثر تا بیست و چهار ساعت به اطلاع مقام قضائی برسانند .چنانچه هر یک از کارکنان دولت یا ضابطان قضائی یا سایر اشخاص از اجرای این دستور خودداری یا داده های حفاظت شده را افشاء کنند یا اشخاصی که داده های مزبور به آنها مربوط می شود را از مفاد دستور صادره آگاه کنند ،ضابطان قضائی و کارکنان دولت به مجازات امتناع از دستور مقام قضائی و سایر اشخاص به حبس از نود و یک روز تا ششماه یا جزای نقدی از پنج تا ده میلیون ریال یا هردو مجازات محکوم میشوند. جزای نقدی مندرج در این ماده به موجب مصوبه مورخ ۱۴۰۳٫۴٫۴ هیات وزیران به ۳۳٫۰۰۰٫۰۰۰ تا ۶۶٫۰۰۰٫۰۰۰ ریال تعدیل شد. تبصره –۱ حفظ دادهها به منزله ارائه یا افشای آنها نیست و مستلزم رعایت مقررات مربوط است. تبصره –۲ مدت زمان حفاظت از دادهها حداکثر سه ماه است و در صورت لزوم با دستور مقام قضایی قابل تمدید است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 670, "category": "other", "chapter": "", "text": "مقام قضایی میتواند دستور ارائه دادههای حفاظتشده مذکور در مواد ( )۶۶۸( ،)۶۶۷ و ( )۶۶۹ این قانون را به اشخاص یادشده بدهد تا در اختیار ضابطان قرار گیرد .خودداری از اجرای این دستور و همچنین عدم نگهداری و عدم مواظبت از این دادهها موجب مجازات مقرر در ماده ( )۶۶۹ این قانون میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 671, "category": "other", "chapter": "", "text": "تفتیش و توقیف دادهها یا سامانههای رایانهای و مخابراتی به موجب دستور قضایی و در مواردی به عمل میآید که ظن قوی به کشف جرم یا شناسایی متهم یا ادله جرم وجود دارد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 672, "category": "other", "chapter": "", "text": "تفتیش و توقیف دادهها یا سامانههای رایانهای و مخابراتی در حضور متصرفان قانونی یا اشخاصی که به نحوی آنها را تحت کنترل قانونی دارند ،نظیر متصدیان سامانهها انجام می شود .در صورت عدم حضور یا امتناع از حضور آنان چنانچه تفتیش یا توقیف ضرورت د اشته باشد یا فوریت امر اقتضا کند ،قاضی با ذکر دلایل دستور تفتیش و توقیف بدون حضور اشخاص مذکور را صادر میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 673, "category": "other", "chapter": "", "text": "دستور تفتیش و توقیف باید شامل اطلاعاتی از جمله اجرای دستور در محل یا خارج از آن ،مشخصات مکان و محدوده تفتیش و توقیف ،نوع و میزان دادههای مورد نظر ،نوع و تعداد سختافزارها و نرمافزارها ،نحوه دستیابی به دادههای رمزنگاری یا حذف شده و زمان تقریبی انجام تفتیش و توقیف باشد که به اجرای صحیح آن کمک میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 674, "category": "other", "chapter": "", "text": "تفتیش دادهها یا سامانههای رایانهای و مخابراتی شامل اقدامات ذیل میشود: الف -دسترسی به تمام یا بخشی از سامانههای رایانهای یا مخابراتی ب -دسترسی به حاملهای داده از قبیل دیسکت تا یا لوحهای فشرده یا کارتهای حافظه پ -دستیابی به دادههای حذف یا رمزنگاریشده", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 675, "category": "other", "chapter": "", "text": "در توقیف دادهها ،با رعایت تناسب ،نوع ،اهمیت و نقش آنها در ارتکاب جرم ،به روشهایی از قبیل چاپ دادهها، تصویربرداری از تمام یا بخشی از دادهها ،غیرقابل دسترس کردن دادهها با روشهایی از قبیل تغییر گذرواژه یا رمزنگاری و ضبط حاملهای داده عمل میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 676, "category": "other", "chapter": "", "text": "در شرایط زیر سامانههای رایانهای یا مخابراتی توقیف میشوند: الف -دادههای ذخیرهشده به سهولت در دسترس نباشد یا حجم زیادی داشته باشد. ب -تفتیش و تجزیه و تحلیل دادهها بدون سامانه سختافزاری امکانپذیر نباشد. پ -متصرف قانونی سامانه رضایت داده باشد. ت -تصویربرداری از دادهها به لحاظ فنی امکانپذیر نباشد. ث -تفتیش در محل باعث آسیب دادهها شود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 677, "category": "other", "chapter": "", "text": "توقیف سامانههای رایانهای یا مخابراتی متناسب با نوع و اهمیت و نقش آنها در ارتکاب جرم با روشهایی از قبیل تغییر گذرواژه به منظور عدم دسترسی به سامانه ،مهر و موم (پلمب) سامانه در محل استقرار و ضبط سامانه صورت میگیرد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 678, "category": "other", "chapter": "", "text": "چنانچه در حین اجرای دستور تفتیش و توقیف ،تفتیش دادههای مرتبط با جرم ارتکابی در سایر سامانههای رایانهای یا مخابراتی که تحت کنترل یا تصرف متهم قرار دارند ضروری باشد ،ضابطان با دستور مقام قضایی دامنه تفتیش و توقیف را به سامانههای دیگر گسترش میدهند و دادههای مورد نظر را تفتیش یا توقیف میکنند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 679, "category": "other", "chapter": "", "text": "توقیف دادهها یا سامانههای رایانهای یا مخابراتی که موجب ایراد لطمه جانی یا خسارات مالی شدید به اشخاص یا اخلال در ارائه خدمات عمومی شود ،ممنوع است مگر اینکه توقیف برای اجرای موضوع اهم نظیر حفظ امنیت کشور ضرورت داشته باشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 680, "category": "other", "chapter": "", "text": "در جایی که اصل دادهها توقیف میشود ،ذینفع حق دارد پس از پرداخت هزینه از آنها کپی دریافت کند ،مشروط به اینکه ارائه دادههای توقیف شده منافی با ضرورت کشف حقیقت نباشد و به روند تحقیقات لطمهای وارد نسازد و دادهها مجرمانه نباشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 681, "category": "other", "chapter": "", "text": "در مواردی که اصل دادهها یا سامانههای رایانهای یا مخابراتی توقیف می شود ،قاضی موظف است با لحاظ نوع و میزان دادهها و نوع و تعداد سختافزارها و نرمافزارهای مورد نظر و نقش آنها در جرم ارتکابی ،در مهلت متناسب و متعارف برای آنها تعیین تکلیف کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 682, "category": "other", "chapter": "", "text": "متضرر میتواند در مورد عملیات و اقدامات مأموران در توقیف دادهها و سامانههای رایانهای و مخابراتی ،اعتراض کتبی خود را همراه با دلایل ظرف ده روز به مرجع قضایی دستوردهنده تسلیم نماید .به درخواست یادشده خارج از نوبت رسیدگی میشود و قرار صادره قابل اعتراض است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 683, "category": "other", "chapter": "", "text": "کنترل محتوای در حال انتقال ارتباطات غیرعمومی در سامانههای رایانهای یا مخابراتی مطابق مقررات راجع به کنترل ارتباطات مخابراتی مقرر در آیین دادرسی کیفری است. تبصره -دسترسی به محتوای ارتباطات غیرعمومی ذخیرهشده ،نظیر پیامنگار (ایمیل) یا پیامک در حکم کنترل و مستلزم رعایت مقررات مربوط است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 684, "category": "other", "chapter": "", "text": "آییننامه اجرائی نحوه نگهداری و مراقبت از ادله الکترونیکی جمعآوریشده ظرف شش ماه از تاری const STORE_KEY = "ghanoonyar_v1";
function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    learned:{},         // {articleNum: true}
    mastery:{},         // {articleNum: {correct:0, wrong:0, status:'new'|'review'|'good'}}
    favorites:{},       // {articleNum: true}
    history:[],         // [{date, mode, total, correct, percent, timeSec}]
    bestScore:0,
    quizCount:0,
    theme:"light"
  };
}
let DB = loadStore();
function saveStore(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }

function markLearned(num){ DB.learned[num]=true; saveStore(); }
function recordAnswer(num, isCorrect){
  if(!DB.mastery[num]) DB.mastery[num]={correct:0,wrong:0,status:'new'};
  const m = DB.mastery[num];
  if(isCorrect){ m.correct++; if(m.correct>=2 && m.wrong===0) m.status='good'; else if(m.correct> m.wrong) m.status='good'; }
  else { m.wrong++; m.status='review'; m.correct=0; }
  saveStore();
}
function toggleFavorite(num){ DB.favorites[num] = !DB.favorites[num]; saveStore(); }

const app = document.getElementById('app');
let route = {name:'home'};
let quizState = null; // {questions:[], index, correct, wrong, answered, startTime, mode}

let navStack = [];
function nav(r){ navStack.push(route); history.pushState({stackLen: navStack.length}, ''); route = r; render(); window.scrollTo(0,0); }
function goBack(){
  if(navStack.length>0){ route = navStack.pop(); }
  else { route = {name:'home'}; }
  render(); window.scrollTo(0,0);
}
window.addEventListener('popstate', ()=>{ goBack(); });
function exitApp(){
  try{ window.close(); }catch(e){}
  setTimeout(()=>{ toast('برای خروج کامل، دکمهٔ برگشت یا Home گوشی را بزنید'); }, 200);
}

function totalQuestionsCount(){
  return LAW_DATA.reduce((s,a)=>s+a.questions.length,0);
}
function allQuestionsFlat(){
  let out=[];
  LAW_DATA.forEach(a=>{
    a.questions.forEach(q=>out.push({...q, article:a.article, category:a.category}));
  });
  return out;
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function catName(id){ const c=CATEGORIES.find(c=>c.id===id); return c?c.name:id; }
function diffLabel(d){ return d==='easy'?'ساده':d==='medium'?'متوسط':'دشوار'; }
function diffClass(d){ return d==='easy'?'easy':d==='medium'?'medium':'hard'; }

function progressPercent(){
  const learnedCount = Object.keys(DB.learned).length;
  return Math.round((learnedCount / LAW_DATA.length) * 100);
}
function curatedCount(){
  return LAW_DATA.filter(a=>a.hasContent).length;
}

function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1600);
}

    list = list.filter(a=> String(a.article).includes(s) || a.text.includes(s) || a.explanation.includes(s));
  }
  app.innerHTML = `
    ${topbar('مرور مواد قانون')}
    <div class="container">
      <div class="search-box">

      </div>
      <div class="chips">
        <div class="chip ${!filterCat?'active':''}" onclick="nav({name:'articles'})">همه</div>
        ${CATEGORIES.map(c=>`<div class="chip ${filterCat===c.id?'active':''}" onclick="nav({name:'articles', filterCat:'${c.id}'})">${c.name}</div>`).join('')}
      </div>
      ${list.length===0 ? `<div class="empty-state"><div class="big">🔎</div>نتیجه‌ای یافت نشد</div>` : ''}
      ${list.map(a=>{

        <div class="section-title" style="margin-top:14px;">💡 توضیح ساده</div>
        <div class="article-explain">${a.explanation}</div>
        <div class="article-notes"><b>نکات مهم و امتحانی:</b><ul style="margin:6px 0 0; padding-inline-start:18px;">
          ${a.notes.map(n=>`<li>${n}</li>`).join('')}
        </ul></div>
        ` : `
        <div class="article-notes" style="background:var(--brand-light);"><b style="color:var(--brand);">📝 توضیح تشریحی و سؤال تستی این ماده هنوز افزوده نشده است.</b> متن ماده دقیقاً از منبع رسمی استخراج شده و قابل مطالعه و جست‌وجو است؛ محتوای آموزشی تکمیلی به‌تدریج اضافه می‌شود.</div>
        `}
        <button class="btn ${DB.learned[a.article]?'success':''}" onclick="markLearned(${a.article}); render(); toast('این ماده در فهرست یادگیری ثبت شد ✓')">
          ${DB.learned[a.article]?'✓ یاد گرفته‌ام':'این ماده را یاد گرفتم ✓'}
        </button>
        ${a.hasContent ? `<button class="btn secondary" onclick="startArticleQuiz(${a.article})">آزمون این ماده (${a.questions.length} سؤال)</button>` : ''}
      </div>
      <div style="display:flex; gap:10px;">
        ${prev?`<button class="btn ghost" style="flex:1" onclick="nav({name:'articleDetail', num:${prev.article}})">▶ مادهٔ ${prev.article}</button>`:'<div style="flex:1"></div>'}
        ${next?`<button class="btn ghost" style="flex:1" onclick="nav({name:'articleDetail', num:${next.article}})">مادهٔ ${next.article} ◀</button>`:'<div style="flex:1"></div>'}
      </div>
    </div>
    ${bottomNav('articles')}
  `;
}

function renderQuizHub(){
  app.innerHTML = `
    ${topbar('آزمون')}
    <div class="container">
      <div class="section-title">⚡ حالت‌های سریع</div>
      <div class="card" onclick="startQuiz('quick10')"><b>آزمون ۱۰ سؤالی</b><div style="font-size:12.5px;color:var(--text-dim);margin-top:4px;">۱۰ سؤال تصادفی از کل بانک سؤالات</div></div>
      <div class="card" onclick="startQuiz('quick30')"><b>آزمون ۳۰ سؤالی</b><div style="font-size:12.5px;color:var(--text-dim);margin-top:4px;">۳۰ سؤال تصادفی (در صورت کافی نبودن، از کل سؤالات موجود استفاده می‌شود)</div></div>
      <div class="card" onclick="startQuiz('full')"><b>آزمون جامع</b><div style="font-size:12.5px;color:var(--text-dim);margin-top:4px;">تمام سؤالات موجود، از همهٔ بخش‌های قانون</div></div>

      <div class="section-title">📑 آزمون بر اساس بازهٔ مواد</div>
      <div class="range-list">
        ${(()=>{
          const ranges=[];
          for(let i=0;i<LAW_DATA.length;i+=50){
            const slice = LAW_DATA.slice(i,i+50);
            if(slice.length===0) continue;
            ranges.push(slice);
          }
          return ranges.map(r=>{
            const first=r[0].article, last=r[r.length-1].article;
            const qCount = r.reduce((s,a)=>s+a.questions.length,0);
            if(qCount===0) return '';
            return `<div class="card" onclick='startRangeQuiz(${JSON.stringify(r.map(a=>a.article))})'>
              <b>مواد ${first} تا ${last}</b>
              <div style="font-size:12.5px;color:var(--text-dim);margin-top:4px;">${qCount} سؤال</div>
            </div>`;
          }).join('');
        })()}
      </div>

      <div class="section-title">🏷️ آزمون بر اساس موضوع</div>
      <div class="range-list">
        ${CATEGORIES.map(c=>{
          const arts = LAW_DATA.filter(a=>a.category===c.id);
          const qCount = arts.reduce((s,a)=>s+a.questions.length,0);
          return `<div class="card" onclick="startCategoryQuiz('${c.id}')">
            <b>${c.name}</b>
            <div style="font-size:12.5px;color:var(--text-dim);margin-top:4px;">${arts.length} ماده · ${qCount} سؤال</div>
          </div>`;
        }).join('')}
      </div>
    </div>
    ${bottomNav('quizHub')}
  `;
}

function startQuiz(mode){
  let pool = shuffle(allQuestionsFlat());
  let n = mode==='quick10' ? 10 : mode==='quick30' ? 30 : pool.length;
  n = Math.min(n, pool.length);
  quizState = {questions: pool.slice(0,n), index:0, correct:0, wrong:0, answered:false, startTime:Date.now(), mode: mode==='quick10'?'آزمون ۱۰ سؤالی':mode==='quick30'?'آزمون ۳۰ سؤالی':'آزمون جامع', weakArticles:new Set(), goodArticles:new Set()};
  if(quizState.questions.length===0){ toast('سؤالی برای این حالت موجود نیست'); return; }
  nav({name:'quizPlay'});
}
function startArticleQuiz(num){
  const a = LAW_DATA.find(x=>x.article===num);
  const qs = a.questions.map(q=>({...q, article:a.article, category:a.category}));
  quizState = {questions:shuffle(qs), index:0, correct:0, wrong:0, answered:false, startTime:Date.now(), mode:`آزمون مادهٔ ${num}`, weakArticles:new Set(), goodArticles:new Set(), articleNum:num};
  nav({name:'quizPlay'});
}
function startRangeQuiz(articleNums){
  const arts = LAW_DATA.filter(a=>articleNums.includes(a.article));
  let qs=[]; arts.forEach(a=>a.questions.forEach(q=>qs.push({...q, article:a.article, category:a.category})));
  qs = shuffle(qs);
  quizState = {questions:qs, index:0, correct:0, wrong:0, answered:false, startTime:Date.now(), mode:`آزمون مواد ${articleNums[0]} تا ${articleNums[articleNums.length-1]}`, weakArticles:new Set(), goodArticles:new Set()};
  nav({name:'quizPlay'});
}
function startCategoryQuiz(catId){
  const arts = LAW_DATA.filter(a=>a.category===catId);
  let qs=[]; arts.forEach(a=>a.questions.forEach(q=>qs.push({...q, article:a.article, category:a.category})));
  qs = shuffle(qs);
  if(qs.length===0){ toast('سؤالی در این موضوع موجود نیست'); return; }
  quizState = {questions:qs, index:0, correct:0, wrong:0, answered:false, startTime:Date.now(), mode:`آزمون موضوعی: ${catName(catId)}`, weakArticles:new Set(), goodArticles:new Set()};
  nav({name:'quizPlay'});
}
function startWeakQuiz(){
  const weakNums = Object.keys(DB.mastery).filter(k=>DB.mastery[k].status==='review').map(Number);
  const arts = LAW_DATA.filter(a=>weakNums.includes(a.article));
  let qs=[]; arts.forEach(a=>a.questions.forEach(q=>qs.push({...q, article:a.article, category:a.category})));
  if(qs.length===0){ toast('در حال حاضر مادهٔ ضعیفی ثبت نشده است 👍'); return; }
  qs = shuffle(qs);
  quizState = {questions:qs, index:0, correct:0, wrong:0, answered:false, startTime:Date.now(), mode:'مرور نقاط ضعف', weakArticles:new Set(), goodArticles:new Set()};
  nav({name:'quizPlay'});
}

function renderQuizPlay(){
  if(!quizState){ nav({name:'quizHub'}); return; }
  const q = quizState.questions[quizState.index];
  const total = quizState.questions.length;
  const pct = Math.round((quizState.index/total)*100);
  app.innerHTML = `
    ${topbar(quizState.mode)}
    <div class="container">
      <div class="quiz-meta">
        <span>سؤال ${quizState.index+1} از ${total}</span>
        <span>·</span>
        <span>مادهٔ ${q.article}</span>
        <span>·</span>
        <span class="badge cat">${catName(q.category)}</span>
      </div>
      <div class="quiz-progress"><div class="bar"><div style="width:${pct}%"></div></div></div>
      <div class="q-text">${q.q}</div>
      <div id="optionsWrap">
        ${q.options.map((opt,i)=>`<div class="option" id="opt${i}" onclick="answerQuiz(${i})"><span class="letter">${['الف','ب','پ','ت'][i]}</span><span>${opt}</span></div>`).join('')}
      </div>
      <div id="explainWrap"></div>
      <div id="nextWrap"></div>
    </div>
  `;
}

function answerQuiz(choice){
  if(quizState.answered) return;
  const q = quizState.questions[quizState.index];
  quizState.answered = true;
  const isCorrect = choice === q.correct;
  if(isCorrect){ quizState.correct++; quizState.goodArticles.add(q.article); }
  else { quizState.wrong++; quizState.weakArticles.add(q.article); }
  recordAnswer(q.article, isCorrect);

  q.options.forEach((opt,i)=>{
    const el = document.getElementById('opt'+i);
    el.onclick=null;
    if(i===q.correct) el.classList.add('correct');
    else if(i===choice) el.classList.add('wrong');
  });
  document.getElementById('explainWrap').innerHTML = `
    <div class="explain-box">
      <b>${isCorrect?'✅ پاسخ صحیح بود':'❌ پاسخ نادرست بود'}</b><br>
      ${q.explain}
    </div>`;
  const isLast = quizState.index === quizState.questions.length-1;
  document.getElementById('nextWrap').innerHTML = `
    <button class="btn" onclick="nextQuizQuestion()">${isLast?'مشاهده نتیجه نهایی':'سؤال بعدی ▶'}</button>`;
}

function nextQuizQuestion(){
  if(quizState.index < quizState.questions.length-1){
    quizState.index++;
    quizState.answered=false;
    renderQuizPlay();
  } else {
    finishQuiz();
  }
}

function finishQuiz(){
  const total = quizState.questions.length;
  const timeSec = Math.round((Date.now()-quizState.startTime)/1000);
  const percent = Math.round((quizState.correct/total)*100);
  DB.quizCount++;
  if(percent > DB.bestScore) DB.bestScore = percent;
  DB.history.unshift({date:new Date().toLocaleDateString('fa-IR'), mode:quizState.mode, total, correct:quizState.correct, percent, timeSec});
  DB.history = DB.history.slice(0,30);
  saveStore();
  route = {name:'quizResult', total, correct:quizState.correct, wrong:quizState.wrong, percent, timeSec,
           weak:[...quizState.weakArticles], good:[...quizState.goodArticles], articleNum:quizState.articleNum};
  history.replaceState(route, '');
  render();
}

function perfLabel(pct){
  if(pct>=90) return {label:'عالی 🌟', color:'var(--good)'};
  if(pct>=70) return {label:'خوب 👍', color:'var(--good)'};
  if(pct>=50) return {label:'متوسط 🙂', color:'var(--warn)'};
  return {label:'نیازمند تمرین بیشتر 📚', color:'var(--bad)'};
}

function renderQuizResult(r){
  const perf = perfLabel(r.percent);
  const mins = Math.floor(r.timeSec/60), secs = r.timeSec%60;
  let nextNav = '';
  if(r.articleNum){
    const idx = LAW_DATA.findIndex(x=>x.article===r.articleNum);
    const next = LAW_DATA[idx+1];
    nextNav = `<div style="display:flex; gap:10px;">
      <button class="btn ghost" style="flex:1" onclick="nav({name:'articleDetail', num:${r.articleNum}})">بازگشت به مادهٔ ${r.articleNum}</button>
      ${next?`<button class="btn" style="flex:1" onclick="nav({name:'articleDetail', num:${next.article}})">مادهٔ بعدی (${next.article}) ◀</button>`:''}
    </div>`;
  }
  app.innerHTML = `
    ${topbar('نتیجهٔ آزمون')}
    <div class="container">
      <div class="card result-hero">
        <div class="result-score">${r.percent}%</div>
        <div style="font-weight:800; color:${perf.color}; margin-top:6px;">${perf.label}</div>
        <div class="result-grid">
          <div class="result-box g"><b>${r.correct}</b>پاسخ صحیح</div>
          <div class="result-box r"><b>${r.wrong}</b>پاسخ غلط</div>
          <div class="result-box"><b>${r.total}</b>کل سؤالات</div>
          <div class="result-box"><b>${mins}:${secs.toString().padStart(2,'0')}</b>زمان صرف‌شده</div>
        </div>
      </div>
      ${r.weak.length>0?`<div class="card">
        <b style="color:var(--bad)">🎯 مواد نیازمند مرور:</b>
        <div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;">
          ${r.weak.map(n=>`<span class="chip" onclick="nav({name:'articleDetail', num:${n}})">مادهٔ ${n}</span>`).join('')}
        </div>
      </div>`:''}
      ${r.good.length>0?`<div class="card">
        <b style="color:var(--good)">✅ مواد قوی شما:</b>
        <div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;">
          ${r.good.map(n=>`<span class="chip" onclick="nav({name:'articleDetail', num:${n}})">مادهٔ ${n}</span>`).join('')}
        </div>
      </div>`:''}
      ${nextNav}
      <button class="btn secondary" onclick="nav({name:'quizHub'})">آزمون جدید</button>
      <button class="btn ghost" onclick="nav({name:'home'})">بازگشت به خانه</button>
    </div>
    ${bottomNav('quizHub')}
  `;
}

function renderWeak(){
  const nums = Object.keys(DB.mastery).map(Number);
  const weak = nums.filter(n=>DB.mastery[n].status==='review');
  const good = nums.filter(n=>DB.mastery[n].status==='good');
  app.innerHTML = `
    ${topbar('نقاط ضعف من')}
    <div class="container">
      <div class="card">
        <b>🎯 مواد نیازمند مرور (${weak.length})</b>
        <div style="font-size:12.5px; color:var(--text-dim); margin-top:4px;">موادی که در آزمون‌ها پاسخ اشتباه داده‌اید</div>
        ${weak.length>0?`<button class="btn" onclick="startWeakQuiz()">آزمون مرور هوشمند (${weak.length} ماده)</button>`:''}
      </div>
      ${weak.length===0 ? `<div class="empty-state"><div class="big">👍</div>هنوز مادهٔ ضعیفی ثبت نشده است.<br>یک آزمون امتحان کنید!</div>` :
        weak.map(n=>{
          const a = LAW_DATA.find(x=>x.article===n);
          const m = DB.mastery[n];
          return `<div class="card" onclick="nav({name:'articleDetail', num:${n}})">
            <div class="article-header"><span class="article-num">مادهٔ ${n}</span><span class="badge review">نیازمند مرور</span></div>
            <div style="font-size:13px;color:var(--text-dim)">${catName(a.category)} · ${m.correct} درست / ${m.wrong} غلط</div>
          </div>`;
        }).join('')
      }
      <div class="section-title">✅ مواد با تسلط خوب (${good.length})</div>
      ${good.length===0 ? `<div class="empty-state" style="padding:20px;"><span>هنوز موردی ثبت نشده</span></div>` :
        good.map(n=>{
          const a = LAW_DATA.find(x=>x.article===n);
          return `<div class="card" onclick="nav({name:'articleDetail', num:${n}})">
            <div class="article-header"><span class="article-num">مادهٔ ${n}</span><span class="badge verified">تسلط خوب</span></div>
            <div style="font-size:13px;color:var(--text-dim)">${catName(a.category)}</div>
          </div>`;
        }).join('')
      }
    </div>
    ${bottomNav('weak')}
  `;
}

function renderStats(){
  const nums = Object.keys(DB.mastery).map(Number);
  const good = nums.filter(n=>DB.mastery[n].status==='good').length;
  const review = nums.filter(n=>DB.mastery[n].status==='review').length;
  app.innerHTML = `
    ${topbar('آمار من')}
    <div class="container">
      <div class="result-grid">
        <div class="result-box"><b>${Object.keys(DB.learned).length}</b>مادهٔ مطالعه‌شده</div>
        <div class="result-box"><b>${DB.quizCount}</b>آزمون انجام‌شده</div>
        <div class="result-box g"><b>${DB.bestScore}%</b>بهترین نتیجه</div>
        <div class="result-box"><b>${progressPercent()}%</b>پیشرفت کلی</div>
        <div class="result-box g"><b>${good}</b>مواد با تسلط خوب</div>
        <div class="result-box r"><b>${review}</b>مواد نیازمند مرور</div>
      </div>
      <div class="section-title">🕓 تاریخچهٔ آزمون‌ها</div>
      ${DB.history.length===0?`<div class="empty-state"><div class="big">📊</div>هنوز آزمونی ثبت نشده است</div>`:
        DB.history.map(h=>`<div class="card">
          <div style="display:flex; justify-content:space-between;">
            <b>${h.mode}</b><span class="badge ${h.percent>=70?'easy':h.percent>=50?'medium':'hard'}">${h.percent}%</span>
          </div>
          <div style="font-size:12px; color:var(--text-dim); margin-top:6px;">${h.date} · ${h.correct}/${h.total} صحیح · زمان ${Math.floor(h.timeSec/60)}:${(h.timeSec%60).toString().padStart(2,'0')}</div>
        </div>`).join('')
      }
      <div class="section-title">⭐ علاقه‌مندی‌ها</div>
      ${(()=>{
        const favNums = Object.keys(DB.favorites).filter(k=>DB.favorites[k]).map(Number);
        if(favNums.length===0) return `<div class="empty-state" style="padding:20px;">هنوز موردی به علاقه‌مندی‌ها اضافه نشده</div>`;
        return favNums.map(n=>{
          const a = LAW_DATA.find(x=>x.article===n);
          if(!a) return '';
          return `<div class="card" onclick="nav({name:'articleDetail', num:${n}})"><span class="article-num">مادهٔ ${n}</span> <span style="font-size:12px;color:var(--text-dim)">${catName(a.category)}</span></div>`;
        }).join('');
      })()}
      <button class="btn ghost" onclick="if(confirm('آیا مطمئن هستید؟ تمام پیشرفت، آزمون‌ها و علاقه‌مندی‌های شما پاک می‌شود و قابل بازگشت نیست.')){ localStorage.removeItem(STORE_KEY); location.reload(); }">پاک کردن کامل اطلاعات و ریست برنامه</button>
      <div class="footer-note">تمام اطلاعات فقط در همین مرورگر و به‌صورت محلی (localStorage) ذخیره می‌شود.</div>
    </div>
    ${bottomNav('stats')}
  `;
}

function toggleTheme(){
  DB.theme = DB.theme==='dark' ? 'light':'dark';
  document.documentElement.setAttribute('data-theme', DB.theme);
  saveStore();
  render();
}

function render(){
  document.documentElement.setAttribute('data-theme', DB.theme||'light');
  switch(route.name){
    case 'home': renderHome(); break;
    case 'articles': renderArticlesList(route.filterCat, route.searchQ); break;
    case 'articleDetail': renderArticleDetail(route.num); break;
    case 'quizHub': renderQuizHub(); break;
    case 'quizPlay': renderQuizPlay(); break;
    case 'quizResult': renderQuizResult(route); break;
    case 'weak': renderWeak(); break;
    case 'stats': renderStats(); break;
    default: renderHome();
  }
}

/* شروع برنامه */
render();

/* ثبت Service Worker برای کارکرد آفلاین (لازم برای بسته‌بندی PWA/APK) */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then((reg)=>{
      reg.update();
      reg.addEventListener('updatefound', ()=>{
        const nw = reg.installing;
        if(nw){
          nw.addEventListener('statechange', ()=>{
            if(nw.state === 'activated'){ window.location.reload(); }
          });
        }
      });
    }).catch(()=>{});
  });
}
</script>

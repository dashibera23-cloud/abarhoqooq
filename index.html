کنترل کند».", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 152, "category": "other", "chapter": "", "text": "تفتیش و بازرسی مراسلات پستی مربوط به متهم در مواردی به عمل می آید که ظن قوی به کشف جرم ،دستیابی به ادله وقوع جرم و یا شناسایی متهم وجود داشته باشد .در این صورت ،بازپرس از مرجع مربوط میخواهد ،این مراسلات را توقیف کند و نزد او بفرستد .در صورت عدم امکان توقیف ،مرجع مربوط ،این امر را به اطلاع بازپرس میرساند و از وی کسب تکلیف میکند .پس از وصول ،بازپرس آنها را در حضور متهم یا وکیل او بررسی و مراتب را در صورتمجلس قید میکند و پس از امضای متهم ،آن را پیوست پرونده می نماید یا در محل مناسب نگهداری میکند .استنکاف متهم از امضا یا عدم حضور متهم یا وکیل او در صورتمجلس قید می شود .چنانچه اشیای مزبور حائز اهمیت نباشد و نگهداری آن ها ضرورت نداشته باشد ،با اخذ رسید به مرجع ارسالکننده یا به صاحبش مسترد میشود. تبصره -موارد ضرورت بازرسی مکاتبات و مراسلات محکومان ،به تشخیص دادگاه به وسیله مأموران مورد اعتماد زندان اعمال میگردد و پس از تأیید ،حسب مورد ارسال یا به محکوم تسلیم می شود .در صورت عدم تأیید ،مکاتبات و مراسلات ضبط و مراتب به اطلاع دادگاه میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 153, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "مقامات و مأموران وزارتخانه ها ،سازمانها ،مؤسسات دولتی ،شرکتهای دولتی ،مؤسسات یا نهادهای عمومی غیردولتی و نهادها و شرکتهای وابسته به آنها ،سازمانهای نظامی و انتظامی ،بانکها و مؤسسات مالی و اعتباری ،دفاتر اسناد رسمی و دستگاههایی که شمول قانون بر آن ها مستلزم ذکر نام است مکلفند اسباب ،ادله و اطلاعات راجع به جرم و آن قسمت از اوراق و اسناد و دفاتری را که مراجعه به آن ها برای تحقیق امر کیفری لازم است ،به درخواست مرجع قضایی در دسترس آنان قرار دهند، مگر در مورد اسناد سری و به کلی سری که این درخواست باید با موافقت رئیس قوه قضائیه باشد .متخلف از این ماده ،در صورتی که عمل وی برای خلاصی متهم از محاکمه و محکومیت نباشد ،حسب مورد به انفصال موقت از خدمات دولت یا عمومی از سه ماه تا یک سال محکوم میشود. تبصره -در خصوص اسناد سری و به کلی سری مربوط به نیروهای مسلح رئیس قوه قضائیه می تواند اختیار خود را به رئیس سازمان قضایی نیروهای مسلح تفویض کند.", "explanation": "مقامات و مأموران دستگاه‌های دولتی، عمومی، بانک‌ها، دفاتر اسناد رسمی و نهادهای مشابه، مکلف‌اند اسناد، ادله و اطلاعات مرتبط با جرم را در اختیار مرجع قضائی قرار دهند.", "notes": ["این ماده پایهٔ الزام دستگاه‌های دولتی و عمومی به همکاری با مراجع قضائی در ارائهٔ اسناد است."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۵۳ قانون آیین دادرسی کیفری، مقامات دستگاه‌های دولتی و بانک‌ها نسبت به اسناد مرتبط با جرم چه تکلیفی دارند؟", "options": ["می‌توانند از ارائه خودداری کنند", "مکلف‌اند اسباب، ادله و اطلاعات مرتبط را در اختیار مرجع قضائی بگذارند", "فقط با حکم دادگاه عالی موظف‌اند", "هیچ تکلیفی ندارند"], "correct": 1, "explain": "متن ماده این الزام را برای دستگاه‌های مذکور به‌صراحت مقرر کرده است."}]}, {"article": 154, "category": "other", "chapter": "", "text": "هرگاه مته م ،نوشته ،اسناد ،مدارک ،اسباب و ادله مؤثر در کشف جرم مربوط را به وکیل خود یا شخص دیگری بسپارد، بازپرس میتواند آن ها را حسب مورد ،در حضور وکیل یا آن شخص بررسی کند .در صورت استنکاف اشخاص مذکور از ارائه آنها، مستنکف به مجازات مقرر برای خلاصی متهم از محاکمه محکوم میشود ،اما در صورتی که این اشخاص عذر موجه داشته باشند، ادله خود را به مقام قضایی رسیدگیکننده ارائه می دهند .نوشته ،اسناد و مدارک غیرمرتبط با جرم نباید مطالبه و مورد بررسی قرار گیرد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 155, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "هرگاه بازپرس رأسا یا به تقاضای یکی از طرفین انجام کارشناسی را ضروری بداند ،قرار ارجاع امر به کارشناسی را صادر می کند .بازپرس باید موضوعی را که جلب نظر کارشناس نسبت به آن لازم است به طور دقیق تعیین کند.", "explanation": "اگر بازپرس (رأساً یا به تقاضای یکی از طرفین) کارشناسی را لازم بداند، قرار ارجاع به کارشناسی صادر می‌کند و باید موضوع دقیق مورد نظرش برای کارشناس را روشن مشخص کند.", "notes": ["دقت در تعیین موضوع کارشناسی وظیفهٔ بازپرس است تا نظر کارشناس مبهم یا کلی نباشد."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۵۵ قانون آیین دادرسی کیفری، هنگام ارجاع پرونده به کارشناسی، بازپرس چه تکلیفی دارد؟", "options": ["نیازی به مشخص‌کردن موضوع نیست", "باید موضوعی که جلب نظر کارشناس نسبت به آن لازم است را دقیق تعیین کند", "باید خودش کارشناسی را انجام دهد", "باید نظر شاکی را قطعی بداند"], "correct": 1, "explain": "متن ماده تعیین دقیق موضوع کارشناسی را وظیفهٔ بازپرس دانسته است."}]}, {"article": 156, "category": "other", "chapter": "", "text": "بازپرس ،کارشناس را به قید قرعه از بین کارشناسان رسمی دادگستری دارای صلاحیت در رشته مربوط انتخاب میکند. در صورت تعدد کارشناسان ،عده منتخبان باید فرد باشد تا به هنگام اختلاف نظر ،نظر اکثریت مالک عمل قرار گیرد. تبصره –۱ اعتبار نظر اکثریت در صورتی است که کارشناسان از نظر تخصص با هم مساوی باشند. تبصره –۲ اگر حوزهای فاقد کارشناس رسمی دادگستری است یا به تعداد کافی کارشناس رسمی دادگستری ندارد و یا در دسترس نیست ،بازپرس می تواند از میان کارشناسان رسمی آن رشته در حوزه قضایی مجاور یا اهل خبره انتخاب کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 157, "category": "other", "chapter": "", "text": "بازپرس دستمزد کارشناس را با رعایت کمیت ،کیفیت و ارزش کار ،پیش از ارجاع امر ،تعیین میکند .هرگاه پس از اظهارنظر کارشناس معلوم شود که دستمزد تعیین شده متناسب نبوده است ،بازپرس میزان آن را به طور قطعی تعیین و دستور وصول آن را میدهد .در هر حال دستمزد مزبور نباید از تعرفه تجاوز نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 158, "category": "other", "chapter": "", "text": "کارشناس منتخب از سوی بازپرس مکلف به انجام موضوع کارشناسی است ،مگر آنکه به تشخیص بازپرس عذر موجه داشته باشد یا موضوع از موارد رد کارشناس محسوب شود که در این صورت ،کارشناس باید پیش از اقدام به کارشناسی ،مراتب را به طور کتبی به بازپرس اعلام دارد. تبصره -جهات رد کارشناس همان جهات رد دادرس است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 159, "category": "other", "chapter": "", "text": "بازپرس هنگام ارجاع موضوع به کارشناس ،مهلت معین را برای اعلام نظر وی مشخص میکند. در مواردی که اظهار نظر مستلزم زمان بیشتر باشد ،کارشناس باید ضمن تهیه و ارسال گزارشی از اقدامات انجامشده ،با ذکر دلیل، تقاضای تمدید مهلت کند که در این صورت ،بازپرس میتواند برای یک بار مهلت را تمدید کند .تمدید مهلت به کارشناس و طرفین ابلاغ میگردد. متن سابق ماده « :۱۵۹ بازپرس هنگام ارجاع موضوع به کارشناس ،مهلت معین را برای اعلامنظر وی مشخص میکند .در مواردی که اظهارنظر مستلزم زمان بیشتر باشد ،کارشناس باید ضمن تهیه و ارسال گزارشی از اقدامات انجام شده ،با ذکر دلیل ،تقاضای تمدید مهلت کند که در این صورت ،بازپرس میتواند برای یکبار مهلت را تمدید کند .تمدید مهلت به کارشناس و طرفین ابلاغ میگردد .هرگاه کارشناس ظرف مدت معین نظر خود را بهطور کتبی تقدیم دادگاه ننماید، کارشناس دیگری تعیین میشود .چنانچه قبل از انتخاب یا اخطار به کارشناسدیگر نظر کارشناس بهدادگاه واصل شود، دادگاه به آن ترتیب اثر میدهد .در هر حال دادگاه تخلف کارشناس را به مرجع صلاحیتدار اعلام میدارد». هرگاه کارشناس ظرف مدت معین نظر خود را به طور کتبی تقدیم بازپرس ننماید ،کارشناس دیگری تعیین میشود .چنانچه قبل از انتخاب یا اخطار به کارشناس دیگر نظر کارشناس به بازپرس واصل شود ،به آن ترتیب اثر می دهد .در هر حال بازپرس تخلف کارشناس را به مرجع صلاحیتدار اعلام میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 160, "category": "other", "chapter": "", "text": "بازپرس پرسش های لازم را از کارشناس به صورت کتبی یا شفاهی به عمل میآورد و نتیجه را در صورتمجلس قید می کند .در صورتی که بعضی موارد از نظر بازپرس در کشف حقیقت اهمیت داشته باشد ،کارشناس مکلف است به درخواست بازپرس در مورد آنها اظهارنظر کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 161, "category": "other", "chapter": "", "text": "جز در موارد فوری ،پس از پرداخت دستمزد ،به کارشناس اخطار میشود که ظرف مهلت تعیینشده در قرار کارشناسی، نظر خود را تقدیم کند .مراتب وصول نظر کارشناس به طرفین ابلاغ میشود. طرفین می توانند ظرف یک هفته از تاریخ ابلاغ ،جهت ملاحظه نظر کارشناس به دفتر بازپرسی مراجعه و نظر خود را به طور کتبی اعلام کنند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 162, "category": "other", "chapter": "", "text": "شهود تحقیق و سایر اشخاصی که هنگام اجرای قرار کارشناسی حق حضور دارند ،میتوانند مخالفت خود با نظریه کارشناس را با ذکر دلیل اعلام کنند .این امر در صورتمجلس قید میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 163, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "در صورت نقص نظریه کارشناسی یا ضرورت اخذ توضیح از کارشناس ،بازپرس موارد لازم را در صورتمجلس درج و به کارشناس اعلام میکند و او را برای ادای توضیح دعوت می نماید .در صورتی که کارشناس بدون عذر موجه در بازپرسی حاضر نشود ،جلب میشود. تبصره -هرگاه پس از اخذ توضیحات ،بازپرس نظریه کارشناسی را ناقص تشخیص دهد ،قرار تکمیل آن را صادر و اجرای قرار را به همان کارشناس یا کارشناس دیگر محول میکند.", "explanation": "اگر نظر کارشناسی ناقص باشد، بازپرس توضیح می‌خواهد و کارشناس را دعوت می‌کند؛ عدم حضور بدون عذر موجه، جلب او را به دنبال دارد. اگر باز هم نظر ناقص باشد، بازپرس قرار تکمیل نظریه صادر می‌کند.", "notes": ["ضمانت اجرای عدم حضور کارشناس بدون عذر موجه: جلب."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۶۳ قانون آیین دادرسی کیفری، اگر کارشناس بدون عذر موجه در بازپرسی برای ادای توضیح حاضر نشود، چه اتفاقی می‌افتد؟", "options": ["هیچ اقدامی انجام نمی‌شود", "جلب می‌شود", "نظر او به‌طور خودکار باطل می‌شود", "باید جریمهٔ نقدی بپردازد"], "correct": 1, "explain": "متن ماده تصریح می‌کند در این حالت کارشناس جلب می‌شود."}]}, {"article": 164, "category": "other", "chapter": "", "text": "اگر یکی از کارشناسان در موقع رسیدگی و مشاوره حاضر باشد ،اما بدون عذر موجه از اظهارنظر یا حضور در جلسه یا امضای نظریه کارشناسی امتناع کند ،نظر اکثریت مالک عمل است .عدم حضور کارشناس یا امتناع وی از اظهارنظر یا امضا باید از طرف کارشناسان دیگر صورتمجلس شود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 165, "category": "other", "chapter": "", "text": "هرگاه نظریه کارشناس به نظر بازپرس ،محل تردید باشد یا در صورت تعدد کارشناسان ،بین نظر آنان اختلاف باشد، بازپرس می تواند تا دو بار دیگر از سایر کارشناسان دعوت به عمل آورد ،یا نظریه کارشناس یا کارشناسان مذکور را نزد متخصص علم یا فن مربوط ارسال و نظر او را استعلام کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 166, "category": "other", "chapter": "", "text": "در صورتی که نظر کارشناس با اوضاع و احوال محقق و معلوم مورد کارشناسی مطابقت نداشته باشد ،بازپرس نظر کارشناس را به نحو مستدل رد میکند و موضوع را به کارشناس دیگر ارجاع میدهد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 167, "category": "other", "chapter": "", "text": "هرگاه یکی از طرفین دعوی از تخلف کارشناس متضرر گردد ،میتواند مطابق قوانین و مقررات مربوط از کارشناس مطالبه جبران خسارت کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 168, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "بازپرس نباید بدون دلیل کافی برای توجه اتهام ،کسی را به عنوان متهم احضار و یا جلب کند. تبصره -تخلف از مقررات این ماده موجب محکومیت انتظامی تا درجه چهار است.", "explanation": "بازپرس نباید بدون دلیل کافی برای توجه اتهام، کسی را احضار یا جلب کند. این ماده تضمینی برای جلوگیری از احضار یا جلب خودسرانه و بی‌دلیل اشخاص است.", "notes": ["تخلف از این ماده مجازات انتظامی تا درجهٔ چهار دارد."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۶۸ قانون آیین دادرسی کیفری، احضار یا جلب شخص به عنوان متهم منوط به چیست؟", "options": ["صرف شکایت شاکی", "وجود دلیل کافی برای توجه اتهام", "درخواست ضابط دادگستری", "هیچ شرطی ندارد"], "correct": 1, "explain": "متن ماده تصریح می‌کند بازپرس نباید بدون دلیل کافی برای توجه اتهام کسی را احضار یا جلب کند."}]}, {"article": 169, "category": "other", "chapter": "", "text": "احضار متهم به وسیله احضاریه به عمل میآید .احضاریه در دو نسخه تنظیم میشود که یک نسخه از آن به متهم ابلاغ میگردد و نسخه دیگر پس از امضا به مأمور ابلاغ مسترد میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 170, "category": "other", "chapter": "", "text": "در احضاریه ،نام و نام خانوادگی احضار شونده ،تاریخ ،ساعت ،محل حضور ،علت احضار و نتیجه عدم حضور قید میشود و به امضای مقام قضایی میرسد. تبصره -در جرایمی که به تشخیص مرجع قضائی ،حیثیت اجتماعی متهم ،عفت یا امنیت عمومی اقتضا کند ،علت احضار ذکر نمیشود ،اما متهم می تواند برای اطلاع از علت احضار به دفتر مرجع قضایی مراجعه کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 171, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "فاصله میان ابلاغ اوراق احضاریه و زمان حضور نزد بازپرس نباید کمتر از پنج روز باشد.", "explanation": "بین تاریخ ابلاغ احضاریه و زمان حضور نزد بازپرس، باید حداقل پنج روز فاصله باشد تا متهم فرصت آمادگی داشته باشد.", "notes": ["حداقل فاصلهٔ ابلاغ تا حضور: پنج روز."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۷۱ قانون آیین دادرسی کیفری، حداقل فاصلهٔ زمانی بین ابلاغ احضاریه و حضور نزد بازپرس چقدر است؟", "options": ["یک روز", "سه روز", "پنج روز", "ده روز"], "correct": 2, "explain": "متن ماده این حداقل فاصله را «پنج روز» تعیین کرده است."}]}, {"article": 172, "category": "other", "chapter": "", "text": "ابلاغ احضاریه توسط مأموران ابلاغ بدون استفاده از لباس رسمی و با ارائه کارت شناسایی انجام میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 173, "category": "other", "chapter": "", "text": "هرگاه شخص احضار شده بی سواد باشد ،مأمور ابلاغ ،مفاد احضاریه را به وی تفهیم میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 174, "category": "other", "chapter": "", "text": "هرگاه ابلاغ احضاریه به لحاظ معلوم نبودن محل اقامت متهم ممکن نباشد و اقدامات برای دستیابی به متهم به نتیجه نرسد و ابلاغ نیز به طریق دیگر میسر نگردد ،متهم از طریق انتشار یک نوبت آگهی در یکی از روزنامههای کثیرالانتشار ملی یا محلی و با ذکر عنوان اتهام و مهلت یک ماه از تاریخ نشر آگهی ،احضار می شود .در این صورت ،بازپرس پس از انقضای مهلت مقرر به موضوع رسیدگی و اظهار عقیده میکند. تبصره -در جرایمی که به تشخیص بازپرس ،حیثیت اجتماعی متهم ،عفت یا امنیت عمومی اقتضا کند ،عنوان اتهام در آگهی موضوع این ماده ذکر نمیشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 175, "category": "other", "chapter": "", "text": "استفاده از سامانههای (سیستمهای) رایانهای و مخابراتی ،از قبیل پیامنگار (ایمیل) ،ارتباط تصویری از راه دور ،نمابر و تلفن ،برای طرح شکایت یا دعوی ،ارجاع پرونده ،احضار متهم ،ابلاغ اوراق قضایی و همچنین نیابت قضایی با رعایت مقررات راجع به دادرسی الکترونیکی بلامانع است. تبصره -شرایط و چگونگی استفاده از سامانههای رایانهای و مخابراتی موضوع این ماده بر اساس آییننامهای است که ظرف شش ماه از تاریخ لازم االجرا شدن این قانون توسط وزیر دادگستری تهیه میشود و به تصویب رئیس قوه قضائیه میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 176, "category": "other", "chapter": "", "text": "قوه قضائیه می تواند ابلاغ اوراق قضایی را به بخش خصوصی واگذار کند .چگونگی اجرای این ماده به موجب آییننامهای است که ظرف شش ماه از تاریخ لازم‌الاجرا شدن این قانون توسط وزرای دادگستری و ارتباطات و فناوری اطلاعات تهیه میشود و به تصویب رئیس قوه قضائیه میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 177, "category": "other", "chapter": "", "text": "سایر ترتیبات و قواعد ابلاغ احضاریه و دیگر اوراق قضایی بر اساس قانون آیین دادرسی مدنی صورت میگیرد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 178, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "متهم مکلف است در موع د مقرر حاضر شود و اگر نتواند باید عذر موجه خود را اعلام کند .جهات زیر عذر موجه محسوب میشود: الف -نرسیدن یا دیر رسیدن احضاریه به گونهای که مانع از حضور شود. ب -بیماری متهم و بیماری سخت والدین ،همسر یا اولاد وی که مانع از حضور شود. پ -همسر یا یکی از اقربا تا درجه سوم از طبقه دوم فوت شود. ت -ابتلا به حوادث مهم از قبیل بیماریهای واگیردار و بروز حوادث قهری مانند سیل و زلزله که موجب عدم امکان تردد گردد. ث -متهم در توقیف یا حبس باشد. ج -سایر مواردی که عرفا ً به تشخیص بازپرس عذر موجه محسوب میشود. تبصره -در سایر موارد ،متهم می تواند برای یک بار پیش از موعد تعیین شده ،بازپرس را از علت عدم حضور خود مطلع سازد و موافقت وی را اخذ نماید که در این مورد ،بازپرس می تواند در صورت عدم تأخیر در تحقیقات ،تا سه روز مهلت را تمدید کند.", "explanation": "این ماده مصادیق «عذر موجه» برای عدم حضور متهم در موعد مقرر را فهرست می‌کند: نرسیدن به‌موقع احضاریه، بیماری متهم یا نزدیکانش، فوت خویشاوند نزدیک، حوادث قهری، توقیف یا حبس متهم، و سایر مواردی که عرفاً بازپرس موجه بداند.", "notes": ["فهرست این ماده در بسیاری از مواد دیگر قانون (مانند مهلت اعتراض کفیل) به عنوان مرجع تعریف «عذر موجه» ارجاع داده می‌شود."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "کدام مورد زیر طبق ماده ۱۷۸ قانون آیین دادرسی کیفری، «عذر موجه» برای عدم حضور متهم محسوب می‌شود؟", "options": ["فراموشی متهم", "بیماری سخت متهم یا والدین، همسر یا فرزند او که مانع حضور شود", "بی‌علاقگی متهم به حضور", "مشغله کاری عادی"], "correct": 1, "explain": "بند «ب» ماده ۱۷۸ بیماری سخت متهم یا نزدیکان او را که مانع حضور شود، عذر موجه می‌داند."}]}, {"article": 179, "category": "other", "chapter": "", "text": "متهمی که بدون عذر موجه حضور نیابد ی ا عذر موجه خود را اعلام نکند ،به دستور بازپرس جلب میشود. تبصره -در صورتی که احضاریه ،ابلاغ قانونی شده باشد و بازپرس احتمال دهد که متهم از احضاریه مطلع نشده است ،وی را فقط برای یک بار دیگر احضار مینماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 180, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "در موارد زیر بازپرس میتواند بدون آن که ا بتدا احضاریه فرستاده باشد ،دستور جلب متهم را صادر کند: الف -در مورد جرایمی که مجازات قانونی آنها سلب حیات ،قطع عضو و یا حبس ابد است. ب -هرگاه محل اقامت ،محل کسب و یا شغل متهم معین نباشد و اقدامات بازپرس برای شناسایی نشانی وی به نتیجه نرسد. پ -در مورد جرای م تعزیری درجه پنج و بالاتر در صورتی که از اوضاع و احوال و قرائن موجود ،بیم تبانی یا فرار یا مخفی شدن متهم برود. ت -در مورد اشخاصی که به جرایم سازمانیافته و جرایم علیه امنیت داخلی و خارجی متهم باشند.", "explanation": "در چهار حالت خاص، بازپرس می‌تواند بدون احضار قبلی، مستقیماً دستور جلب متهم را صادر کند: جرایم بسیار شدید (سلب حیات، قطع عضو، حبس ابد)، نامعلوم بودن محل متهم، بیم تبانی یا فرار در جرایم تعزیری درجه پنج و بالاتر، و اتهام به جرایم سازمان‌یافته یا علیه امنیت.", "notes": ["این ماده استثنایی بر اصل «ابتدا احضار، سپس جلب» است."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۸۰ قانون آیین دادرسی کیفری، در کدام مورد بازپرس می‌تواند بدون احضار قبلی، دستور جلب متهم را صادر کند؟", "options": ["در تمام جرایم بدون استثنا", "در جرایمی که مجازات قانونی آن‌ها سلب حیات، قطع عضو یا حبس ابد است", "فقط در جرایم قابل‌گذشت", "هرگز چنین اختیاری ندارد"], "correct": 1, "explain": "بند «الف» ماده ۱۸۰ این استثنا را برای جرایم موجب سلب حیات، قطع عضو یا حبس ابد پیش‌بینی کرده است."}]}, {"article": 181, "category": "other", "chapter": "", "text": "جلب متهم به موجب برگه جلب به عمل میآید .مضمون برگه جلب که حاوی مشخصات متهم و علت جلب است باید توسط بازپرس امضا و به متهم ابلاغ شود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 182, "category": "other", "chapter": "", "text": "مأمور جلب پس از ابلاغ برگه جلب ،متهم را دعوت می کند که با او نزد بازپرس حاضر شود .چنانچه متهم امتناع کند، مأمور او را جلب و تحتالحفظ نزد بازپرس حاضر مینماید و در صورت نیاز میتواند از سایر مأموران کمک بخواهد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 183, "category": "other", "chapter": "", "text": "جلب متهم به استثنای موارد ضروری باید در روز به عمل آید و در همان روز به وسیله بازپرس و یا قاضی کشیک تعیین تکلیف شود. تبصره -تشخیص موارد ضرورت با توجه به اهمیت جرم ،وضعیت متهم ،کیفیت ارتکاب جرم و احتمال فرار متهم با نظر بازپرس است .بازپرس موارد ضرورت را در پرونده درج میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 184, "category": "other", "chapter": "", "text": "در صورتی که متواری بودن متهم به نظر بازپرس محرز باشد ،برگه جلب با تعیین مدت اعتبار در اختیار ضابطان دادگستری قرار میگیرد تا هر جا متهم را یافتند ،جلب و نزد بازپرس حاضر کنند. تبصره –۱ چنانچه جلب متهم به هر علت در مدت تعیین شده میسر نشود ،ضابطان مکلفند علت عدم جلب متهم را گزارش کنند. تبصره –۲ در صورت ضرورت ،بازپرس می تواند برگه جلب را برای مدت معین در اختیار شاکی قرار دهد تا با معرفی او ،ضابطان حوزه قضایی مربوط ،متهم را جلب کنند و تحویل دهند. تبصره –۳ در صورتی که متهم در منزل یا محل کار خود یا دیگری مخفی شده باشد ،ضابطان باید حکم ورود به آن محل را از مقام قضایی اخذ کنند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 185, "category": "other", "chapter": "", "text": "ضابطان دادگستری مکلفند متهم جلب شده را بلافاصله نزد بازپرس بیاورند و در صورت عدم دسترسی به بازپرس یا مقام قضایی جانشین ،در اولین وقت اداری ،متهم را نزد او حاضر کنند .در صورت تأخیر از تحویل فوری متهم ،باید علت آن و مدت زمان نگهداری در پرونده درج شود .به هر حال مدت نگهداری متهم تا تحویل وی به بازپرس یا قاضی کشیک نباید بیش از بیست و چهار ساعت باشد. تبصره -رعایت مقررات مواد ( )۴۹ تا ( )۵۳ این قانون در خصوص متهمان موضوع این ماده الزامی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 186, "category": "other", "chapter": "", "text": "در ایام تعطیل متوالی ،قاضی کشیک ،پرونده متهم جلب شده را با تنظیم صورت مجلس از شعبه بازپرسی خارج و تصمیم مقتضی اتخاذ مینماید و در نخستین روز پس از تعطیلی ،پرونده را با شرح اقدامات به شعبه مزبور اعاده میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 187, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "هرگاه شخصی که دستور احضار یا جلب او داده شده به علت بیماری ،کهولت سن یا معاذیری که بازپرس موجه تشخیص می دهد ،نتواند نزد بازپرس حاضر شود ،در صورت اهمیت و فوریت امر کیفری و امکان انجام تحقیقات ،بازپرس نزد او میرود و تحقیقات لازم را به عمل میآورد.", "explanation": "اگر شخص احضارشده به دلیل بیماری، کهولت سن یا عذر موجه دیگر نتواند نزد بازپرس حاضر شود، در صورت اهمیت و فوریت پرونده، خود بازپرس نزد او می‌رود و تحقیق را انجام می‌دهد.", "notes": ["مشابه ماده ۲۱۶ (دربارهٔ شهود)، این ماده همان اصل را برای «متهم یا شخص احضارشده» تکرار می‌کند."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۸۷ قانون آیین دادرسی کیفری، اگر شخص احضارشده به دلیل کهولت سن نتواند حاضر شود و امر کیفری هم مهم و فوری باشد، چه اقدامی انجام می‌شود؟", "options": ["پرونده بدون او پیش می‌رود", "بازپرس نزد او می‌رود و تحقیق می‌کند", "او به‌طور خودکار تبرئه می‌شود", "پرونده متوقف می‌ماند"], "correct": 1, "explain": "متن ماده در این شرایط حضور بازپرس نزد شخص احضارشده را پیش‌بینی کرده است."}]}, {"article": 188, "category": "other", "chapter": "", "text": "تا هنگامی که به متهم دسترسی حاصل نشده ،بازپرس میتواند با توجه به اهمیت و ادله وقوع جرم ،دستور منع خروج او را از کشور صادر کند .مدت اعتبار این دستور ،شش ماه و قابل تمدید است .در صورت حضور متهم در بازپرسی و یا صدور قرار موقوفی ،ترک و یا منع تعقیب ،ممنوعیت خروج منتفی و مراتب بلافاصله به مراجع مربوط اطلاع داده میشود .در صورتی که مدت مندرج در دستور منع خروج منقضی شود این دستور خود به خود منتفی است و مراجع مربوط نمیتوانند مانع از خروج شوند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 189, "category": "other", "chapter": "", "text": "بازپرس مکلف است بلافاصله پس از حضور یا جلب متهم ،تحقیقات را شروع کند و در صورت عدم امکان ،حداکثر ظرف بیست و چهار ساعت از زمان تحت نظر قرار گرفتن او توسط ضابطان دادگستری ،با رعایت ماده ( )۹۸ این قانون مبادرت به تحقیق نماید .در صورت غیبت یا عذر موجه بازپ رس یا امتناع وی از شروع تحقیقات به دلایل قانونی ،دادستان انجام تحقیقات را به بازپرس دیگر یا در صورت اقتضا به دادرس دادگاه محول میکند. تبصره -تحت نظر قرار دادن متهم بیش از بیست و چهار ساعت ،بدون آنکه تحقیق از او شروع یا تعیین تکلیف شود ،بازداشت غیرقانونی محسوب و مرتکب به مجازات قانونی محکوم میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 190, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "متهم می تواند در مرحله تحقیقات مقدماتی ،یک نفر وکیل دادگستری همراه خود داشته باشد .این حق باید پیش از شروع تحقیق توسط بازپرس به متهم ابلاغ و تفهیم شود .چنانچه متهم احضار شود این حق در برگه احضاریه قید و به او ابلاغ میشود .وکیل متهم می تواند با کسب اطلاع از اتهام و دلایل آن ،مطالبی را که برای کشف حقیقت و دفاع از متهم یا اجرای قانون لازم بداند ،اظهار کند .اظهارات وکیل در صورتمجلس نوشته میشود. تبصره ( ۱ اصالحی –)۱۳۹۴٫۳٫۲۴ سلب حق همراه داشتن وکیل و عدم تفهیم این حق به مته م به ترتیب موجب مجازات انتظامی درجه هشت و سه است. متن سابق تبصره « :۱ سلب حق همراه داشتن وکیل یا عدم تفهیم این حق به متهم موجب بیاعتباری تحقیقات میشود». تبصره –۲ در جرایمی که مجازات آن سلب حیات یا حبس ابد است ،چنانچه متهم اقدام به معرفی وکیل در مرحله تحقیقات مقدماتی ننماید ،بازپرس برای وی وکیل تسخیری انتخاب میکند. تبصره –۳ در مورد این ماده و نیز چنانچه اتهام مطرح مربوط به منافی عفت باشد ،مفاد ماده ( )۱۹۱ جاری است.", "explanation": "متهم حق دارد در تحقیقات مقدماتی یک وکیل همراه داشته باشد و این حق باید پیش از شروع تحقیق به او ابلاغ شود. طبق اصلاحیهٔ ۱۳۹۴، سلب این حق یا عدم تفهیم آن دیگر باعث «بی‌اعتباری تحقیقات» نمی‌شود، بلکه صرفاً مجازات انتظامی برای بازپرس متخلف دارد.", "notes": ["تغییر مهم نسبت به متن قبلی: پیش‌تر نقض این حق باعث بی‌اعتباری کل تحقیقات می‌شد؛ اکنون فقط مجازات انتظامی (درجهٔ هشت یا سه) دارد.", "در جرایم موجب سلب حیات یا حبس ابد، اگر متهم خودش وکیل نگیرد، بازپرس مکلف به تعیین وکیل تسخیری است."], "difficulty": "hard", "verified": true, "hasContent": true, "questions": [{"q": "طبق تبصرهٔ ۱ (اصلاحی) ماده ۱۹۰ قانون آیین دادرسی کیفری، عدم تفهیم حق داشتن وکیل به متهم چه پیامدی دارد؟", "options": ["بی‌اعتباری کامل تحقیقات", "مجازات انتظامی برای بازپرس متخلف", "بی‌گناهی خودکار متهم", "هیچ پیامدی ندارد"], "correct": 1, "explain": "طبق اصلاحیهٔ ۱۳۹۴، این نقض دیگر باعث بی‌اعتباری تحقیقات نیست، بلکه صرفاً موجب مجازات انتظامی می‌شود."}]}, {"article": 191, "category": "other", "chapter": "", "text": "چنانچه بازپرس ،مطالعه یا دسترسی به تمام یا برخی از اوراق ،اسناد یا مدارک پرونده را با ضرورت کشف حقیقت منافی بداند ،یا موضوع از جرایم علیه امنیت داخلی یا خارجی کشور باشد با ذکر دلیل ،قرار عدم دسترسی به آنها را صادر میکند .این قرار ،حضوری به متهم یا وکیل وی ابلاغ می شود و ظرف سه روز قابل اعتراض در دادگاه صالح است .دادگاه مکلف است در وقت فوقالعاده به اعتراض رسیدگی و تصمیم گیری کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 192, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "تحقیق از شاکی و متهم غیر علنی و انفرادی است مگر در جرایم قابلگذشت که به آنها در دادسرا حتیاالمکان به صورت ترافعی رسیدگی می شود و بازپرس مکلف است در صورت امکان ،سعی در ایجاد صلح و سازش و یا ارجاع امر به میانجیگری نماید.", "explanation": "تحقیق از شاکی و متهم اصولاً غیرعلنی و انفرادی است؛ اما در جرایم قابل‌گذشت، در دادسرا تا حد امکان به‌صورت ترافعی (حضوری و رودررو) رسیدگی می‌شود و بازپرس باید تلاش کند بین طرفین صلح و سازش برقرار کند یا به میانجی‌گری ارجاع دهد.", "notes": ["در جرایم قابل‌گذشت، بازپرس نقش فعالی در ایجاد صلح و سازش یا ارجاع به میانجی‌گری دارد."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۹۲ قانون آیین دادرسی کیفری، در جرایم قابل‌گذشت، بازپرس چه تلاشی باید انجام دهد؟", "options": ["فقط تحقیقات فنی", "تا حد امکان تلاش برای ایجاد صلح و سازش یا ارجاع به میانجی‌گری", "صدور فوری کیفرخواست", "هیچ تلاش خاصی لازم نیست"], "correct": 1, "explain": "متن ماده این تلاش برای صلح و سازش یا ارجاع به میانجی‌گری را وظیفهٔ بازپرس دانسته است."}]}, {"article": 193, "category": "other", "chapter": "", "text": "بازپرس ابتدا اوراق هویت متهم را ملاحظه می نماید و سپس مشخصات متهم ،شامل نام ،نام خانوادگی ،نام پدر ،شهرت، سن ،شغل ،میزان تحصیلات ،وضعیت تأهل ،تعداد فرزند ،تابعیت ،مذهب ،سابقه کیفری در موارد ضروری و مرتبط ،همچنین نشانی محل سک ونت و محل کار او ،اعم از شهر ،بخش ،دهستان ،روستا ،خیابان ،کوچه ،شماره و کد پستی منزل ،شماره ملی، پیامنگار (ایمیل) و شماره تلفن ثابت و همراه او را به طور دقیق پرسش میکند ،به نحوی که ابلاغ احضاریه و سایر اوراق قضایی به متهم به آسانی مقدور باشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 194, "category": "other", "chapter": "", "text": "بازپرس در ابتدای تحقیق به متهم تفهیم میکند محلی را که برای اقامت خود اعلام مینماید ،محل اقامت قانونی او است و چنانچه محل اقامت خود را تغییر دهد ،باید محل جدید را به گونهای که ابلاغ ممکن باشد اعلام کند و در غیر این صورت، احضاریهها و سایر اوراق قضایی به محل اقامت اعلامشده قبلی فرستاده می شود .تغییر محل اقامت به منظور تأخیر و تعلل به گونهای که ابلاغ اوراق دشوار باشد ،پذیرفته نیست و تمام اوراق در همان محل اعلامشده قبلی ابلاغ میشود .تشخیص تغییر محل به منظور تأخیر و تعلل ،با مقامی است که به اتهام رسیدگی می کند .رعایت مقررات این ماده از نظر تعیین محل اقامت شاکی یا مدعی خصوصی نیز لازم است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 195, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "بازپرس پیش از شروع به تحقیق با توجه به حقوق متهم به وی اعلام میکند مراقب اظهارات خود باشد .سپس موضوع اتهام و ادله آن را به شکل صریح به او تفهیم میکند و به او اعلام مینماید که اقرار یا همکاری مؤثر وی میتواند موجبات تخفیف مجازات وی را در دادگاه فراهم سازد و آنگاه شروع به پرسش میکند .پرسش ها باید مفید ،روشن ،مرتبط با اتهام و در محدوده آن باشد .پرسش تلقینی یا همراه با اغفال ،اکراه و اجبار متهم ممنوع است. تبصره -وکیل متهم می تواند در صورت طرح سؤالات تلقینی یا سایر موارد خلاف قانون به بازپرس تذکر دهد.", "explanation": "پیش از شروع تحقیق، بازپرس به متهم دربارهٔ حقوقش تذکر می‌دهد، اتهام و ادله را صریح تفهیم می‌کند و یادآوری می‌کند که اقرار یا همکاری می‌تواند در دادگاه به تخفیف مجازات منجر شود. پرسش‌ها باید مفید، روشن و مرتبط با اتهام باشند؛ پرسش‌های تلقینی یا اغفال‌کننده ممنوع است.", "notes": ["ممنوعیت پرسش‌های تلقینی یا اغفال‌کننده، تضمینی برای انصاف در بازجویی است."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۹۵ قانون آیین دادرسی کیفری، پرسش‌های بازپرس از متهم باید چه ویژگی‌هایی داشته باشد؟", "options": ["می‌تواند تلقینی و اغفال‌کننده هم باشد", "باید مفید، روشن و مرتبط با اتهام باشد و پرسش تلقینی ممنوع است", "فقط باید بله/خیر باشد", "نیازی به ارتباط با اتهام ندارد"], "correct": 1, "explain": "متن ماده این استانداردها را برای پرسش‌های بازپرس تعیین کرده و پرسش تلقینی را ممنوع دانسته است."}]}, {"article": 196, "category": "other", "chapter": "", "text": "تخلف از مقررات مواد ( )۱۹۳ تا ( )۱۹۵ این قانون موجب محکومیت انتظامی تا درجه چهار است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 197, "category": "other", "chapter": "", "text": "متهم می تواند سکوت اختیار کند .در این صورت مراتب امتناع وی از دادن پاسخ یا امضای اظهارات ،در صورتمجلس قید میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 198, "category": "other", "chapter": "", "text": "بازپرس جز در موارد مواجهه حضوری ،از متهمان به نحو انفرادی تحقیق می کند .متهمان نباید با یکدیگر داخل در مذاکره و مواضعه شوند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 199, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "پاسخ پرسش ها باید بدون تغییر ،تبدیل و یا تحریف نوشته شود و پ س از قرائت برای متهم به امضا یا اثر انگشت او برسد .متهم با سواد خودش پاسخ را مینویسد ،مگر آنکه نخواهد از این حق استفاده کند.", "explanation": "پاسخ‌های متهم به پرسش‌ها باید عیناً و بدون تغییر یا تحریف نوشته شود و پس از قرائت به امضا یا اثر انگشت متهم برسد. اگر متهم باسواد باشد، خودش پاسخ را می‌نویسد، مگر از این حق صرف‌نظر کند.", "notes": ["اصل: ثبت بدون تحریف پاسخ‌ها + امکان نوشتن پاسخ توسط خود متهم باسواد."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۹۹ قانون آیین دادرسی کیفری، اگر متهم باسواد باشد، پاسخ به پرسش‌ها را چه کسی می‌نویسد؟", "options": ["فقط بازپرس", "خود متهم، مگر از این حق صرف‌نظر کند", "فقط منشی دادگاه", "فقط وکیل متهم"], "correct": 1, "explain": "متن ماده این حق را برای متهم باسواد به‌رسمیت شناخته، مگر خودش از آن صرف‌نظر کند."}]}, {"article": 200, "category": "other", "chapter": "", "text": "بازپرس برای شاکی ،مدعی خصوصی ،متهم ،شاهد و مطلعی که قادر به سخن گفتن به زبان فارسی نیست ،مترجم مورد وثوق از بین مترجمان رسمی و در صورت عدم دسترسی به مترجم رسمی ،مترجم مورد وثوق دیگری تعیین میکند .مترجم باید سوگند یاد کند که راستگویی و امانتداری را رعایت کند .عدم اتیان سوگند سبب عدم پذیرش ترجمه مترجم مورد وثوق نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 201, "category": "other", "chapter": "", "text": "بازپرس برای شاکی ،مدعی خصوصی ،متهم ،شاهد و مطلعی که ناشنوا است یا قدرت تکلم ندارد ،فرد مورد وثوقی که توانایی بیان مقصود را از طریق اشاره یا وسایل فنی دیگر دارد ،به عنوان مترجم انتخاب میکند .مترجم باید سوگند یاد کند که راستگویی و امانتداری را رعایت کند .چنانچه افراد مذکور قادر به نوشتن باشند ،منشی شعبه سؤال را برای آنان مینویسد تا به طور کتبی پاسخ دهند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 202, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "هرگاه بازپرس در جریان تحقیقات احتمال دهد متهم هنگام ارتکاب جرم مجنون بوده است ،تحقیقات لازم را از نزدیکان او و سایر مطلعان به عمل میآورد ،نظریه پزشکی قانونی را تحصیل میکند و با احراز جنون ،پرونده را با صدور قرار موقوفی تعقیب نزد دادستان می فرستد .در صورت موافقت دادستان با نظر بازپرس ،چنانچه جنون استمرار داشته باشد شخص مجنون بنا بر ضرورت ،حسب دستور دادستان به مراکز مخصوص نگهداری و درمان سازمان بهزیستی و وزارت بهداشت ،درمان و آموزش پزشکی منتقل میشود .مراکز مذکور مکلف به پذیرش می باشند و در صورت امتناع از اجرای دستور دادستان ،به مجازات امتناع از دستور مقام قضایی مطابق قانون مجازات اسلامی محکوم میشوند. تبصره –۱ آیین نامه اجرائی این ماده توسط وزیر دادگستری با همکاری وزرای بهداشت ،درمان و آموزش پزشکی و تعاون ،کار و رفاه اجتماعی تهیه می شود و به تصویب رئیس قوه قضائیه میرسد. تبصره –۲ چنانچه جرایم مشمول این ماده مستلزم پرداخت دیه باشد ،طبق مقررات مربوط اقدام میشود.", "explanation": "اگر بازپرس احتمال دهد متهم هنگام ارتکاب جرم مجنون بوده، تحقیق از نزدیکان و مطلعان انجام داده و نظر پزشکی قانونی می‌گیرد. با احراز جنون، قرار موقوفی تعقیب صادر و پرونده نزد دادستان می‌رود؛ در صورت استمرار جنون، شخص می‌تواند حسب ضرورت نگهداری شود.", "notes": ["مسیر رسیدگی به احتمال جنون متهم: تحقیق از نزدیکان + نظر پزشکی قانونی + قرار موقوفی تعقیب (در صورت احراز)."], "difficulty": "hard", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۰۲ قانون آیین دادرسی کیفری، اگر بازپرس جنون متهم را هنگام ارتکاب جرم احراز کند، چه اقدامی می‌کند؟", "options": ["پرونده را مختومه و بدون هیچ اقدامی بایگانی می‌کند", "نظر پزشکی قانونی می‌گیرد و قرار موقوفی تعقیب صادر می‌کند", "بلافاصله متهم را محکوم می‌کند", "پرونده را نجام می‌شود؟", "options": ["نادیده گرفته می‌شود", "جلب می‌شود", "فقط جریمهٔ نقدی می‌شود", "پرونده متوقف می‌شود"], "correct": 1, "explain": "متن تبصره در این حالت جلب شاهد را پیش‌بینی کرده است."}]}, {"article": 205, "category": "other", "chapter": "", "text": "در صورتی که ش اهد یا مطلع از نیروهای مسلح باشد ،باید حداقل بیست و چهار ساعت پیش از تحقیق یا جلسه محاکمه از طریق فرمانده یا رئیس او دعوت شود .فرمانده یا رئیس مربوط مکلف است پس از وصول دستور مقام قضائی ،شخص احضارشده را در موقع مقرر بفرستد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 206, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "تحقیق و بازجویی از شهود و مطلعان قبل از رسیدگی در دادگاه ،غیر علنی است.", "explanation": "تحقیق و بازجویی از شهود و مطلعان در مرحلهٔ پیش از دادگاه، غیرعلنی است؛ یعنی افراد غیرمرتبط حق حضور در این جلسات را ندارند.", "notes": ["اصل غیرعلنی بودن، محدود به مرحلهٔ پیش از دادگاه است؛ در خودِ دادگاه ممکن است علنی باشد."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۰۶ قانون آیین دادرسی کیفری، تحقیق و بازجویی از شهود و مطلعان پیش از رسیدگی در دادگاه چگونه است؟", "options": ["علنی و باز برای عموم", "غیرعلنی", "فقط با حضور رسانه‌ها", "بستگی به نظر شاهد دارد"], "correct": 1, "explain": "متن ماده صراحتاً این مرحله را «غیرعلنی» اعلام کرده است."}]}, {"article": 207, "category": "other", "chapter": "", "text": "بازپرس از هر یک از شهود و مطلعان جداگانه و بدون حضور متهم تحقیق میکند و منشی اطلاعات ایشان را ثبت میکند و به امضا یا اثر انگشت آنان می رساند .تحقیق مجدد از شهود و مطلعان در موارد ضرورت یا مواجهه آنان بلامانع است. دلیل ضرورت باید در صورتمجلس قید شود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 208, "category": "other", "chapter": "", "text": "پس از حضور شهود و مطلعان ،بازپرس ابتدا اسامی حاضران را در صورتمجلس قید میکند و سپس از آنان به ترتیبی که از جهت تقدم و تأخر صالح بداند تحقیق مینماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 209, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "بازپرس پیش از شروع به تحقیق ،حرمت و مجازات شهادت دروغ و کتمان شهادت را به شاهد تفهیم میکند و نام ،نام خانوادگی ،نام پدر ،سن ،شغل ،میزان تحصیلات ،مذهب ،محل اقامت ،پیامنگار (ایمیل) ،شماره تلفن ثابت و همراه و سابقه محکومیت کیفری و درجه قرابت سببی یا نسبی و وجود یا عدم رابطه خادم و مخ دومی شاهد یا مطلع با طرفین پرونده را سؤال مینماید و در صورتمجلس قید میکند.", "explanation": "پیش از تحقیق از شاهد، بازپرس باید حرمت و مجازات شهادت دروغ یا کتمان شهادت را به او تفهیم کند و مشخصات کامل هویتی، تماسی و نسبت او با طرفین پرونده را ثبت نماید.", "notes": ["تفهیم مجازات شهادت دروغ، پیش‌شرط شروع تحقیق از شاهد است."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۰۹ قانون آیین دادرسی کیفری، بازپرس پیش از شروع تحقیق از شاهد چه تکلیفی دارد؟", "options": ["هیچ تکلیفی ندارد", "باید حرمت و مجازات شهادت دروغ و کتمان شهادت را به او تفهیم کند", "باید فوراً او را سوگند دهد", "باید شاهد را بازداشت کند"], "correct": 1, "explain": "متن ماده این تفهیم را پیش از شروع تحقیق، تکلیف بازپرس دانسته است."}]}, {"article": 210, "category": "other", "chapter": "", "text": "شاهد و مطلع پیش از اظهار اطلاعات خود به این شرح سوگند یاد میکند« :به خداوند متعال سوگند یاد میکنم که جز به راستی چیزی نگویم و تمام واقعیت را بیان کنم».", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 211, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "بازپرس می تواند در صورتی که شاهد یا مطلع واجد شرایط شهادت نباشد ،بدون یاد کردن سوگند ،اظهارات او را برای اطلاع بیشتر استماع کند.", "explanation": "اگر شاهد یا مطلع واجد شرایط قانونی شهادت (مثل سن یا اهلیت) نباشد، بازپرس می‌تواند بدون اجرای تشریفات سوگند، صرفاً برای کسب اطلاع بیشتر، اظهارات او را بشنود؛ چنین اظهاراتی «شهادت رسمی» محسوب نمی‌شود.", "notes": ["تفاوت مهم: شنیدن حرف افراد فاقد شرایط شهادت، جنبهٔ اطلاعاتی دارد نه ارزش شهادت رسمی."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۱۱ قانون آیین دادرسی کیفری، اگر شاهدی واجد شرایط شهادت نباشد، بازپرس چه اقدامی می‌تواند انجام دهد؟", "options": ["اصلاً حق شنیدن اظهارات او را ندارد", "بدون سوگند، صرفاً برای اطلاع بیشتر اظهاراتش را می‌شنود", "او را ملزم به سوگند می‌کند", "او را از دادن اظهارات منع می‌کند"], "correct": 1, "explain": "متن ماده این امکان (شنیدن بدون سوگند، صرفاً جهت اطلاع) را برای بازپرس پیش‌بینی کرده است."}]}, {"article": 212, "category": "other", "chapter": "", "text": "اظهارات شهود و مطلعان در صورتمجلس قید میشود ،سپس متن آن قرائت میگردد و به امضا یا اثر انگشت شاهد یا مطلع میرسد و چنان چه از امضا یا اثر انگشت امتناع یا از ادای شهادت خودداری ورزد یا قادر به انجام آن نباشد ،مراتب در صورتمجلس قید میشود و تمام صفحات صورتمجلس به امضای بازپرس و منشی میرسد. تبصره -بازپرس مکلف است از شاهد یا مطلع علت امتناع از امضا یا اثرانگشت یا ادای شهادت را بپرسد و پاسخ را در صورتمجلس قید کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 213, "category": "other", "chapter": "", "text": "تفهیم اتهام به کسی که به عنوان متهم احضار نشده از قبیل شاهد یا مطلع ممنوع است و چنانچه این شخص پس از تحقیق در مظان اتهام قرار گیرد ،باید طبق مقررات و به عنوان متهم برای وقت دیگر احضار شود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 214, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "هرگاه بیم خطر جانی یا حیثیتی و یا ضرر مالی برای شاهد یا مطلع و یا خانواده آنان وجود داشته باشد ،اما استماع اظهارات آنان ضروری باشد ،بازپرس به منظور حمایت از شاهد یا مطلع و با ذکر علت در پرونده ،تدابیر زیر را اتخاذ میکند: الف -عدم مواجهه حضوری بین شاهد یا مطلع با شاکی یا متهم ب -عدم افشای اطلاعات مربوط به هویت ،مشخصات خانوادگی و محل سکونت یا فعالیت شاهد یا مطلع پ -استماع اظهارات شاهد یا مطلع در خارج از دادسرا با وسایل ارتباط از راه دور تبصره –۱ در صورت شناسایی شاهد یا مطلع حسب مورد توسط متهم یا متهمان یا شاکی و یا وجود قرائن یا شواهد ،مبنی بر احتمال شناسایی و وجود بیم خطر برای آنان ،بازپرس به درخواست شاهد یا مطلع ،تدابیر لازم را از قبیل آموزش برای حفاظت از سلامت جسمی و روحی یا تغییر مکان آنان اتخاذ میکند .ترتیبات این امر به موجب آییننامهای است که ظرف شش ماه از تاریخ لازم‌الاجرا شدن این قانون توسط وزارت دادگستری تهیه می شود و به تصویب رئیس قوه قضائیه میرسد. تبصره –۲ ترتیبات فوق باید به نحوی صورت پذیرد که منافی حقوق دفاعی متهم نباشد. تبصره –۳ ترتیبات مقرر در این ماده و تبصره ( )۱ آن در مرحله رسیدگی در دادگاه نیز اجرا میشود.", "explanation": "اگر شاهد یا مطلع در معرض خطر جانی، حیثیتی یا مالی باشد، بازپرس می‌تواند تدابیر حمایتی اتخاذ کند: جلوگیری از مواجههٔ حضوری او با متهم/شاکی، و عدم افشای هویت و مشخصات او.", "notes": ["دو تدبیر کلیدی حمایت از شاهد در خطر: عدم مواجههٔ حضوری + عدم افشای هویت."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۱۴ قانون آیین دادرسی کیفری، یکی از تدابیر حمایتی بازپرس از شاهدی که در معرض خطر است، چیست؟", "options": ["افشای کامل هویت او برای شفافیت", "عدم مواجههٔ حضوری بین شاهد و متهم یا شاکی", "اجبار او به حضور علنی در دادگاه", "نادیده گرفتن اظهاراتش"], "correct": 1, "explain": "بند «الف» ماده ۲۱۴ عدم مواجههٔ حضوری را یکی از تدابیر حمایتی معرفی کرده است."}]}, {"article": 215, "category": "other", "chapter": "", "text": "در صورتی که شاهد یا مطلع برای حضور خود درخواست هزینه ایاب و ذهاب کند یا مدعی ضرر و زیانی از حیث ترک شغل خود شود ،بازپرس هزینه ایاب و ذهاب را طبق تعرفهای که قوه قضائیه اعلام میکند و ضرر و زیان ناشی از ترک شغل را در صورت لزوم با استفا ده از نظر کارشناس تعیین و شاکی را مکلف به تودیع آن در صندوق دادگستری مینماید .هرگاه شاکی ،به تشخیص بازپرس توانایی پرداخت هزینه را نداشته یا احضار از طرف بازپرس باشد ،هزینههای مذکور از محل اعتبارات مصوب قوه قضائیه پرداخت میشود .هرگاه در جرایم قابلگذشت ،شاکی با وجود ملائت از پرداخت هزینههای مذکور در این ماده خودداری کند ،استماع شهادت یا گواهی مطلعین معرفیشده از جانب وی به عمل نمیآید .اما در جرایم غیرقابلگذشت ،هزینههای مذکور به دستور بازپرس از محل اعتبارات مصوب قوه قضائیه پرداخت میشود .هرگاه متهم متقاضی احضار شاهد یا مطلع باشد، هزینههای مذکور از محل اعتبارات مصوب قوه قضائیه پرداخت میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 216, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "در صورتی که شاهد یا مطلع به عللی از قبیل بیماری یا کهولت سن نتواند حاضر شود و یا تعداد شهود یا مطلعان ،زیاد و در یک یا چند محل باشند و همچنین هرگاه اهمیت و فوریت امر اقتضا کند ،بازپرس در محل حضور مییابد و مبادرت به تحقیق میکند.", "explanation": "اگر شاهد یا مطلع به دلیل بیماری یا کهولت سن نتواند حاضر شود، یا تعداد شهود زیاد و پراکنده باشد، یا فوریت امر اقتضا کند، بازپرس خودش در محل حضور یافته و تحقیق را انجام می‌دهد.", "notes": ["استثنایی بر اصل حضور شاهد نزد بازپرس: در این موارد، بازپرس به محل شاهد می‌رود."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۱۶ قانون آیین دادرسی کیفری، اگر شاهدی به دلیل کهولت سن نتواند نزد بازپرس حاضر شود، چه اتفاقی می‌افتد؟", "options": ["اظهاراتش نادیده گرفته می‌شود", "بازپرس در محل او حضور می‌یابد و تحقیق می‌کند", "پرونده متوقف می‌شود", "شاهد باید حتماً بازداشت شود"], "correct": 1, "explain": "متن ماده در چنین شرایطی حضور بازپرس در محل شاهد را پیش‌بینی کرده است."}]}, {"article": 217, "category": "gharar", "chapter": "بخش دوم - کشف جرم و تحقیقات مقدماتی، قرارهای تأمین کیفری", "text": "به منظور دسترسی به متهم و حضور به موقع وی ،جلوگیری از فرار یا مخفی شدن او و تضمین حقوق بزهدیده برای جبران ضرر و زیان وی ،بازپرس پس از تفهیم اتهام و تحقیق لازم ،در صورت وجود دلایل کافی ،یکی از قرارهای تأمین زیر را صادر میکند: الف -التزام به حضور با قول شرف ب -التزام به حضور با تعیین وجه التزام پ -التزام به عدم خروج از حوزه قضایی با قول شرف ت -التزام به عدم خروج از حوزه قضایی با تعیین وجه التزام ث -التزام به معرفی نوبه ای خود به صورت هفتگی یا ماهانه به مرجع قضایی یا انتظامی با تعیین وجه التزام ج -التزام مستخدمان رسمی کشوری یا نیروهای مسلح به حضور با تعیین وجه التزام ،با موافقت متهم و پس از اخذ تعهد پرداخت از محل حقوق آنان از سوی سازمان مربوط چ -التزام به عدم خروج از منزل یا محل اقامت تعیین شده با موافقت متهم با تعیین وجه التزام از طریق نظارت با تجهیزات الکترونیکی یا بدون نظارت با این تجهیزات ح -اخذ کفیل با تعیین وجهالکفاله خ -اخذ وثیقه اعم از وجه نقد ،ضمانتنامه بانکی ،مال منقول یا غیرمنقول د -بازداشت موقت با رعایت شرایط مقرر قانونی تبصره –۱ در صورت امتناع متهم از پذیرش قرار تأمین مندرج در بند (الف) ،قرار التزام به حضور با تعیین وجه التزام صادر و در صورت امتناع از پذیرش قرارهای مندرج در بندهای (ب)( ،پ)( ،ت) و (ث) قرار کفالت صادر میشود. تبصره –۲ در مورد بندهای (پ) و (ت) ،خروج از حوزه قضایی با اجازه قاضی ممکن است. تبصره –۳ در جرایم غیر عمدی در صورتی که به تشخیص مقام قضایی تضمین حقوق بزهدیده به طریق دیگر امکانپذیر باشد، صدور قرار کفالت و وثیقه جایز نیست.", "explanation": "ماده ۲۱۷ ده نوع «قرار تأمین کیفری» را به ترتیب از خفیف‌ترین (التزام با قول شرف) تا شدیدترین (بازداشت موقت) برمی‌شمرد. بازپرس باید متناسب با شدت اتهام، یکی از این قرارها را انتخاب کند.", "notes": ["ترتیب قرارها از خفیف به شدید: قول شرف ← وجه التزام ← نظارت الکترونیکی ← کفیل ← وثیقه ← بازداشت موقت.", "بازداشت موقت به عنوان آخرین و شدیدترین گزینه در نظر گرفته شده و مشروط به رعایت شرایط قانونی خاص است."], "difficulty": "hard", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۱۷ قانون آیین دادرسی کیفری، شدیدترین نوع قرار تأمین کیفری که باید با رعایت شرایط قانونی خاص صادر شود، کدام است؟", "options": ["التزام به حضور با قول شرف", "اخذ کفیل", "بازداشت موقت", "اخذ وثیقهٔ نقدی"], "correct": 2, "explain": "بازداشت موقت شدیدترین نوع قرار تأمین است و صدور آن مشروط به رعایت شرایط مقرر قانونی است."}, {"q": "صدور قرارهای تأمین کیفری موضوع ماده ۲۱۷ بر عهدهٔ چه مقامی است؟", "options": ["ضابط دادگستری", "بازپرس، پس از تفهیم اتهام و تحقیق لازم", "شاکی خصوصی", "وکیل متهم"], "correct": 1, "explain": "متن ماده تصریح می‌کند این قرارها توسط «بازپرس» و پس از تفهیم اتهام و انجام تحقیق لازم صادر می‌شود."}]}, {"article": 218, "category": "gharar", "chapter": "بخش دوم - قرارهای تأمین کیفری", "text": "برای اتهامات متعدد متهم ،قرار تأمین واحد صادر می شود ،مگر آنکه رسیدگی به جرایم ارتکابی در صلاحیت ذاتی دادگاه های مختلف باشد که در این صورت برای اتهامات موضوع صلاحیت هر دادگاه ،قرار تأمین متناسب و مستقل صادر میشود.", "explanation": "اگر متهم چند اتهام مختلف داشته باشد، اصولاً یک قرار تأمین واحد صادر می‌شود؛ اما اگر رسیدگی به این اتهامات در صلاحیت ذاتی دادگاه‌های مختلفی باشد، برای هر دسته، قرار تأمین جداگانه و متناسب صادر می‌شود.", "notes": ["اصل: قرار تأمین واحد برای اتهامات متعدد. استثنا: صلاحیت ذاتی متفاوت دادگاه‌ها → قرارهای مجزا."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۱۸ قانون آیین دادرسی کیفری، برای اتهامات متعدد متهم اصولاً چند قرار تأمین صادر می‌شود؟", "options": ["به تعداد اتهامات، همیشه جداگانه", "یک قرار تأمین واحد، مگر صلاحیت ذاتی دادگاه‌ها متفاوت باشد", "هیچ قرار تأمینی لازم نیست", "فقط برای سنگین‌ترین اتهام"], "correct": 1, "explain": "متن ماده اصل را بر صدور قرار واحد گذاشته و استثنا را به تفاوت صلاحیت ذاتی دادگاه‌ها محدود کرده است."}]}, {"article": 219, "category": "gharar", "chapter": "بخش دوم - قرارهای تأمین کیفری", "text": "مبلغ وجه التزام ،وجهالکفاله و وثیقه نباید در هر حال از خسارت وارد به بزه دیده کمتر باشد .در مواردی که دیه یا خسارت زیان دیده از طریق بیمه قابل جبران است ،بازپرس با لحاظ مبلغ قابل پرداخت از سوی بیمه قرار تأمین متناسب صادر میکند.", "explanation": "این ماده معیار تعیین میزان وجه التزام، وجه‌الکفاله و وثیقه را مشخص می‌کند: نباید کمتر از خسارت واردشده به بزه‌دیده باشد، مگر آنکه بخشی از خسارت از طریق بیمه قابل جبران باشد.", "notes": ["حداقل مبلغ تأمین = میزان خسارت وارده به بزه‌دیده (با احتساب سهم قابل پرداخت بیمه در صورت وجود)."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۱۹ قانون آیین دادرسی کیفری، مبلغ وجه‌الکفاله یا وثیقه نباید کمتر از چه میزانی باشد؟", "options": ["حداقل دستمزد قانونی", "خسارت وارده به بزه‌دیده", "نصف ارزش اموال متهم", "مبلغ ثابت تعیین‌شده برای همهٔ پرونده‌ها"], "correct": 1, "explain": "متن ماده تصریح می‌کند این مبالغ در هر حال نباید از خسارت وارده به بزه‌دیده کمتر باشد."}]}, {"article": 220, "category": "gharar", "chapter": "بخش دوم - قرارهای تأمین کیفری", "text": "در صورتی که متهم بخواهد به جای معرفی کفیل ،وثیقه بسپارد ،بازپرس مکلف به قبول آن و تبدیل قرار است .در این صورت متهم میتواند در هر زمان با معرفی کفیل ،آزادی وثیقه را تقاضا کند.", "explanation": "اگر متهم بخواهد به‌جای معرفی کفیل، وثیقه بسپارد، بازپرس مکلف است این تبدیل را بپذیرد. متهم بعداً هم می‌تواند در هر زمان با معرفی کفیل، آزادی وثیقه را درخواست کند (یعنی تبدیل در هر دو جهت ممکن است).", "notes": ["تبدیل کفالت به وثیقه و برعکس، حق متهم است و بازپرس مکلف به پذیرش آن است."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۲۰ قانون آیین دادرسی کیفری، اگر متهم به‌جای کفیل بخواهد وثیقه بسپارد، بازپرس چه تکلیفی دارد؟", "options": ["می‌تواند رد کند", "مکلف به قبول آن و تبدیل قرار است", "باید از دادستان اجازه بگیرد", "فقط دادگاه می‌تواند تصمیم بگیرد"], "correct": 1, "explain": "متن ماده بازپرس را مکلف به پذیرش این تبدیل کرده است."}]}, {"article": 221, "category": "other", "chapter": "", "text": "کفالت شخصی پذیرفته میشود که ملائت او به تشخیص بازپرس برای پرداخت وجهالکفاله محل تردید نباشد .چنانچه بازپرس ملائت کفیل را احراز نکند ،مراتب را فوری به نظر دادستان می رساند .دادستان موظف است در همان روز ،رسیدگی و در این باره اظهارنظر کند .تشخیص دادستان برای بازپرس الزامی است .در صورت تأیید نظر بازپرس توسط دادستان مراتب در پرونده درج میشود. تبصره -پذیرش کفالت اشخاص حقوقی با رعایت مقررات این ماده بلامانع است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 222, "category": "other", "chapter": "", "text": "در صورت عدم پذیرش تقاضای کتبی وثیقه گذار توسط بازپرس ،مراتب با ذکر علت در پرونده منعکس میشود .تخلف از مقررات این ماده موجب محکومیت انتظامی از درجه چهار به بالا است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 223, "category": "other", "chapter": "", "text": "بازپرس در مورد قبول وثیقه یا کفالت ،قرار صادر مینماید و پس از امضای کفیل یا وثیقه گذار ،خود نیز آن را امضا میکند و با درخواست کفیل یا وثیقه گذار ،تصویر قرار را به آنان میدهد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 224, "category": "gharar", "chapter": "بخش دوم - قرارهای تأمین کیفری", "text": "بازپرس مکلف است ضمن صدور قرار قبولی کفالت یا وثیقه ،به کفیل یا وثیقهگذار تفهیم کند که در صورت احضار متهم و عدم حضور او بدون عذر موجه و عدم معرفی وی از ناحیه کفیل یا وثیقه گذار ،وجهالکفاله وصول یا وثیقه طبق مقررات این قانون ضبط میشود. تبصره -تفهیم مفاد ماده ( )۱۹۴ این قانون نسبت به کفیل و وثیقهگذار نیز الزامی است.", "explanation": "این ماده تکلیف بازپرس به «تفهیم» پیامد عدم حضور متهم به کفیل یا وثیقه‌گذار را مقرر می‌کند؛ یعنی کفیل/وثیقه‌گذار باید از قبل بداند که در صورت عدم حضور متهم، مال یا وجه او ضبط خواهد شد.", "notes": ["تفهیم این موضوع به کفیل/وثیقه‌گذار یک «تکلیف» قانونی برای بازپرس است، نه یک اختیار."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۲۴ قانون آیین دادرسی کیفری، اگر متهم پس از احضار بدون عذر موجه حاضر نشود و کفیل نیز او را معرفی نکند، چه اتفاقی می‌افتد؟", "options": ["فقط تذکر کتبی به کفیل داده می‌شود", "وجه‌الکفاله وصول یا وثیقه طبق مقررات ضبط می‌شود", "پرونده بدون هیچ اقدامی مختومه می‌شود", "کفیل بازداشت می‌شود"], "correct": 1, "explain": "متن صریح ماده ۲۲۴: در این حالت وجه‌الکفاله وصول یا وثیقه ضبط می‌شود."}]}, {"article": 225, "category": "other", "chapter": "", "text": "قرار تأمین باید فوری به متهم ابلاغ و تصویر آن به وی تحویل شود .در صورتی که قرار تأمین منتهی به بازداشت گردد، مفاد قرار در برگه اعزام درج میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 226, "category": "other", "chapter": "", "text": "متهمی که در مورد او قرار کفالت یا وثیقه صادر می شود تا معرفی کفیل یا سپردن وثیقه به بازداشتگاه معرفی میگردد؛ اما در صورت بازداشت ،متهم میتواند تا مدت ده روز از تاریخ ابلاغ قرار بازپرس ،نسبت به اصل قرار منتهی به بازداشت یا عدم پذیرش کفیل یا وثیقه اعتراض کند. تبصره -مرجع صادرکننده قرار و رئیس یا معاون زندان مکلفند تمهیدات لازم را به منظور دسترسی متهم به افرادی که وی برای یافتن کفیل یا وثیقه گذار معرفی می کند ،فراهم کنند و هر زمان متهم ،کفیل یا وثیقه معرفی نماید هر چند خارج از وقت اداری باشد، در صورت وجود شرایط قانونی ،مرجع صادرکننده قرار یا قاضی کشیک مکلف به پذیرش آن هستند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 227, "category": "other", "chapter": "", "text": "مراتب تحویل متهم توسط مأمور رسمی در سوابق بازداشتگاه ثبت و تحویلدهنده ،رسیدی حاوی تاریخ و ساعت تحویل متهم اخذ و به بازپرس تسلیم میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 228, "category": "other", "chapter": "", "text": "کفیل یا وثیقهگذار در هر مرحله از تحقیقات و دادرسی با معرفی و تحویل متهم میتواند ،حسب مورد ،رفع مسؤولیت یا آزادی وثیقه خود را از مرجعی که پرونده در آنجا مطرح است درخواست کند .مرجع مزبور مکلف است بلافاصله مراتب رفع مسؤولیت یا آزادی وثیقه را فراهم نماید. تبصره -در مواردی که متهم به علت دیگری از سوی سایر مراجع بازداشت باشد نیز ،کفیل یا وثیقهگذار میتواند اعزام وی را درخواست نماید .در این صورت پس از حضور متهم مطابق این ماده اقدام میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 229, "category": "other", "chapter": "", "text": "خواستن متهم از کفیل یا وثیقه گذار جز در موردی که حضور متهم برای تحقیقات ،دادرسی و یا اجرای حکم ضرورت دارد ،ممنوع است. تبصره -تخلف از مقررات این ماده موجب محکومیت انتظامی تا درجه چهار است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 230, "category": "gharar", "chapter": "بخش دوم - قرارهای تأمین کیفری", "text": "متهمی که برای او قرار تأمین صادر و خود ملتزم شده یا وثیقه گذاشته است ،در صورتی که حضورش لازم باشد ،احضار می شود و هرگاه ثابت شود بدون عذر موجه حاضر نشده است ،در صورت ابلاغ واقعی اخطاریه ،وجه التزام تعیینشده به دستور دادستان اخذ و یا از وثیقه سپردهشده معادل وجه قرار ضبط میشود .چنانچه متهم ،کفیل معرفی کرده یا شخص دیگری برای او وثیقه سپرده باشد به کفیل یا وثیقهگذار اخطار می شود که ظرف یک ماه متهم را تحویل دهد .در صورت ابلاغ واقعی اخطاریه و عدم تحویل متهم ،به دستور دادستان ،حسب مورد ،وجهالکفاله اخذ و یا از وثیقه ،معادل وجه قرار ،ضبط میشود .دستور دادستان پس از قطعیت ،بدون صدور اجرائیه در اجرای احکام کیفری و مطابق مقررات اجرای احکام مدنی اجرا میشود. تبصره -مبلغ مازاد بر وجه قرار وثیقه ،پس از کسر هزینههای ضروری مربوط به اجرای دستور ،به وثیقهگذار مسترد میشود.", "explanation": "اگر متهمی که برایش قرار تأمین صادر شده، بدون عذر موجه پس از احضار حاضر نشود، وجه‌التزام تعیین‌شده به دستور دادستان اخذ یا از وثیقهٔ سپرده‌شده معادل وجه قرار ضبط می‌شود؛ اگر کفیل دارد، به کفیل هم اخطار می‌شود.", "notes": ["شرط اجرای ضمانت (اخذ وجه‌التزام یا ضبط وثیقه): عدم حضور بدون عذر موجه + ابلاغ واقعی اخطاریه."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۳۰ قانون آیین دادرسی کیفری، اگر متهم دارای وثیقه بدون عذر موجه و با ابلاغ واقعی اخطاریه حاضر نشود، چه اتفاقی می‌افتد؟", "options": ["هیچ اقدامی انجام نمی‌شود", "معادل وجه قرار از وثیقهٔ سپرده‌شده ضبط می‌شود", "وثیقه بلافاصله و بدون هیچ محاسبه‌ای مصادره کامل می‌شود", "فقط تذکر کتبی داده می‌شود"], "correct": 1, "explain": "متن ماده اخذ معادل وجه قرار از وثیقه را در این شرایط مقرر کرده است."}]}, {"article": 231, "category": "other", "chapter": "", "text": "هرگاه ثابت شود که متهم ،کفیل یا وثیقه گذار به منظور عدم امکان ابلاغ واقعی اخطاریه ،نشانی محل اقامت واقعی یا تغییر آن را به مرجع قبول کننده کفالت یا وثیقه اعلام نکرده یا به این منظور از محل خارج شده یا به هر نحو دیگر به این منظور امکان ابلاغ واقعی را دشوار کرده است و این امر از نظر بازپرس محرز شود ،ابلاغ قانونی اخطاریه برای ضبط وثیقه ،اخذ وجهالکفاله و یا وجه التزام کافی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 232, "category": "gharar", "chapter": "بخش دوم - قرارهای تأمین کیفری", "text": "دیه با رعایت مقررات مربوط و ضرر و زیان محکومله ،در صورتی از مبلغ وثیقه یا وجهالکفاله کسر میشود که امکان وصول آن از بیمه میسر نباشد و محکومعلیه حاضر نشود و وثیقه گذار یا کفیل هم ،وی را طبق مقررات حاضر ننموده و عذر موجهی هم نداشته باشد.", "explanation": "کسر دیه یا ضرر و زیان از مبلغ وثیقه یا وجه‌الکفاله، فقط زمانی مجاز است که وصول آن از بیمه ممکن نباشد، محکوم‌علیه حاضر نشود، و کفیل/وثیقه‌گذار هم بدون عذر موجه او را حاضر نکرده باشند.", "notes": ["سه شرط تجمعی برای کسر از وثیقه/وجه‌الکفاله: عدم امکان وصول از بیمه + عدم حضور محکوم‌علیه + عدم حاضرسازی توسط کفیل/وثیقه‌گذار بدون عذر موجه."], "difficulty": "hard", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۳۲ قانون آیین دادرسی کیفری، کسر دیه از مبلغ وثیقه در چه صورتی مجاز است؟", "options": ["همیشه و بدون هیچ شرطی", "وقتی وصول از بیمه ممکن نباشد و محکوم‌علیه بدون عذر موجه حاضر نشود", "فقط با درخواست شاکی", "فقط در جرایم مالی"], "correct": 1, "explain": "متن ماده این کسر را مشروط به عدم امکان وصول از بیمه و عدم حضور بدون عذر موجه محکوم‌علیه کرده است."}]}, {"article": 233, "category": "other", "chapter": "", "text": "چنانچه قرار تأمین صادرشده ،متضمن تادیه وجه التزام باشد یا متهم خود ایداع وثیقه کرده باشد ،در صورت عدم حضور محکوم علیه و عدم امکان وصول آن از بیمه ،علاوه بر اخذ دیه و ضرر و زیان محکوم له از محل تأمین ،جزای نقدی نیز در صورت محکومیت وصول میشود و در مورد قرار وثیقه ،در صورت حضور و عجز از پرداخت ،محکومیتهای فوق ،با لحاظ مستثنیات دین از محل تأمین اخذ میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 234, "category": "other", "chapter": "", "text": "در صورت فوت کفیل یا وثیقه گذار ،قرار قبولی کفالت یا وثیقه منتفی است و متهم حسب مورد ،باید نسبت به معرفی کفیل یا ایداع وثیقه جدید اقدام کند ،مگر آنکه دستور اخذ وجهالکفاله یا ضبط وثیقه صادر شده باشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 235, "category": "other", "chapter": "", "text": "متهم ،کفیل و وثیقهگذار می توانند در موارد زیر ظرف ده روز از تاریخ ابلاغ دستور دادستان ،درباره اخذ وجه التزام، وجهالکفاله و یا ضبط وثیقه اعتراض کنند .مرجع رسیدگی به این اعتراض ،دادگاه کیفری دو است: الف -هرگاه مدعی شوند در اخذ وجه التزام و وجهالکفاله و یا ضبط وثیقه مقررات مربوط رعایت نشده است. ب -هرگاه مدعی شوند متهم در موعد مقرر حاضر شده یا او را حاضر کردهاند یا شخص ثالثی متهم را حاضر کرده است. پ -هرگاه مدعی شوند به جهات مذکور در ماده ( )۱۷۸ این قانون ،متهم نتوانسته حاضر شود یا کفیل و وثیقهگذار به یکی از آن جهات نتوانستهاند متهم را حاضر کنند. ت -هرگاه مدعی شوند پس از صدور قرار قبولی کفالت یا التزام معسر شدهاند. ث -هرگاه کفیل یا وثیقه گذار مدعی شوند تسلیم متهم ،به علت فوت او در مهلت مقرر ممکن نبوده است. تبصره –۱ دادگاه در تمام موارد فوق ،خارج از نوبت و بدون رعایت تشریفات دادرسی به شکایت رسیدگی میکند .رأی دادگاه قطعی است. تبصره –۲ مرجع رسیدگی به اعتراض نسبت به دستور رئیس یا دادرس دادگاه عمومی بخش ،دادگاه کیفری دو نزدیکترین شهرستان آن استان است. تبصره –۳ در خصوص بند (ت) ،دادگاه به ادعای اعسار متهم یا کفیل رسیدگی و در صورت احراز اعسار آنان ،به معافیت آنان از پرداخت وجه التزام یا وجهالکفاله حکم میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 236, "category": "other", "chapter": "", "text": "در صورتی که متهم پس از صدور دستور دادستان مبنی بر اخذ وجه التزام یا وجهالکفاله و یا ضبط وثیقه و پیش از اتمام عملیات اجرائی ،در مرجع قضایی حاضر شود یا کفیل یا وثیقه گذار او را حاضر کند ،دادستان با رفع اثر از دستور صادره، دستور اخذ یا ضبط حداکثر تا یک چهارم از وجه قرار را صادر می کند .در این صورت ،اعتبار قرار تأمین صادره به قوت خود باقی است .هرگاه متهم خود ایداع وثیقه کرده باشد ،مکلف است ،نسبت به تکمیل وجه قرار اقدام کند و چنانچه شخص ثالث از متهم کفالت نموده و یا ایداع وثیقه ک رده باشد و رفع مسؤولیت خود را درخواست نکند ،مکلف است نسبت به تکمیل وجه قرار اقدام کند .در صورتی که شخص ثالث ،رفع مسؤولیت خود را درخواست کند ،متهم حسب مورد ،نسبت به معرفی کفیل یا وثیقهگذار جدید اقدام میکند. تبصره –۱ هرگاه متهم یا وثیقهگذار یا کفیل ،ظرف ده روز از تاریخ ابلاغ دستور ضبط بخشی از وجه قرار ،معادل وجه مقرر را به صندوق دولت واریز کند ،ضبط انجام نمی شود و اعتبار قرار تأمین صادره به صورت کامل به قوت خود باقی است. تبصره ( ۲ الحاقی –)۱۳۹۴٫۳٫۲۴ در صورت تحت تعقیب قرار گرفتن اتباع بیگانه و تقاضای آنان بازپرس مکلف است مشخصات و نوع اتهام آن ها را بلافاصله جهت اقدام لازم به دادستانی کل کشور اعلام نماید ،تا از آن طریق وفق مقررات به مراجع ذیربط اعلام شود .چنانچه تعقیب این افراد منجر به محکومیت قطعی شود ،قاضی اجرای احکام خلاصهای از دادنامه را جهت اجرای این تبصره به دادستانی کل اعلام می کند .در صورت تقاضای ملاقات از سوی کنسولگری مربوط ،مراتب به دادستانی کل اعلام میشود تا بر اساس تصمیم آن مرجع ،مطابق مقررات اقدام شود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 237, "category": "bazdasht", "chapter": "بخش دوم - قرارهای تأمین کیفری، بازداشت موقت", "text": "صدور قرار بازداشت موقت جایز نیست ،مگر در مورد جرایم زیر ،که دلایل ،قرائن و امارات کافی بر توجه اتهام به متهم دلالت کند: الف -جرایمی که مجازات قانونی آن ها سلب حیات ،حبس ابد یا قطع عضو و جنایات عمدی علیه تمامیت جسمانی که میزان دیه آنها ثلث دیه کامل یا بیش از آن است. ب -جرایم تعزیری که درجه چهار و بالاتر است. پ -جرایم علیه امنیت داخلی و خارجی کشور که مجازات قانونی آنها درجه پنج و بالاتر است. ت -ایجاد مزاحمت و آزار و اذیت بانوان و اطفال و تظاهر ،قدرتنمایی و ایجاد مزاحمت برای اشخاص که بهوسیله چاقو یا هر نوع اسلحه انجام شود. ث -سرقت ،کالهبرداری ،ارتشا ،اختالس ،خیانت در امانت ،جعل یا استفاده از سند مجعول در صورتی که مشمول بند (ب) این ماده نباشد و متهم دارای یک فقره سابقه محکومیت قطعی به علت ارتکاب هر یک از جرایم مذکور باشد. تبصره -موارد بازداشت موقت الزامی ،موضوع قوانین خاص ،به جز قوانین

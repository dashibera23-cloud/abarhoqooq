لتی و نهادهای عمومی غیردولتی و سازمانها و نهادهایی که شمول قانون بر آنان مست لزم ذکر یا تصریح نام است به عمل آید ،قاضی اجرای احکام کیفری ،ضمن صدور دستور اجرا و ارائه تعلیمات لازم ،بر چگونگی اجرا و اقدامات آنها نظارت دارد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 496, "category": "other", "chapter": "", "text": "تمام ضابطان دادگستری ،نیروهای انتظامی و نظامی ،مقامات و مستخدمان وزارتخانهها ،مؤسسات و شرکتهای دولتی و نهادهای عمومی غیردولتی و سازمان ها و نهادهایی که شمول قانون بر آنان مستلزم ذکر یا تصریح نام است ،در حدود وظایف خود مکلفند دستور قاضی اجرای احکام کیفری را در مقام اجرای رأی که مرتبط با اجرای آن است رعایت کنند .متخلف از مقررات این ماده ،علاوه بر تعقیب ا نتظامی و اداری ،به مجازات مقرر قانونی نیز محکوم میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 497, "category": "other", "chapter": "", "text": "رفع ابهام و اجمال از رأی با دادگاه صادرکننده رأی قطعی است ،اما رفع اشکالات مربوط به اجرای رأی با رعایت موازین شرعی و قانونی ،با قاضی اجرای احکام کیفری است که رأی زیر نظر او اجرا میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 498, "category": "other", "chapter": "", "text": "هرگاه شیوه اجرای رأی در دادنامه تعیین گردد ،به همان ترتیب اجرا میشود و در صورت عدم تعیین شیوه اجرا ،قاضی اجرای احکام کیفری مطابق مقررات قانونی ،رأی را اجرا میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 499, "category": "other", "chapter": "", "text": "اجرای علنی مجازات ممنوع است ،مگر در موارد الزام قانونی یا در صورتی که به لحاظ آثار و تبعات اجتماعی بزه ارتکابی، نحوه ارتکاب جرم و سوابق مرتکب و بیم تجری او یا دیگران ،دادگاه خود یا به پیشنهاد دادستان اجرای علنی مجازات را ضروری تشخیص دهد و اجرای علنی مجازات را در رأی تصریح کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 500, "category": "other", "chapter": "", "text": "محکومعلیه برای اجرای رأی احضار میشود و در صورت عدم حضور ،به کفیل یا وثیقه گذار اخطار میشود تا محکومعلیه را برای اجرای رأی تسلیم کند .در این صورت ،قاضی اجرای احکام کیفری میتواند به طور همزمان دستور جلب محکومعلیه را صادر کند. تبصره -در صورتی که بیم فرار یا مخفی شدن محکومعلیه باشد ،قاضی اجرای احکام کیفری می تواند با ذکر دلیل در پرونده ،از ابتدا دستور جلب محکومعلیه را صادر کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 501, "category": "other", "chapter": "", "text": "اجرای مجازات در موارد زیر به تشخیص و دستور قاضی اجرای احکام به تعویق میافتد: الف -دوران بارداری ب -پس از زایمان حداکثر تا شش ماه پ -دوران شیردهی حداکثر تا رسیدن طفل به سن دو سالگی ت -اجرای مجازات شلاق در ایام حیض یا استحاضه", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 502, "category": "other", "chapter": "", "text": "هرگاه محکوم علیه به بیماری جسمی یا روانی مبتلا باشد و اجرای مجازات موجب تشدید بیماری و یا تأخیر در بهبودی وی شود ،قاضی اجرای احکام کیفری با کسب نظر پزشکی قانونی تا زمان بهبودی ،اجرای مجازات را به تعویق میاندازد .چنانچه در جرایم تعزیری امیدی به بهبودی بیمار نباشد ،قاضی اجرای احکام کیفری ،پس از احراز بیماری محکومعلیه و مانع بودن آن برای اعمال مجازات ،با ذکر دلیل ،پرونده را برای تبدیل به مجازات مناسب دیگر با در نظر گرفتن نوع بیماری و مجازات به مرجع صادرکننده رأی قطعی ارسال میکند. تبصره -هرگاه حین اجرای مجازات ،بیماری حادث شود و تعویق اجرای مجازات فوریت داشته باشد ،قاضی اجرای احکام کیفری، ضمن صدور دستور توقف اجرای آن ،طبق مقررات این ماده اقدام میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 503, "category": "other", "chapter": "", "text": "هرگاه محکومعلیه در جرایم تعزیری ،پس از صدور حکم قطعی ،مبتلا به جنون شود ،تا زمان افاقه ،اجرای حکم به تعویق میافتد؛ مگر در مورد مجازاتهای مالی که از اموال محکومعلیه وصول میشود. تبصره -محکوم به حبس یا کسی که به علت عدم پرداخت جزای نقدی در حبس به سر میبرد ،در صورت جنون تا بهبودی در بیمارستان روانی یا مکان مناسب دیگری نگهداری می شود .این ایام جزء مدت محکومیت وی محاسبه میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 504, "category": "other", "chapter": "", "text": "در غیر مجازات حبس ،هرگاه رئیس قوه قضائیه با عفو یا تخفیف مجازات محکوم علیه برای پیشنهاد به مقام رهبری موافقت کند و دستور توقف اجرای حکم دهد ،اجرای حکم متوقف میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 505, "category": "other", "chapter": "", "text": "در مواردی که مطابق مقررات ،اجرای رأی موقوف میشود ،قاضی اجرای احکام کیفری قرار موقوفی اجرا صادر میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 506, "category": "other", "chapter": "", "text": "موقوف شدن اجرای مجازات در حقوق شاکی یا مدعی خصوصی و اجرای احکام ضبط اشیاء و اموال که وسیله ارتکاب جرم بوده و یا از ارتکاب جرم تحصیل شده است ،تأثیری نخواهد داشت ،مگر اینکه علت موقوف شدن اجرای مجازات ،نسخ مجازات قانونی باشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 507, "category": "other", "chapter": "", "text": "چنانچه اجرای مجازات مستلزم دسترسی به محکومعلیه به دفعات باشد و محکوم علیه در پرونده فاقد قرار تأمین بوده و یا قرار صادره م تناسب نباشد ،قاضی اجرای احکام کیفری مطابق مقررات ،قرار تأمین متناسب صادر میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 508, "category": "other", "chapter": "", "text": "قاضی اجرای احکام کیفری درباره درخواست محکوم علیه ،کفیل یا وثیقه گذار مبنی بر تبدیل قرار تأمین ،تغییر کفیل یا وثیقه گذار و یا جایگزینی وثیقه ،تصمیم میگیرد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 509, "category": "other", "chapter": "", "text": "هرگاه اقدامات قاضی اجرای احکام کیفری منتهی به دسترسی به محکوم علیه نشود و بیم فرار وی از کشور باشد، میتواند دستور منع خروج او را از کشور صادر و به مراجع قانونی اعلام کند؛ اما به محض حضور یا دستگیری محکومعلیه نسبت به لغو این دستور اقدام میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 510, "category": "other", "chapter": "", "text": "هرگاه پس از صدور حکم معلوم شود محکومعلیه دارای محکومیت های قطعی دیگری است و اعمال مقررات تعدد ،در میزان مجازات قابل اجرا مؤثر است ،قاضی اجرای احکام کیفری به شرح زیر اقدام میکند: الف -اگر احکام به طور قطعی صادر یا به لحاظ عدم تجدیدنظرخواهی قطعی شده باشند ،در صورت تساوی دادگاهها پروندهها را به دادگاه صادرکننده آخرین حکم و در غیر این صورت به دادگاه دارای صلاحیت بالاتر ارسال میکند ،تا پس از نقض تمام احکام، با رعایت مقررات مربوط به تعدد جرم ،حکم واحد صادر شود. ب -اگر حداقل یکی از احکام در دادگاه تجدیدنظر استان صادر شده باشد ،پروندهها را به این دادگاه ارسال میکند تا پس از نقض تمام احکام با رعایت مقررات مربوط به تعدد جرم ،حکم واحد صادر شود .چنانچه احکام از شعب مختلف دادگاه تجدیدنظر استان صادر شده باشد ،شعبه صادرکننده آخرین حکم تجدیدنظر خواسته صلاحیت رسیدگی دارد. پ -در سایر موارد و همچنین در صورتی که حداقل یکی از احکام در دیوان عالی کشور مورد تأیید قرار گرفته باشد یا احکام متعدد در حوزههای قضایی استانهای مختلف یا در دادگاههای با صلاحیت ذاتی متفاوت صادر شده باشد ،پروندهها را به دیوان عالی کشور ارسال میکند تا پس از نقض احکام ،حسب مورد ،مطابق بندهای (الف) یا (ب) اقدام شود. تبصره -در موارد فوق ،دادگاه در وقت فوق العاده بدون حضور طرفین به موضوع ،رسیدگی و بدون ورود در شرایط و ماهیت محکومیت با رعایت مقررات تعدد جرم ،حکم واحد صادر میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 511, "category": "other", "chapter": "", "text": "هرگاه هنگام اجرای حکم معلوم شود محکومعلیه محکومیت های قطعی دیگری داشته است که در اعمال مقررات تکرار جرم مؤثر است ،قاضی اجرای احکام کیفری ،پرونده را نزد دادگاه صادرکننده حکم قطعی ارسال میکند .در این صورت ،چنانچه دادگاه ،محکومیتهای سابق را محرز دانست ،مطابق مقررات اقدام مینماید. تبصره -هرگاه حکم در دیوان عالی کشور تأیید شده باشد ،پرونده به آن مرجع ارسال میشود تا چنانچه محکومیتهای سابق را محرز دانست ،حکم را نقض و پرونده را جهت صدور حکم به دادگاه صادرکننده آن ارسال کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 512, "category": "other", "chapter": "", "text": "شخصی که به موجب حکم قطعی ،برائت حاصل کند ،می تواند حداکثر ظرف شش ماه از تاریخ ابلاغ رأی ،از دادگاه صادرکننده حکم نخستین درخواست نماید که حکم برائت از محل اعتبارات مربوط به قوه قضائیه در یکی از روزنامههای کثیرالانتشار منتشر شود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 513, "category": "other", "chapter": "", "text": "اشخاص محکوم به حبس با ذکر مشخصات کامل ،نوع جرم ،میزان محکومیت ،ایام بازداشت قبلی و مرجع صادرکننده حکم در برگه مخصوص ،برای تحمل کیفر به زندان همان حوزه قضایی یا نزدیکترین حوزه قضایی آن استان ،حسب مورد ،به همراه مأمور بدرقه زن و یا مرد و با رعایت موازین مراقبتی ،اعزام و معرفی میشوند. تبصره –۱ زندانها به زندان بسته ،نیمهباز ،مراکز حرفه آموزی و اشتغال و مراکز اقدامات تأمینی و تربیتی از جمله کانون اصلاح و تربیت برای اطفال و نوجوانان تقسیم میشود. تبصره –۲ به جز مواردی که در قانون یا در حکم دادگاه تصریح شده است ،محکومان با توجه به نوع و مدت محکومیت ،پیشینه و شخصیتشان ،بر اساس تصمیم شورای طبقهبندی و تأیید قاضی اجرای احکام در یکی از بخشهای فوق نگهداری میشوند. تبصره –۳ در صورتی که محل اقامت محکوم به حبس ،خارج از حوزه دادگاه صادرکننده حکم باشد ،نامبرده برای تحمل ادامه حبس به زندان محل اقامت خود منتقل میشود؛ مگر اینکه این امر موجب مفسده باشد که در این صورت با تشخیص قاضی صادرکننده رأی قطعی به نزدیکترین زندان به محل اقامت خود منتقل می شود .هزینه انتقال از محل اعتبارات قوه قضائیه پرداخت میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 514, "category": "other", "chapter": "", "text": "نگهداری محکومان و متهمان در یک مکان ممنوع است .نگهداری متهمان در بازداشتگاهها و زیر نظر سازمان زندانها و اقدامات تأمینی و تربیتی کشور صورت میگیرد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 515, "category": "other", "chapter": "", "text": "مدت تمام کیفرهای حبس از روزی شروع میشود که محکومعلیه به موجب حکم قطعی لازم‌الاجرا ،حبس شود .چنانچه محکومعلیه پیش از صدور حکم به علت اتهام یا اتهاماتی که در همان پرونده مطرح بوده تحت نظر یا بازداشت شده باشد ،مدت بازداشت قبلی از میزان حبس او کسر میشود. تبصره -اگر مدت زمان تحت نظر یا بازداشت شدن متهم کمتر از بیست و چهار ساعت باشد ،در احتساب ایام بازداشت ،یک روز محاسبه میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 516, "category": "other", "chapter": "", "text": "در مورد محکومیت به مجازات های جایگزین حبس ،شلاق و جزای نقدی ،ایام بازداشت قبلی موضوع ماده ( )۵۱۵ به شرح زیر محاسبه میشود: الف -به ازای هر روز بازداشت قبلی ،یک روز جزای نقدی روزانه ،هشت ساعت خدمات عمومی و پنج روز از دوره مراقبت کسر میشود. ب -در مورد محکومیت به شلاق به عنوان مجازات تعزیری به ازای هر روز بازداشت قبلی ،سه ضربه از شلاق کسر میشود. پ -در مورد محکومیت به جزای نقدی ،مطابق مقررات فصل مربوط به نحوه اجرای محکومیتهای مالی اقدام میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 517, "category": "other", "chapter": "", "text": "چنانچه قاضی صادرکننده حکم ،ایام بازداشت قبلی را محاسبه نکرده باشد ،قاضی اجرای احکام کیفری به احتساب این ایام ،حسب ملاکهای موضوع مواد فوق اقدام میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 518, "category": "other", "chapter": "", "text": "قاضی اجرای احکام کیفری مکلف است دستور ت  –۲ اعزام متهمان بازداشت شده به مرخصی تنها به مدت و به شرح مقرر در تبصره فوق و با نظر مرجع صدور قرار جایز است. تبصره –۳ در مواردی که زندانی دارای شاکی خصوصی است و بنا به تشخیص دادستان یا قاضی اجرای احکام ،اعطای مرخصی میتواند در جلب رضایت شاکی مؤثر باشد ،زندانی می تواند علاوه بر مرخصی مذکور در این ماده پس از سپردن تأمین مناسب، در طول مدت حبس یک نوبت دیگر و حداکثر به مدت هفت روز از مرخصی استفاده نماید .در صورتی که محکوم بتواند بخشی از خسارت شاکی را پرداخت یا رضایت او را جلب کند ،این مرخصی فقط برای یک بار دیگر به مدت هفت روز تمدید میشود. تبصره –۴ محکومانی که به موجب قانون مشمول مقررات تعلیق اجرای مجازات نمیشوند ،پس از تحمل یک سوم از میزان مجازات با رعایت شرایط مندرج در صدر ماده و به تشخیص دادستان میتوانند در هر چهار ماه حداکثر پنج روز از مرخصی برخوردار شوند. تبصره –۵ رئیس قوه قضائیه میتواند به مناسبت های ملی و مذهبی علاوه بر سقف تعیین شده در این قانون ،حداکثر دو بار در سال به زندانیان واجد شرایط ،مرخصی اعطا کند. تبصره –۶ مواردی که شخص باید به موجب مقررات شرعی به طور دائم در زندان باشد از شمول مقررات این ماده و تبصرههای آن خارج است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 521, "category": "other", "chapter": "", "text": "در صورتی که مجازات حبس با انفصال موقت از خدمت توأم باشد ،اجرای مجازات انفصال موقت از زمان پایان یافتن مجازات حبس شروع میشود. تبصره -مدت زمانی که محکومعلیه پیش از صدور حکم قطعی به موجب الزامات قانونی از خدمت معلق شده است ،از میزان محکومیت وی به انفصال موقت کسر میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 522, "category": "other", "chapter": "", "text": "در صورتی که مداوای محکوم به حبس در خارج از زندان ضروری باشد ،قاضی اجرای احکام کیفری ،مدت زمان مورد نیاز برای مداوا را با توجه به نظر پزشکی قانونی تعیین میکند و با اخذ تأمین متناسب ،اجرای حبس را به تعویق میاندازد و هرگاه محکومعلیه تأمین متناسب ندهد ،معالجه وی در بیمارستان تحت نظر ضابطان صورت میگیرد و مدت معالجه جزء محکومیت وی محسوب میشود. تبصره sContent": false, "questions": []}, {"article": 527, "category": "other", "chapter": "", "text": "هرگاه حسب گزارش مدیران کانون ،رفتار و اخلاق طفل یا نوجوانی ،موجب فساد اخلاق اطفال و یا نوجوانان دیگر گردد، در صورت احراز موضوع توسط قاضی دادگاه اطفال و نوجوانان و به دستور وی ،طفل یا نوجوان مذکور در محل دیگری در همان قسمت نگهداری میشود و پس از اصلاح اخلاق و رفتارش با دستور دادگاه به محل قبلی بازگردانده میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 528, "category": "other", "chapter": "", "text": "آییننامه اجرائی مربوط به نحوه نگهداری و طبقهبندی محکومان و متهمان ،اشتغال و حرفهآموزی آنان ،برنامههای بازپروری ،نحوه ملاقات زندانیان ،نحوه اداره کانون های اصلاح و تربیت و کیفیت اصلاح و تربیت اطفال و نوجوانان در آنجا، طبقه بندی اطفال و نوجوانان از حیث جنس ،سن ،نوع جرایم و امور اجرائی این کانونها و نحوه اجرای مجازات حبس ظرف شش ماه از تاریخ لازم االجرا شدن این قانون توسط وزارت دادگستری با همکاری سازمان زندانها و اقدامات تأمینی و تربیتی کشور تهیه میشود و به تصویب رئیس قوه قضائیه میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 529, "category": "other", "chapter": "", "text": "هر کس به موجب حکم قطعی دادگاه به پرداخت جزای نقدی محکوم گردد و آن را نپردازد ،اموال وی به وسیله مرجع اجرای حکم ،شناسایی ،توقیف و با رعایت مقررات راجع به مستثنیات دین از محل فروش آنها نسبت به اجرای حکم اقدام میشود. در صورت فقدان مال یا عدم شناسایی آن ،مرجع اجرای حکم می تواند با توقیف بخشی از حقوق طبق قانون اجرای احکام مدنی و یا تمام یا بخشی از سایر درآمدهای محکومعلیه برای وصول جزای نقدی اقدام مقتضی به عمل آورد .در صورت تقاضای تقسیط از جانب محکوم علیه و احراز قدرت وی به پرداخت اقساط ،دادگاه نخستین که رأی زیر نظر آن اجرا میشود میتواند با اخذ تضمین مناسب امر به تقسیط نماید. هرگاه اجرای حکم به طرق مذکور ممکن نگردد با رعایت مقررات مربوط به مجازاتهای جایگزین حبس به ترتیب زیر عمل میشود: الف -در جزای نقدی تا پانزده میلیون ریال ،هر سی هزار ریال به یک ساعت انجام خدمات عمومی رایگان تبدیل میشود. ب -در جزای نقدی بالای پانزده میلیون ریال ،همچنین در صورت عدم شرایط اجرای بند (الف) این ماده ،هر دو میلیون و پانصد هزار ( )۲٫۵۰۰٫۰۰۰ ریال به یک روز حبس تبدیل میشود. تبصره –۱ چنانچه محکوم علیه قبل از صدور حکم محکومیت قطعی به جزای نقدی ،به دلیل اتهام یا اتهامات مطرح در پرونده در بازداشت بوده باشد ،دادگاه پس از تعیین مجازات ،ایام بازداشت قبلی را در ازای هر دو میلیون و پانصد هزار ( )۲٫۵۰۰٫۰۰۰ ریال یک روز از مجازات تعیینشده کسر میکند. قضات اجرای احکام موظفند رعایت مراتب فوق را به هنگام اجرای حکم ،مراقبت نمایند و در صورت عدم رعایت خود اقدام کنند. هیئت وزیران در جلسه ۱۴۰۱٫۱۲٫۱۰ به پیشنهاد شماره ۴۳۸۲۱ مورخ ۱۴۰۱٫۱۲٫۷ وزارت دادگستری و به استناد ماده ( )۲۸ اصالحی قانون مجازات اسلامی -مصوب -۱۳۹۹ تصویب کرد: مبالغ مندرج در ماده ( )۲۷ قانون مجازات اسلامی -مصوب -۱۳۹۲ و بند (ب) ماده ( )۵۲۹ قانون آیین دادرسی کیفری -مصوب -۱۳۹۲ و تبصره ( )۱ آن از تاریخ اتمام مدت سه سال تصویب نامه شماره /۱۵۰۱۷۹ ت۵۷۰۷۵ ه مورخ )۱۴۰۱٫۱۱ ٫۲۶( ۱۳۹۸٫۱۱٫۲۶ از مبلغ یک میلیون ( )۱٫۰۰۰٫۰۰۰ ریال به دو میلیون و پانصد هزار ( )۲٫۵۰۰٫۰۰۰ ریال تعدیل میشود. تبصره –۲ صدور حکم تقسیط جزای نقدی یا تبدیل آن به مجازات دیگر مانع استیفای مابه ازای بخش اجرا نشده آن از اموالی که بعدا ً از محکومعلیه به دست میآید ،نیست. تبصره –۳ هرگاه محکومعلیه ظرف ده روز از تاریخ ابلاغ احضاریه قاضی اجرای احکام کیفری برای پرداخت جزای نقدی حاضر شود، قاضی اجرای احکام میتواند او را از پرداخت بیست درصد ( )۲۰ ٪جزای نقدی معاف کند .دفتر قاضی اجرای احکام کیفری مکلف است در برگه احضاریه محکومعلیه معافیت موضوع این تبصره را قید کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 530, "category": "other", "chapter": "", "text": "در صورت محکومیت اشخاص به جزای نقدی در مرحله بدوی ،محکومعلیه می تواند قبل از قطعیت حکم از دادگاه صادرکننده تقاضای تقسیط کند .درخواست مذکور به منزله اسقاط حق تجدیدنظرخواهی نیست. تبصره -دعوای تقسیط جزای نقدی در هر مورد باید به صورت مستقل مطرح شود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, questions": []}, {"article": 536, "category": "other", "chapter": "", "text": "چنانچه حکم صادره متضمن بازگرداندن مال به شخ ص باشد و وی پس از شش ماه از تاریخ اخطاریه قاضی اجرای احکام کیفری ،بدون عذر موجه برای دریافت مال منقول مراجعه نکند ،قاضی اجرای احکام کیفری در صورت احتمال عقلایی فساد مال ،می تواند دستور فروش مال را صادر کند .در این صورت مال به فروش میرسد و پس از کسر هزینههای مربوط ،در صندوق دادگستری تودیع میگردد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 537, "category": "other", "chapter": "", "text": "اجرای دستورهای دادستان و آرای لازم‌الاجرای دادگاههای کیفری در مورد ضبط و مصادره اموال ،اخذ وجه التزام، وجه الکفاله یا وثیقه و نیز جزای نقدی ،وصول دیه ،رد مال و یا ضرر و زیان ناشی از جرم بر عهده معاونت اجرای احکام کیفری است. تبصره -چنانچه اجرای دستور یا رأی در موارد فوق مستلزم توقیف و یا فروش اموال باشد ،انجام عملیات مذکور مطابق مقررات اجرای احکام مدنی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 538, "category": "other", "chapter": "", "text": "در اجرای مواد ( )۲۳۲ و ( )۲۳۳ این قانون ،دیه و یا ضرر و زیان ناشی از جرم در ابتدا از محل تأمین اخذشده پرداخت و مازاد بر آن به نفع دولت ضبط میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 539, "category": "other", "chapter": "", "text": "دادخواست تقسیط جزای نقدی از تاجر پذیرفته نمیشود .تاجری که متقاضی تقسیط محکومبه است باید مطابق مقررات قانون تجارت ،دادخواست ورشکستگی دهد .کسبه جزء ،مشمول این ماده نیستند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 540, "category": "other", "chapter": "", "text": "سایر مقررات و ترتیبات راجع به اجرای محکومیتهای مالی تابع قانون نحوه اجرای محکومیتهای مالی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 541, "category": "other", "chapter": "", "text": "هرگاه اجرای مجازات منوط به درخواست محکوم له باشد و در تقاضای اجرای آن ،بدون داشتن عذر موجه ،تأخیر کند، به دستور قاضی اجرای احکام کیفری به وی ابلاغ می شود تا ظرف سه ماه تصمیم خود را درباره اجرای حکم اعلام کند .در صورت سپری شدن این مدت و عدم وصول درخواست اجرای حکم بدون عذر موجه ،قاضی اجرای احکام کیفری قرار تأمین صادره را لغو میکند .در این صورت ،چنانچه محکومعلیه به علت دیگری در حبس نباشد ،آزاد و پرونده به طور موقت بایگانی میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 542, "category": "other", "chapter": "", "text": "هرگاه محکوم به سلب حیات ،در غیر جرایم مستوجب حد که قابل عفو نیستند و قصاص پس از لازم‌الاجرا شدن حکم و پیش از اجرای آن درخواست عفو کند ،به دستور دادگاه صادرکننده حکم ،اجرای آن فقط برای یک بار تا اعلام نتیجه از سوی کمیسیون عفو و تخفیف مجازات محکومان به تأخیر می افتد .کمیسیون مزبور مکلف است حداکثر ظرف دو ماه به این تقاضا رسیدگی و نتیجه را به دادگاه اعلام کند. تبصره -قاضی اجرای احکام کیفری مکلف است ،حداقل یک هفته پیش از اجرای حکم سلب حیات موضوع این ماده ،مراتب را به محکومعلیه اعلام کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 543, "category": "other", "chapter": "", "text": "پیش از اجرای حکم سلب حیات ،مراسم مذهبی توسط اشخاص واجد صلاحیت اجرا میشود .هنگام اجرای حکم باید دادستان یا نماینده او ،قاضی اجرای احکام کیفری ،فرمانده نیروی انتظامی محل یا نماینده وی ،پزشک قانونی یا پزشک معتمد و منشی دادگاه حضور داشته باشند .هرگاه اجرای حکم در محوطه زندان صورت گیرد ،رئیس زندان یا نماینده وی نیز حضور مییابد. وکیل محکومعلیه نیز میتواند برای اجرای حکم حاضر شود .پس از حاضر کردن محکومعلیه در محل اجرای حکم ،منشی دادگاه، حکم را با صدای رسا قرائت می کند .سپس به دستور قاضی اجرای احکام کیفری ،حکم اجرا شده ،صورتمجلس تنظیم میشود و به امضای حاضران میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 544, "category": "other", "chapter": "", "text": "احکام حدود و سایر احکام راجع به قصاص و دیات طبق مقررات مربوط اجرا میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 545, "category": "other", "chapter": "", "text": "شخصی که به تبعید یا اقامت اجباری محکوم شده است ،به دادسرای محل اجرای حکم اعزام میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 546, "category": "other", "chapter": "", "text": "نظارت بر حضور و فعالیت محکومان در محل تبعید یا اقامت اجباری بر عهده قاضی اجرای احکام کیفری محل اجرای حکم است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 547, "category": "other", "chapter": "", "text": "قاضی اجرای احکام کیفری محل اجرای حکم تبعید یا اقامت اجباری ،در صورت ضرورت و با اخذ تأمین مناسب به محکومان به تبعید یا اقامت اجباری با رعایت مفاد ماده ( )۵۲۰ این قانون مرخصی اعطا میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 548, "category": "other", "chapter": "", "text": "اشخاصی که به منع از اقامت در نقطهای معین محکوم میشوند ،از محل تعیینشده اخراج میشوند و مراتب به نیروی انتظامی محل و سایر نهادها و مراجع مرتبط ابلاغ میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 549, "category": "other", "chapter": "", "text": "آییننامه اجرائی نحوه اجرای مجازات های سلب حیات ،قطع عضو ،قصاص عضو و جرح ،شلاق ،تبعید ،اقامت اجباری و منع از اقامت در محل یا محلهای معین ظرف شش ماه از تاریخ لازم‌الاجرا شدن این قانون توسط وزیر دادگستری با همکاری وزیر کشور تهیه میشود و به تصویب رئیس قوه قضائیه میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 550, "category": "other", "chapter": "", "text": "اجرای احکام رفع تصرف عدوانی ،مزاحمت و ممانعت از حق ،مطابق مقررات اجرای احکام مدنی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 551, "category": "other", "chapter": "", "text": "در صورت تعلیق اجرای مجازات ،قاضی اجرای احکام کیفری ،محکومعلیه را احضار و در صورت عدم حضور بدون عذر موجه ،جلب میکند و با حضور محکوم علیه ،دستور یا دستورهای دادگاه ،چگونگی اجرا و ضمانت عدم رعایت آنها را به وی تفهیم و ابلاغ مینماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 552, "category": "other", "chapter": "", "text": "هرگاه محکومعلیه پس از سپری شدن حداقل شش ماه از مدت تعلیق اجرای مجازات ،به طور مستمر حسن اخلاق و رفتار نشان دهد ،قاضی اجرای احکام کیفری ،مراتب را با پیشنهاد کاهش مدت تعلیق یا لغو تمام یا برخی از دستورهای تعیینشده به دادگاه صادرکننده حکم اعلام میکند .دادگاه در وقت فوقالعاده در مورد پیشنهاد قاضی اجرای احکام کیفری تصمیم میگیرد. تبصره (اصلاحی –)۱۳۹۴٫۳٫۲۴ در صورت عدم پذیرش پیشنهاد از سوی دادگاه ،قاضی اجرای احکام کیفری میتواند هر دو ماه یک بار مجددا ً اجرای این ماده را به دادگاه پیشنهاد نماید. متن سابق تبصره ماده « :۵۵۲ در صورت عدم پذیرش پیشنهاد از سوی دادگاه ،قاضی اجرای احکام کیفری میتواند هر دوماه یکبار تعلیق اجرای مجازات را به دادگاه پیشنهاد نماید»", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 553, "category": "other", "chapter": "", "text": "در جرایم مشمول نظام نیمه آزادی و آزادی تحت نظارت سامانههای الکترونیکی ،قاضی اجرای احکام کیفری میتواند پس از وصول گزارش شورای طبقه بندی زندان و نظریه مددکاران اجتماعی معاونت اجرای احکام کیفری ،مبنی بر آنکه اجرای یک فعالیت شغلی یا حرفهای ،آموزشی ،حرفهآموزی ،مشارکت در تداوم زندگی خانوادگی و یا درمان پزشکی ،از سوی محکومعلیه در خارج از محیط زندان ،در فرآیند اصلاح وی و یا جبران ضرر و زیان بزهدیده مؤثر است ،به دادگاه صادرکننده حکم ،پیشنهاد اجرای نظام نیمه آزادی و آزادی تحت نظارت سامانه های الکترونیکی را طبق مقررات راجع به دادرسی الکترونیکی دهد و مطابق تصمیم این دادگاه اقدام کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 554, "category": "other", "chapter": "", "text": "قاضی اجرای احکام کیفری ،پس از موافقت دادگاه با پیشنهاد موضوع ماده فوق ،با اخذ تأمین متناسب از محکومعلیه، دستور اجرای تصمیم دادگاه را صادر و مراتب را به زندان اعلام میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 555, "category": "other", "chapter": "", "text": "صدور قرار تعلیق اجرای مجازات ،حکم آزادی مشروط ،قرار تعویق صدور حکم ،نظام نیمه آزادی و آزادی تحت نظارت سامانه های الکترونیکی طبق مقررات راجع به دادرسی الکترونیکی و دستور یا دستورهای قاضی اجرای احکام کیفری ،آثار عدم تبعیت محکومعلیه یا متهم از آن ها و نیز آثار ارتکاب جرم جدید به شاکی یا مدعی خصوصی ابلاغ میشود .چنانچه محکومعلیه یا متهم در مدت مزبور بدون عذر موجه از دستور یا دستورهای قاضی اجرای احکام کیفری تبعیت نکند ،یا مرتکب جرم عمدی شود، شاکی یا مدعی خصوصی می تواند مراتب را به قاضی اجرای احکام کیفری برای اجرای مقررات مربوط اعلام کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 556, "category": "other", "chapter": "", "text": "محکوم علیه یا متهم مکلف است حسب مورد در طول دوره تعلیق اجرای مجازات ،آزادی مشروط ،تعویق صدور حکم و نظام نیمه آزادی و آزادی تحت نظارت سامانههای الکترونیکی ،امکان نظارت مأمور مراقبتی را به شیوهای که قاضی اجرای احکام کیفری مشخص می نماید ،فراهم آورد و هرگونه اقدامی از قبیل تغییر شغل یا محل اقامت ،که اجرای کامل نظارت را با دشواری مواجه میسازد از قبل به اطلاع قاضی اجرای احکام کیفری برساند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 557, "category": "other", "chapter": "", "text": "نحوه اجرای قرار تعلیق اجرای مجازات ،آزادی مشروط ،قرار تعویق صدور حکم ،نظام نیمه آزادی و آزادی تحت نظارت سامانه های الکترونیکی مطابق مقررات راجع به دادرسی الکترونیکی و نیز نحوه اجرای مجازاتهای جایگزین حبس به موجب آییننامهای است که ظرف شش ماه از تاریخ لازم االجرا شدن این قانون توسط وزیر دادگستری با همکاری وزیر کشور و رئیس سازمان زندانها و اقدامات تأمینی و تربیتی کشور تهیه میشود و به تصویب رئیس قوه قضائیه میرسد. تبصره -آییننامه این ماده در مورد جرایم در صلاحیت سازما ن قضایی نیروهای مسلح ،توسط رئیس ستاد کل نیروهای مسلح و رئیس سازمان قضایی نیروهای مسلح و با همکاری مراجع مذکور در صدر این ماده تهیه می شود و به تصویب رئیس قوه قضائیه میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 558, "category": "other", "chapter": "", "text": "چنانچه اقامتگاه اشخاص مشمول تعلیق اجرای مجازات ،آزادی مشروط ،تعویق صدور حکم ،نظام نیمه آزادی و آزادی تحت نظارت سامانه های الکترونیکی ،در حوزه قضایی دیگری غیر از حوزه قضایی دادگاه صادرکننده رأی باشد ،اشخاص مذکور می توانند اجرای تصمیم مذکور را در محل اقامت خود تقاضا نمایند .در این صورت قاضی مجری حکم با اعطای نیابت به قاضی اجرای ا حکام حوزه اقامت آنان ،تمامی دستورهای دادگاه و واحد اجرای احکام و شرایط مقرر در رأی را به قاضی مجری نیابت اعلام مینماید و موارد مذکور ،تحت نظارت قاضی مرجوعالیه اجرا میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 559, "category": "other", "chapter": "", "text": "شاکی باید هزینه شکایت کیفری را برابر قانون در هنگام طرح شکایت تادیه کند .مدعی خصوصی هم که به تبع امر کیفری مطالبه ضرر و زیان میکند ،باید هزینه دادرسی را مطابق مقررات مربوط به امور مدنی بپردازد. چنانچه شاکی توانایی پرداخت هزینه شکایت را نداشته باشد ،به تشخیص دادستان یا دادگاهی که به موضوع رسیدگی میکند از پرداخت هزینه شکایت معاف میشود و هرگاه مدعی خصوصی توانایی پرداخت هزینه دادرسی را نداشته باشد ،دادگاه میتواند او را از پرداخت هزینه دادرسی برای همان موضوعی که مورد ادعا است ،به طور موقت معاف نماید .رسیدگی به امر کیفری را نمیتوان به علت عدم تادیه هزینه دادرسی از سوی مدعی خصوصی به تأخیر انداخت. متن سابق ماده « :۵۵۹ شاکی باید هزینه شکایت کیفری را برابر قانون در هنگام طرح شکایت تأدیه کند .مدعی خصوصی هم که به تبع امر کیفری مطالبه ضررو زیان میکند ،باید هزینه دادرسی را مطابق مقررات مربوط به امور مدنی بپردازد. چنانچه شاکی توانایی پرداخت هزینه شکایت را نداشته باشد ،به تشخیص دادستان یا دادگاهی که به موضوع رسیدگی میکند از پرداخت هزینه شکایت معاف میشود و هرگاه مدعی خصوصی توانایی پرداخت هزینه دادرسی را نداشته باشد، دادگاه میتواند او را از پرداخت هزینه دادرسی برای همان موضوعی که مورد ادعا است ،به طور موقت معاف نماید. رسیدگی به امر کیفری را نمیتوان به علت عدم تأدیه هزینه دادرسی از سوی مدعی خصوصی به تأخیر انداخت .مگر آنکه محکومبه از مستثنیات دین بوده و یا بهمیزانی نباشد که موجب خروج محکومله از اعسار گردد». تبصره (اصلاحی –)۱۳۹۴٫۳٫۲۴ پس از صدور حکم و هنگام اجرای آن ،قاضی اجرای احکام کیفری مکلف است هزینه دادرسی را از محل محکومبه استیفا کند مگر آنکه محکومبه از مستثنیات دین بوده و یا به میزانی نباشد که موجب خروج محکومله از اعسار گردد. متن سابق تبصره« :پس از صدور حکم و هنگام اجرای آن ،قاضی اجرای احکام کیفری مکلف است هزینه دادرسی را از محل محکومبه استیفاء کند».", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 560, "category": "other", "chapter": "", "text": "شاکی و متهم بابت هزینه انتشار آگهی ،ایاب و ذهاب گواهان ،حقالزحمه کارشناسان ،مترجمان و پزشکان و سایر اشخاصی که به تشخیص مقام قضایی احضار میشوند ،وجهی نمیپردازند و هزینههای مذکور از اعتبارات مربوط به قوه قضائیه پرداخت می شود ،اما هرگاه اقدامات مذکور بنا به درخواست شاکی صورت گیرد ،شاکی باید هزینه مقرر را مطابق قوانین و مقررات و تعرفههای مربوط ،در مهلت تعیینشده ،پرداخت کند .در صورتی که شاکی ملزم به پرداخت هزینه مذکور باشد و از پرداخت آن امتناع کند ،هزینه مذکور از اعتبارات مربوط به قوه قضائیه پرداخت می شود و مراتب به اطلاع دادستان میرسد تا به دستور وی و از طریق اجرای احکام مدنی ،با توقیف و فروش اموال شاکی ،با رعایت مستثنیات دین ،معادل هزینه پرداختشده اخذ و به حساب مربوط در خزانهداری کل واریز شود .در هر صورت از متهم هیچ هزینهای اخذ نمیشود. تبصره –۱ در صورتی که به تشخیص مقام قضائی ،شاکی قادر به پرداخت هزینههای فوق نباشد ،هزینه از اعتبارات قوه قضائیه پرداخت میشود. تبصره –۲ در موارد فوری به دستور مقام قضائی ،اقدامات موضوع این ماده ،پیش از پرداخت هزینه مربوط انجام میشود. تبصره –۳ میزان هزینه ایاب و ذهاب گواهان مطابق تعرفهای است که ظرف شش ماه از تاریخ لازم‌الاجرا شدن این قانون توسط وزیر دادگستری تهیه میشود و به تصویب رئیس قوه قضائیه میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 561, "category": "other", "chapter": "", "text": "هزینه تطبیق رونوشت یا تصویر اسناد و تهیه آنها برابر مقررات قانونی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 562, "category": "other", "chapter": "", "text": "دادگاه مکلف است هنگام صدور حکم ،تمامی هزینه هایی را که در جریان تحقیقات و محاکمه صورت گرفته است ،به تفصیل تعیین و مسؤول پرداخت آن را معین کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 563, "category": "other", "chapter": "", "text": "شاکی یا مدعی خصوصی میتواند در هر مرحله از دادرسی تمام هزینههای پرداختشده دادرسی را از مدعیعلیه طبق مقررات مطالبه کند .دادگاه پس از ذیحق شناختن وی ،مکلف است هنگام صدور حکم ،مدعیعلیه را به پرداخت هزینههای مزبور ملزم کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 564, "category": "other", "chapter": "", "text": "در صورت محکومیت متهم ،پرداخت هزینههای دادرسی به عهده او است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 565, "category": "other", "chapter": "", "text": "هرگاه شخصی که به موجب حکم دادگاه مسؤول پرداخت هزینه دادرسی است ،فوت کند ،هزینه مذکور از ماترک وی وصول میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 566, "category": "other", "chapter": "", "text": "تمام مراجع قضایی موضوع این قانون مکلفند با توجه به نوع دعاوی به تخصیص شعبه یا شعبی از مراجع قضایی برای رسیدگی تخصصی اقدام کنند. تبصره -شیوه تشکیل شعب تخصصی مراجع قضایی اعم از حقوقی و کیفری موضوع این ماده به موجب آییننامهای است که ظرف شش ماه از تاریخ لازم االجرا شدن این قانون توسط وزیر دادگستری تهیه میشود و به تصویب رئیس قوه قضائیه میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 567, "category": "other", "chapter": "", "text": "در اجرای تکالیف مقرر در تبصره ماده ( ،)۱۴۵ تبصره ماده ( ،)۱۴۷ مواد ( )۳۴۷( ،)۲۱۵ و ( )۳۴۸ این قانون و در تمام مواردی که به موجب مقررات این قانون ،انجام تحقیقات و یا هر اقدام دیگری ،مستلزم پرداخت هزینه از سوی دولت است ،اعتبار آن هر سال در ردیف مستقلی در بودجه کل کشور پیشبینی و منظور میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 568, "category": "other", "chapter": "", "text": "مواردی که مقررات ویژه ای برای دادرسی جرایم اطفال و نوجوانان و نیروهای مسلح مقرر نگردیده تابع مقررات عمومی آیین دادرسی کیفری است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 569, "category": "other", "chapter": "", "text": "به موجب ماده ۶۹۸ قانون آیین دادرسی کیفری صریحا ً نسخ شده است].", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 570, "category": "other", "chapter": "", "text": "از تاریخ لازم‌الاجرا شدن این قانون ،قوانین موقتی محاکمات جزایی (آیین دادرسی کیفری) مصوب ،۳۰/۵/۱۲۹۱ قانون راجع به محاکمه و مجازات مأموران به خدمات عمومی مصوب ،۱۳۱۵٫۲٫۶ الیحه مربوط به تشکیل دیوان کیفر کارکنان دولت و طرز تعقیب مأموران دولتی در محل خدمت مصوب ،۱۳۳۴٫۲٫۱۹ مواد ( )۲۴( ،)۲۳( ،)۲۲( ،)۲۱( ،)۱۸( ،)۱۷( ،)۱۵( ،)۶ و ( )۲۵ از قانون اصلاح پارهای از قوانین دادگستری مصوب ،۲۵/۳/۱۳۵۶ الیحه قانونی تشکیل دادگاههای عمومی مصوب ۱۰/۷/۱۳۵۸ شورای انقلاب، لایحه قانونی راجع به مأموران سازمان قند و شکر که مأمور کشف و تعقیب جرایم مربوط به اخاللکنندگان در امر عرضه ،توزیع و یا فروش قند و شکر میشوند مصوب ۱۳۵۹٫۴٫۲۱ شورای انقلاب ،ق

اند ارتباط برقرار کند) انتخاب می‌کند که سوگند به راستگویی و امانتداری یاد می‌کند؛ اگر شخص بتواند بنویسد، منشی دادگاه سؤالات را برایش می‌نویسد.", "notes": ["حق دسترسی به مترجم برای اشخاص ناشنوا یا ناتوان از تکلم، یک تضمین دادرسی عادلانه است."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۳۶۸ قانون آیین دادرسی کیفری، اگر متهم یا شاهدی ناشنوا باشد ولی بتواند بنویسد، سؤالات چگونه به او منتقل می‌شود؟", "options": ["اصلاً امکان تحقیق از او نیست", "منشی دادگاه سؤالات را برایش می‌نویسد تا کتباً پاسخ دهد", "باید حتماً مترجم اشاره داشته باشد", "سؤالات نادیده گرفته می‌شود"], "correct": 1, "explain": "متن ماده در این حالت نوشتن سؤالات توسط منشی دادگاه را پیش‌بینی کرده است."}]}, {"article": 369, "category": "other", "chapter": "", "text": "پس از شروع محاکمه توسط دادگاه ،محاکمه تا صدور حکم استمرار دارد و چنانچه محاکمه به طول انجامد ،به قدر لزوم تنفس داده میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 370, "category": "other", "chapter": "", "text": "چنانچه دادگاه در جریان رسیدگی ،احتمال دهد متهم حین ارتکاب جرم مجنون بوده است ،تحقیقات لازم را از نزدیکان او و سایر مطلعان به عمل میآورد ،نظریه پزشکی قانونی را تحصیل میکند و با احراز جنون ،نسبت به اصل اتهام به صدور قرار موقوفی تعقیب مبادرت میکند و با رعایت اقدامات تأمینی برای متهم تصمیم میگیرد. تبصره -چنانچه جرایم مشمول این ماده مستلزم پرداخت دیه باشد ،طبق مقررات مربوط اقدام میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 371, "category": "other", "chapter": "", "text": "قبل از ختم دادرسی ،چنانچه شاکی یا مدعی خصوصی راجع به موضوع شکایت ،مطلب جدیدی داشته باشد ،استماع میشود و دادستان یا نماینده وی نیز می تواند عقیده خود را اظهار کند .دادگاه مکلف است پیش از اعلام ختم دادرسی ،به متهم یا وکیل او اجازه دهد که آخرین دفاع خود را بیان کند .هرگاه متهم یا وکیل وی در آخرین دفاع مطلبی اظهار کند که در کشف حقیقت مؤثر باشد ،دادگاه مکلف به رسیدگی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 372, "category": "other", "chapter": "", "text": "قاضی دادگاه نباید پیش از اتمام رسیدگی و اعلام رأی ،در خصوص برائت یا مجرمیت متهم اظهار عقیده کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 373, "category": "other", "chapter": "", "text": "دادگاه پس از اعلام ختم رسیدگی ،نمی تواند لوایح ،اسناد و مدارک جدید را دریافت کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 374, "category": "other", "chapter": "", "text": "دادگاه پس از اعلام ختم دادرسی با استعانت از خداوند متعال ،با تکیه بر شرف و وجدان و با توجه به محتویات پرونده و ادله موجود ،در همان جلسه و در صورت عدم امکان در اولین فرصت و حداکثر ظرف یک هفته به انشای رأی مبادرت میکند. رأی د ادگاه باید مستدل ،موجه و مستند به مواد قانون و اصولی باشد که بر اساس آن صادر شده است .تخلف از صدور رأی در مهلت مقرر موجب محکومیت انتظامی تا درجه چهار است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 375, "category": "other", "chapter": "", "text": "دادگاه باید در رأی ،حضوری یا غیابی بودن و قابلیت واخواهی ،تجدیدنظر و یا فرجام و مهلت و مرجع آن را قید کند. اگر رأی قابل واخواهی ،تجدیدنظر یا فرجام باشد و دادگاه آن را غیرقابل واخواهی ،تجدیدنظر یا فرجام اعلام کند این امر ،مانع واخواهی ،تجدیدنظر یا فرجامخواهی نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 376, "category": "other", "chapter": "", "text": "هرگاه رأی بر برائت ،منع یا موقوفی تعقیب و یا تعلیق اجرای مجازات صادر شود و متهم در بازداشت باشد ،بلافاصله به دستور دادگاه آزاد میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 377, "category": "other", "chapter": "", "text": "هرگاه متهم با صدور قرار تأمین در بازداشت باشد و به موجب حکم غیرقطعی به حبس ،شلاق تعزیری و یا جزای نقدی محکوم شود ،مقام قضایی که پرونده تحت نظر او است باید با احتساب ایام بازداشت قبلی ،مراتب را به زندان اعلام کند تا وی بیش از میزان محکومیت در زندان نماند.", "explanation": "اگر متهمی که در بازداشت است، با حکم غیرقطعی به حبس، شلاق تعزیری یا جزای نقدی محکوم شود، مقام قضائی مربوطه باید با احتساب ایام بازداشت قبلی، مراتب را به زندان اعلام کند تا بیش از میزان محکومیت واقعی در زندان نماند.", "notes": ["هدف این ماده جلوگیری از تحمل حبس مازاد بر میزان محکومیت نهایی است."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۳۷۷ قانون آیین دادرسی کیفری، احتساب ایام بازداشت قبلی متهم در محکومیت او برای چه هدفی انجام می‌شود؟", "options": ["افزایش مدت حبس او", "جلوگیری از ماندن بیش از میزان محکومیت در زندان", "هیچ هدف خاصی ندارد", "فقط برای آمار زندان‌هاست"], "correct": 1, "explain": "متن ماده هدف این احتساب را جلوگیری از ماندن متهم بیش از میزان محکومیت واقعی در زندان بیان می‌کند."}]}, {"article": 378, "category": "other", "chapter": "", "text": "رأی دادگاه باید حداکثر ظرف سه روز از تاریخ انشا ،پاکنویس یا تایپ شود .این رأی که «دادنامه» خوانده میشود با نام خداوند متعال شروع و موارد زیر در آن درج میشود و به امضای دادرس یا دادرسان میرسد و به مهر شعبه ممهور میشود: الف -شماره پرونده ،شماره و تاریخ دادنامه و تاریخ صدور رأی ب -مشخصات دادگاه و قاضی یا قضات صادرکننده رأی و سمت ایشان پ -مشخصات طرفین دعوی و وکلای آنان ت -گردش کار و متن کامل رأی", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 379, "category": "other", "chapter": "", "text": "پیش از امضای دادنامه ،اعلام مفاد و تسلیم رونوشت یا تصویر آن ممنوع است .متخلف از این امر ،حسب مورد ،به موجب حکم دادگاه انتظامی قضات یا هیئت رسیدگی به تخلفات اداری به سه ماه تا یک سال انفصال از خدمات دولتی محکوم میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 380, "category": "other", "chapter": "", "text": "دادنامه به طرفین یا وکیل آنان و دادستان ابلاغ می شود و در صورتی که رأی دادگاه حضوری به طرفین ابلاغ شود ،دادن نسخه ای از رأی یا تصویر مصدق آن به طرفین الزامی است .در این صورت ،ابلاغ مجدد ضرورت ندارد. تبصره –۱ مدیر دفتر دادگاه مکلف است حداکثر ظرف سه روز پس از امضای دادنامه ،آن را برای ابلاغ ارسال نماید. تبصره –۲ در جرایم منافی عفت ،چنانچه دادنامه حاوی مطالبی باشد که اطلاع شاکی از آن حرام است و همچنین در جرایم علیه امنیت داخلی و خارجی کشور ،ابلاغ دادنامه حضوری بوده و ذینفع میتواند از مفاد کامل رأی اطلاع یافته و از آن استنساخ نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 381, "category": "other", "chapter": "", "text": "هرگاه در تنظی م و نوشتن رأی دادگاه ،سهو قلمی مانند کم یا زیاد شدن کلمهای رخ دهد و یا اشتباهی در محاسبه صورت گیرد ،چنانچه رأی قطعی باشد یا به علت عدم تجدیدنظرخواهی و انقضای مواعد قانونی ،قطعی شود یا هنوز از آن تجدیدنظرخواهی نشده باشد ،دادگاه خود یا به درخواست ذینفع یا دادستان ،رأی تصحیحی صادر میکند .رأی تصحیحی نیز ابلاغ میشود .تسلیم رونوشت یا تصویر هر یک از آرا ،جداگانه ممنوع است .رأی دادگاه در قسمتی که مورد اشتباه نیست ،در صورت قطعیت اجرا میشود. تبصره –۱ در مواردی که اصل رأی دادگاه قابل واخواهی ،تجدیدنظر یا فرجام اس ت ،تصحیح آن نیز در مدت قانونی ،قابل واخواهی، تجدیدنظر یا فرجام میباشد. تبصره –۲ هرگاه رأی اصلی به واسطه واخواهی ،تجدیدنظر یا فرجام نقض شود ،رأی تصحیحی نیز بیاعتبار میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 382, "category": "other", "chapter": "", "text": "دادگاه کیفر ی یک فقط در صورت صدور کیفرخواست و در حدود آن مبادرت به رسیدگی و صدور رأی میکند ،مگر در جرایمی که مطابق قانون لزوما ً به طور مستقیم در دادگاه کیفری یک مورد رسیدگی واقع میشود .در این صورت ،انجام تحقیقات مقدماتی مطابق مقررات بر عهده دادگاه کیفری یک است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 383, "category": "other", "chapter": "", "text": "در مواردی که پرونده به طور مستقیم در دادگاه کیفری یک رسیدگی میشود ،پس از پایان تحقیقات مقدماتی ،چنانچه عمل انتسابی جرم محسوب نشود یا ادله کافی برای انتساب جرم به متهم وجود نداشته باشد و یا به جهات قانونی دیگر متهم قابل تعقیب نباشد ،دادگاه حسب مورد ،قرار منع یا موقوفی تعقیب و در غیر این صورت قرار رسیدگی صادر میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 384, "category": "other", "chapter": "", "text": "پس از ارجاع پرونده به دادگاه کیفری یک ،در جرایم موضوع بندهای (الف)( ،ب)( ،پ) و (ت) ماده ( )۳۰۲ این قانون و یا پس از صدور قرار رسیدگی در مواردی که پرونده به طور مستقیم در دادگاه کیفری یک رسیدگی میشود ،هرگاه متهم وکیل معرفی نکرده باشد ،مدیر دفتر دادگاه ظرف پنج روز به او اخطار می کند که وکیل خود را حداکثر تا ده روز پس از ابلاغ به دادگاه معرفی کند .چنانچه متهم وکیل خود را معرفی نکند ،مدیر دفتر ،پرونده را نزد رئیس دادگاه ارسال میکند تا طبق مقررات برای متهم وکیل تسخیری تعیین شود.", "explanation": "در جرایم بسیار شدید (بندهای الف تا ت مادهٔ ۳۰۲)، اگر متهم وکیل معرفی نکرده باشد، مدیر دفتر دادگاه ظرف پنج روز به او اخطار می‌کند که حداکثر ظرف ده روز پس از ابلاغ، وکیل معرفی کند؛ در غیر این صورت، دادگاه برایش وکیل تسخیری تعیین می‌کند.", "notes": ["مهلت‌های کلیدی: پنج روز برای اخطار مدیر دفتر، ده روز برای معرفی وکیل توسط متهم."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۳۸۴ قانون آیین دادرسی کیفری، در جرایم بسیار شدید، متهمی که وکیل معرفی نکرده، حداکثر چند روز پس از ابلاغ اخطاریه فرصت معرفی وکیل دارد؟", "options": ["پنج روز", "ده روز", "یک ماه", "سه ماه"], "correct": 1, "explain": "متن ماده این مهلت را «حداکثر ده روز پس از ابلاغ» تعیین کرده است."}]}, {"article": 385, "category": "other", "chapter": "", "text": "هر یک از طرفین می تواند حداکثر سه وکیل به دادگاه معرفی کند .استعفای وکیل تعیینی یا عزل وکیل پس از تشکیل جلسه رسیدگی پذیرفته نمیشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 386, "category": "other", "chapter": "", "text": "در صورتی که هر یک از اصحاب دعوی وکلای متعدد داشته باشد ،حضور یکی از آنان برای تشکیل جلسه دادگاه کافی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 387, "category": "other", "chapter": "", "text": "پس از تعیین وکیل ،مدیر دفتر بلافاصله به متهم و وکیل او و حسب مورد ،به شاکی یا مدعی خصوصی یا وکیل آنان اخطار میکند تا تمام ایرادها و اعتراضهای خود را ظرف ده روز از تاریخ ابلاغ تسلیم کنند .تجدید مهلت به تقاضای متهم یا وکیل او برای یک نوبت و به مدت ده روز از تاریخ اتمام مهلت قبلی ،به تشخیص دادگاه بلامانع است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 388, "category": "other", "chapter": "", "text": "متهم و شاکی یا مدعی خصوصی یا وکلای آنان باید تمام ایرادها و اعتراضهای خود از قبیل مرور زمان ،عدم صلاحیت، رد دادرس یا قابل تعقیب نبود ن عمل انتسابی ،نقص تحقیقات و لزوم رسیدگی به ادله دیگر یا ادله جدید و کافی نبودن ادله را ظرف مهلت مقرر به دفتر دادگاه تسلیم کنند .پس از اتمام مدت مذکور ،هیچ ایرادی از طرف اشخاص مزبور پذیرفته نمیشود، مگر آنکه جهت ایراد پس از مهلت ،کشف و یا حادث شود .در هر حال ،طرح پرونده در جلسه مقدماتی دادگاه ،پیش از اتمام مهلت ممنوع است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 389, "category": "other", "chapter": "", "text": "پس از اتمام مهلت اعم از آنکه ایراد و اعتراضی واصل شده یا نشده باشد ،مدیر دفتر ،پرونده را به دادگاه ارسال میکند. رئیس دادگاه ،پرونده را شخصا ً بررسی و گزارش جامع آن را تنظیم و یا به نوبت به یکی از اعضای دادگاه ارجاع میکند .عضو مذکور حداکثر ظرف ده روز ،گزارش مبسوط راجع به اتهام و ادله و جریان پرونده را تهیه و تقدیم رئیس میکند .دادگاه به محض وصول گزارش ،جلسه مقدماتی اداری را تشکیل می دهد و با توجه به مفاد گزارش و اوراق پرونده و ایرادها و اعتراضهای اصحاب دعوی به شرح زیر اقدام میکند: الف -در صورتی که تحقیقات ناقص باشد ،قرار رفع نقص صادر میکند و پرونده را نزد دادسرای صادرکننده کیفرخواست میفرستد تا پس از انجام دستور دادگاه ،آن را بدون اظهارنظر اعاده کند. ب -هرگاه موضوع ،خارج از صلاحیت دادگاه باشد ،قرار عدم صلاحیت صادر میکند. پ -در صورتی که به دلیل شمول مرور زمان ،گذشت شاکی یا مدعی خصوصی و یا جهات قانونی دیگر ،متهم قابل تعقیب نباشد، قرار موقوفی تعقیب صادر می کند .در این صورت چنانچه متهم زندانی باشد به دستور دادگاه ،فوری آزاد میشود. تبصره -دادگاه می تواند در صورت ضرورت ،دادستان یا نماینده او ،شاکی یا مدعی خصوصی یا متهم و یا وکلای آنان را برای حضور در جلسه مقدماتی دعوت کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 390, "category": "salahiyat", "chapter": "بخش سوم - تشکیلات و صلاحیت دادگاه‌های کیفری", "text": "قرار عدم صلاحیت از طرف دادستان و قرارهای مذکور در بند (پ) ماده قبل از طرف دادستان و شاکی یا مدعی خصوصی قابل تجدیدنظر است .در صورت نقض این قرار ،پرونده برای طرح مجدد در جلسه مقدماتی و انجام سایر وظایف به دادگاه کیفری یک اعاده میشود.", "explanation": "قرار عدم صلاحیت صادره از دادستان، توسط دادستان یا شاکی/مدعی خصوصی قابل تجدیدنظرخواهی است. در صورت نقض این قرار، پرونده برای طرح مجدد و ادامهٔ رسیدگی به دادگاه کیفری یک بازگردانده می‌شود.", "notes": ["حق تجدیدنظرخواهی از قرار عدم صلاحیت: هم برای دادستان هم برای شاکی/مدعی خصوصی."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۳۹۰ قانون آیین دادرسی کیفری، قرار عدم صلاحیت دادستان توسط چه اشخاصی قابل تجدیدنظرخواهی است؟", "options": ["فقط متهم", "دادستان و شاکی یا مدعی خصوصی", "فقط وکیل متهم", "هیچ‌کس نمی‌تواند اعتراض کند"], "correct": 1, "explain": "متن ماده این حق تجدیدنظرخواهی را برای دادستان و شاکی/مدعی خصوصی به‌رسمیت شناخته است."}]}, {"article": 391, "category": "other", "chapter": "", "text": "هرگاه دادگاه در جلسه مقدماتی ،پرونده را کامل و قابل طرح برای دادرسی تشخیص دهد ،بلافاصله دستور تعیین وقت رسیدگی و احضار تمام اشخاصی را که حضورشان ضروری است ،صادر میکند. تبصره -چنانچه در جرایم موضوع بندهای (الف)( ،ب)( ،پ) و (ت) ماده ( )۳۰۲ این قانون ،دادگاه جلب بدون احضار متهم را برای محاکمه لازم بداند ،دستور جلب وی را برای روز محاکمه صادر میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 392, "category": "other", "chapter": "", "text": "مدیر دفتر دادگ اه مکلف است پس از وصول پرونده به دفتر ،حداکثر ظرف دو روز ،وقت رسیدگی تعیین و مطابق دستور دادگاه اقدام کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 393, "category": "other", "chapter": "", "text": "در هر مورد که دادگاه باید با حضور هیئت منصفه تشکیل شود ،اعضای هیئت منصفه نیز طبق مقررات دعوت میشوند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 394, "category": "other", "chapter": "", "text": "هرگاه متهم متواری باشد یا دسترسی به وی امکان نداشته باشد و احضار و جلب او برای تعیین وکیل یا انجام تشریفات راجع به تشکیل جلسه مقدماتی یا دادرسی مقدور نباشد و دادگاه حضور متهم را برای دادرسی ضروری تشخیص ندهد ،به تشکیل جلسه مقدماتی مبادرت میورزد و در غیاب متهم ،اقدام به رسیدگی میکند ،مگر آنکه دادستان احضار متهم را ممکن بداند که در این صورت دادگاه پس از تقاضای دادستان ،مهلت مناسبی برای احضار یا جلب متهم به وی میدهد .مهلت مذکور نباید بیشتر از پانزده روز باشد. تبصره –۱ در هر مورد که دادگاه بخواهد رسیدگی غیابی کند ،باید از قبل قرار رسیدگی غیابی صادر کند .در این قرار ،موضوع اتهام و وقت دادرسی و نتیجه عدم حضور قید و مراتب دو نوبت به فاصله ده روز در یکی از روزنامههای کثیرالانتشار ملی یا محلی آگهی می شود .فاصله بین تاریخ آخرین آگهی و وقت دادرسی نباید کمتر از یک ماه باشد. تبصره –۲ هرگاه متهم ان متعدد و بعضی از آنان متواری باشند ،دادگاه نسبت به متهمان حاضر شروع به رسیدگی مینماید و در مورد غایبان به ترتیب فوق رسیدگی میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 395, "category": "other", "chapter": "", "text": "در دادگاه کیفری یک و نیز در تمام مواردی که رسیدگی مرجع قضایی با قضات متعدد پیشبینی شده باشد ،رأی اکثریت تمام اعضا مالک است .نظر اقلیت باید به طور مستدل در پرونده درج شود .اگر نظر اکثریت به شرح فوق حاصل نشود، یک عضو مستشار دیگر توسط مقام ارجاع اضافه میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 396, "category": "other", "chapter": "", "text": "رئیس دادگاه پس از تشکیل جلسه و اعلام رسمیت آن ،ابتدا در مورد متهم به شرح مواد ( )۱۹۳ و ( )۱۹۴ این قانون اقدام و سپس به وی اخطار می کند در موقع محاکمه مواظب گفتار خود باشد و پس از آن به دیگر اشخاصی که در محاکمه شرکت دارند نیز اخطار می کند مطلبی برخلاف حقیقت ،وجدان ،قوانین ،ادب و نزاکت اظهار نکنند. پس از آن دادستان یا نماینده او کیفرخواست و منشی دادگاه ،دادخواست مدعی خصوصی را قرائت میکند .سپس رئیس دادگاه موضوع اتهام و تمام ادله آن را به متهم تفهیم و شروع به رسیدگی مینماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 397, "category": "other", "chapter": "", "text": "قضات دادگاه کیفری یک می توانند با اجازه رئیس دادگاه از طرفین و وکلای آنان ،شهود ،اهل خبره و دادستان پرسش کنند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 398, "category": "other", "chapter": "", "text": "هرگاه دادستان ،متهم ،شاکی ،مدعی خصوصی یا وکلای آنان تحقیق از اشخاص حاضر در دادگاه را درخواست کنند، دادگاه در صورت ضرورت از آنان تحقیق میکند ،هر چند از قبل احضار نشده باشند.", "explanation": "اگر دادستان، متهم، شاکی، مدعی خصوصی یا وکلای آنان درخواست تحقیق از اشخاص حاضر در دادگاه را بدهند، دادگاه در صورت ضرورت از آنان تحقیق می‌کند، حتی اگر پیش‌تر احضار نشده باشند.", "notes": ["این ماده انعطاف‌پذیری برای تحقیق از حاضرین در جلسه، فراتر از احضارشدگان قبلی، فراهم می‌کند."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۳۹۸ قانون آیین دادرسی کیفری، آیا دادگاه می‌تواند از شخصی که قبلاً احضار نشده اما در جلسه حاضر است، تحقیق کند؟", "options": ["خیر، فقط احضارشدگان قابل تحقیق‌اند", "بله، در صورت ضرورت و با درخواست طرفین یا دادستان", "فقط با اجازهٔ رئیس قوهٔ قضائیه", "هرگز چنین امکانی وجود ندارد"], "correct": 1, "explain": "متن ماده این امکان را در صورت ضرورت و با درخواست اصحاب دعوا پیش‌بینی کرده است."}]}, {"article": 399, "category": "other", "chapter": "", "text": "پس از رعایت ترتیب مقرر در ماده ( )۳۵۹ این قانون ،هرگاه دادستان بار دیگر اجازه صحبت بخواهد ،به متهم ،شاکی، مدعی خصوصی یا وکلای آنان نیز اجازه صحبت داده می شود .پیش از اعلام ختم رسیدگی ،رئیس دادگاه یک بار دیگر به متهم یا وکیل او اجازه صحبت می دهد ،آخرین دفاع را از متهم یا وکیل وی اخذ و سپس رسیدگی را ختم میکند .هرگاه متهم یا وکیل وی در آخرین دفاع ،مطلبی اظهار کند که در کشف حقیقت مؤثر باشد ،دادگاه مکلف به رسیدگی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 400, "category": "other", "chapter": "", "text": "محاکمات دادگاه کیفری یک ،ضبط صوتی و در صورت تشخیص دادگاه ،ضبط تصویری نیز میشود .انتشار آنها ممنوع و استفاده از آنها نیز منوط به اجازه دادگاه است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 401, "category": "other", "chapter": "", "text": "در مواردی که به جرایم موضوع صلاحیت دادگاه کیفری یک در خارج از حوزه قضایی محل وقوع جرم رسیدگی میشود، تمام وظایف و اختیارات دادسرا ،از جمله شرکت در جلسه محاکمه و دفاع از کیفرخواست بر عهده دادسرای محل وقوع جرم است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 402, "category": "other", "chapter": "", "text": "در مواردی که دادگاه کیفری یک حسب مقررات این قانون صلاحیت رسیدگی به جرایم موضوع صلاحیت دادگاه اطفال و نوجوانان را دارد رعایت مقررات مربوط به رسیدگی به جرایم اطفال و نوجوانان الزامی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 403, "category": "other", "chapter": "", "text": "دادگاه کیفری یک با رعایت صلاحیت ذاتی ،پس از شروع به رسیدگی نمی تواند قرار عدم صلاحیت صادر کند و به هر حال باید رأی مقتضی را صادر نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 404, "category": "other", "chapter": "", "text": "اعضای دادگاه پس از اعلام ختم رسیدگی با استعانت از خداوند متعال ،تکیه بر شرف و وجدان و با توجه به محتویات پرونده ،مشاوره مینمایند و در همان جلسه و در صورت عدم امکان ،در اولین فرصت و حداکثر ظرف مدت یک هفته مبادرت به صدور رأی می کنند .در صورتی که بین اعضای دادگاه اتفاق نظر حاصل نشود رأی اکثریت معتبر است .انشای رأی به عهده رئیس دادگاه است ،مگر آنکه وی جزء اکثریت نباشد که در این صورت ،عضوی که جزء اکثریت است و سابقه قضایی بیشتر دارد ،رأی را انشا می کند .در صورت صدور رأی در همان جلسه ،بلافاصله جلسه علنی دادگاه با حضور متهم یا وکیل او و دادستان یا نماینده او و شاکی تشکیل و رأی توسط منشی دادگاه با صدای رسا قرائت و مفاد آن توسط رئیس دادگاه به متهم تفهیم میشود .هرگاه رأی بر برائت یا تعلیق اجرای مجازات باشد ،متهم به دستور دادگاه ،فوری آزاد میشود. تبصره (اصلاحی -)۱۳۹۴٫۳٫۲۴ پس از ختم رسیدگی ،چنانچه نظر به صدور رأی در همان جلسه باشد ،اعضای دادگاه تا صدور رأی و اعلام آن در جلسه علنی نباید متفرق شوند .این حکم در مورد اعضای هیئت منصفه نیز جاری است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 405, "category": "salahiyat", "chapter": "بخش سوم - تشکیلات و صلاحیت دادگاه‌های کیفری", "text": "سایر ترتیبات رسیدگی در دادگاه کیفری یک همان است که برای سایر دادگاههای کیفری مقرر گردیده است.", "explanation": "سایر ترتیبات رسیدگی در دادگاه کیفری یک، همان قواعدی است که برای دیگر دادگاه‌های کیفری در این قانون مقرر شده؛ یعنی جز مواردی که قانون به‌طور خاص برای کیفری یک تعیین کرده، بقیهٔ قواعد عمومی حاکم است.", "notes": ["این ماده یک «ماده ارجاعی» است: قواعد عمومی دادرسی کیفری، در نبود حکم خاص، برای دادگاه کیفری یک هم اجرا می‌شود."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۴۰۵ قانون آیین دادرسی کیفری، ترتیبات رسیدگی در دادگاه کیفری یک که در قانون به‌طور خاص ذکر نشده، تابع چیست؟", "options": ["تصمیم شخصی قاضی بدون هیچ ضابطه‌ای", "همان ترتیباتی که برای سایر دادگاه‌های کیفری مقرر شده", "قواعد آیین دادرسی مدنی", "هیچ قاعده‌ای وجود ندارد"], "correct": 1, "explain": "متن ماده تصریح می‌کند سایر ترتیبات همان است که برای سایر دادگاه‌های کیفری مقرر شده است."}]}, {"article": 406, "category": "other", "chapter": "", "text": "در تمام جرایم ،به استثنای جرایمی که فقط جنبه حق اللهی دارند ،هرگاه متهم یا وکیل او در هیچ یک از جلسات دادگاه حاضر نشود یا لایحه دفاعیه نفرستاده باشد ،دادگاه پس از رسیدگی ،رأی غیابی صادر میکند .در این صورت ،چنانچه رأی دادگاه مبنی بر محکومیت متهم باشد ،ظرف بیست روز از تاریخ ابلاغ واقعی ،قابل واخواهی در همان دادگاه است و پس از انقضای مهلت واخواهی برابر مقررات حسب م ورد قابل تجدیدنظر یا فرجام است .مهلت واخواهی برای اشخاص مقیم خارج از کشور ،دو ماه است. تبصره –۱ هرگاه متهم در جلسه رسیدگی حاضر و در فاصله تنفس یا هنگام دادرسی بدون عذر موجه غائب شود ،دادگاه رسیدگی را ادامه میدهد .در این صورت حکمی که صادر میشود ،حضوری است. تبصره –۲ حکم غیابی که ظرف مهلت مقرر از آن واخواهی نشود ،پس از انقضای مهلتهای واخواهی و تجدیدنظر یا فرجام به اجرا گذاشته میشود .هرگاه حکم دادگاه ابلاغ واقعی نشده باشد ،محکومعلیه می تواند ظرف بیست روز از تاریخ اطلاع ،واخواهی کند که در این صورت ،اجرای رأی ،متوقف و متهم تحتالحفظ به همراه پرونده به دادگاه صادرکننده حکم اعزام میشود .این دادگاه در صورت اقتضا نسبت به اخذ تأمین یا تجدیدنظر در تأمین قبلی اقدام میکند. تبصره –۳ در جرایمی که فقط جنبه حقاللهی دارند ،هرگاه محتویات پرونده ،مجرمیت متهم را اثبات نکند و تحقیق از متهم ضروری نباشد ،دادگاه میتواند بدون حضور متهم ،رأی بر برائت او صادر کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 407, "category": "other", "chapter": "", "text": "دادگاه پس از واخواهی ،با تعیین وقت رسیدگی طرفین را دعوت میکند و پس از بررسی ادله و دفاعیات واخواه ،تصمیم مقتضی اتخاذ مینماید .عدم حضور طرفین یا هر یک از آنان مانع رسیدگی نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 408, "category": "other", "chapter": "", "text": "رئیس دادگستری یا رئیس کل دادگاههای شهرستان مرکز استان هر حوزه حسب مورد ریاست دادگاههای اطفال و نوجوانان را نیز بر عهده دارد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 409, "category": "other", "chapter": "", "text": "قضات دادگاه و دادسرای اطفا ل و نوجوانان را رئیس قوه قضائیه از بین قضاتی که حداقل پنج سال سابقه خدمت قضایی دارند و شایستگی آنان را برای این امر با رعایت سن و جهات دیگر از قبیل تأهل ،گذراندن دوره آموزشی و ترجیحا ً داشتن فرزند محرز بداند ،انتخاب میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 410, "category": "other", "chapter": "", "text": "مشاوران دادگاه اطفال و نوجوانان از بین متخصصان علوم تربیتی ،روانشناسی ،جرمشناسی ،مددکاری اجتماعی، دانشگاهیان و فرهنگیان آشنا به مسائل روانشناختی و تربیتی کودکان و نوجوانان اعم از شاغل و بازنشسته انتخاب میشوند. تبصره –۱ برای انتخاب مشاوران ،رییس حوزه قضایی هر محل برای هر شعبه حداقل هشت نفر مرد و زن را که واجد شرایط مندرج در این ماده بداند به رئیس کل دادگستری استان پیشنهاد میکند .رئیس کل دادگستری استان از بین آنان حداقل چهار نفر را برای مدت دو سال به این سمت منصوب مینماید .انتخاب مجدد آنان بلامانع است. تبصره –۲ در صورت مؤنث بودن متهم ،حداقل یکی از مشاوران باید زن باشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 411, "category": "other", "chapter": "", "text": "هرگاه قاضی دادگاه اطفال و نوجوانان به جهتی از جهات قانونی از انجام وظیفه باز بماند ،رئیس دادگستری میتواند شخصا ً به جای او انجام وظیفه کند یا یکی از قضات واجد شرایط را به جای قاضی دادگاه اطفال و نوجوانان به طور موقت مأمور رسیدگی نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 412, "category": "other", "chapter": "", "text": "دادگاه اطفال و نوجوانان وقت جلسه رسیدگی را تعیین و به والدین ،اولیا یا سرپرست قانونی طفل یا نوجوان ،وکیل وی و دادستان و شاکی ابلاغ میکند. تبصره –۱ هرگاه در موقع رسیدگی سن متهم هجده سال و یا بیشتر باشد ،وقت دادرسی به متهم یا وکیل او ابلاغ میشود. تبصره –۲ در جرایم تعزیری درجه شش ،هفت و هشت و همچنین در جرایم تعزیری که مجازات قانونی آنها غیر از حبس است، هرگاه متهم و والدین یا سرپرست قانونی او و همچنین در صورت داشتن وکیل ،وکیل او حاضر باشند و درخواست رسیدگی نمایند و موجبات رسیدگی نیز فراهم باشد ،دادگاه میتواند بدون تعیین وقت ،رسیدگی و اتخاذ تصمیم نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 413, "category": "other", "chapter": "", "text": "در دادگاه اطفال و نوجوانان ،والدین ،اولیا یا سرپرست طفل و نوجوان ،وکیل مدافع ،شاکی ،اشخاصی که نظر آنان در تحقیقات مقدماتی جلب شده ،شهود ،مطلعان و مددکار اجتماعی سازمان بهزیستی حاضر میشوند .حضور اشخاص دیگر در جلسه رسیدگی با موافقت دادگاه بلامانع است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 414, "category": "other", "chapter": "", "text": "هرگاه مصلحت طفل موضوع تبصره ( )۱ ماده ( )۳۰۴ این قانون ،اقتضا کند ،ممکن است تمام یا قسمتی از دادرسی در غیاب او به عمل آید .رأی دادگاه در هر صورت حضوری محسوب میشود.", "explanation": "اگر به مصلحت طفل (موضوع تبصرهٔ ۱ مادهٔ ۳۰۴) باشد، ممکن است تمام یا بخشی از دادرسی در غیاب او انجام شود؛ با این حال، رأی صادره در هر صورت «حضوری» محسوب می‌شود (نه غیابی).", "notes": ["این ماده استثنایی برای اطفال است: غیاب طفل به مصلحت خودش، رأی را غیابی نمی‌کند."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۴۱۴ قانون آیین دادرسی کیفری، اگر به مصلحت طفل، دادرسی در غیاب او انجام شود، رأی صادره چه وضعیتی دارد؟", "options": ["غیابی محسوب می‌شود و قابل واخواهی است", "در هر صورت حضوری محسوب می‌شود", "باطل و بی‌اثر است", "نیاز به تجدید محاکمه دارد"], "correct": 1, "explain": "متن ماده تصریح می‌کند رأی در این حالت «در هر صورت حضوری محسوب می‌شود»."}]}, {"article": 415, "category": "other", "chapter": "", "text": "در جرایمی که رسیدگی به آن ها در صلاحیت دادگاه کیفری یک است یا جرایمی که مستلزم پرداخت دیه یا ارش بیش از خمس دیه کامل است و در جرایم تعزیری درجه شش و بالاتر ،دادسرا و یا دادگاه اطفال و نوجوانان به ولی یا سرپرست قانونی متهم ابلاغ می نماید که برای او وکیل تعیین کند .در صورت عدم تعیین وکیل یا عدم حضور وکیل بدون اعلام عذر موجه ،در مرجع قضایی برای متهم وکیل تعیین می شود .در جرایم تعزیری درجه هفت و هشت ،ولی یا سرپرست قانونی طفل یا نوجوان میتواند خود از وی دفاع و یا وکیل تعیین نماید .نوجوان نیز میتواند از خود دفاع کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 416, "category": "other", "chapter": "", "text": "به دادخواست ضرر و زیان ناشی از جرم که در دادگاه اطفال و نوجوانان مطرح میگردد ،طبق مقررات قانونی رسیدگی و حکم مقتضی صادر می شود .در هنگام رسیدگی به دعوای ضرر و زیان ،حضور طفل لازم نیست ،مگر در صورتی که توضیحات وی برای صدور رأی ضروری باشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 417, "category": "other", "chapter": "", "text": "آرا و تصمیمات دادگاه اطفال و نوجوانان علاوه بر شاکی ،متهم و محکومعلیه ،به ولی یا سرپرست قانونی متهم و محکومعلیه و در صورت داشتن وکیل به وکیل ایشان نیز ابلاغ میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 418, "category": "other", "chapter": "", "text": "در هر مرحله از رسیدگی کیفری ،احاله پرونده از یک حوزه قضایی به حوزه قضایی دیگر یک استان ،حسب مورد ،به درخواست دادستان یا رئیس حوزه قضایی مبدأ و موافقت شعبه اول دادگاه تجدیدنظر استان و از حوزه قضایی یک استان به استان دیگر به تقاضای همان اشخاص و موافقت دیوان عالی کشور صورت میگیرد. تبصره -در مورد جرایم در صلاحیت سازمان قضایی نیروهای مسلح ،احاله حسب مورد به درخواست دادستان نظامی یا رئیس سازمان قضایی استان با موافقت رئیس سازمان قضایی نیروهای مسلح انجام میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 419, "category": "other", "chapter": "", "text": "احاله در موارد زیر صورت میگیرد: الف -متهم یا بیشتر متهمان در حوزه دادگاه دیگری اقامت داشته باشند. ب -محل وقوع جرم از دادگاه صالح دور باشد ،به نحوی که دادگاه دیگر به علت نزدیک بودن به محل وقوع آن ،آسانتر بتواند به موضوع رسیدگی کند. تبصره -احاله پرونده نباید به کیفیتی باشد که موجب عسر و حرج شاکی و یا مدعی خصوصی شود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 420, "category": "other", "chapter": "", "text": "علاوه بر موارد مذکور در ماده قبل ،به منظور حفظ نظم و امنیت عمومی ،بنا به پیشنهاد رئیس قوه قضائیه یا دادستان کل کشور و تجویز دیوان عالی کشور ،رسیدگی به حوزه قضایی دیگر احاله میشود. تبصره -در جرایم در صلاحیت سازمان قضایی نیروهای مسلح ،رئیس این سازمان می تواند به منظور حفظ نظم و امنیت عمومی و رعایت مصالح نیروهای مسلح ،پرونده را به حوزه قضایی دیگر احاله کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 421, "category": "salahiyat", "chapter": "بخش سوم - تشکیلات و صلاحیت دادگاه‌های کیفری", "text": "دادرس در موارد زیر باید از رسیدگی امتناع کند و طرفین دعوی نیز میتوانند در این موارد ایراد رد دادرس کنند: الف -قرابت نسبی یا سببی تا درجه سوم از هر طبقه بین دادرس و یکی از طرفین دعوی یا شریک یا معاون جرم؛ وجود داشته باشد. ب -دادرس ،قیم یا مخدوم یکی از طرفین دعوی باشد یا یکی از طرفین ،مباشر امور دادرس یا امور همسر وی باشد. پ -دادرس ،همسر و یا فرزند او ،وارث یکی از طرفین دعوی یا شریک یا معاون جرم باشند. ت -دادرس در همان امر کیفری قبال ً تحت هر عنوان یا سمتی اظهارنظر ماهوی کرده یا شاهد یکی از طرفین بوده باشد. ث -بین دادرس ،پدر و مادر ،همسر و یا فرزند او و یکی از طرفین دعوی یا پدر و مادر ،همسر و یا فرزند او ،دعوای حقوقی یا کیفری مطرح باشد یا در سابق مطرح بوده و از تاریخ صدور رأی قطعی ،بیش از دو سال نگذشته باشد. ج -دادرس ،همسر و یا فرزند او نفع شخصی در موضوع مطروحه داشته باشند. تبصره -شکایت انتظامی از جهات رد دادرس محسوب نمیشود.", "explanation": "این ماده موارد «رد دادرس» را برمی‌شمرد: خویشاوندی نزدیک با طرفین، رابطهٔ قیمومت یا خدمتی، اظهارنظر قبلی دادرس دربارهٔ همان پرونده، دعاوی متقابل بین دادرس/خانواده‌اش و طرفین، و نفع شخصی دادرس یا خانواده‌اش در موضوع.", "notes": ["هدف این ماده تضمین بی‌طرفی قاضی است؛ در صورت وجود هرکدام از این جهات، دادرس باید خودش کنار برود یا طرفین می‌توانند او را رد کنند."], "difficulty": "hard", "verified": true, "hasContent": true, "questions": [{"q": "کدام مورد زیر طبق ماده ۴۲۱ قانون آیین دادرسی کیفری، از جهات رد دادرس محسوب می‌شود؟", "options": ["اختلاف سلیقهٔ حقوقی با وکیل یکی از طرفین", "دادرس در همان پرونده قبلاً تحت هر عنوانی اظهارنظر ماهوی کرده باشد", "سابقهٔ کاری طولانی دادرس", "محل تحصیل دادرس"], "correct": 1, "explain": "بند «ت» ماده ۴۲۱ اظهارنظر ماهوی قبلی دادرس دربارهٔ همان پرونده را از جهات رد او می‌داند."}]}, {"article": 422, "category": "other", "chapter": "", "text": "ایراد رد باید تا قبل از صدور رأی به عمل آید .هرگاه دادرس آن را بپذیرد ،از رسیدگی امتناع میکند و رسیدگی به دادرس علیالبدل یا شعبه دیگر ارجاع میشود .در صورت نبودن دادرس علیالبدل یا شعبه دیگر ،پرونده برای رسیدگی به نزدیکترین مرجع قضایی همعرض فرستاده میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 423, "category": "other", "chapter": "", "text": "هرگاه داد رس ایراد رد را قبول نکند ،مکلف است ظرف سه روز قرار رد ایراد را صادر کند و به رسیدگی ادامه دهد .قرار مذکور ظرف ده روز از تاریخ ابلاغ ،قابل اعتراض در مرجع صالح است .به این اعتراض خارج از نوبت رسیدگی میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 424, "category": "other", "chapter": "", "text": "مقامات قضایی دادسرا نیز باید در صورت وجود جهات رد دادرس ،از رسیدگی امتناع کنند .شاکی ،مدعی خصوصی یا متهم نیز می توانند دادستان یا بازپرس را رد و مراتب را به صورت کتبی به او اعلام کنند .در صورت قبول ایراد ،دادستان یا بازپرس از رسیدگی و مداخله در موضوع امتناع مینماید و رسیدگی حسب مورد ،به جانشین دادستان یا بازپرس دیگر محول میشود و در غیر این صورت ،باید قرار رد ایراد صادر و به مدعی رد ،ابلاغ شود .مدعی رد می تواند در مهلتی که برای اعتراض به سایر قرارها مقرر شده است ،به دادگاه صالح برای رسیدگی به جرم اعتراض کند .رأی دادگاه در این مورد قطعی است. تبصره -صدور قرار رد ایراد ،مانع انجام تحقیقات مقدماتی نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 425, "category": "other", "chapter": "", "text": "در مواردی که دادگاه با تعدد قاضی تشکیل میشود ،هرگاه نسبت به یکی از اعضا ایراد رد شود و آن عضو از رسیدگی امتناع کند ،دادگاه با حضور عضو دیگر تکمیل می شود و مبادرت به رسیدگی میکند .چنانچه ایراد رد مورد پذیرش قرار نگیرد ،همان دادگاه بدون حضور عضو مورد ایراد در وقت اداری به اعتراض رسیدگی و قرار رد یا قبول ایراد را صادر می کند .هرگاه تعداد باقیمانده اعضای شعبه در اکثریت نباشند و امکان انتخاب اعضای علیالبدل نیز برای رسیدگی به ایراد وجود نداشته باشد ،رسیدگی به ایراد در شعبه دیوان عالی کشور به عمل میآید .هرگاه شعبه دیوان درخواست رد را وارد بداند ،پرونده جهت رسیدگی به دادگاه همعرض ارجاع میشود متن سابق ماده « :۴۲۵ در مواردی که دادگاه با تعدد قاضی تشکیل میشود ،هرگاه نسبت به یکی از اعضاء ایراد رد شود و آن عضو از رسیدگی امتناع کند ،دادگاه با حضور عضو دیگر تکمیل میشود و مبادرت به رسیدگی میکند .چنانچه ایراد رد مورد پذیرش قرار نگیرد ،همان دادگاه بدون حضور عضو مورد ایراد در وقت اداری به اعتراض رسیدگی و قرار رد یا قبول ایراد را صادر میکند .هرگاه چند نفر از اعضای دادگاه مورد ایراد واقع شوند و ایراد رد را قبول نکنند ،چنانچه تعداد اعضای باقیمانده شعبه اکثریت را تشکیل دهند ،اکثریت اعضاء ،بدون حضور اعضای مورد ایراد و در وقت اداری به اعتراض رسیدگی و قرار رد یا قبول ایراد را صادر میکنند .هرگاه تعداد باقیمانده اعضای شعبه در اکثریت نباشند و امکان انتخاب اعضای علیالبدل نیز برای رسیدگی به ایراد وجود نداشته باشد ،رسیدگی به ایراد در شعبه دیوان عالی کشور به عمل میآید .هرگاه شعبه دیوان درخواست رد را وارد بداند ،پرونده جهت رسیدگی به دادگاه همعرض ارجاع میشود».", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 426, "category": "other", "chapter": "", "text": "دادگاه تجدیدنظر استان مرجع صالح برای رسیدگی به درخواست تجدیدنظر از کلیه آرای غیر قطعی کیفری است ،جز در مواردی که در صلاحیت دیوان عالی کشور باشد .دادگاه تجدیدنظر استان در مرکز هر استان تشکیل میشود .این دادگاه دارای رئیس و دو مستشار است ،دادگاه تجدیدنظر و شعب دیوان عالی کشور با دو عضو نیز رسمیت دارند. متن سابق ماده « :۴۲۶ دادگاه تجدیدنظر استان مرجع صالح برای رسیدگی به درخواست تجدیدنظر از کلیه آراء غیرقطعی کیفری است جز در مواردیکه در صلاحیت دیوان عالی کشور باشد .دادگاه تجدیدنظر استان در مرکز هر استان ،با حضور رئیس یا دادرس علیالبدل و عضویت دو مستشار تشکیل میشود».", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 427, "category": "tajdidnazar", "chapter": "بخش چهارم - تجدیدنظر، فرجام و اعاده دادرسی", "text": "آرای دادگاههای کیفری جز در موارد زیر که قطعی محسوب می شود ،حسب مورد در دادگاه تجدیدنظر استان همان حوزه قضایی قابل تجدیدنظر و یا در دیوان عالی کشور قابل فرجام است: الف -جرایم تعزیری درجه هشت باشد. ب -جرایم مستلزم پرداخت دیه یا ارش ،در صورتی که میزان یا جمع آنها کمتر از یکدهم دیه کامل باشد. تبصره –۱ در مورد مجازات های جایگزین حبس ،معیار قابلیت تجدیدنظر ،همان مجازات قانونی اولیه است. تبصره –۲ آرای قابل تجدیدنظر ،اعم از محکومیت ،برائت ،یا قرارهای منع و موقوفی تعقیب ،اناطه و تعویق صدور حکم است .قرار رد درخواست واخواهی یا تجدیدنظرخواهی ،در صورتی مشمول این حکم است که رأی راجع به اصل دعوی ،قابل تجدیدنظرخواهی باشد.", "explanation": "اصل بر قابل تجدیدنظر بودن آرای دادگاه‌های کیفری است؛ فقط دو استثنا وجود دارد که رأی قطعی محسوب می‌شود: جرایم تعزیری درجهٔ هشت، و جرایم مستلزم دیه یا ارش کمتر از یک‌دهم دیهٔ کامل.", "notes": ["استثناهای قطعیت: تعزیر درجهٔ هشت (سبک‌ترین درجه) و دیه/ارش کمتر از یک‌دهم دیهٔ کامل."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۴۲۷ قانون آیین دادرسی کیفری، آرای مربوط به کدام درجهٔ مجازات تعزیری، قطعی محسوب می‌شود؟", "options": ["درجهٔ یک", "درجهٔ چهار", "درجهٔ هشت", "درجهٔ شش"], "correct": 2, "explain": "بند «الف» ماده ۴۲۷ جرایم تعزیری درجهٔ هشت را از موارد قطعیت رأی (غیرقابل تجدیدنظر) می‌داند."}]}, {"article": 428, "category": "tajdidnazar", "chapter": "بخش چهارم - تجدیدنظر، فرجام و اعاده دادرسی", "text": "آرای صادره درباره جرایمی که مجازات قانونی آنها سلب حیات ،قطع عضو ،حبس ابد و یا تعزیر درجه سه و بالاتر است و جنایات عمدی علیه تمامیت جسمانی که میزان دیه آن ها نصف دیه کامل یا بیش از آن است و آرای صادره درباره جرایم سیاسی و مطبوعاتی ،قابل فرجامخواهی در دیوان عالی کشور است. متن سابق ماده « :۴۲۸ آراء صادره درباره جرائمی که مجازات قانونی آنها سلب حیات ،قطع عضو ،حبس ابد و یا تعزیر درجه چهار و بالاتر است و جنایات عمدی علیه تمامیت جسمانی که میزان دیه آنها ثلث دیه کامل مجنیعلیه یا بیش از آن است و آراء صادره درباره جرائم سیاسی و مطبوعاتی ،قابل فرجام خواهی در دیوان عالی کشور است». تبصره (الحاقی –)۱۳۹۴٫۳٫۲۴ اجرای این ماده مانع از انجام سایر وظایف نظارتی دیوان عالی کشور به شرح مقرر در اصل یکصد و شصت و یکم ( )۱۶۱ قانون اساسی نمیباشد.", "explanation": "فرجام‌خواهی در دیوان عالی کشور فقط نسبت به آرای مربوط به جرایم بسیار شدید امکان‌پذیر است: مجازات سلب حیات، قطع عضو، حبس ابد، تعزیر درجهٔ سه و بالاتر، جنایات عمدی با دیهٔ نصف دیهٔ کامل یا بیشتر، و جرایم سیاسی و مطبوعاتی.", "notes": ["فرجام‌خواهی محدود به شدیدترین دسته از جرایم است؛ برخلاف تجدیدنظرخواهی که دامنهٔ وسیع‌تری دارد."], "difficulty": "hard", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۴۲۸ قانون آیین دادرسی کیفری، آرای مربوط به کدام جرایم قابل فرجام‌خواهی در دیوان عالی کشور است؟", "options": ["تمام جرایم تعزیری بدون استثنا", "فقط جرایم موجب سلب حیات، قطع عضو، حبس ابد، تعزیر درجهٔ سه و بالاتر و جرایم سیاسی/مطبوعاتی", "فقط جرایم مالی", "فقط جرایم رانندگی"], "correct": 1, "explain": "متن ماده دقیقاً همین دسته از جرایم شدید و جرایم سیاسی/مطبوعاتی را مشمول فرجام‌خواهی می‌داند."}]}, {"article": 429, "category": "other", "chapter": "", "text": "در مواردی که رأی دادگاه توأم با محکومیت به پرداخت دیه ،ارش یا ضرر و زیان است ،هرگاه یکی از جنبههای مزبور قابل تجدیدنظر یا فرجام باشد ،جنبههای دیگر رأی نیز به تبع آن ،حسب مورد قابل تجدیدنظر یا فرجام است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 430, "category": "other", "chapter": "", "text": "در صورتی که طرفین دعوی با توافق کتبی حق تجدیدنظر یا فرجامخواهی خود را ساقط کنند ،تجدیدنظر یا فرجامخواهی آنان جز در خصوص صلاحیت دادگاه یا قاضی صادرکننده رأی ،مسموع نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 431, "category": "other", "chapter": "", "text": "مهلت درخواست یا دادخواست تجدیدنظر و فرجام برای اشخاص مقیم ایران بیست روز و برای اشخاص مقیم خارج از کشور دو ماه از تاریخ ابلاغ رأی یا انقضای مهلت واخواهی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 432, "category": "other", "chapter": "", "text": "هرگاه تقاضای تجدیدنظر یا فرجام ،خارج از مهلت مقرر تقدیم شود و درخواستکننده عذر موجهی عنوان کند ،دادگاه صادرکننده رأی ابتدا به عذر او رسیدگی می نماید و در صورت موجه شناختن آن ،قرار قبولی درخواست و در غیر این صورت قرار رد آن را صادر میکند .جهات عذرموجه همان است که در ماده ( )۱۷۸ این قانون مقرر شده است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 433, "category": "other", "chapter": "", "text": "اشخاص زیر حق درخواست تجدیدنظر یا فرجام دارند: الف -محکومعلیه ،وکیل یا نماینده قانونی او ب -شاکی یا مدعی خصوصی و یا وکیل یا نماینده قانونی آنان پ -دادستان از جهت برائت متهم ،عدم انطباق رأی با قانون و یا عدم تناسب مجازات", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 434, "category": "other", "chapter": "", "text": "جهات تجدیدنظرخواهی به شرح زیر است: الف -ادعای عدم اعتبار ادله یا مدارک استنادی دادگاه ب -ادعای مخالف بودن رأی با قانون پ -ادعای عدم صلاحیت دادگاه صادرکننده رأی یا وجود یکی از جهات رد دادرس ت -ادعای عدم توجه دادگاه به ادله ابرازی تبصره -اگر تجدیدنظرخواهی به استناد یکی از جهات مذکور در این ماده به عمل آید ،در صورت وجود جهت دیگر ،به آن هم رسیدگی میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 435, "category": "tajdidnazar", "chapter": "بخش چهارم - تجدیدنظر، فرجام و اعاده دادرسی", "text": "دادگاه تجدیدنظر استان و دیوان عالی کشور فقط نسبت به آنچه مورد تجدیدنظرخواهی یا فرجامخواهی واقع و نسبت به آن رأی صادر شده است ،رسیدگی میکند.", "explanation": "دادگاه تجدیدنظر استان و دیوان عالی کشور فقط نسبت به همان بخش‌هایی از رأی که مورد تجدیدنظرخواهی یا فرجام‌خواهی قرار گرفته رسیدگی می‌کنند، نه کل پرونده به‌طور خودکار.", "notes": ["اصل «محدودهٔ رسیدگی تجدیدنظر»: فقط همان قسمت اعتراض‌شده بررسی می‌شود."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۴۳۵ قانون آیین دادرسی کیفری، دادگاه تجدیدنظر استان نسبت به چه بخشی از رأی رسیدگی می‌کند؟", "options": ["کل پرونده، حتی بخش‌های مورد اعتراض قرار نگرفته", "فقط همان بخشی که مورد تجدیدنظرخواهی واقع شده است", "فقط بخش‌های مالی پرونده", "هیچ محدودیتی ندارد"], "correct": 1, "explain": "متن ماده رسیدگی را محدود به همان قسمت مورد تجدیدنظرخواهی یا فرجام‌خواهی کرده است."}]}, {"article": 436, "category": "other", "chapter": "", "text": "تجدیدنظرخواهی یا فرجام خواهی طرفین راجع به جنبه کیفری رأی با درخواست کتبی و پرداخت هزینه دادرسی مقرر صورت می گیرد و نسبت به ضرر و زیان ناشی از جرم ،مستلزم تقدیم دادخواست و پرداخت هزینه دادرسی مطابق قانون آیین دادرسی مدنی است. تبصره -تجدیدنظرخواهی یا فرجامخواهی محکوم علیه نسبت به محکومیت کیفری و ضرر و زیان ناشی از جرم به صورت توأمان، مستلزم پرداخت هزینه دادرسی در امر حقوقی و رعایت تشریفات آیین دادرسی مدنی نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 437, "category": "other", "chapter": "", "text": "هرگاه تجدیدنظرخواه یا فرجامخواه ،مدعی اعسار از پرداخت هزینه دا درسی دعوای ضرر و زیان ناشی از جرم شود، دادگاه صادرکننده رأی نخستین به این ادعا خارج از نوبت رسیدگی میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 438, "category": "other", "chapter": "", "text": "هرگاه تجدیدنظرخواه یا فرجام خواه زندانی باشد ،حسب مورد از پرداخت هزینه دادرسی مرحله تجدیدنظر یا فرجام در امری که به موجب آن زندانی است ،معاف میگردد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 439, "category": "other", "chapter": "", "text": "تجدیدنظرخواه یا فرجام خواه باید حسب مورد ،درخواست یا دادخواست خود را به دفتر دادگاه صادرکننده رأی نخستین یا تجدیدنظر و یا دفتر زندان تسلیم کند .دفتر دادگاه یا زندان باید بلافاصله آن را ثبت کند و رسیدی مشتمل بر نام تجدیدنظرخواه یا فرجام خواه و طرف دعوای او ،تاریخ تسلیم و شماره ثبت به تقدیم کننده بدهد و همان شماره و تاریخ را در دادخواست یا درخواست تجدیدنظر و فرجام درج کند .تاریخ مزبور تاریخ تجدیدنظر یا فرجامخواهی محسوب میشود .دفتر دادگاه تجدیدنظر استان یا زندان مکلف است پس از ثبت تقاضای تجدیدنظر یا فرجام ،بلافاصله آن را به دادگاه صادرکننده رأی نخستین ارسال کند. تبصره -در صورتی که تجدیدنظرخواهی یا فرجام خواهی در مهلت مقرر صورت گیرد ،دفتر دادگاه صادرکننده رأی نخستین ،بلافاصله یا پس از رفع نقص ،پرونده را حسب مورد ،به دادگاه تجدیدنظر استان یا دیوان عالی کشور ارسال میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 440, "category": "other", "chapter": "", "text": "هرگاه درخواست یا دادخواست تجدیدنظرخواهی یا فرجام خواهی فاقد یکی از شرایط قانونی باشد ،مدیر دفتر دادگاه نخستین ،ظرف دو روز ،نقایص آن را به درخواستکننده یا دادخواست دهنده اعلام و اخطار میکند تا ظرف ده روز از تاریخ ابلاغ، نقایص مذکور را رفع کند .چنانچه در مهلت مقرر ،رفع نقص صورت نگیرد و در صورتی که درخواست یا دادخواست تجدیدنظر یا فرجام خارج از مهلت قانونی تقدیم شود ،مدیر دفتر ،پرونده را به نظر رئیس دادگاه می رساند تا قرار مقتضی را صادر کند .این قرار حسب مورد قابل اعتراض در دادگاه تجدیدنظر استان و یا دیوان عالی کشور است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 441, "category": "other", "chapter": "", "text": "هرگاه تجدیدنظرخواه یا فرجام خواه درخواست یا دادخواست تجدیدنظر یا فرجام را مسترد کند ،دادگاه صادرکننده رأی نخستین ،قرار رد درخواست یا ابطال دادخواست تجدیدنظر یا فرجام را صادر میکند .چنانچه پرونده به مرجع تجدیدنظر یا فرجام ارسال شده باشد ،قرار رد درخواست یا ابطال دادخواست تجدیدنظر یا فرجام توسط دادگاه تجدیدنظر استان یا دیوان عالی کشور صادر می شود .در هر حال ،درخواست یا دادخواست تجدیدنظر یا فرجام مجدد ،پذیرفته نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 442, "category": "other", "chapter": "", "text": "در تمام محکومیتهای تعزیری در صورتی که دادستان از حکم صادره درخواست تجدیدنظر نکرده باشد ،محکومعلیه می تواند پیش از پایان مهلت تجدیدنظرخواهی با رجوع به دادگاه صادرکننده حکم ،حق تجدیدنظرخواهی خود را اسقاط یا درخواست تجدیدنظر را مسترد نماید و تقاضای تخفیف مجازات کند .در این صورت ،دادگاه در وقت فوقالعاده با حضور دادستان به موضوع رسیدگی و تا یک چهارم مجازات تعیینشده را کسر میکند .این حکم دادگاه قطعی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 443, "category": "other", "chapter": "", "text": "آرائی که در مرحله تجدیدنظر صادر میشود ،قطعی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 444, "category": "other", "chapter": "", "text": "مرجع رسیدگی به درخواست تجدیدنظر از آرا و تصمیمات دادگاه اطفال و نوجوانان ،شعبهای از دادگاه تجدیدنظر استان است که مطابق با شرایط مقرر در این قانون و با ابلاغ رئیس قوه قضائیه تعیین میگردد .مرجع فرجامخواهی از آرا و تصمیمات دادگاه کیفری یک ویژه رسیدگی به جرایم اطفال و نوجوانان ،دیوان عالی کشور است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 445, "category": "other", "chapter": "", "text": "آرای دادگاه اطفال و نوجوانان در تمامی موارد قابل تجدیدنظرخواهی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 446, "category": "other", "chapter": "", "text": "درخواست تجدیدنظر از آرا و تصمیمات دادگاه اطفال و نوجوانان را می توان به دفتر دادگاه صادرکننده حکم یا دفتر دادگاه تجدیدنظر استان یا چنانچه طفل یا نوجوان در کانون اصلاح و تربیت نگهداری می شود به دفتر کانون اصلاح و تربیت تسلیم نمود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 447, "category": "other", "chapter": "", "text": "درخواست تجدیدنظر از آرا و تصمیمات دادگاه اطفال و نوجوانان می تواند توسط نوجوان یا ولی یا سرپرست قانونی طفل یا نوجوان و یا وکیل آنان به عمل آید .دادستان نیز هرگاه آرا و تصمیمات دادگاه را مخالف قانون بداند میتواند درخواست تجدیدنظر نماید .مدعی خصوصی می تواند فقط از حکم مربوط به ضرر و زیان یا برائت یا قرار منع یا موقوفی یا تعلیق تعقیب و یا قرار بایگانی کردن پرونده تجدیدنظرخواهی کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 448, "category": "other", "chapter": "", "text": "پروندهها پس از وصول به دادگاه تجدیدنظر استان به ترتیب در دفتر کل یا در صورت تأسیس واحد رایانه و رعایت مقررات راجع به دادرسی الکترونیکی در این واحد ثبت می شود و با رعایت ترتیب شعب دادگاه ،به وسیله رئیس کل دادگستری استان یا معاون او و یا یکی از رؤسای شعب به انتخاب وی با رعایت تخصص شعب و ترتیب وصول از طریق سامانه رایانهای در حوزههای قضایی که سامانه رایانهای دارند ،ارجاع میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 449, "category": "other", "chapter": "", "text": "دادگاه به ترتیب وصول پروندهها به نوبت رسیدگی می کند ،مگر در مواردی که به موجب قانون ،رسیدگی خارج از نوبت ضروری باشد. تبصره -به جرایمی که موجب جریحه دار شدن احساسات عمومی شود ،با درخواست دادستان صادرکننده کیفرخواست و موافقت دادگاه تجدیدنظر استان ،خارج از نوبت رسیدگی میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 450, "category": "tajdidnazar", "chapter": "بخش چهارم - تجدیدنظر، فرجام و اعاده دادرسی", "text": "رئیس شعبه ،پرونده های ارجاعی را بررسی و گزارش جامع آن را تهیه می کند و یا به نوبت به یکی از اعضای دادگاه تجدیدنظر استان ارجاع می دهد .این عضو ،گزارش پرونده را که متضمن جریان آن و بررسی کامل در خصوص تجدیدنظرخواهی و جهات قانونی آن است ،تهیه و در جلسه دادگاه قرائت میکند. خلاصه این گزارش در پرونده درج می شود و سپس دادگاه به شرح زیر اتخاذ تصمیم مینماید: الف -در صورتی که تحقیقات ناقص باشد ،قرار رفع نقص صادر میکند و پرونده را نزد دادسرای صادرکننده کیفرخواست یا دادگاه صادرکننده رأی می فرستد تا پس از انجام دستور دادگاه تجدیدنظر استان ،آن را بدون اظهار نظر اعاده کند و یا دادگاه تجدیدنظر میتواند خود مبادرت به انجام تحقیقات نماید. ب -هرگاه رأی صادره از نوع قرار باشد و تحقیقات یا اقدامات دیگر ضروری نباشد و قرار مطابق مقررات صادر شده باشد ،آن را تأیید و پرونده به دادگاه صادرکننده قرار اعاده می شود و چنانچه به هر علت دادگاه تجدیدنظر عقیده به نقض داشته باشد ،پرونده برای رسیدگی به دادگاه صادرکننده قرار اعاده میشود و آن دادگاه ،مکلف است خارج از نوبت رسیدگی کند. پ -هرگاه رأی توسط دادگاهی که صلاحیت ذاتی یا محلی ندارد صادر شود ،دادگاه تجدیدنظر استان ،رأی را نقض و پرونده را به مرجع صالح ارسال و مراتب را به دادگاه صادرکننده رأی اعلام میکند. ت -اگر عملی که محکوم علیه به اتهام ارتکاب آن محکوم شده به فرض ثبوت ،جرم نبوده یا به لحاظ شمول عفو عمومی و یا سایر جهات قانونی متهم قابل تعقیب نباشد ،رأی مقتضی صادر میکند. ث -در غیر از موارد مذکور در بندهای فوق ،هرگاه جرم از جرایم مستوجب مجازاتهای حدود ،قصاص و جرایم غیر عمدی مستوجب بیش از نصف دیه و یا جرایم تعزیری درجه چهار و پنج باشد به طور مطلق و در جرایم تعزیری درجه شش و هفت در صورت محکومیت به حبس و در سایر جرایم در صورت اقتضا ،دادگاه تجدیدنظر با صدور دستور تعیین وقت رسیدگی ،طرفین و اشخاصی را که حضورشان ضروری است احضار میکند .طرفین میتوانند شخصا ً حاضر شوند یا وکیل معرفی کنند .در هر حال عدم حضور یا عدم معرفی وکیل مانع از رسیدگی نیست.", "explanation": "رئیس شعبهٔ تجدیدنظر، پرونده‌های ارجاعی را بررسی کرده یا به نوبت به یکی از اعضا ارجاع می‌دهد؛ آن عضو گزارش کاملی از جریان پرونده و جهات قانونی تجدیدنظرخواهی تهیه و در جلسه قرائت می‌کند و خلاصهٔ آن در پرونده ثبت می‌شود.", "notes": ["فرایند رسیدگی تجدیدنظر با تهیهٔ گزارش مکتوب توسط یکی از اعضا و قرائت آن در جلسه آغاز می‌شود."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۴۵۰ قانون آیین دادرسی کیفری، گزارش پرونده در دادگاه تجدیدنظر توسط چه کسی تهیه می‌شود؟", "options": ["فقط رئیس شعبه شخصاً", "رئیس شعبه یا یکی از اعضا که پرونده به او ارجاع شده", "وکیل متهم", "شاکی"], "correct": 1, "explain": "متن ماده این گزارش را وظیفهٔ رئیس شعبه یا عضو ارجاع‌شده می‌داند."}]}, {"article": 451, "category": "other", "chapter": "", "text": "در مواردی که رسیدگی در دادگاه تجدیدنظر استان ،مستلزم تعیین وقت و احضار طرفین است ،رسیدگی با حضور دادستان شهرستان مرکز استان یا یکی از معاونان یا دادیاران وی و با رعایت ماده ( )۳۰۰ این قانون به ترتیب زیر انجام میشود: الف -قرائت گزارش پرونده و تحقیقات و اقدامات انجامشده توسط یکی از اعضای دادگاه ب -طرح سؤالات لازم و تحقیق از طرفین توسط رئیس یا مستشار و استماع دفاعیات آنان پ -کسب اطلاع از شهود و مطلعان در صورت لزوم ت -اظهار عقیده دادستان یا نماینده او و استماع اظهارات شاکی یا مدعی خصوصی و آخرین دفاعیات متهم یا وکلای آنان", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 452, "category": "other", "chapter": "", "text": "قرار معاینه محل و تحقیق محلی توسط رئیس دادگاه یا با تعیین او توسط یکی از مستشاران شعبه اجرا میشود .چنانچه محل اجرای قرار ،خارج از حوزه قضایی مرکز استان باشد ،دادگاه تجدیدنظر استان میتواند اجرای قرار را از دادگاه محل مربوط درخواست کند و در صورتی که محل اجرای قرار در حوزه قضایی استان دیگری باشد ،با اعطای نیابت قضایی به دادگاه نخستین محل ،درخواست اجرای قرار نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 453, "category": "other", "chapter": "", "text": "هرگاه دادگاه تجدیدنظر استان ،حضور شخصی را که زندانی است لازم بداند ،دستور اعزام او را به مسؤول زندان یا بازداشتگاه صادر می کند .چنانچه زندان یا بازداشتگاه در محل دیگری باشد ،دادگاه میتواند با کسب موافقت مرجع قضایی که متهم تحت نظر وی زندانی است ،دستور دهد که متهم زندانی به طور موقت تا پایان رسیدگی در زندان نزدیک محل دادگاه نگهداری شود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 454, "category": "other", "chapter": "", "text": "احضار ،جلب ،رسیدگی به ادله ،صدور رأی و سایر ترتیبات در دادگاه تجدیدنظر استان مطابق قواعد و مقررات مرحله نخستین است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 455, "category": "other", "chapter": "", "text": "دادگاه تجدیدنظر استان پس از تشکیل جلسه رسیدگی و اعلام ختم دادرسی به شرح زیر اتخاذ تصمیم میکند: الف -هرگاه رأی مورد تجدیدنظرخواهی مطابق ادله موجود در پرونده و طبق قانون صادر شده باشد رأی را تأیید و پرونده را به دادگاه صادرکننده رأی اعاده میکند. ب -هرگاه متهم به جهات قانونی قابل تعقیب نباشد یا دادگاه تجدیدنظر استان ،به هر دلیل ،برائت متهم را احراز کند ،رأی تجدیدنظر خواسته را نقض و رأی مقتضی صادر میکند ،هرچند محکومعلیه درخواست تجدیدنظر نکرده باشد و چنانچه محکومعلیه زندانی باشد ،به دستور دادگاه فوری آزاد میشود. پ -چنانچه رأی تجدیدنظر خواسته را مخالف قانون تشخیص دهد با استدلال و ذکر مبانی و مستند قانونی ،آن را نقض و در ماهیت ،انشای رأی میکند. تبصره -عدم رعایت تشریفات دادرسی ،موجب نقض رأی نیست ،مگر آنکه تشریفات مذکور به درجهای از اهمیت باشد که موجب بیاعتباری رأی شود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 456, "category": "other", "chapter": "", "text": "هرگاه از رأی صادره درخواست تجدیدنظر شود و از متهم تأمین اخذ نشده باشد یا قرار تأمین با جرم و ضرر و زیان مدعی خصوصی متناسب نباشد ،دادگاه تجدیدنظر استان در صورت اقتضا رأسا ً یا به درخواست دادستان ،شاکی یا مدعی خصوصی و یا متهم ،تأمین متناسب اخذ میکند و این تصمیم قطعی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 457, "category": "other", "chapter": "", "text": "اگر رأی تجدیدنظر خواسته از نظر تعیین مشخصات طرفین یا تعیین نوع و میزان مجازات ،تطبیق عمل با قانون، احتساب محکوم به یا خسارت و یا مواردی نظیر آن ،متضمن اشتباهی باشد که به اساس رأی ،لطمه وارد نسازد ،دادگاه تجدیدنظر استان ،رأی را اصلاح و آن را تأیید میکند و تذکر لازم را به دادگاه نخستین میدهد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 458, "category": "other", "chapter": "", "text": "دادگاه تجدیدنظر استان نمی تواند مجازات تعزیری یا اقدامات تأمینی و تربیتی مقرر در حکم تجدیدنظر خواسته را تشدید کند ،مگر در مواردی که مجازات مقرر در حک م نخستین برخلاف جهات قانونی ،کمتر از حداقل میزانی باشد که قانون مقرر داشته و این امر مورد تجدیدنظرخواهی شاکی و یا دادستان قرار گرفته باشد .در این موارد ،دادگاه تجدیدنظر استان با تصحیح حکم ،نسبت به تعیین حداقل مجازاتی که قانون مقرر داشته است ،اقدام میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 459, "category": "other", "chapter": "", "text": "هرگاه دادگاه تجدیدنظر استان ،محکومعلیه را مستحق تخفیف مجازات بداند ،ضمن تأیید اساس حکم میتواند به نحو مستدل مجازات او را در حدود قانون تخفیف دهد ،هرچند محکومعلیه تقاضای تجدیدنظر نکرده باشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 460, "category": "other", "chapter": "", "text": "دادگاه تجدیدنظر استان مکلف است پس از ختم رسیدگی ،در همان جلسه و در صورت عدم امکان در اولین فرصت و حداکثر ظرف یک هفته ،انشای رأی کند .تخلف از صدور رأی در مهلت مقرر موجب محکومیت انتظامی تا درجه چهار است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 461, "category": "other", "chapter": "", "text": "در مواردی که رأی دادگاه تجدیدنظر استان بر محکومیت متهم باشد و متهم و یا وکیل او در هیچ یک از مراحل دادرسی نخستین و تجدیدنظر حاضر نبوده و لایحه دفاعیه یا اعتراضیه هم نداده باشد ،رأی دادگاه تجدیدنظر استان ظرف بیست روز پس از ابلاغ واقعی به متهم یا وکیل او ،قابل واخواهی و رسیدگی در همان دادگاه است .رأیی که در این مرحله صادر میشود ،قطعی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 462, "category": "other", "chapter": "", "text": "دیوان عالی کشور در تهران مستقر است و شعب آن از رئیس و دو مستشار تشکیل میشود و مرجع فرجامخواهی در جرایم موضوع ماده ( )۴۲۸ این قانون است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 463, "category": "other", "chapter": "", "text": "دیوان عالی کشور به تعداد لازم ،عضو معاون دارد که میتوانند وظایف مستشار یا رئیس را بر عهده گیرند. متن سابق ماده « :۴۶۳ دیوان عالی کشور به تعداد لازم عضو معاون دارد که میتوانند وظایف مستشار را بر عهده گیرند».", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 464, "category": "other", "chapter": "", "text": "جهات فرجامخواهی به قرار زیر است: الف -ادعای عدم رعایت قوانین مربوط به تقصیر متهم و مجازات قانونی او ب -ادعای عدم رعایت اصول دادرسی با درجهای از اهمیت منجر به بیاعتباری رأی دادگاه پ -عدم انطباق مستندات با مدارک موجود در پرونده", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 465, "category": "other", "chapter": "", "text": "پرونده ها به ترتیب وصول ،در دفتر کل یا در صورت تأسیس واحد رایانه در این واحد با رعایت مقررات راجع به دادرسی الکترونیکی ثبت می شود و توسط رئیس دیوان یا معاون او و در غیاب آنان ،توسط یکی از رؤسای شعب دیوان به انتخاب رئیس دیوان عالی کشور و از طریق سامانه رایانهای با رعایت تخصص شعب و ترتیب وصول ،به یکی از شعب دیوان ارجاع میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 466, "category": "other", "chapter": "", "text": "شعب دیوان عالی کشور به نوبت به پروندهها رسیدگی میکنند ،مگر در مواردی که به موجب قانون ،رسیدگی خارج از نوبت مقرر باشد یا در جرایمی که به تشخیص رئیس دیوان عالی کشور موجب جریحهدار شدن احساسات عمومی شود و رسیدگی خارج از نوبت ضرورت داشته باشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 467, "category": "other", "chapter": "", "text": "رئیس شعبه ،پروندههای ارجاعی را خود بررسی و گزارش جامع آنها را تنظیم میکند و یا به نوبت به یکی از اعضای شعبه به عنوان عضو ممیز ارجاع می دهد .عضو ممیز ،گزارش پرونده را که متضمن جریان آن و بررسی کامل درباره فرجامخواهی و جهات قانونی آن است به صورت مستدل تهیه و به رئیس شعبه تسلیم میکند. تبصره -هرگاه رئیس یا عضو ممیز در حین تنظیم گزارش از هر یک از قضاتی که در آن پرونده دخالت داشتهاند ،تخلف از مواد قانونی ،یا عدم رعایت مبانی قضایی و یا اعمال غرض مشاهده کند ،آن را به طور مشروح و با استدلال در گزارش خود متذکر میشود .به دستور رئیس شعبه ،رونوشتی از این گزارش برای دادستان انتظامی قضات ارسال میگردد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 468, "category": "other", "chapter": "", "text": "رسیدگی فرجامی در دیوان عالی کشور بدون احضار طرفین دعوی یا وکلای آنان انجام میشود ،مگر آنکه شعبه رسیدگیکننده حضور آنان را لازم بداند .عدم حضور احضارشوندگان موجب تأخیر در رسیدگی و اتخاذ تصمیم نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 469, "category": "other", "chapter": "", "text": "در موقع رسیدگی ،عضو ممیز ،گزارش پرونده و مفاد اوراقی را که لازم است قرائت میکند و طرفین یا وکلای آنان ،در صورت حضور ،می توانند با اجازه رئیس شعبه ،مطالب خود را اظهار دارند .همچنین دادستان کل یا نماینده وی با حضور در شعبه به طور مستدل ،مستند و مکتوب نسبت به نقض یا ابرام رأی معترضعنه یا فرجامخواسته ،نظر خود را اعلام میکند .سپس اعضای شعبه با توجه به محتویات پرونده و مفاد گزارش و مطالب اظهارشده ،با درج نظر دادستان کل کشور یا نماینده وی در متن دادنامه، به شرح زیر اتخاذ تصمیم میکنند: الف -اگر رأی مطابق قانون و ادله موجود در پرونده باشد با ابرام آن ،پرونده را به دادگاه صادرکننده رأی اعاده مینمایند. ب -هرگاه رأی مخالف قانون ،یا بدون توجه به ادله و مدافعات طرفین صادر شده باشد یا رعایت تشریفات قانونی نشده و آن تشریفات به درجهای از اهمیت باشد که موجب بی اعتباری رأی شود ،شعبه دیوان عالی کشور ،رأی را نقض و به شرح زیر اقدام میکند: -۱ اگر عملی که محکوم علیه به اتهام ارتکاب آن محکوم شده به فرض ثبوت ،جرم نبوده یا به لحاظ شمول عفو عمومی و یا سایر جهات قانونی متهم قابل تعقیب نباشد ،رأی صادره نقض بال ارجاع میشود. -۲ اگر رأی صادره از نوع قرار و یا حکمی باشد که به علت ناقص بودن تحقیقات نقض شده است ،برای رسیدگی مجدد به دادگاه صادر کننده رأی ارجاع میشود. -۳ اگر رأی به علت عدم صلاحیت ذاتی دادگاه نقض شود ،پرونده به مرجعی که دیوان عالی کشور ،صالح تشخیص میدهد ،ارسال میشود و مرجع مذکور مکلف به رسیدگی است. -۴ در سایر موارد ،پس از نقض رأی ،پرونده به دادگاه همعرض ارجاع میشود. تبصره -در مواردی که دیوان عالی کشور رأی را به علت نقص تحقیقات نقض میکند ،مکلف است تمام موارد نقص تحقیقات را به تفصیل ذکر کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 470, "category": "other", "chapter": "", "text": "مرجع رسیدگی پس از نقض رأی در دیوان عالی کشور به شرح زیر اقدام میکند: الف -در صورت نقض رأی به علت ناقص بودن تحقیقات ،باید تحقیقات مورد نظر دیوان عالی کشور را انجام دهد و سپس مبادرت به صدور رأی کند. ب -در صورت نقض قرار و ضرورت رسیدگی ماهوی ،باید از نظر دیوان عالی کشور متابعت نماید و در ماهیت ،رسیدگی و انشای حکم کند ،مگر آنکه پس از نقض ،جهت تازهای برای صدور قرار حادث شود. پ -در صورت نقض حکم در غیر موارد مذکور ،دادگاه می تواند بر مفاد رأی دادگاه قبلی اصرار کند .چنانچه این حکم مورد فرجامخواهی واقع شود و شعب ه دیوان عالی کشور پس از بررسی ،استدلال دادگاه را بپذیرد ،حکم را ابرام میکند و در غیر این صورت ،پرونده در هیئت عمومی شعب کیفری مطرح می شود .هرگاه نظر دادگاه صادرکننده رأی مورد تأیید قرار گیرد ،رأی ابرام میشود و در صورتی که نظر شعبه دیوان عالی کشور را تأیید کند ،حکم صادره نقض و پرونده به شعبه دیگر دادگاه ارجاع میشود. دادگاه مزبور بر اساس استدلال هیئت عمومی دیوان عالی کشور ،حکم صادر می کند .این حکم قطعی و غیرقابل فرجام است .در صورتی که هیئت عمومی پرونده را به علت نقص تحقیقات قابل رسیدگی نداند با ذکر موارد نقص ،پرونده را به شعبه دیوان عالی کشور اعاده مینماید .شعبه دیوان مطابق قسمت ( )۲ بند (ب) ماده ( )۴۶۹ اقدام میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 471, "category": "other", "chapter": "", "text": "هرگاه از شعب مختلف دیوان عالی کشور یا دادگاه ها نسبت به موارد مشابه ،اعم از حقوقی ،کیفری و امور حسبی ،با استنباط متفاوت از قوانین ،آرای مختلفی صادر شود ،رئیس دیوان عالی کشور یا دادستان کل کشور ،به هر طریق که آگاه شوند، مکلفند نظر هیئت عمومی دیوان عالی کشور را به منظور ایجاد وحدت رویه درخواست کنند .هر یک از قضات شعب دیوان عالی کشور یا دادگاهها یا دادستانها یا وکلای دادگستری نیز میتوان ند با ذکر دلیل از طریق رئیس دیوان عالی کشور یا دادستان کل کشور ،نظر هیئت عمومی را درباره موضوع درخواست کنند .هیئت عمومی دیوان عالی کشور به ریاست رئیس دیوان عالی یا معاون وی و با حضور دادستان کل کشور یا نماینده او و حداقل سه چهارم رؤسا و مستشاران و اعضای معاون تمام شعب تشکیل میشود تا موضوع مورد اختلاف را بررسی و نسبت به آن اتخاذ تصمیم کنند .رأی اکثریت در موارد مشابه برای شعب دیوان عالی کشور و دادگاهها و سایر مراجع ،اعم از قضایی و غیر آن لازم االتباع است؛ اما نسبت به رأی قطعی شده بیاثر است. در صورتی که رأی ،اجرا نشده یا در حال اجرا باشد و مطابق رأی وحدت رویه هیئت عمومی دیوان عالی کشور ،عمل انتسابی جرم شناخته نشود یا رأی به جهاتی مساعد به حال محکوم علیه باشد ،رأی هیئت عمومی نسبت به آرای مذکور قابل تسری است و مطابق مقررات قانون مجازات اسلامی عمل میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 472, "category": "other", "chapter": "", "text": "در کلیه مواردی که هیئت عمومی دیوان عالی کشور به منظور ایجاد وحدت رویه قضایی و یا رسیدگی به آرای اصراری و یا انجام سایر وظایف قانونی تشکیل می گردد ،باید با حضور دادستان کل یا نماینده وی باشد .قبل از اتخاذ تصمیم ،دادستان کل یا نماینده وی اظهارنظر میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 473, "category": "other", "chapter": "", "text": "آرای وحدت رویه هیئت عمومی دیوان عالی کشور ،فقط به موجب قانون یا رأی وحدت رویه مؤخری که مطابق ماده ( )۴۷۱ این قانون صادر میشود ،قابل تغییر است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 474, "category": "tajdidnazar", "chapter": "بخش چهارم - تجدیدنظر، فرجام و اعاده دادرسی", "text": "درخواست اعاده دادرسی در مورد احکام محکومیت قطعی دادگاهها اعم از آنکه حکم مذکور به اجرا گذاشته شده یا نشده باشد در موارد زیر پذیرفته میشود: الف -کسی به اتهام قتل شخصی محکوم شود و سپس زنده بودن وی محرز گردد. ب -چند نفر به اتهام ارتکاب جرمی محکوم شوند و ارتکاب آن جرم به گونهای باشد که نتوان بیش از یک مرتکب برای آن قائل شد. پ -شخصی به علت انتساب جرمی محکوم شود و فرد دیگری نیز به موجب حکمی از مرجع قضایی به علت انتساب همان جرم محکوم شده باشد ،به طوری که از تعارض و تضاد مفاد دو حکم ،بیگناهی یکی از آنان احراز گردد. ت -درباره شخصی به اتهام واحد ،احکام متفاوتی صادر شود. ث -در دادگاه صالح ثابت شود که اسناد جعلی یا شهادت خلاف واقع گواهان ،مبنای حکم بوده است. ج -پس از صدور حکم قطعی ،واقعه جدیدی حادث و یا ظاهر یا ادله جدیدی ارائه شود که موجب اثبات بیگناهی محکومعلیه یا عدم تقصیر وی باشد. چ -عمل ارتکابی جرم نباشد و یا مجازات مورد حکم بیش از مجازات مقرر قانونی باشد.", "explanation": "این ماده موارد استثنایی «اعاده دادرسی» (بازگشایی پروندهٔ قطعی‌شده) را برمی‌شمرد: زنده بودن «مقتول»، محکومیت چند نفر برای جرمی که فقط یک مرتکب داشته، تعارض دو حکم متناقض، اسناد جعلی یا شهادت دروغ مبنای حکم، کشف دلیل جدید، یا اینکه عمل اصلاً جرم نبوده است.", "notes": ["اعاده دادرسی یک راه استثنایی برای نقض حکم قطعی است، نه یک مرحلهٔ عادی مثل تجدیدنظر یا فرجام."], "difficulty": "hard", "verified": true, "hasContent": true, "questions": [{"q": "کدام مورد زیر طبق ماده ۴۷۴ قانون آیین دادرسی کیفری، از موجبات اعاده دادرسی است؟", "options": ["نارضایتی محکوم‌علیه از شدت مجازات", "کسی به اتهام قتل شخصی محکوم شده و بعد زنده بودن او محرز شود", "تغییر وکیل محکوم‌علیه", "گذشت زمان طولانی از صدور حکم"], "correct": 1, "explain": "بند «الف» ماده ۴۷۴ دقیقاً همین مورد (زنده بودن مقتول پس از محکومیت به قتل او) را از موجبات اعاده دادرسی می‌داند."}]}, {"article": 475, "category": "other", "chapter": "", "text": "اشخاص زیر حق درخواست اعاده دادرسی دارند: الف -محکومعلیه یا وکیل یا نماینده قانونی او و در صورت فوت یا غیبت محکومعلیه ،همسر و وراث قانونی و وصی او ب -دادستان کل کشور پ -دادستان مجری حکم", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 476, "category": "other", "chapter": "", "text": "درخواست اعاده دادرسی به دیوان عالی کشور تسلیم میشود .این مرجع پس از احراز انطباق موضوع درخواست با یکی از موارد موضوع ماده ( )۴۷۴ این قانون ،با تجویز اعاده دادرسی ،رسیدگی مجدد را به دادگاه همعرض دادگاه صادرکننده حکم قطعی ،ارجاع میدهد و در غیر این صورت قرار رد اعاده دادرسی صادر مینماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 477, "category": "other", "chapter": "", "text": "در صورتی که رئیس قوه قضائیه رأی قطعی صادره از هریک از مراجع قضایی را خلاف شرع بین تشخیص دهد ،با تجویز اعاده دادرسی ،پرونده را به دیوان عالی کشور ارسال تا در شعبی خاص که توسط رئیس قوه قضائیه برای این امر تخصیص مییابد رسیدگی و رأی قطعی صادر نماید .شعب خاص مذکور مبنیا ً بر خلاف شرع بین اعلام شده ،رأی قطعی قبلی را نقض و رسیدگی مجدد اعم از شکلی و ماهوی به عمل میآورند و رأی مقتضی صادر مینمایند. تبصره –۱ آرای قطعی مراجع قضایی (اعم از حقوقی و کیفری) شامل احکام و قرارهای دیوان عالی کشور ،سازمان قضایی نیروهای مسلح ،دادگاههای تجدیدنظر و بدوی ،دادسراها و شوراهای حل اختلاف میباشند. تبصره –۲ آرای شعب دیوان عالی کشور در باب تجویز اعاده دادرسی و نیز دستورهای موقت دادگاهها ،اگر توسط رئیس قوه قضائیه خلاف شرع بین تشخیص داده شود ،مشمول احکام این ماده خواهد بود. تبصره –۳ در صورتی که رئیس دیوان عالی کشور ،دادستان کل کشور ،رئیس سازمان قضایی نیروهای مسلح و یا رئیس کل دادگستری استان در انجام وظایف قانونی خود ،رأی قطعی اعم از حقوقی یا کیفری را خلاف شرع بین تشخیص دهند ،میتوانند با ذکر مستندات از رئی س قوه قضائیه درخواست تجویز اعاده دادرسی نمایند .مفاد این تبصره فقط برای یک بار قابل اعمال است؛ مگر اینکه خلاف شرع بین آن به جهت دیگری باشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 478, "category": "other", "chapter": "", "text": "هرگاه رأی دیوان عالی کشور مبنی بر تجویز اعاده دادرسی باشد یا طبق ماده ( )۴۷۷ اعاده دادرسی پذیرفته شده باشد اجرای حکم تا صدور حکم مجدد به تعویق می افتد و چنانچه از متهم تأمین اخذ نشده و یا تأمین منتفی شده باشد یا متناسب نباشد ،دادگاهی که پس از تجویز اعاده دادرسی به موضوع رسیدگی میکند ،تأمین لازم را اخذ مینماید. تبصره (اصلاحی –)۱۳۹۴٫۳٫۲۴ در صورتی که مجازات مندرج در حکم ،از نوع مجازات سالب حیات یا سایر مجازاتهای بدنی یا قلع و قمع بنا باشد ،شعبه دیوان عالی کشور با وصول تقاضای اعاده دادرسی قبل از اتخاذ تصمیم درباره تقاضا ،دستور توقف اجرای حکم را میدهد. متن سابق تبصره« :در صورتی که مجازات مندرج در حکم ،از نوع مجازات سالب حیات یا سایر مجازاتهای بدنی باشد، شعبه دیوان عالی کشور با وصول تقاضای اعاده دادرسی قبل از اتخاذ تصمیم درباره تقاضا ،دستور توقف اجرای حکم را میدهد».", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 479, "category": "other", "chapter": "", "text": "پس از شروع به محاکمه جدید ،هرگاه ادلهای که اقامه شده قوی باشد ،قرار توقف آثار و تبعات حکم اولی ،فوری صادر میشود و دادرسی مطابق مواد این قانون انجام میگیرد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 480, "category": "other", "chapter": "", "text": "هرگاه دادگاه پس از رسیدگی ماهوی ،درخواست اعاده دادرسی را وارد تشخیص دهد ،حکم مورد اعاده دادرسی را نقض و حکم مقتضی صادر می کند .در صورتی که درخواست اعاده دادرسی راجع به قسمتی از حکم باشد ،فقط همان قسمت نقض یا اصلاح می شود .حکم دادگاه از حیث تجدیدنظر یا فرجامخواهی تابع مقررات مربوط است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 481, "category": "other", "chapter": "", "text": "اگر جهت اعاده دادرسی ،مغایرت دو حکم باشد ،دادگاه پس از قبول اعاده دادرسی ،هر یک را که صحیح تشخیص دهد، تأیید و رأی دیگر را نقض میکند و چنانچه هر دو رأی را غیر صحیح تشخیص دهد پس از نقض آنها وفق مقررات رسیدگی میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 482, "category": "other", "chapter": "", "text": "نسبت به حکمی که پس از اعاده دادرسی صادر می شود ،دیگر اعاده دادرسی از همان جهت پذیرفته نمیشود .مگر این که اعاده دادرسی از مصادیق ماده ( )۴۷۷ بوده و مغایرت رأی صادره با مسلمات فقهی به جهات دیگری غیر از جهت قبلی باشد و یا رأی جدید مجددا ً همانند رأی قبلی مغایر با مسلمات فقهی صادر شده باشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 483, "category": "other", "chapter": "", "text": "هرگاه شاکی یا مدعی خصوصی در جرایم غیرقابل گذشت ،پس از قطعی شدن حکم از شکایت خود صرف نظر کند، محکومعلیه میتواند از دادگاه صادرکننده حکم ق طعی ،درخواست کند در میزان مجازات او تجدیدنظر شود .در این صورت ،دادگاه به درخواست محکومعلیه در وقت فوق العاده و با حضور دادستان یا نماینده او با رعایت مقررات ماده ( )۳۰۰ این قانون ،رسیدگی میکند و مجازات را در صورت اقتضا در حدود قانون تخفیف میدهد یا به مجازاتی که مناسبتر به حال محکومعلیه باشد ،تبدیل میکند .این رأی قطعی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 484, "category": "other", "chapter": "", "text": "اجرای احکام کیفری بر عهده دادستان است و «معاونت اجرای احکام کیفری» تحت ریاست و نظارت وی در مناطقی که رئیس قوه قضائیه تشخیص میدهد ،در دادسرا عهدهدار این وظیفه است. متن سابق ماده « :۴۸۴ اجرای احکام کیفری برعهده دادستان است و «معاونت اجرای احکام کیفری» تحت ریاست و نظارت وی در مناطقی که رئیس قوه قضائیه تشخیص میدهد ،در دادسرای عمومی عهدهدار این وظیفه است». تبصره ( ۱ اصالحی -)۱۳۹۸٫۱۱٫۲۰ معاونت اجرای احکام کیفری ،میتواند در صورت ضرورت دارای واحد یا واحدهای تخصصی برای اجرای احکام باشد. متن سابق تبصره « :۱ معاونت اجرای احکام کیفری ،میتواند در صورت ضرورت دارای واحد یا واحدهای تخصصی برای اجرای احکام باشد». تبصره –۲ معاونت اجرای احکام کیفری یا واحدی از آن میتواند با تصویب رئیس قوه قضائیه در زندانها و یا مؤسسات کیفری مستقر شود .شیوه استقرار و اجرای وظایف آنها به موجب آییننامهای است که ظرف شش ماه از تاریخ لازم‌الاجرا شدن این قانون توسط وزیر دادگستری با همکاری رئیس سازمان زندان ها و اقدامات تأمینی و تربیتی کشور تهیه میشود و به تصویب رئیس قوه قضائیه میرسد. تبصره –۳ در حوزه قضایی بخش ،اجرای احکام کیفری به عهده رئیس دادگاه و در غیاب وی با دادرس علیالبدل است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 485, "category": "other", "chapter": "", "text": "معاونت اجرای احکام کیفری به تعداد لازم قاضی اج رای احکام کیفری ،مددکار اجتماعی ،مأمور اجرا و مأمور مراقبتی در اختیار دارد. تبصره -قاضی اجرای احکام کیفری باید حداقل سه سال سابقه خدمت قضایی داشته باشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 486, "category": "other", "chapter": "", "text": "قوه قضائیه به منظور انجام وظایف مددکاران اجتماعی ،تشکیلات مناسبی تحت عنوان «مددکاری اجتماعی» را در حوزه قضایی هر شهرستان ایجاد مینماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 487, "category": "other", "chapter": "", "text": "مددکاران اجتماعی از بین فارغالتحصیلان رشته های مددکاری اجتماعی ،علوم تربیتی ،روانشناسی ،جامعهشناسی، جرمشناسی و حقوق استخدام میشوند. تبصره -در رشتههای مذکور ،اولویت با فارغالتحصیلان رشته مددکاری اجتماعی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 488, "category": "other", "chapter": "", "text": "در هر معاونت اجرای احکام کیفری ،واحد سجل کیفری و عفو و بخشودگی برای انجام وظایف زیر تشکیل میشود: الف -ایجاد بانک اطلاعاتی مجرمان خطرناک ،متهمان تحت تعقیب و متواری و محکومان فراری ب -تنظیم برگ سجل کیفری محکومعلیه در محکومیتهای مؤثر کیفری با ثبت و درج مشخصات دقیق و اثرانگشت و تصویر وی به صورت الکترونیکی پ -ثبت و ارسال درخواست عفو محکومعلیه و نیز پیشنهاد عفو یا تخفیف مجازات محکومان طبق مقررات تبصره –۱ ترتیب ثبت و تنظیم این مشخصات ،امکان دسترسی به این اطلاعات و چگونگی تشکیل و راهاندازی شبکه الکترونیکی سجل کیفری با رعایت مقررات راجع به دادرسی الکترونیکی و به موجب آییننامهای است که ظرف شش ماه از تاریخ لازم‌الاجرا شدن این قانون توسط وزیر دادگستری با همکاری رئیس سازمان زندانها و اقدامات تأمینی و تربیتی کشور تهیه میشود و به تصویب رئیس قوه قضائیه میرسد. تبصره –۲ اقدامات موضوع بندهای (الف) و (ب) این ماده با همکاری نیروی انتظامی و نهادهای اطلاعاتی و امنیتی صورت میگیرد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 489, "category": "other", "chapter": "", "text": "وظایف قاضی اجرای احکام کیفری عبارت است از: الف -صدور دستور اجرای احکام لازم‌الاجرای کیفری و نظارت بر شیوه اجرای آنها ب -نظارت بر زندانها در امور راجع به زندانیان پ -اعلام نظر درباره زندانیان واجد شرایط عفو و آزادی مشروط مطابق قوانین و مقررات ت -اعطای مرخصی به محکومان بر اساس قوانین و مقررات ث -اتخاذ تصمیم درباره محکومان سالمند ،مبتالیان به بیماریهای روانی و بیماریهای جسمی صعبالعالج و سایر افراد محکوم نیازمند به مراقبت و توجه ویژه ،از قبیل صدور اجازه بستری برای آنها در مراکز درمانی بر اساس ضوابط و مقررات ج -اجرای سایر وظایفی که به موجب قوانین و مقررات برای اجرای مجازاتها وضع شده یا بر عهده قاضی اجرای احکام کیفری یا ناظر زندان قرار گرفته است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 490, "category": "other", "chapter": "", "text": "آرای کیفری در موارد زیر پس از ابلاغ به موقع اجرا گذاشته میشود: الف -رأی قطعی که دادگاه نخستین صادر میکند. ب -رأیی که در مهلت قانونی نسبت به آن واخواهی یا درخواست تجدیدنظر یا فرجام نشده باشد یا درخواست تجدیدنظر یا فرجام آن رد شده باشد. پ -رأیی که مرجع تجدیدنظر آن را تأیید یا پس از نقض رأی نخستین صادر کرده باشد. ت -رأیی که به تأیید مرجع فرجام رسیده باشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 491, "category": "other", "chapter": "", "text": "هرگاه قاضی اجرای احکام کیفری ،رأی صادره را از لحاظ قانونی لازم االجرا نداند ،مراتب را با اطلاع دادستان به دادگاه صادرکننده رأی قطعی اعلام و مطابق تصمیم دادگاه اقدام میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 492, "category": "other", "chapter": "", "text": "هرگاه رأی ،در خصوص اشخاص متعدد صادر شده باشد و در موعد مقرر بعضی از آنان اعتراض و یا درخواست تجدیدنظر یا فرجام کرده باشند ،پس از گذشت مهلت اعتراض و یا تجدیدنظر یا فرجام در مورد بقیه لازم‌الاجرا است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 493, "category": "other", "chapter": "", "text": "اعتراض و یا درخواست تجدیدنظر یا فرجام درباره یک قسمت از رأی ،مانع از اجرای سایر قسمتهای لازم‌الاجرای آن نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 494, "category": "other", "chapter": "", "text": "عملیات اجرای رأی با دستور قاضی اجرای احکام کیفری شروع میشود و به هیچ وجه متوقف نمیشود ،مگر در مواردی که قانون مقرر نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 495, "category": "other", "chapter": "", "text": "آرای کیفری به دستور و تحت نظارت قاضی اجرای احکام کیفری اجرا میشود و در مواردی که طبق قانون ،اجرای رأی باید توسط وزارتخانهها ،مؤسسات و شرکتهای دو

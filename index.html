<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>قانون‌یار | آموزش تعاملی آیین دادرسی کیفری</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="قانون‌یار">

<style>
:root{
  --bg:#f4f6fb; --bg-card:#ffffff; --text:#1c2333; --text-dim:#6b7488;
  --brand:#2f5bea; --brand-dark:#1e3fb8; --brand-light:#e8edff;
  --good:#16a34a; --good-bg:#e9f9ee; --bad:#dc2626; --bad-bg:#fdeaea;
  --warn:#d97706; --warn-bg:#fff4e0; --border:#e6e9f2; --shadow:0 4px 18px rgba(30,40,90,.08);
  --radius:16px;
}
[data-theme="dark"]{
  --bg:#11141c; --bg-card:#1a1f2b; --text:#eef1f8; --text-dim:#93a0b8;
  --brand:#5b7dff; --brand-dark:#4a68e0; --brand-light:#232a44;
  --good:#34d572; --good-bg:#123322; --bad:#f36565; --bad-bg:#3a1b1e;
  --warn:#f2b344; --warn-bg:#3a2c10; --border:#262d3d; --shadow:0 4px 20px rgba(0,0,0,.4);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Vazirmatn","Tahoma","Segoe UI",sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; direction:rtl; transition:background .25s,color .25s;
}
#app{max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:90px; position:relative;}
.topbar{
  position:sticky; top:0; z-index:50; background:var(--bg-card); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px; padding:12px 14px;
}
.topbar h1{font-size:17px; margin:0; flex:1; font-weight:800;}
.icon-btn{
  background:var(--brand-light); color:var(--brand); border:none; width:38px; height:38px; border-radius:12px;
  display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer;
}
.back-btn{background:none; border:none; font-size:20px; color:var(--text); cursor:pointer; width:32px;}
.container{padding:16px;}
.hero{
  background:linear-gradient(135deg,var(--brand),#7c3aed); border-radius:22px; padding:26px 20px; color:#fff;
  text-align:center; box-shadow:var(--shadow); margin-bottom:18px;
}
.hero .logo{font-size:40px; margin-bottom:6px;}
.hero h2{margin:4px 0; font-size:22px; font-weight:900;}
.hero p{margin:6px 0 0; font-size:13px; opacity:.92; line-height:1.9;}
.stats-row{display:flex; gap:10px; margin-top:16px;}
.stat-chip{flex:1; background:rgba(255,255,255,.16); border-radius:14px; padding:10px 6px;}
.stat-chip b{display:block; font-size:18px;}
.stat-chip span{font-size:11px; opacity:.85;}
.progress-outer{background:rgba(255,255,255,.25); border-radius:10px; height:8px; margin-top:14px; overflow:hidden;}
.progress-inner{background:#fff; height:100%; border-radius:10px; transition:width .4s;}
.menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px;}
.menu-btn{
  background:var(--bg-card); border:1px solid var(--border); border-radius:18px; padding:18px 10px;
  text-align:center; cursor:pointer; box-shadow:var(--shadow); transition:transform .15s;
}
.menu-btn:active{transform:scale(.96);}
.menu-btn .emoji{font-size:26px; display:block; margin-bottom:8px;}
.menu-btn b{display:block; font-size:14px; margin-bottom:2px;}
.menu-btn small{color:var(--text-dim); font-size:11px;}
.section-title{font-size:15px; font-weight:800; margin:20px 0 10px; display:flex; align-items:center; gap:6px;}
.card{background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:var(--shadow);}
.badge{display:inline-block; font-size:11px; padding:3px 10px; border-radius:20px; font-weight:700;}
.badge.cat{background:var(--brand-light); color:var(--brand);}
.badge.easy{background:var(--good-bg); color:var(--good);}
.badge.medium{background:var(--warn-bg); color:var(--warn);}
.badge.hard{background:var(--bad-bg); color:var(--bad);}
.badge.verified{background:var(--good-bg); color:var(--good);}
.badge.review{background:var(--bad-bg); color:var(--bad);}
.article-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; gap:8px;}
.article-num{font-size:19px; font-weight:900; color:var(--brand);}
.article-text{font-size:14.5px; line-height:2; background:var(--brand-light); padding:12px; border-radius:12px; margin:10px 0; border-right:4px solid var(--brand);}
.article-explain{font-size:13.5px; line-height:1.95; color:var(--text); margin:8px 0;}
.article-notes{background:var(--warn-bg); border-radius:12px; padding:10px 12px; margin:10px 0; font-size:13px; line-height:1.9;}
.article-notes b{color:var(--warn);}
.btn{
  display:block; width:100%; background:var(--brand); color:#fff; border:none; padding:14px; border-radius:14px;
  font-size:15px; font-weight:800; cursor:pointer; margin-top:8px; font-family:inherit;
}
.btn.secondary{background:var(--brand-light); color:var(--brand);}
.btn.success{background:var(--good);}
.btn.ghost{background:transparent; color:var(--brand); border:2px solid var(--brand-light);}
.btn:active{opacity:.85;}
.btn:disabled{opacity:.5;}
.fav-btn{background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-dim);}
.fav-btn.active{color:#f5b400;}
.search-box{
  display:flex; align-items:center; background:var(--bg-card); border:1px solid var(--border); border-radius:14px;
  padding:10px 14px; margin-bottom:14px; gap:8px;
}
.search-box input{border:none; background:none; outline:none; flex:1; font-family:inherit; font-size:14px; color:var(--text);}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.chip{
  background:var(--bg-card); border:1px solid var(--border); padding:8px 14px; border-radius:20px; font-size:12.5px;
  cursor:pointer; font-weight:600;
}
.chip.active{background:var(--brand); color:#fff; border-color:var(--brand);}
.quiz-progress{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.quiz-progress .bar{flex:1; height:8px; background:var(--brand-light); border-radius:8px; overflow:hidden;}
.quiz-progress .bar div{height:100%; background:var(--brand); border-radius:8px; transition:width .3s;}
.quiz-meta{font-size:12px; color:var(--text-dim); margin-bottom:6px; display:flex; gap:10px;}
.q-text{font-size:16px; font-weight:700; line-height:1.9; margin:14px 0;}
.option{
  display:flex; align-items:center; gap:10px; background:var(--bg-card); border:2px solid var(--border);
  border-radius:14px; padding:13px 14px; margin-bottom:10px; cursor:pointer; font-size:14px; line-height:1.7;
}
.option .letter{
  width:26px; height:26px; border-radius:50%; background:var(--brand-light); color:var(--brand);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex-shrink:0;
}
.option.correct{border-color:var(--good); background:var(--good-bg);}
.option.correct .letter{background:var(--good); color:#fff;}
.option.wrong{border-color:var(--bad); background:var(--bad-bg);}
.option.wrong .letter{background:var(--bad); color:#fff;}
.explain-box{background:var(--brand-light); border-radius:14px; padding:14px; margin-top:14px; font-size:13.5px; line-height:1.9;}
.explain-box b{color:var(--brand);}
.result-hero{text-align:center; padding:20px 0;}
.result-score{font-size:52px; font-weight:900; color:var(--brand);}
.result-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0;}
.result-box{background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:14px; text-align:center;}
.result-box b{display:block; font-size:20px;}
.result-box.g b{color:var(--good);} .result-box.r b{color:var(--bad);}
.empty-state{text-align:center; padding:40px 16px; color:var(--text-dim);}
.empty-state .big{font-size:40px; margin-bottom:10px;}
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto; background:var(--bg-card);
  border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:8px 4px 10px;
}
.nav-item{flex:1; text-align:center; background:none; border:none; color:var(--text-dim); font-size:10.5px; cursor:pointer; padding:6px 2px; font-family:inherit;}
.nav-item .ic{font-size:19px; display:block; margin-bottom:2px;}
.nav-item.active{color:var(--brand); font-weight:800;}
.footer-note{font-size:11px; color:var(--text-dim); text-align:center; padding:16px; line-height:1.9;}
.timer-tag{font-size:12px; background:var(--brand-light); color:var(--brand); padding:4px 10px; border-radius:10px; font-weight:700;}
.toast{
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg);
  padding:10px 20px; border-radius:30px; font-size:13px; z-index:100; animation:fadeUp .25s;
}
@keyframes fadeUp{from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);}}
.range-list{display:flex; flex-direction:column; gap:10px;}
.mastery-bar{height:6px; border-radius:6px; background:var(--border); overflow:hidden; margin-top:6px;}
.mastery-bar div{height:100%;}
@media(min-width:521px){#app{border-inline:1px solid var(--border);}}
</style>
</head>

<script>
/* ============================================================
   قانون‌یار — بانک اطلاعاتی مواد قانون آیین دادرسی کیفری
   ------------------------------------------------------------
   ساختار داده به گونه‌ای طراحی شده که افزودن مواد/سؤالات بیشتر
   در آینده بدون نیاز به تغییر در رابط کاربری امکان‌پذیر باشد.
   هر ماده دارای فیلد verified است: true = متن از منابع رسمی
   استخراج و تطبیق داده شده. مواردی که هنوز اضافه نشده‌اند در
   بخش «مرور مواد قانون» به صورت «نیازمند افزودن» مشخص می‌شوند.
   ============================================================ */

const CATEGORIES = [

];

egory": "taghib", "chapter": "بخش اول - کلیات، فصل سوم", "text": "شاکی میتواند جبران تمام ضرر و زیانهای مادی و معنوی و منافع ممکنالحصول ناشی از جرم را مطالبه کند. تبصره –۱ زیان معنوی عبارت از صدمات روحی یا هتک حیثیت و اعتبار شخصی ،خانوادگی یا اجتماعی است .دادگاه میتواند علاوه بر صدور حکم به جبران خسارت مالی ،به رفع زیان از طرق دیگر از قبیل الزام به عذرخواهی و درج حکم در جراید و امثال آن حکم نماید. تبصره –۲ منافع ممکنالحصول تنها به مواردی اختصاص دارد که صدق اتلاف نماید .همچنین مقررات مرتبط به منافع ممکنالحصول و نیز پرداخت خسارت معنوی شامل جرایم موجب تعزیرات منصوص شرعی و دیه نمیشود.", "explanation": "این ماده حق مطالبهٔ خسارت شاکی (بزه‌دیده) را در سه دسته مشخص می‌کند: ضرر مادی، ضرر معنوی و منافع ممکن‌الحصول (سودی که در آینده عاید می‌شد ولی به دلیل جرم از دست رفته).", "notes": ["زیان معنوی شامل صدمات روحی و هتک حیثیت شخصی، خانوادگی یا اجتماعی است.", "«منافع ممکن‌الحصول» یعنی منفعتی که به‌طور متعارف قابل حصول بوده ولی در اثر جرم از بین رفته است."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق تبصرهٔ ۱ ماده ۱۴ قانون آیین دادرسی کیفری، «زیان معنوی» شامل چه مواردی می‌شود؟", "options": ["فقط خسارات مالی مستقیم", "صدمات روحی یا هتک حیثیت و اعتبار شخصی، خانوادگی یا اجتماعی", "فقط از دست دادن شغل", "فقط هزینه‌های درمانی"], "correct": 1, "explain": "تبصرهٔ ۱ ماده ۱۴ زیان معنوی را دقیقاً همین‌گونه تعریف کرده است."}]}, {"article": 15, "category": "taghib", "chapter": "بخش اول - کلیات، فصل سوم", "text": "پس از آنکه متهم تحت تعقیب قرار گرفت ،زیاندیده از جرم میتواند تصویر یا رونوشت مصدق تمام ادله و مدارک خود را جهت پیوست به پرونده به مرجع تعقیب تسلیم کند و تا قبل از اعلام ختم دادرسی ،دادخواست ضرر و زیان خود را تسلیم دادگاه کند .مطال به ضرر و زیان و رسیدگی به آن ،مستلزم رعایت تشریفات آیین دادرسی مدنی است.", "explanation": "بعد از شروع تعقیب متهم، بزه‌دیده می‌تواند مدارک خود را به پرونده ضمیمه کند و تا پیش از پایان رسیدگی، دادخواست ضرر و زیان بدهد. رسیدگی به این دادخواست تابع تشریفات آیین دادرسی مدنی است، نه کیفری.", "notes": ["مهلت تسلیم دادخ  بندهای (الف)( ،ب)( ،پ) و (ت) ماده ( )۳۰۲ این قانون به صورت مشهود واقع شود ،در صورت عدم حضور ضابطان دادگستری ،تمام شهروندان می توانند اقدامات لازم را برای جلوگیری از فرار مرتکب جرم و حفظ صحنه جرم به عمل آورند. تبصره –۲ ولگرد کسی است که مسکن و مأوای مشخص و وسیله معاش معلوم و شغل یا حرفه معینی ندارد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 46, "category": "zabetan", "chapter": "بخش اول - کلیات، فصل دوم: ضابطان دادگستری", "text": "ضابطان دادگستری مکلفند نتیجه اقدامات خود را فوری به دادستان اطلاع دهند .چنانچه دادستان اقدامات انجامشده را کافی نداند ،میتواند تکمیل آن را بخواهد .در این صورت ،ضابطان باید طبق دستور دادستان تحقیقات و اقدامات قانونی را برای کشف جرم و تکمیل تحقیقات به عمل آورند ،اما نمیتوانند متهم را تحت نظر نگهدارند .چنانچه در جرایم مشهود ،نگهداری متهم برای تکمیل تحقیقات ضروری باشد ،ضابطان باید موضوع اتهام و ادله آن را بلافاصله و به طور کتبی به متهم ابلاغ و تفهیم کنند و مراتب را فوری برای اتخاذ تصمیم قانونی به اطلاع دادستان برسانند .در هر حال ،ضابطان نمیتوانند بیش از بیست و چهار ساعت متهم را تحت نظر قرار دهند.", "explanation": "ضابطان باید نتیجهٔ اقدامات خود را فوری به دادستان گزارش دهند. اگر دادستان اقدامات را ناکافی بداند، دستور تکمیل می‌دهد؛ اما ضابطان حق ندارند خودشان متهم را تحت نظر نگه دارند، مگر در جرایم مشهود که نگهداری موقت برای تکمیل تحقیقات امکان‌پذیر است.", "notes": ["اصل: ضابطان حق نگهداری متهم تحت نظر را ندارند. استثنا: جرایم مشهود."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۴۶ قانون آیین دادرسی کیفری، آیا ضابطان دادگستری حق دارند برای تکمیل تحقیقات، متهم را تحت نظر نگه دارند؟", "options": ["بله، همیشه بدون محدودیت", "خیر، مگر در جرایم مشهود", "بله، فقط با اجازهٔ شاکی", "خیر، هرگز حتی در جرایم مشهود"], "correct": 1, "explain": "متن ماده این نگهداری را ممنوع دانسته، مگر در جرایم مشهود که استثنائاً مجاز است."}]}, {"article": 47, "category": "other", "chapter": "", "text": "هرگاه فردی خارج از وقت اداری به علت هر یک از  ["نیم ساعت", "یک ساعت", "دو ساعت", "بدون محدودیت زمانی"], "correct": 1, "explain": "متن ماده این مدت را حداکثر «یک ساعت» تعیین کرده است."}]}, {"article": 49, "category": "other", "chapter": "", "text": "به محض آنکه متهم تحت نظر قرار گرفت ،حداکثر ظرف یک ساعت ،مشخصات سجلی ،شغل ،نشانی و علت تحت نظر قرار گرفتن وی ،به هر طریق ممکن ،به دادسرای محل اعلام میشود .دادستان هر شهرستان با درج مشخصات مزبور در دفتر مخصوص و رایانه ،با رعایت مقررات راجع به دادرسی الکترونیکی ،نظارت لازم را برای رعایت حقوق این افراد اعمال مینماید و فهرست کامل آنان را در پایان هر روز به رئیس کل دادگستری استان مربوط اعلام میکند تا به همان نحو ثبت شود .والدین، همسر ،فرزندان ،خواهر و برادر این اشخاص می توانند از طریق مراجع مزبور از تحت نظر بودن آنان اطلاع یابند .پاسخگویی به بستگان فوق درباره تحت نظر قرار گرفتن ،تا حدی که با حیثیت اجتماعی و خانوادگی اشخاص تحت نظر منافات نداشته باشد، ضروری است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 50, "category": "other", "chapter": "", "text": "شخص تحت نظر می تواند به وسیله تلفن یا هر وسیله ممکن ،افراد خانواده یا آشنایان خود را از تحت نظر بودن آگاه کند و ضابطان نیز مکلفند مساعدت لازم را در این خصوص به عمل آورند ،مگر آنکه بنا بر ضرورت تشخیص دهند که شخص تحت نظر نباید از چنین حقی استفاده کند .در این صورت بای د مراتب را برای اخذ دستور مقتضی به اطلاع مقام قضایی برسانند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 51, "category": "other", "chapter": "", "text": "بنا به درخواست شخص تحت نظر یا یکی از بستگان نزدیک وی ،یکی از پزشکان به تعیین دادستان از شخص تحت نظر معاینه به عمل میآورد .گواهی پزشک در پرونده ثبت و ضبط میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 52, "category": "zabetan", "chapter": "بخش اول - کلیات، فصل دوم: ضابطان دادگستری", "text": "هرگاه متهم تحت نظر قرار گرفت ،ضابطان دادگستری مکلفند حقوق مندرج در این قانون در مورد شخص تحت }, {"article": 62, "category": "zabetan", "chapter": "بخش اول - کلیات، فصل دوم: ضابطان دادگستری", "text": "تحمیل هزینه های ناشی از انجام وظایف ضابطان نسبت به کشف جرم ،حفظ آثار و علائم و جمعآوری ادله وقوع جرم، شناسایی و یافتن و جلوگیری از فرار و مخفی شدن متهم ،دستگیری وی ،حمایت از بزهدیده و خانواده او در برابر تهدیدات ،ابلاغ اوراق و اجرای تصمیمات قضایی تحت هر عنوان بر بزهدیده ممنوع است.", "explanation": "هزینهٔ انجام وظایف ضابطان (کشف جرم، جمع‌آوری ادله، دستگیری متهم، حمایت از بزه‌دیده، ابلاغ اوراق و غیره) نباید تحت هیچ عنوانی بر بزه‌دیده تحمیل شود.", "notes": ["اصل رایگان بودن اقدامات ضابطان برای بزه‌دیده، بدون هیچ استثنای مالی."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۶۲ قانون آیین دادرسی کیفری، هزینه‌های ناشی از انجام وظایف ضابطان دادگستری بر عهدهٔ کیست؟", "options": ["بزه‌دیده باید بپردازد", "نباید تحت هیچ عنوانی بر بزه‌دیده تحمیل شود", "متهم باید بپردازد", "شاکی و متهم مشترکاً می‌پردازند"], "correct": 1, "explain": "متن ماده صراحتاً تحمیل این هزینه‌ها بر بزه‌دیده را ممنوع کرده است."}]}, {"article": 63, "category": "other", "chapter": "", "text": "تخلف از مقررات مواد ()۵۹( ،)۵۵( ،)۵۳( ،)۵۲( ،)۵۱( ،)۴۹( ،)۴۲( ،)۴۱( ،)۴۰( ،)۳۹( ،)۳۸( ،)۳۷( ،)۳۵( ،)۳۴( ،)۳۰ و ( )۱۴۱ این قانون توسط ضابطان ،موجب محکومیت به سه ماه تا یک سال انفصال از خدمات دولتی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 64, "category": "taghib", "chapter": "بخش اول - کلیات، فصل چهارم", "text": "جهات قانونی شروع به تعقیب به شرح زیر است: الف -شکایت شاکی یا مدعی خصوصی ب -اعلام و اخبار ضابطان دادگستری ،مقامات رسمی یا اشخاص موثق و مطمئن پ -وقوع جرم مشهود ،در برابر دادستان یا بازپرس ت -اظهار و اقرار متهم ث -اطلاع دادستان از وقوع جرم به طرق قانونی دیگر", "explanation": "این ماده پنج «جهت قانونی» را برمی‌شمرد که با هرکدام تعقیب کیفری می‌تواند آغاز شود: شکایت شاکی، گزارش ضابطان یا اشخاص موثق، مشاهدهٔ مستقیم جرم مشهود توسط دادستان/بازپرس، اقرار متهم، یا اطلاع دادستان از طریق دیگ  یا سرپرست قانونی او اخذ می شود .اگر ولی ،قیم یا سرپرست قانونی ،خود مرتکب جرم شده باشد ،سازمانهای مذکور با اخذ رضایت قیم اتفاقی یا تأیید دادستان ،اقدامات لازم را انجام میدهند. متن سابق تبصره « :۱ درصورتی که جرم واقع شده دارای بزهدیده خاص باشد ،کسب رضایت وی جهت اقدام مطابق این ماده ضروری است .چنانچه بزهدیده طفل ،مجنون و یا در جرائم مالی سفیه باشد ،رضایت ولی یا سرپرست قانونی او أخذ میشود .اگر ولی یا سرپرست قانونی ،خود مرتکب جرم شده باشد ،سازمانهای مذکور با أخذ رضایت قیم اتفاقی یا تأیید دادستان ،اقدامات لازم را انجام میدهند». تبصره –۲ ضابطان دادگستری و مقامات قضایی مکلفند بزهدیدگان جرایم موضوع این ماده را از کمک سازمانهای مردمنهاد مربوطه، آگاه کنند. تبصره ( ۳ اصالحی -)۱۳۹۵٫۱۱٫۱۰ سازمانهای مردمنهاد در صورتی میتوانند از حق مذکور در ماده ( )۶۶ قانون آیین دادرسی کیفری مصوب ،۱۳۹۲٫۱۲٫۴ استفاده کنند که از مراجع ذیصلاح قانونی ذیربط مجوز اخذ کنند و اگر سه بار متوالی اعلام جرم یک سازمان مردم نهاد در محاکم صالحه به طور قطعی رد شود ،برای یکسال از استفاده از حق مذکور در ماده ( )۶۶ قانون ذکرشده ،محروم میشوند. متن سابق تبصره « :۳ اسامی سازمانهای مردمنهاد که میتوانند در اجرای این ماده اقدام کنند ،در سهماهه ابتدای هر سال توسط وزیر دادگستری با همکاری وزیر کشور تهیه میشود و به تصویب رئیس قوه قضائیه میرسد». تبصره ( ۴ الحاقی -)۱۳۹۴٫۳٫۲۴ اجرای این ماده با رعایت اصل یکصد و شصت و پنجم ( )۱۶۵ قانون اساسی است و در جرایم منافی عفت سازمانهای مردمنهاد موضوع این ماده میتوانند با رعایت ماده ( )۱۰۲ این قانون و تبصرههای آن تنها اعلام جرم نموده و دلایل خود را به مراجع قضایی ارائه دهند و حق شرکت در جلسات را ندارند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 67, "category": "other", "chapter": "", "text": "گزارشها و نامه هایی که هویت گزارش دهندگان و نویسندگان آنها مشخص نیست ،نمیتواند مبنای شروع به تعقیب قرار گیرد ،مگر آنکه دلالت بر وقوع امر مهمی کند که موجب اخلال در نظم و امنیت عمومی است یا همراه با قرائنی باشد که به نظر دادستان برای شروع به تعقیب کفایت میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 68, "category": "other", "chapter": "", "text": "شاکی یا مدعی خصوصی میتواند شخصا ً یا توسط وکیل شکایت کند .در شکوائیه موارد زیر باید قید شود: الف -نام و نام خانوادگی ،نام پدر ،سن ،شغل ،میزان تحصیلات ،وضعیت تأهل ،تابعیت ،مذهب ،شماره شناسنامه ،شماره ملی، نشانی دقیق و در صورت امکان نشانی پیامنگار (ایمیل) ،شماره تلفن ثابت و همراه و کدپستی شاکی ب -موضوع شکایت ،تاریخ و محل وقوع جرم پ -ضرر و زیان وارده به مدعی و مورد مطالبه وی ت -ادله وقوع جرم ،اسامی ،مشخصات و نشانی شهود و مطلعان در صورت امکان ث -مشخصات و نشانی مشتکی عنه یا مظنون در صورت امکان تبصره -قوه قضائیه مکلف است اوراق متحدالشکل مشتمل بر موارد فوق را تهیه کند و در اختیار مراجعان قرار دهد تا در تنظیم شکوائیه مورد استفاده قرار گیرد .عدم استفاده از اوراق مزبور مانع استماع شکایت نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 69, "category": "other", "chapter": "", "text": "دادستان مکلف است شکایت کتبی و شفاهی را همه وقت قبول کند .شکایت شفاهی در صورتمجلس قید و به امضا یا اثر انگشت شاکی میرسد .هرگاه شاکی سواد نداشته باشد ،مراتب در صورتمجلس قید و انطباق شکایت با مندرجات صورتمجلس تصدیق میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 70, "category": "other", "chapter": "", "text": "در مواردی که تعقیب کیفری ،منوط به شکایت شاکی است و بزهدیده ،محجور می باشد و ولی یا قیم نداشته یا به آنان دسترسی ندارد و نصب قیم نیز موجب فوت وقت یا توجه ضرر به محجور شود ،تا حضور و مداخله ولی یا قیم یا نصب قیم و همچنین در صورتی که ولی یا قیم خود مرتکب جرم شده یا مداخله در آن داشته باشد ،دادستان شخصی را به عنوان قیم موقت تعیین و یا خود امر کیفری را تعقیب میکند و اقدامات ضروری را برای حفظ و جمعآوری ادله جرم و جلوگیری از فرار متهم به عمل میآورد .این حکم در مواردی که بزه دیده ،ولی و یا قیم او به عللی از قبیل بیهوشی قادر به شکایت نباشد نیز جاری است. تبصره -در خصوص شخص سفیه فقط در دعاوی کیفری که جنبه مالی دارد رعایت ترتیب مذکور در این ماده الزامی است و در غیر موارد مالی ،سفیه میتواند شخصا ً طرح شکایت نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 71, "category": "taghib", "chapter": "بخش اول - کلیات، فصل چهارم", "text": "در مواردی که تعقیب کیفری منوط به شکایت شاکی است ،اگر بزه دیده طفل یا مجنون باشد و ولی قهری یا سرپرست قانونی او با وجود مصلحت مولّی علیه اقدام به شکایت نکند ،دادستان موضوع را تعقیب میکند .همچنین در مورد بزهدیدگانی که به عللی از قبیل معلولیت جسمی یا ذهنی یا کهولت سن ،ناتوان از اقامه دعوی هستند ،دادستان موضوع را با جلب موافقت آنان تعقیب میکند .در این صورت ،در خصوص افراد محجور ،موقوف شدن تعقیب یا اجرای حکم نیز منوط به موافقت دادستان است.", "explanation": "در جرایمی که تعقیب منوط به شکایت شاکی است، اگر بزه‌دیده طفل یا مجنون باشد و ولی/سرپرست او با وجود مصلحت، شکایت نکند، دادستان خودش تعقیب می‌کند. برای بزه‌دیدگان ناتوان از اقامهٔ دعوا (مثل معلولیت یا کهولت سن)، دادستان با جلب موافقت آنان تعقیب می‌کند.", "notes": ["این ماده حمایتی برای بزه‌دیدگان آسیب‌پذیر (طفل، مجنون، معلول، سالمند) است که نمی‌توانند یا سرپرستشان نمی‌خواهد شکایت کند."], "difficulty": "hard", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۷۱ قانون آیین دادرسی کیفری، اگر بزه‌دیدهٔ طفل باشد و ولی او با وجود مصلحت طفل شکایت نکند، چه اتفاقی می‌افتد؟", "options": ["پرونده برای همیشه مختومه می‌شود", "دادستان خودش موضوع را تعقیب می‌کند", "باید منتظر بلوغ طفل ماند", "هیچ اقدامی ممکن نیست"], "correct": 1, "explain": "متن ماده در این حالت تعقیب توسط دادستان را پیش‌بینی کرده است."}]}, {"article": 72, "category": "other", "chapter": "", "text": "هرگاه مقامات و اشخاص رسمی از وقوع یکی از جرایم غیرقابل گذشت در حوزه کاری خود مطلع شوند ،مکلفند موضوع را فوری به دادستان اطلاع دهند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 73, "category": "other", "chapter": "", "text": "دادستان در اموری که به بازپرس ارجاع میشود ،حق نظارت و ارائه تعلیمات لازم را دارد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 74, "category": "other", "chapter": "", "text": "دادستان می تواند در تحقیقات مقدماتی حضور یابد و بر نحوه انجام آن نظارت کند؛ اما نمیتواند جریان تحقیقات را متوقف سازد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 75, "category": "other", "chapter": "", "text": "نظارت بر تحقیقات بر عهده دادستانی است که تحقیقات در حوزه او به عمل می آید ،هر چند راجع به امری باشد که خارج از آن حوزه اتفاق افتاده است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 76, "category": "other", "chapter": "", "text": "دادستان پیش از آنکه تحقیق در جرمی را از بازپرس بخواهد یا جریان تحقیقات را به طور کلی به بازپرس واگذار کند، می تواند اجرای برخی تحقیقات و اقدامات لازم را از بازپرس تقاضا کند .در این صورت ،بازپرس مکلف است فقط تحقیق یا اقدام مورد تقاضای دادستان را انجام دهد و نتیجه را نزد وی ارسال کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 77, "category": "other", "chapter": "", "text": "در صورت مشهود بودن جرایم موضوع بندهای (الف)( ،ب)( ،پ) و (ت) ماده ( )۳۰۲ این قانون ،تا پیش از حضور و مداخله بازپرس ،دادستان برای حفظ آثار و علائم ،جمع آوری ادله وقوع جرم و جلوگیری از فرار و مخفی شدن متهم اقدامات لازم را به عمل میآورد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 78, "category": "other", "chapter": "", "text": "در مورد جرایم مشهود که رسیدگی به آن ها از صلاحیت دادگاه محل خارج است ،دادستان مکلف است تمام اقدامات لازم را برای جلوگیری از امحای آثار جرم و فرار و مخفی شدن متهم انجام دهد و هر تحقیقی را که برای کشف جرم لازم بداند ،به عمل آورد و نتیجه اقدامات خود را فوری به مرجع قضایی صالح ارسال کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 79, "category": "taghib", "chapter": "بخش اول - کلیات، فصل چهارم", "text": "در جرایم قابلگذشت ،شاکی می تواند تا قبل از صدور کیفرخواست درخواست ترک تعقیب کند .در این صورت ،دادستان قرار ترک تعقیب صادر میکند .شاکی می تواند تعقیب مجدد متهم را فقط برای یک بار تا یک سال از تاریخ صدور قرار ترک تعقیب درخواست کند.", "explanation": "در جرایم قابل‌گذشت، شاکی می‌تواند پیش از صدور کیفرخواست تقاضای «ترک تعقیب» کند (که با گذشت کامل فرق دارد؛ چون امکان درخواست تعقیب مجدد وجود دارد). این حق فقط یک‌بار و ظرف حداکثر یک سال از تاریخ صدور قرار ترک تعقیب قابل استفاده است.", "notes": ["تفاوت «ترک تعقیب» با «گذشت»: در ترک تعقیب، شاکی می‌تواند فقط یک‌بار و تا یک سال بعد، تقاضای از سرگیری تعقیب کند."], "difficulty": "hard", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۷۹ قانون آیین دادرسی کیفری، شاکی پس از صدور قرار ترک تعقیب، تا چه زمانی می‌تواند تعقیب مجدد متهم را درخواست کند؟", "options": ["هر زمان که بخواهد بدون محدودیت", "فقط یک‌بار، تا یک سال از تاریخ صدور قرار ترک تعقیب", "ظرف یک ماه", "اصلاً امکان تعقیب مجدد وجود ندارد"], "correct": 1, "explain": "متن ماده این حق را «فقط برای یک بار تا یک سال از تاریخ صدور قرار ترک تعقیب» مقرر کرده است."}]}, {"article": 80, "category": "other", "chapter": "", "text": "در جرایم تعزیری درجه هفت و هشت ،چنانچه شاکی وجود نداشته یا گذشت کرده باشد ،در صورت فقدان سابقه محکومیت مؤثر کیفری ،مقام قضایی می تواند پس از تفهیم اتهام با ملاحظه وضع اجتماعی و سوابق متهم و اوضاع و احوالی که موجب وقوع جرم شده است و در صورت ضرورت با اخذ التزام کتبی از متهم برای رعایت مقررات قانونی ،فقط یک بار از تعقیب متهم خودداری نماید و قرار بایگانی پرونده را صادر کند .این قرار ظرف ده روز از تاریخ ابلاغ ،قابلاعتراض است. متن سابق ماده « :۸۰ در جرائم تعزیری درجه هفت و هشت ،چنانچه شاکی وجود نداشته یا گذشت کرده باشد ،در صورت فقدان سابقه محکومیت مؤثر کیفری ،مقام قضائی میتواند پس از تفهیم اتهام با ملاحظه وضع اجتماعی و سوابق متهم و اوضاع و احوالی که موجب وقوع جرم شده است و در صورت ضرورت با أخذ التزام کتبی از متهم برای رعایت مقررات قانونی ،فقط یکبار از تعقیب متهم خودداری نماید و قرار بایگانی پرونده را صادر کند .این قرار ظرف ده روز از تاریخ ابلاغ ،قابل اعتراض در دادگاه کیفری مربوط است». تبصره (الحاقی –)۱۳۹۴٫۳٫۲۴ مرجع تجدیدنظر قرار موضوع این ماده و سایر قرارهای قابل اعتراض مربوط به تحقیقات مقدماتی جرایمی که به طور مستقیم در دادگاه رسیدگی میشوند ،دادگاه تجدیدنظر است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 81, "category": "other", "chapter": "", "text": "در جرایم تعزیری درجه شش ،هفت و هشت که مجازات آنها قابل تعلیق است ،چنانچه شاکی وجود نداشته ،گذشت کرده یا خسارت وارده جبران گردیده باشد و یا با موافقت بزه دیده ،ترتیب پرداخت آن در مدت مشخصی داده شود و متهم نیز فاقد سابقه محکومیت مؤثر کیفری باشد ،دادستان می تواند پس از اخذ موافقت متهم و در صورت ضرورت با اخذ تأمین متناسب، تعقیب وی را از شش ماه تا دو سال معلق کند .در این صورت ،دادستان متهم را حسب مورد ،مکلف به اجرای برخی از دستورهای زیر میکند: الف -ارائه خدمات به بزهدیده در جهت رفع یا کاهش آثار زیانبار مادی یا معنوی ناشی از جرم با رضایت بزهدیده ب -ترک اعتیاد از طریق مراجعه به پزشک ،درمانگاه ،بیمارستان و یا به هر طریق دیگر ،حداکثر ظرف شش ماه پ -خودداری از اشتغال به کار یا حرفه معین ،حداکثر به مدت یک سال ت -خودداری از رفت و آمد به محل یا مکان معین ،حداکثر به مدت یک سال ث -معرفی خود در زمانهای معین به شخص یا مقامی به تعیین دادستان ،حداکثر به مدت یک سال ج -انجام دادن کار در ایام یا ساعات معین در مؤسسات عمومی یا عامالمنفعه با تعیین دادستان ،حداکثر به مدت یک سال چ -شرکت در کلاسها یا جلسات آموزشی ،فرهنگی و حرفهای در ایام و ساعات معین حداکثر ،به مدت یک سال ح -عدم اقدام به رانندگی با وسایل نقلی ه موتوری و تحویل دادن گواهینامه ،حداکثر به مدت یک سال خ -عدم حمل سلاح دارای مجوز یا استفاده از آن ،حداکثر به مدت یک سال د -عدم ارتباط و ملاقات با شرکای جرم و بزهدیده به تعیین دادستان ،برای مدت معین ذ -ممنوعیت خروج از کشور و تحویل دادن گذرنامه با اعلام مرا تب به مراجع مربوط ،حداکثر به مدت شش ماه تبصره –۱ در صورتی که متهم در مدت تعلیق به اتهام ارتکاب یکی از جرایم مستوجب حد ،قصاص یا تعزیر درجه هفت و بالاتر مورد تعقیب قرار گیرد و تعقیب وی منتهی به صدور کیفرخواست گردد و یا دستورهای مقام قضایی را اجرا نکند ،قرار تعلیق ،لغو و با رعایت مقررات مربوط به تعدد ،تعقیب به عمل می آید و مدتی که تعقیب معلق بوده است ،جزء مدت مرور زمان محسوب نمی شود .چنانچه متهم از اتهام دوم تبرئه گردد ،دادگاه قرار تعلیق را ابقا می کند .مرجع صادرکننده قرار مکلف است به مفاد این تبصره در قرار صادره تصریح کند. تبصره –۲ قرار تعلیق تعقیب ،ظرف ده روز پس از ابلاغ ،قابل اعتراض در دادگاه صالح است. تبصره –۳ هرگاه در مدت قرار تعلیق تعقیب معلوم شود که متهم دارای سابقه محکومیت کیفری مؤثر است ،قرار مزبور بلافاصله به وسیله مرجع صادرکننده لغو و تعقیب از سر گرفته می شود .مدتی که تعقیب معلق بوده است ،جزء مدت مرور زمان محسوب نمیشود. تبصره –۴ بازپرس میتواند در صورت وجود شرایط قانونی ،اعمال مقررات این ماده را از دادستان درخواست کند. تبصره –۵ در مواردی که پرونده به طور مستقیم در دادگاه مطرح میشود ،دادگاه میتواند مقررات این ماده را اعمال کند. تبصره –۶ قرار تعلیق تعقیب در دفتر مخصوصی در واحد سجل کیفری ثبت می شود و در صورتی که متهم در مدت مقرر ،ترتیبات مندرج در قرار را رعایت ننماید ،تعلیق لغو میگردد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 82, "category": "other", "chapter": "", "text": "در جرایم تعزیری درجه شش ،هفت و هشت که مجازات آنها قابل تعلیق است ،مقام قضایی میتواند به درخواست متهم و موافقت بزه دیده یا مدعی خصوصی و با اخذ تأمین متناسب ،حداکثر دو ماه مهلت به متهم بدهد تا برای تحصیل گذشت شاکی یا جبران خسارت ناشی از جرم اقدام کند .همچنین مقام قضایی میتواند برای حصول سازش بین طرفین ،موضوع را با توافق آنان به شورای حل اختلاف یا شخص یا مؤسسهای برای میانجیگری ارجاع دهد .مدت میانجیگری بیش از سه ماه نیست. مهلت های مذکور در این ماده در صورت اقتضا فقط برای یک بار و به میزان مذکور قابل تمدید است .اگر شاکی گذشت کند و موضوع از جرایم قابلگذشت باشد ،تعقیب موقوف می شود .در سایر موارد ،اگر شاکی گذشت کند یا خسارت او جبران شود و یا راجع به پرداخت آن توافق حاصل شود و متهم فاقد سابقه محکومیت مؤثر کیفری باشد ،مقام قضایی میتواند پس از اخذ موافقت متهم ،تعقیب وی را از شش ماه تا دو سال معلق کند .در این صورت ،مقام قضایی متهم را با رعایت تبصرههای ماده ( )۸۱ این قانون حسب مورد ،مکلف به اجرای برخی دستورهای موضوع ماده مذکور میکند .همچنین در صورت عدم اجرای تعهدات مورد توافق از سوی متهم بدون عذر موجه ،بنا به درخواست شاکی یا مدعی خصوصی ،قرار تعلیق تعقیب را لغو و تعقیب را ادامه میدهد. تبصره -بازپرس میتواند تعلیق تعقیب یا ارجاع به میانجیگری را از دادستان تقاضا نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 83, "category": "other", "chapter": "", "text": "نتیجه میانجی گری به صورت مشروح و با ذکر ادله آن طی صورتمجلسی که به امضای میانجیگر و طرفین میرسد، برای بررسی و تأیید و اقدامات بعدی حسب مورد نزد مقام قضایی مربوط ارسال می شود .در صورت حصول توافق ،ذکر تعهدات طرفین و چگونگی انجام آنها در صورتمجلس الزامی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 84, "category": "other", "chapter": "", "text": "چگونگی انجام دادن کار در مؤسسات عامالمنفعه موضوع بند (ج) ماده ( )۸۱ این قانون و ترتیب میانجیگری و شخص یا اشخاصی که برای میانجیگری انتخاب میشوند ،موضوع ماده ( )۸۲ این قانون به موجب آییننامهای است که ظرف سه ماه از تاریخ لازم‌الاجرا شدن این قانون توسط وزیر دادگستری تهیه می شود و پس از تأیید رئیس قوه قضائیه به تصویب هیئت وزیران میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 85, "category": "other", "chapter": "", "text": "در مواردی که دیه باید از بیت المال پرداخت شود ،پس از اتخاذ تصمیم قانونی راجع به سایر جهات ،پرونده به دستور دادستان برای صدور حکم مقتضی به دادگاه ارسال میشود. تبصره ( ۱ الحاقی –)۱۳۹۴٫۳٫۲۴ حکم این ماده در مواردی که پرونده با قرار موقوفی تعقیب یا با هر تصمیم دیگری در دادسرا مختومه می شود اما باید نسبت به پرداخت دیه تعیین تکلیف شود نیز جاری است. تبصره ( ۲ الحاقی –)۱۳۹۴٫۳٫۲۴ در مواردی که مسؤولیت پرداخت دیه متوجه عاقله است ،در صورت وجود دلیل کافی و با رعایت مقررات مربوط به احضار ،به وی اخطار میشود برای دفاع از خود حضور یابد .پس از حضور ،موضوع برای وی تبیین و اظهارات او اخذ میشود .هیچ یک از الزامات و محدودیت های مربوط به متهم در مورد عاقله قابل اعمال نیست .عدم حضور عاقله مانع از رسیدگی نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 86, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "در غیر جرایم موضوع ماده ( )۳۰۲ این قانون ،چنانچه متهم و شاکی حاضر باشند یا متهم حاضر و شاکی وجود نداشته یا گذشت کرده باشد و تحقیقات مقدماتی هم کامل باشد ،دادستان میتواند رأسا ً یا به درخواست بازپرس ،با اعزام متهم به دادگاه و در صورت حضور شاکی به همراه او ،دعوای کیفری را بلافاصله بدون صدور کیفرخواست به صورت شفاهی مطرح کند .در این مورد ،دادگاه بدون تأخیر تشکیل جلسه میدهد و به متهم تفهیم می کند که حق دارد برای تعیین وکیل و تدارک دفاع مهلت بخواهد که در صورت درخواست متهم ،حداقل سه روز به او مهلت داده می شود .تفهیم این موضوع و پاسخ متهم باید در صورت مجلس دادگاه قید شود .هرگاه متهم از این حق استفاده نکند ،دادگاه در همان جلسه ،رسیدگی و رأی صادر میکند و اگر ضمن رسیدگی انجام تحقیقاتی را لازم بداند ،آن ها را انجام و یا دستور تکمیل تحقیقات را به دادستان یا ضابطان دادگستری می دهد .اخذ تأمین متناسب از متهم با دادگاه است .شاکی در صورت مطالبه ضرر و زیان میتواند حداکثر ظرف پنج روز دادخواست خود را تقدیم کند و دادگاه می تواند فارغ از امر کیفری به دعوای ضرر و زیان رسیدگی و رأی مقتضی صادر نماید.", "explanation": "در جرایم سبک‌تر (خارج از صلاحیت دادگاه کیفری یک)، اگر متهم و شاکی حاضر باشند (یا شاکی گذشت کرده) و تحقیقات کامل باشد، دادستان می‌تواند بدون نوشتن کیفرخواست، به‌صورت شفاهی و فوری دعوا را در دادگاه مطرح کند تا رسیدگی سریع‌تر انجام شود.", "notes": ["این مسیر («طرح شفاهی دعوا») یک روش تسریع‌کننده برای پرونده‌های ساده و کامل است، جایگزین کیفرخواست کتبی."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۸۶ قانون آیین دادرسی کیفری، در چه شرایطی دادستان می‌تواند دعوای کیفری را بدون صدور کیفرخواست و به‌صورت شفاهی مطرح کند؟", "options": ["در تمام پرونده‌ها بدون قید و شرط", "وقتی متهم و شاکی حاضرند (یا شاکی گذشت کرده) و تحقیقات کامل است", "فقط با درخواست وکیل متهم", "فقط در جرایم مالی"], "correct": 1, "explain": "متن ماده این شرایط را دقیقاً مشخص کرده است: حضور طرفین یا گذشت شاکی، همراه با کامل بودن تحقیقات."}]}, {"article": 87, "category": "other", "chapter": "", "text": "هرگاه مأموران پست بر مبنای قرائن و امارات ،احتمال قوی دهند که بسته پستی حاوی مواد مخدر ،سمی ،میکروبی خطرناک و یا مواد منفجره ،اسلحه گرم ،اقلام امنیتی مطابق فهرست اعلامی از سوی مراجع ذیصلاح به پست و یا سایر آلات و ادوات جرم است ،محموله پستی با تنظیم صورتمجلس توقیف میشود و موضوع فوری به اطلاع دادستان میرسد .دادستان پس از اخذ نظر مراجع ذیصلاح و بررسی ،در صورت من تفی بودن احتمال ،بلافاصله دستور استرداد یا ارسال بسته پستی را صادر میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 88, "category": "other", "chapter": "", "text": "در اموری که از طرف دادستان به معاون دادستان یا دادیار ارجاع می شود ،آنان در امور محوله تمام وظایف و اختیارات دادستان را دارند و تحت تعلیمات و نظارت او انجام وظیفه میکنند .در غیاب دادستان و معاون او ،دادیاری که سابقه قضایی بیشتری دارد و در صورت تساوی ،دادیاری که سن بیشتری دارد ،جانشین دادستان میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 89, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "شروع به تحقیقات مقدماتی از سوی بازپرس منوط به ارجاع دادستان است .چنانچه بازپرس ،ناظر وقوع جرم باشد تحقیقات را شروع میکند ،مراتب را فوری به اطلاع دادستان میرساند و در صورت ارجاع دادستان ،تحقیقات را ادامه میدهد.", "explanation": "بازپرس اصولاً فقط با ارجاع دادستان می‌تواند تحقیقات را آغاز کند؛ اما اگر خودش ناظر وقوع جرم باشد، می‌تواند بلافاصله شروع کرده و سپس فوری به دادستان اطلاع دهد تا او تصمیم ارجاع را بگیرد.", "notes": ["اصل: شروع تحقیقات منوط به ارجاع دادستان.", "استثنا: مشاهدهٔ مستقیم جرم توسط بازپرس، که در این حالت او خودش آغاز و بعد اطلاع می‌دهد."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۸۹ قانون آیین دادرسی کیفری، شروع تحقیقات مقدماتی توسط بازپرس اصولاً منوط به چیست؟", "options": ["درخواست شاکی", "ارجاع دادستان", "دستور رئیس دادگستری استان", "درخواست وکیل متهم"], "correct": 1, "explain": "متن ماده تصریح می‌کند شروع تحقیقات از سوی بازپرس منوط به ارجاع دادستان است، مگر در حالت مشاهدهٔ مستقیم جرم."}]}, {"article": 90, "category": "other", "chapter": "", "text": "تحقیقات مقدماتی ،مجموعه اقدامات قانونی است که از سوی بازپرس یا دیگر مقامات قضائی ،برای حفظ آثار و علائم و جمع آوری ادله وقوع جرم ،شناسایی ،یافتن و جلوگیری از فرار یا مخفی شدن متهم انجام میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 91, "category": "other", "chapter": "", "text": "تحقیقات مقدماتی به صورت محرمانه صورت می گیرد مگر در مواردی که قانون به نحو دیگری مقرر نماید .کلیه اشخاصی که در جریان تحقیقات مقدماتی حضور دارند موظف به حفظ این اسرار هستند و در صورت تخلف ،به مجازات جرم افشای اسرار شغلی و حرفهای محکوم میشوند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 92, "category": "other", "chapter": "", "text": "تحقیقات مقدماتی تمام جرایم بر عهده بازپرس است .در غیر جرایم مستوجب مجازاتهای مقرر در ماده ( )۳۰۲ این قانون ،در صورت کمبود بازپرس ،داد ستان نیز دارای تمام وظایف و اختیاراتی است که برای بازپرس تعیین شده است .در این حالت ،چنانچه دادستان انجام تحقیقات مقدماتی را به دادیار ارجاع دهد ،قرارهای نهائی دادیار و همچنین قرار تأمین منتهی به بازداشت متهم ،باید در همان روز صدور به نظر دادستان برسد و دا دستان نیز مکلف است حداکثر ظرف بیست و چهار ساعت در این باره اظهارنظر کند. متن سابق ماده -۹۲ تحقیقات مقدماتی تمام جرائم بر عهده بازپرس است .در غیر جرائم موضوع ماده ( )۳۰۲ این قانون، در صورت نبودن بازپرس ،دادستان نیز دارای تمام وظایف و اختیاراتی است که برای بازپرس تعیین شده است .در این حالت ،چنانچه دادستان انجام تحقیقات مقدماتی را به دادیار ارجاع دهد ،قرارهای نهائی دادیار و همچنین قرار تأمین منتهی به بازداشت متهم ،باید در همان روز صدور به نظر دادستان برسد و دادستان نیز مکلف است حداکثر ظرف بیست و چهار ساعت در این باره اظهارنظر کند. تبصره -در صورت عدم حضور بازپرس یا معذور بودن وی از انجام وظیفه و عدم دسترسی به بازپرس دیگر در آن دادسرا در جرایم موضوع ماده ( )۳۰۲ این قانون ،دادرس دادگاه به تقاضای دادستان و تعیین رئیس حوزه قضائی ،وظیفه بازپرس را فقط تا زمان باقی بودن وضعیت مذکور انجام میدهد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 93, "category": "other", "chapter": "", "text": "بازپرس باید در کمال بی طرفی و در حدود اختیارات قانونی ،تحقیقات را انجام دهد و در کشف اوضاع و احوالی که به نفع یا ضرر متهم است فرق نگذارد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 94, "category": "other", "chapter": "", "text": "تحقیقات مقدماتی باید به سرعت و به نحو مستمر انجام شود و ایام تعطیل مانع انجام آن نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 95, "category": "other", "chapter": "", "text": "بازپرس مکلف است برای جلوگیری از امحای آثار و علائم جرم ،اقدامات فوری را به عمل آورد و در تحصیل و جمعآوری ادله وقوع جرم تأخیر نکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 96, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "انتشار تصویر و سایر مشخصات مربوط به هویت متهم در کلیه مراحل تحقیقات مقدماتی توسط رسانهها و مراجع انتظامی و قضایی ممنوع است مگر در مورد اشخاص زیر که تنها به درخواست بازپرس و موافقت دادستان شهرستان ،انتشار تصویر و یا سایر مشخصات مربوط به هویت آنان مجاز است: الف -متهمان به ارتکاب جرایم عمدی موضوع بندهای (الف)( ،ب)( ،پ) و (ت) ماده ( )۳۰۲ این قانون که متواری بوده و دلایل کافی برای توجه اتهام به آنان وجود داشته باشد و از طریق دیگری امکان دستیابی به آنان موجود نباشد ،به منظور شناسایی آنان و یا تکمیل ادله ،تصویر اصلی و یا تصویر به دست آمده از طریق چهرهنگاری آنان منتشر میشود. ب -متهمان دستگیرشده که به ارتکاب چند فقره جرم نسبت به اشخاص متعدد و نامعلومی نزد بازپرس اقرار کردهاند و تصویر آنان برای آگاهی بزه دیدگان و طرح شکایت و یا اقامه دعوای خصوصی توسط آنان ،منتشر میشود.", "explanation": "اصل بر ممنوعیت انتشار تصویر و مشخصات هویتی متهم در جریان تحقیقات مقدماتی است. استثنا محدود به دو گروه خاص است: متهمان فراری در جرایم شدید (با اجازهٔ بازپرس و دادستان) و متهمان دستگیرشده‌ای که به چند فقره جرم اقرار کرده‌اند (برای آگاهی بزه‌دیدگان احتمالی).", "notes": ["انتشار تصویر متهم استثناست نه قاعده، و همیشه نیازمند درخواست بازپرس و موافقت دادستان شهرستان است."], "difficulty": "hard", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۹۶ قانون آیین دادرسی کیفری، انتشار تصویر متهم در جریان تحقیقات مقدماتی اصولاً چه حکمی دارد؟", "options": ["همیشه آزاد است", "ممنوع است مگر در موارد استثنایی مشخص‌شده در قانون", "فقط با اجازهٔ خود متهم مجاز است", "فقط رسانه‌های دولتی می‌توانند منتشر کنند"], "correct": 1, "explain": "اصل بر ممنوعیت است و فقط در دو مورد استثنایی مشخص‌شده (با درخواست بازپرس و موافقت دادستان شهرستان) مجاز می‌شود."}]}, {"article": 97, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "بازپرس به منظور حمایت از بزهدیده ،شاهد ،مطلع ،اعالمکننده جرم یا خانواده آنان و همچنین خانواده متهم در برابر تهدیدات ،در صورت ضرورت ،انجام برخی از اقدامات احتیاطی را به ضابطان دادگستری دستور میدهد .ضابطان دادگستری مکلف به انجام دستورها و ارائه گزارش به بازپرس هستند.", "explanation": "برای حمایت از بزه‌دیده، شاهد، مطلع، اعلام‌کنندهٔ جرم یا خانواده‌های آنان (و حتی خانوادهٔ متهم) در برابر تهدید، بازپرس می‌تواند به ضابطان دستور اقدامات احتیاطی بدهد که آنان مکلف به اجرا و گزارش‌دهی هستند.", "notes": ["دامنهٔ حمایتی این ماده وسیع است: شامل خانوادهٔ متهم هم می‌شود، نه فقط بزه‌دیده و شهود."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۹۷ قانون آیین دادرسی کیفری، اقدامات حمایتی در برابر تهدید، توسط چه کسی به ضابطان دستور داده می‌شود؟", "options": ["شاکی", "بازپرس", "وکیل متهم", "خود ضابطان بدون نیاز به دستور"], "correct": 1, "explain": "متن ماده صدور این دستور را وظیفهٔ بازپرس دانسته است."}]}, {"article": 98, "category": "other", "chapter": "", "text": "بازپرس باید شخصا ً تحقیقات و اقدامات لازم را به منظور جمع آوری ادله وقوع جرم به عمل آورد ،ولی میتواند در غیر جرایم موضوع بندهای (الف)( ،ب)( ،پ) و (ت) ماده ( )۳۰۲ این قانون ،تفتیش ،تحقیق از شهود و مطلعان ،جمعآوری اطلاعات و ادله وقوع جرم و یا هر اقدام قانونی دیگری را که برای کشف جرم لازم بداند ،پس از دادن تعلیمات لازم به ضابطان دادگستری ارجاع دهد که در این صورت ،ضمن نظارت ،چنانچه تکمیل آنها را لازم بداند ،تصمیم مقتضی اتخاذ میکند. تبصره (الحاقی –)۱۳۹۴٫۳٫۲۴ در بندهای (الف)( ،ب)( ،پ) و (ت) ماده ( )۳۰۲ این قانون نیز بازپرس میتواند با همکاری ضابطان دادگستری تحقیقات لازم را انجام دهد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 99, "category": "other", "chapter": "", "text": "هرگاه بازپرس ضمن تحقیق ،جرم دیگری را کشف کند که با جرم اول مرتبط نباشد و بدون شکایت شاکی نیز قابل تعقیب باشد ،اقدامات لازم را طبق قانون برای حفظ آثار و علائم وقوع جرم و جلوگیری از فرار یا مخفی شدن متهم به عمل میآورد و همزمان مراتب را به دادستان اطلاع میدهد و در صورت ارجاع دادستان ،تحقیقات را ادامه میدهد. تبصره -چنانچه جرم کشف شده از جرایمی باشد که با شکایت شاکی قابل تعقیب است ،مراتب در صورت امکان ،توسط دادستان به نحو مقتضی به اطلاع بزهدیده میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 100, "category": "other", "chapter": "", "text": "شاکی میتواند در هنگام تحقیقات ،شهود خود را معرفی و ادلهاش را اظهار کند و در تحقیقات حضور یابد ،صورتمجلس تحقیقات مقدماتی یا سایر اوراق پرونده را که با ضرورت کشف حقیقت منافات ندارد ،مطالعه کند و یا به هزینه خود از آنها تصویر یا رونوشت بگیرد. تبصره –۱ در صورت درخواست شاکی ،چنانچه بازپرس مط العه یا دسترسی به تمام یا برخی از اوراق پرونده را منافی با ضرورت کشف حقیقت بداند ،با ذکر دلیل ،قرار رد درخواست را صادر میکند .این قرار ،حضوری به شاکی ابلاغ میشود و ظرف سه روز قابل اعتراض در دادگاه صالح است .دادگاه مکلف است در وقت فوقالعاده به اعتراض رسیدگی و اتخاذ تصمیم کند .تصمیم دادگاه قطعی است. تبصره –۲ ارائه اسناد و مدارک طبقهبندی شده و اسناد حاوی مطالب مربوط به تحقیقات جرایم منافی عفت و جرایم علیه امنیت داخلی و خارجی به شاکی ممنوع است. تبصره –۳ شاکی باید از انتشار مطالب و مدارکی که انتشار آنها به موجب شرع یا قانون ممنوع است امتناع کند ،مگر در مقام احقاق حق خود در مراجع صالح.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 101, "category": "other", "chapter": "", "text": "بازپرس مکلف است در مواردی که دسترسی به اطلاعات فردی بزه دیده ،از قبیل نام و نام خانوادگی ،نشانی و شماره تلفن ،احتمال خطر و تهدید جدی علیه تمامیت جسمانی و حیثیت بزهدی ده را به همراه داشته باشد ،تدابیر مقتضی را برای جلوگیری از دسترسی به این اطلاعات اتخاذ کند .این امر در مرحله رسیدگی در دادگاه نیز به تشخیص رئیس دادگاه و با رعایت مصالح بزهدیده اعمال میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 102, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "انجام هر گونه تعقیب و تحقیق در جرایم منافی عفت ممنوع است و پرسش از هیچ فردی در این خصوص مجاز نیست ،مگر در مواردی که جرم در مرئی و منظر عام واقع شده و یا دارای شاکی یا به عنف یا سازمانیافته باشد که در این صورت ،تعقیب و تحقیق فقط در محدوده شکایت و یا اوضاع و احوال مشهود توسط مقام قضایی انجام میشود. متن سابق ماده :۱۰۲ انجام هرگونه تعقیب و تحقیق در جرم زنا و لواط و سایر جرائم منافی عفت ممنوع است و پرسش از هیچ فردی در این خصوص مجاز نیست ،مگر در مواردی که جرم در مرئی و منظر عام واقع شود و یا دارای شاکی باشد که در این صورت ،تعقیب و تحقیق فقط در محدوده شکایت و یا اوضاع و احوال مشهود توسط قاضی دادگاه انجام میشود. تبصره ( ۱ اصالحی –)۱۳۹۴٫۳٫۲۴ در جرایم منافی عفت هرگاه شاکی وجود نداشته باشد و متهم بدوا ً قصد اقرار داشته باشد ،قاضی وی را توصیه به پوشاندن جرم و عدم اقرار میکند. متن سابق تبصره :۱ در جرم زنا و لواط و سایر جرائم منافی عفت هرگاه شاکی وجود نداشته باشد و متهم بدوا ً قصد اقرار داشته باشد ،قاضی وی را توصیه به پوشاندن جرم و عدم اقرار میکند. تبصره –۲ قاضی مکلف است عواقب شهادت فاقد شرایط قانونی را به شاهدان تذکر دهد. تبصره –۳ در جرایم مذکور در این ماده ،اگر بزهدیده محجور باشد ،ولی یا سرپرست قانونی او حق طرح شکایت دارد .در مورد بزه دیده بالغی که سن او زیر هجده سال است ،ولی یا سرپرست قانونی او نیز حق طرح شکایت دارد.", "explanation": "تعقیب و تحقیق در جرایم منافی عفت اصولاً ممنوع است و از کسی دربارهٔ آن پرسش نمی‌شود، مگر جرم آشکارا در ملأ عام رخ داده، شاکی داشته باشد، به عنف بوده یا سازمان‌یافته باشد؛ در این موارد تحقیق فقط محدود به همان محدودهٔ شکایت یا اوضاع مشهود انجام می‌شود.", "notes": ["این ماده در سال ۱۳۹۴ اصلاح و از حالت مصداقی (ذکر عناوین خاص جرم) به حالت کلی («جرایم منافی عفت») تغییر یافت.", "طبق تبصرهٔ ۱، اگر شاکی نباشد و متهم قصد اقرار داشته باشد، قاضی او را به پوشاندن جرم و عدم اقرار توصیه می‌کند."], "difficulty": "hard", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۰۲ قانون آیین دادرسی کیفری، تعقیب و تحقیق در جرایم منافی عفت در چه صورتی مجاز است؟", "options": ["همیشه و بدون هیچ استثنایی مجاز است", "فقط وقتی جرم در ملأ عام واقع شده، شاکی دارد، به عنف یا سازمان‌یافته باشد", "فقط با اجازهٔ رئیس قوهٔ قضائیه", "هرگز مجاز نیست"], "correct": 1, "explain": "متن ماده این استثناها را به‌طور محدود برشمرده و در غیر این موارد، تعقیب و پرسش ممنوع است."}]}, {"article": 103, "category": "other", "chapter": "", "text": "هرگاه در برابر مقام قضایی به هنگام انجام وظیفه مقاومتی شود ،او می تواند از قوای انتظامی و در صورت ضرورت از نیر وهای نظامی استفاده کند .این قوا مکلف به انجام دستور مقام قضایی هستند .در صورت عدم اجرای دستور ،مستنکف به مجازات مقرر قانونی محکوم میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 104, "category": "other", "chapter": "", "text": "بازپرس نمی تواند به عذر آنکه متهم معین نیست ،مخفی شده و یا دسترسی به او مشکل است ،تحقیقات خود را متوقف کند. در جرایم تعزیری درجه چهار ،پنج ،شش ،هفت و هشت ،هرگاه با انجام تحقیقات لازم ،مرتکب جرم معلوم نشود و دو سال تمام از وقوع جرم بگذرد ،با موافقت دادستان ،قرار توقف تحقیقات صادر و پرونده به طور موقت بایگانی و مراتب در مواردی که پرونده شاکی دارد ،به شاکی ابلاغ میشود .شاکی می تواند ظرف مهلت اعتراض به قرارها ،به این قرار اعتراض کند .هرگاه شاکی ،هویت مرتکب را به دادستان اعلام کند یا مرتکب به نحو دیگری شناخته شود ،به دستور دادستان موضوع مجددا ً تعقیب میشود .در مواردی که پرونده مطابق قانون به طور مستقیم در دادگاه مطرح شود ،دادگاه رأساً ،مطابق مقررات این ماده اقدام میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 105, "category": "other", "chapter": "", "text": "بازپرس در جریان تحقیقات ،تقاضای قانونی دادستان را اجرا و مراتب را در صورتمجلس قید میکند و هرگاه در هنگام اجرا با اشکال مواجه شود ،به نحوی که انجام تقاضا مقدور نباشد مراتب را به دادستان اعلام مینماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 106, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "بازپرس مکلف است پیش از اخذ مرخصی ،عزیمت به مأموریت ،انتقال و مانند آن ،نسبت به پروندههایی که متهمان آنها بازداشت می باشند ،اقدام قانونی لازم را انجام دهد و در صورتی که امکان آزادی زندانی به هر علت فراهم نشود ،مراتب را به طور کتبی به دادستان اعلام کند. تبصره -تخلف از این ماده و مواد ( )۱۰۴( ،)۱۰۲( ،)۹۵ و تبصره ( )۱ ماده ( )۱۰۲ این قانون موجب محکومیت انتظامی تا درجه چهار است.", "explanation": "بازپرس پیش از گرفتن مرخصی، انتقال یا مأموریت، باید تکلیف پرونده‌های دارای متهم بازداشتی را روشن کند و اگر نمی‌تواند زندانی را آزاد کند، موضوع را کتباً به دادستان اطلاع دهد؛ تخلف از این تکلیف مجازات انتظامی دارد.", "notes": ["هدف این ماده جلوگیری از بلاتکلیف ماندن متهمان بازداشتی به دلیل غیبت بازپرس است."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۰۶ قانون آیین دادرسی کیفری، بازپرس پیش از رفتن به مرخصی نسبت به پرونده‌های دارای متهم بازداشتی چه تکلیفی دارد؟", "options": ["هیچ تکلیفی ندارد", "باید اقدام قانونی لازم را انجام دهد و در صورت عدم امکان آزادی زندانی، کتباً به دادستان اطلاع دهد", "باید پرونده را برای همیشه بایگانی کند", "باید شخصاً زندانی را آزاد کند"], "correct": 1, "explain": "متن ماده این تکلیف را دقیقاً همین‌گونه مقرر کرده و تخلف از آن مجازات انتظامی دارد."}]}, {"article": 107, "category": "other", "chapter": "", "text": "شاکی می تواند تأمین ضرر و زیان خود را از بازپرس بخواهد .هرگاه این تقاضا مبتنی بر ادله قابل قبول باشد ،بازپرس قرار تأمین خواسته صادر میکند. تبصره -چنانچه با صدور قرار تأمین خواسته ،اموال متهم توقیف شود ،بازپرس مکلف است هنگام صدور قرار تأمین کیفری این موضوع را مدنظر قرار دهد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 108, "category": "other", "chapter": "", "text": "در صورتی که خواسته شاکی ،عین معین نبوده یا عین معین بوده ،اما توقیف آن ممکن نباشد ،بازپرس معادل مبلغ ضرر و زیان شاکی از سایر اموال و داراییهای متهم توقیف میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 109, "category": "other", "chapter": "", "text": "قرار تأمین خواسته به محض ابلاغ ،اجرا می شود .در مواردی که ابلاغ فوری ممکن نیست و تأخیر در اجرا موجب تضییع خواسته می شود ،ابتدا قرار تأمین ،اجرا و سپس ابلاغ میشود .این موارد ،فورا ً به اطلاع دادستان میرسد .قرار تأمین خواسته مطابق مقررات اجرای احکام مدنی در اجرای احکام کیفری دادسرای مربوط اجرا میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 110, "category": "other", "chapter": "", "text": "رفع ابهام و اجمال از قرار تأمین خواسته به عهده بازپرس است و رفع اشکالات ناشی از اجرای آن توسط دادستان یا قاضی اجرای احکام به عمل میآید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 111, "category": "other", "chapter": "", "text": "دادگاه حقوقی به اعتراض اشخاص ثالث نسبت به توقیف اموال ناشی از اجرای قرار تأمین خواسته ،مطابق مقررات اجرای احکام مدنی رسیدگی میکند.", "explanation": "اگر شخص ثالثی (غیر از طرفین دعوا) نسبت به توقیف اموالش در اجرای قرار تأمین خواسته اعتراض داشته باشد، این اعتراض در دادگاه حقوقی و طبق مقررات اجرای احکام مدنی رسیدگی می‌شود، نه در دادگاه کیفری.", "notes": ["اعتراض ثالث به توقیف اموال، مسیر رسیدگی حقوقی (مدنی) دارد، نه کیفری."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۱۱ قانون آیین دادرسی کیفری، اعتراض اشخاص ثالث به توقیف اموال ناشی از قرار تأمین خواسته در کجا رسیدگی می‌شود؟", "options": ["دادگاه کیفری همان پرونده", "دادگاه حقوقی، طبق مقررات اجرای احکام مدنی", "دادسرا", "نزد ضابطان دادگستری"], "correct": 1, "explain": "متن ماده این رسیدگی را بر عهدهٔ دادگاه حقوقی و طبق مقررات اجرای احکام مدنی می‌داند."}]}, {"article": 112, "category": "other", "chapter": "", "text": "در مواردی که مطالبه خواسته به تقدیم دادخواست نیاز دارد ،چنانچه شاکی تا قبل از ختم دادرسی ،دادخواست ضرر و زیان خود را به دادگاه کیفری تقدیم نکند ،به درخواست متهم ،از قرار تأمین خواسته رفع اثر میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 113, "category": "other", "chapter": "", "text": "در صورتی که به جهتی از جهات قانونی ،تعقیب متهم موقوف یا قرار منع تعقیب صادر و یا پرونده به هر کیفیت مختومه شود ،پس از قطعیت رأی و اجرای آن ،از قرار تأمین خواسته رفع اثر میشود.", "explanation": "وقتی تعقیب متهم به هر دلیل قانونی متوقف شود یا پرونده مختومه گردد، پس از قطعیت رأی و اجرای آن، از قرار تأمین خواسته (توقیف اموال) رفع اثر می‌شود.", "notes": ["رفع اثر از تأمین خواسته منوط به قطعیت رأی و اجرای آن است، نه صرف صدور رأی."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۱۳ قانون آیین دادرسی کیفری، رفع اثر از قرار تأمین خواسته چه زمانی انجام می‌شود؟", "options": ["بلافاصله پس از شروع تعقیب", "پس از قطعیت رأی و اجرای آن", "هرگز رفع اثر نمی‌شود", "فقط با درخواست شاکی"], "correct": 1, "explain": "متن ماده این زمان‌بندی را دقیقاً مشخص کرده است."}]}, {"article": 114, "category": "other", "chapter": "", "text": "جلوگیری از فعالیت تمام یا بخشی از امور خدماتی یا تولیدی از قبیل امور تجارتی ،کشاورزی ،فعالیت کارگاهها ،کارخانهها و شرکتهای تجارتی و تعاونی ها و مانند آن ممنوع است مگر در مواردی که حسب قرائن معقول و ادله مثبته ،ادامه این فعالیت متضمن ارتکاب اعمال مجرمانه ای باشد که مضر به سلامت ،مخل امنیت جامعه و یا نظم عمومی باشد که در این صورت ،بازپرس مکلف است با اطلاع دادستان ،حسب مورد از آن بخش از فعالیت مذکور جلوگیری و ادله یادشده را در تصمیم خود قید کند .این تصمیم ظرف پنج روز پس از ابلاغ قابل اعتراض در دادگاه کیفری است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 115, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "نوشتن بین سطور ،قلم خوردگی و تراشیدن کلمات در اوراق بازجویی و تحقیقات ،ممنوع است .اگر یک یا چند کلمه اضافه گردد باید بر روی آن خط نازکی کشیده و این موضوع قید شود و بازپرس و شخصی که تحقیق از او به عمل میآید ،آن را امضا کنند .همچنین اگر یک یا چند کلمه از قلم افتاده و در حاشیه نوشته شود ،اشخاص یادشده باید زیر آن را امضا کنند .هرگاه این ترتیب رعایت نشود ،کلمات و خطوط مزبور فاقد اعتبار است .رعایت مقررات این ماده در تمام مراحل دادرسی از سوی مقامات قضایی و ضابطان دادگستری الزامی است .در صورت قلم خوردگی جزئی موضوع باید در ذیل برگه توضیح داده شده و به امضای اشخاص فوق برسد.", "explanation": "در اوراق بازجویی، تراشیدن یا خط‌خوردگی کلمات ممنوع است. اگر کلمه‌ای اضافه شود، باید با خط نازک روی آن کشیده و توسط بازپرس و شخص تحت تحقیق امضا شود؛ کلمهٔ جاافتاده هم باید در حاشیه نوشته و امضا شود؛ عدم رعایت این تشریفات، آن قسمت از سند را از اعتبار می‌اندازد.", "notes": ["هدف: جلوگیری از دستکاری غیرمجاز در اسناد رسمی بازجویی."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۱۵ قانون آیین دادرسی کیفری، تراشیدن یا خط‌خوردگی کلمات در اوراق بازجویی چه حکمی دارد؟", "options": ["مجاز و بدون تشریفات خاص است", "ممنوع است و اصلاحات باید با تشریفات مشخص (خط‌کشیدن و امضا) انجام شود", "فقط بازپرس می‌تواند بدون هیچ محدودیتی این کار را انجام دهد", "هیچ تأثیری بر اعتبار سند ندارد"], "correct": 1, "explain": "متن ماده این کار را ممنوع دانسته و روش صحیح اصلاح (خط‌کشیدن نازک + امضای طرفین) را مشخص کرده است."}]}, {"article": 116, "category": "other", "chapter": "", "text": "بازپرس در حوزه قضایی محل مأموریت خود با رعایت مفاد این قانون ایفای وظیفه میکند و در صورت وجود جهات قانونی در موارد زیر شروع به تحقیق مینماید: الف -جرم در حوزه قضایی محل مأموریت او واقع شود. ب -جرم در حوزه قضایی دیگری واقع گردد و در حوزه قضایی محل مأموریت او کشف یا متهم در آن حوزه دستگیر شود. پ -جرم در حوزه قضایی دیگری واقع شود ،اما متهم یا مظنون به ارتکاب جرم در حوزه قضایی محل مأموریت او مقیم باشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 117, "category": "other", "chapter": "", "text": "در مواردی که جرم خارج از حوزه قضایی محل مأموریت بازپرس واقع شده ،اما در حوزه او کشف یا مرتکب در آن حوزه دستگیر شود ،بازپرس تحقیقات و اقدامات مقتضی را به عمل میآورد و در صورت لزوم ،قرار تأمین نیز صادر میکند و چنانچه قرار صادره منتهی به بازداشت متهم شود ،پس از رسیدگی به اعتراض وی در دادگاه کیفری که بازپرس در معیت آن انجام وظیفه می نماید ،با صدور قرار عدم صلاحیت ،پرونده را به همراه متهم ،حداکثر ظرف چهل و هشت ساعت ،به دادسرای محل وقوع جرم میفرستد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 118, "category": "other", "chapter": "", "text": "هرگاه آثار و ادله وقوع جرمی در حوزه قضایی محل مأموریت بازپرس کشف شود ،اما محل وقوع آن معلوم نباشد، بازپرس ضمن انجام تحقیقات ،سعی در کشف محل وقوع جرم می کند و اگر محل وقوع جرم تا ختم تحقیقات مشخص نشود، بازپرس در خصوص موضوع ،اظهار عقیده میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 119, "category": "other", "chapter": "", "text": "هرگاه تحقیق از متهم ،استماع شهادت شهود و مطلع ،معاینه محل ،بازرسی از منازل و اماکن و اشیا ،جمعآوری آلات جرم و به طور کلی هر اقدام دیگری خارج از حوزه قضایی محل مأموریت بازپرس لازم شود ،وی با صدور قرار نیابت قضایی مطابق مقررات قانونی و ارسال اصل یا تصویر اوراق مورد نیاز پرونده و تصریح موارد ،انجام آنها را از بازپرس محل ،تقاضا میکند .این بازپرس در حدود مفاد نیابت اعطائی ،موضوع نیابت را انجام می دهد و اوراق تنظیمی را پس از امضا به همراه سایر مدارک به دست آمده نزد مرجع نیابت دهنده می فرستد و در صورتی که اجرای تمام یا بخشی از مفاد نیابت ،مربوط به حوزه قضایی دیگری باشد ،اوراق را برای اجرای نیابت به مرجع مزبور ارسال و مراتب را به بازپرس نیابت دهنده اعلام میدارد. تبصره –۱ انجام نیابت قضایی در حوزه قضایی بخش به عهده رئیس یا دادرس علیالبدل دادگاه آن محل است. تبصره –۲ در مواردی که اقرار متهم و یا شهادت شاهد و یا شهادت بر شهادت شاهد ،مستند رأی دادگاه باشد ،استماع آن توسط قاضی صادرکننده رأی الزامی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 120, "category": "other", "chapter": "", "text": "بازپرس در هنگام صدور قرار نیابت قضایی میتواند نوع تأمین را معین یا اختیار اخذ تأمین و نوع آن را به نظر بازپرسی که تحقیق از او خواسته شده ،واگذار کند .چنانچه بازپرسی که تحقیق از او درخواست شده با توجه به دفاع متهم و ادله ابرازی وی احراز کند که تأمین خواسته شده نامتناسب است به نظر خود ،تأمین متناسبی اخذ میکند .همچنین در موردی که تقاضای اخذ تأمین نشده باشد ،وی میتواند در صورت توجه اتهام با نظر خود تأمین مناسب اخذ کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 121, "category": "other", "chapter": "", "text": "هرگاه در اجرای نیابت قضائی ،قرار تأمین صادره منتهی به بازداشت متهم شود ،پرونده جهت اظهارنظر نزد دادستان محل اجرای نیابت ارسال میشود .به اعتراض متهم نسبت به قرار بازداشت ،مطابق مقررات در دادگاه صالح محل اجرای نیابت، رسیدگی میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 122, "category": "other", "chapter": "", "text": "هرگاه به تشخیص بازپرس ،مباشرت وی در انجام تحقیقی در خارج از حوزه قضایی محل مأموریتش ضروری باشد، موضوع را به نحو مستدل به دادستان اعلام و پس از کسب نظر موافق وی ،ضمن هماهنگی با دادستان محل و تحت نظارت او، نسبت به اجرای مأموریت اقدام می کند .در این صورت ،ضابطان دادگستری و مراجع رسمی مکلف به اجرای دستورهای بازپرس هستند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 123, "category": "other", "chapter": "", "text": "هرگاه برای کشف واقع و روشن شدن موضوع ،تحقیق محلی یا معاینه محل ضرورت یابد و یا متهم یا شاکی درخواست نمایند ،بازپرس اقدام به تحقیقات محلی یا معاینه محل میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 124, "category": "other", "chapter": "", "text": "معاینه محل و تحقیق محلی جز در مواردی که ضرورت دارد باید در روز انجام شود .مراتب ضرورت در دستور قید میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 125, "category": "other", "chapter": "", "text": "معاینه محل و تحقیق محلی توسط بازپرس و یا به دستور او توسط ضابط دادگستری انجام میشود .هنگام معاینه محل، اشخاصی که در امر کیفری شرکت دارند می توانند حاضر شوند ،اما عدم حضور آنان ،مانع از انجام معاینه نیست. تبصره -هرگاه حضور متهم یا سایر اشخاصی که در امر کیفری شرکت دارند در هنگام معاینه محل ضروری باشد ،مکلفند به دستور بازپرس در محل حاضر شوند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 126, "category": "other", "chapter": "", "text": "هنگام تحقیق محلی و معاینه محل ،چنانچه بازپرس لازم بداند ،شخصا ً حاضر میشود؛ اما در جرایم موضوع بند (الف) ماده ( )۳۰۲ این قانون و همچنین هنگام معاینه اجساد ،مکلف است شخصا ً و در اسرع وقت حضور یابد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 127, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "هنگام تحقیق محلی و معاینه محل ،شهود و مطلعان نیز دعوت می شوند .در موارد ضروری ،بازپرس میتواند دیگر اشخاصی را که حضور آنان لازم است به محل دعوت کند .چنانچه اثبات حق به اظهارات اشخاص موضوع این ماده منحصر باشد و آنان بدون عذر موجه حاضر نشوند ،بازپرس دستور جلب آنان را صادر میکند ،مشروط به اینکه به تشخیص بازپرس حضور آنان ضرورت داشته باشد.", "explanation": "در تحقیق محلی و معاینهٔ محل، شهود و مطلعان دعوت می‌شوند و بازپرس می‌تواند در موارد ضروری افراد دیگر را هم دعوت کند. اگر اثبات حق فقط به اظهارات این افراد بستگی داشته باشد و بدون عذر موجه حاضر نشوند، بازپرس می‌تواند دستور جلب آنان را صادر کند.", "notes": ["جلب افراد در تحقیق محلی، مشروط است به اینکه اثبات حق منحصراً به اظهارات آنان بستگی داشته باشد و حضورشان ضروری تشخیص داده شود."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۲۷ قانون آیین دادرسی کیفری، جلب اشخاص برای حضور در تحقیق محلی مشروط به چیست؟", "options": ["هیچ شرطی ندارد", "انحصار اثبات حق به اظهارات آنان و ضرورت حضورشان از نظر بازپرس", "فقط درخواست شاکی", "سن بالای ۱۸ سال"], "correct": 1, "explain": "متن ماده جلب را مشروط به این دو شرط (انحصار اثبات حق + ضرورت حضور به تشخیص بازپرس) کرده است."}]}, {"article": 128, "category": "other", "chapter": "", "text": "کارشناس رسمی یا خبره ،از قبیل پزشک ،داروساز ،مهندس و ارزیاب هنگامی دعوت میشوند که اظهارنظر آنان از جهت علمی یا فنی یا معلومات مخصوص لازم باشد. تبصره -بازپرس میتواند در صورت لزوم از پزشک معالج نیز دعوت به عمل آورد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 129, "category": "other", "chapter": "", "text": "هنگام تحقیق محلی و معاینه محل ،تمام آثار و نشانه های مشهود و مکشوف که به نحوی در قضیه مؤثر است ،به دستور بازپرس توسط کارشناسان جمعآوری و در صورتمجلس قید میشود و به امضای اشخاص دخیل در موضوع میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 130, "category": "other", "chapter": "", "text": "صحنه جرم باید توسط گروه بررسی صحنه جرم که حسب مورد ،متشکل از پزشک قانونی ،کارشناسان بررسی صحنه جرم و تشخیص هویت ،کارآگاهان نیروی انتظامی و عنداللزوم سایر کارشناسان آن است ،تحت نظارت بازپرس و در صورت ضرورت به سرپرستی وی بررسی شود. تبصره -حدود اختیارات ،شرح وظایف و چگونگی بررسی صحنه جرم توسط این گروه به موجب آییننامه اجرائی است که ظرف شش ماه از تاریخ لازم االجرا شدن این قانون توسط وزیر دادگستری و وزیر کشور با همکاری نیروی انتظامی و سازمان پزشکی قانونی کشور تهیه میشود و به تصویب رئیس قوه قضائیه میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 131, "category": "other", "chapter": "", "text": "بازپرس برای حفظ جسد ،کشف هویت متوفی و چگونگی فوت وی ،نسبت به ترسیم کروکی ،عکسبرداری و در صورت امکان ،فیلمبرداری از جسد و غیره اقدام و دستورهای لازم را صادر میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 132, "category": "other", "chapter": "", "text": "هرگاه هویت متوفی معلوم نباشد به دستور بازپرس ،علائم و مشخصات جسد به طور دقیق در صورتمجلس قید می گردد و اثر انگشتان دست متوفی در پرونده ثبت و برای تشخیص هویت وی به هر نحو که مقتضی بداند ،اقدام میشود. تبصره –۱ در صورت ضرورت ،بازپرس می تواند دستور انتشار تصویر متوفی را در پایگاههای اطلاعرسانی نیروی انتظامی یا پزشکی قانونی و یا به هر نحو مناسب دیگر صادر کند. تبصره –۲ اجرای مقررات این ماده و ماده ( )۱۳۱ منوط به رعایت موازین شرعی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 133, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "ضابطان دادگستری مکلفند در جرایم منجر به سلب حیات ،صحنه جرم و محل کشف جسد را با وسایل مناسب محصور کنند و تا حضور بازپرس یا صدور دستور لازم برای معاینه محل ،در صورت ضرورت از ورود افراد و خروج آنان از محل جلوگیری کنند.", "explanation": "در جرایم منجر به مرگ، ضابطان موظف‌اند صحنهٔ جرم و محل کشف جسد را محصور کرده و تا حضور بازپرس یا صدور دستور لازم، از ورود و خروج افراد جلوگیری کنند تا آثار و ادله حفظ شود.", "notes": ["هدف این ماده حفظ صحنهٔ جرم برای معاینهٔ دقیق‌تر بازپرس است."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۳۳ قانون آیین دادرسی کیفری، در جرایم منجر به سلب حیات، ضابطان چه تکلیفی نسبت به صحنهٔ جرم دارند؟", "options": ["هیچ تکلیفی ندارند", "باید صحنه را محصور کرده و تا حضور بازپرس از ورود و خروج افراد جلوگیری کنند", "باید بلافاصله صحنه را پاک‌سازی کنند", "فقط باید عکس بگیرند"], "correct": 1, "explain": "متن ماده این تکلیف حفاظتی را دقیقاً همین‌گونه برای ضابطان مقرر کرده است."}]}, {"article": 134, "category": "other", "chapter": "", "text": "از تمام آثار قابل انتقال موجود در صحنه جرم که در کشف جرم مؤثر است باید به میزان لازم برداشت و به نحوی مهر و موم نمود که در معرض تلف نباشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 135, "category": "other", "chapter": "", "text": "هرگاه ادله وقوع جرم ،مواردی از قبیل مایعات ریخته شده و غیرقابل انتقال از محل باشد ،تا جمعآوری آنها ،بازپرس برای حفظ ادله یادشده اقدام میکند و اگر لازم بداند محل را قفل یا مهر و موم میکند و حفاظت آنها را به ضابط دادگستری میسپارد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 136, "category": "other", "chapter": "", "text": "بازپرس برای معاینه جراحات ،آثار و علائم ضرب ،صدمات جسمی ،آسیبهای روانی و سایر معاینات و آزمایشهای پزشکی ،نظر پزشک قانونی را اخذ یا حسب مورد ،از وی دعوت می کند .اگر پزشک قانونی نتواند حضور یابد و یا در جایی پزشک قانونی نباشد ،پزشک متخصص معتمد دعوت میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 137, "category": "other", "chapter": "", "text": "تفتیش و بازرسی منا زل ،اماکن بسته و تعطیل و همچنین تفتیش و بازرسی اشیاء در مواردی که حسب قرائن و امارات، ظن قوی به حضور متهم یا کشف اسباب ،آلات و ادله وقوع جرم در آن وجود دارد ،با دستور بازپرس و با قید جهات ظن قوی در پرونده ،انجام میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 138, "category": "other", "chapter": "", "text": "مجوز تفتیش و بازرسی منزل و محل کار اشخاص و مقامات موضوع مواد ( )۳۰۷ و ( )۳۰۸ و نیز متهمان جرایم موضوع بند (ث) ماده ( )۳۰۲ این قانون ،باید به تأیید رئیس کل دادگستری استان برسد و با حضور مقام قضایی اجرا شود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 139, "category": "other", "chapter": "", "text": "چنانچه تفتیش و بازرسی با حقوق اشخاص در تزاحم باشد ،در صورتی مجاز است که از حقوق آنان مهمتر باشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 140, "category": "other", "chapter": "", "text": "تفتیش و بازرسی منزل در روز به عمل میآید و در صورتی هنگام شب انجام میشود که ضرورت اقتضا کند .بازپرس دلایل ضرورت را احراز و در صورتمجلس قید میکند و در صورت امکان ،خود در محل حضور مییابد. تبصره -روز از طلوع آفتاب تا غروب آن است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 141, "category": "other", "chapter": "", "text": "دستور مقام قضایی برای ورود به منازل ،اماکن بسته و تعطیل ،تحت هر عنوان باید موردی باشد و موضوعی که تفتیش برای آن صورت میگیرد ،زمان ،دفعات ورود ،اموال ،اماکن و نشانی آنها به صراحت مشخص شود .ضابطان مکلفند ضمن رعایت دستورهای مقام قضا ئی ،کیفیت تفتیش و بازرسی و نتیجه را در صورتمجلس تنظیم کرده ،آن را به امضا یا اثر انگشت متصرف برسانند و مراتب را حداکثر ظرف بیست و چهار ساعت به مقام قضایی اعلام کنند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 142, "category": "other", "chapter": "", "text": "تفتیش و بازرسی منزل یا محل سکنای افراد در حضور متصرف یا ارشد حاضران و در صورت ضرورت با حضور شهود تحقیق ،ضمن رعایت موازین شرعی و قانونی ،حفظ نظم محل مورد بازرسی و مراعات حرمت متصرفان و ساکنان و مجاوران آن به عمل میآید. تبصره -هرگاه در محل مورد بازرسی کسی نباشد ،در صورت فوریت ،بازرسی در غیاب متصرفان و ساکنان محل ،با حضور دو نفر از اهل محل به عمل میآید و مراتب فوریت در صورتمجلس قید میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 143, "category": "other", "chapter": "", "text": "حضور اشخاصی که در امر کیفری دخیل هستند در هنگام بازرسی منوط به اجازه متصرف است؛ اما چنانچه بازپرس حضور اشخاصی را برای تحقیق ضروری بداند ،به دستور وی در محل حاضر میشوند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 144, "category": "other", "chapter": "", "text": "در صورت ضرورت ،بازپرس می تواند ورود و خروج به محل بازرسی را تا پایان بازرسی ممنوع کند و برای اجرای این دستور از نیروی انتظامی و حسب ضرورت از نیروی نظامی با هماهنگی مقامات مربوط استفاده کند که در این صورت ،نیروی نظامی زیر نظر مقام قضایی و در حکم ضابط دادگستری است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 145, "category": "other", "chapter": "", "text": "در صورتی که متصرف منزل و مکان و یا اشیای مورد بازرسی ،از بازکردن محلها و اشیای بسته خودداری کند ،بازپرس میتواند دستور بازگشایی آنها را بدهد ،اما تا حد امکان باید از اقداماتی که موجب ورود خسارت میگردد ،خودداری شود. تبصره (اصلاحی –)۱۳۹۴٫۳٫۲۴ در صورتی که در اجرای این ماده ،خسارت مادی وارد شود و به موجب تصمیم قطعی ،قرار منع یا موقوفی تعقیب و یا حکم برائت صادر شود ،همچنین مواردی که امتناع کننده شخص مجرم نباشد حتی اگر موضوع به صدور قرار جلب به دادرسی یا محکومیت متهم منجر شود ،دولت مسؤول جبران خسارت است ،مگر آنکه تقصیر بازپرس یا سایر مأموران محرز شود که در این صورت ،دولت جبران خسارت میکند و به بازپرس و یا مأموران مقصر مراجعه مینماید. متن سابق تبصره « :۱۴۵ در صورتیکه در اجرای این ماده ،خسارت مادی وارد شود و به موجب تصمیم قطعی ،قرار منع یا موقوفی تعقیب و یا حکم برائت صادر شود ،همچنین مواردی که امتناعکننده شخص مجرم نباشد حتی اگر موضوع به صدور قرار مجرمیت یا محکومیت متهم منجر شود ،دولت مسؤول جبران خسارت است ،مگر آنکه تقصیر بازپرس یا سایر مأموران محرز شود که در اینصورت ،دولت جبران خسارت میکند و به بازپرس و یا مأموران مقصر مراجعه مینماید».", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 146, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "از اوراق ،نوشته ها و سایر اشیای متعلق به متهم ،فقط آنچه راجع به جرم است تحصیل و در صورت لزوم به شهود تحقیق ارائه می شود .بازپرس مکلف است در مورد سایر نوشته ها و اشیای متعلق به متهم با احتیاط رفتار کند ،موجب افشای مضمون و محتوای غیرمرتبط آن ها با جرم نشود ،در غیر این صورت وی به جرم افشای اسرار محکوم میشود.", "explanation": "از میان اوراق و اشیای متهم، فقط آنچه مرتبط با جرم است تحصیل و در صورت لزوم به شهود ارائه می‌شود. بازپرس باید نسبت به سایر نوشته‌ها و اشیای غیرمرتبط با احتیاط رفتار کند و از افشای محتوای آن‌ها خودداری کند، وگرنه به جرم افشای اسرار محکوم می‌شود.", "notes": ["ضمانت اجرای افشای غیرمجاز محتوای غیرمرتبط: محکومیت بازپرس به جرم افشای اسرار."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۴۶ قانون آیین دادرسی کیفری، اگر بازپرس محتوای غیرمرتبط با جرم را از اوراق متهم افشا کند، چه پیامدی دارد؟", "options": ["هیچ پیامدی ندارد", "به جرم افشای اسرار محکوم می‌شود", "فقط تذکر اداری می‌گیرد", "باید خسارت مادی بپردازد"], "correct": 1, "explain": "متن ماده این پیامد کیفری (محکومیت به جرم افشای اسرار) را برای بازپرس متخلف مقرر کرده است."}]}, {"article": 147, "category": "other", "chapter": "", "text": "آلات و ادوات جرم ،از قبیل اسلحه ،اسناد و مدارک ساختگی ،سکه تقلبی و تمامی اشیائی که حین بازرسی به دست میآید و مرتبط با کشف جرم یا اقرار متهم باشد توقیف میشود و هر یک در صورتمجلس توصیف و شمارهگذاری میگردد .آنگاه در لفاف یا مکان مناسب نگهداری و رسیدی مشتمل بر ذکر مشخصات آن اشیاء به صاحب یا متصرف آنها داده میشود .مال توقیف شده با توجه به وضعیت آن در محل مناسبی که از طرف دادگستری برای این منظور تعیین میشود ،نگهداری میگردد. تبصره -شیوه نگهداری اموال و پرداخت هزینه های مربوط که از محل اعتبارات قوه قضائیه است ،به موجب آییننامهای است که ظرف سه ماه از تاریخ لازم‌الاجرا شدن این قانون توسط وزیر دادگستری تهیه میشود به تصویب رئیس قوه قضائیه میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 148, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "بازپرس در صورت صدور قرار منع ،موقوفی یا ترک تعقیب باید درباره استرداد و یا معدوم کردن اشیاء و اموال مکشوفه که دلیل یا وسیله ارتکاب جرم بوده ،از جرم تحصیل شده ،حین ارتکاب استعمال شده و یا برای استعمال اختصاص داده شده است ،تعیین تکلیف کند .در مورد ضبط این اموال یا اشیاء دادگاه تکلیف آنها را تعیین میکند. بازپرس مکلف است مادام که پرونده نزد او جریان دارد به تقاضای ذینفع و با رعایت شرایط زیر ،دستور رد اموال و اشیای مذکور را صادر کند: الف -وجود تمام یا قسمتی از آن اشیاء و اموال در بازپرسی یا دادرسی لازم نباشد. ب -اشیاء و اموال بلامعارض باشد. پ -از اشیاء و اموال نباشد که باید ضبط یا معدوم شود. تبصره –۱ در تمام امور کیفری ،دادگاه نیز باید ضمن صدور رأی ،نسبت به استرداد ،ضبط و یا معدوم کردن اشیاء و اموال موضوع این ماده تعیین تکلیف کند. تبصره –۲ متضرر از تصمیم بازپرس یا دادگاه در مورد اشیاء و اموال موضوع این ماده ،می تواند طبق مقررات اعتراض کند ،هر چند قرار بازپرس یا حکم دادگاه نسبت به امر کیفری قابل اعتراض نباشد .در این مورد ،مرجع رسیدگی به اعتراض نسبت به تصمیم بازپرس ،دادگاه و نسبت به تصمیم دادگاه ،دادگاه تجدیدنظر استان است.", "explanation": "در صورت صدور قرار منع، موقوفی یا ترک تعقیب، بازپرس باید دربارهٔ اشیاء و اموال کشف‌شده (وسیلهٔ جرم، حاصل از جرم یا ابزار ارتکاب) تعیین تکلیف کند: بازگرداندن به صاحبش یا معدوم کردن؛ اما اگر ضبط اموال مطرح باشد، تصمیم نهایی با دادگاه است.", "notes": ["تفکیک مهم: تعیین تکلیف عادی (استرداد/امحا) با بازپرس؛ اما «ضبط» اموال نیازمند تصمیم دادگاه است."], "difficulty": "hard", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۱۴۸ قانون آیین دادرسی کیفری، در صورت لزوم «ضبط» اموال مکشوفه، تصمیم نهایی با کیست؟", "options": ["بازپرس", "دادگاه", "ضابط دادگستری", "شاکی"], "correct": 1, "explain": "متن ماده تصمیم دربارهٔ ضبط اموال را در صلاحیت دادگاه قرار داده، برخلاف استرداد یا امحا که با بازپرس است."}]}, {"article": 149, "category": "other", "chapter": "", "text": "مالی که نگهداری آن مستلزم هزینه نامتناسب است و یا موجب خرابی یا کسر فاحش قیمت آن شود و حفظ مال هم برای دادرسی لازم نباشد و همچنین اموال ضایع شدنی و سریع الفساد ،در صورت عدم دسترسی به مالک حسب مورد ،به تقاضای بازپرس و موافقت دادستان و یا دستور دادگاه به قیمت روز فروخته میشود .وجه حاصل تا تعیین تکلیف نهایی در صندوق دادگستری به عنوان امانت نگهداری میشود. تبصره –۱ هرگونه دخالت و تصرف غیرمجاز و استفاده از اموال توقیفی ممنوع است. تبصره –۲ چنانچه مدعی مالکیت ،همان قیمت را پرداخت کند در اولویت خرید قرار دارد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 150, "category": "other", "chapter": "", "text": "کنترل ارتباطات مخابراتی افراد ممنوع است ،مگر در مواردی که به امنیت داخلی و خارجی کشور مربوط باشد یا برای کشف جرایم موضوع بندهای (الف)( ،ب)( ،پ) و (ت) ماده ( )۳۰۲ این قانون لازم تشخیص داده شود .در این صورت با موافقت رئیس کل دادگستری استان و با تعیین مدت و دفعات کنترل ،اقدام می شود .کنترل مکالمات تلفنی اشخاص و مقامات موضوع ماده ( )۳۰۷ این قانون منوط به تأیید رئیس قوه قضائیه است و این اختیار قابل تفویض به سایرین نمیباشد. تبصره –۱ شرایط و کیفیات کنترل ارتباطات مخابراتی به موجب مصوبه شورای عالی امنیت ملی تعیین میشود. تبصره –۲ کنترل ارتباطات مخابراتی محکومان جز به تشخیص دادگاه نخستین که رأی زیر نظر آن اجرا میشود یا قاضی اجرای احکام ممنوع است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 151, "category": "other", "chapter": "", "text": "بازپرس میتواند در موارد ضروری ،برای کشف جرم و یا دستیابی به ادله وقوع جرم ،حسابهای بانکی اشخاص را با تأیید رئیس حوزه قضایی کنترل کند. متن سابق ماده « :۱۵۱ بازپرس میتواند در موارد ضروری ،برای کشف جرم و یا دستیابی به ادله وقوع جرم ،حسابهای بانکی اشخاص را با تأیید رئیس کل دادگستری استان

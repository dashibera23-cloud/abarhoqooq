}]}, {"article": 241, "category": "other", "chapter": "", "text": "هرگاه علت بازداشت مرتفع شود و موجب دیگری برای ادامه آن نباشد ،بازپرس با موافقت دادستان فوری از متهم رفع بازداشت می کند .در صورت مخالفت دادستان با تصمیم بازپرس ،حل اختلاف با دادگاه صالح است .اگر متهم نیز موجبات بازداشت را مرتفع بداند ،میتواند فک قرار بازداشت یا تبد یل آن را از بازپرس تقاضا کند .بازپرس به طور فوری و حداکثر ظرف پنج روز به طور مستدل راجع به درخواست متهم اظهارنظر می کند .در صورت رد درخواست ،مراتب در پرونده ثبت و قرار رد به متهم ابلاغ میشود و متهم می تواند ظرف ده روز به آن اعتراض کند .متهم در هر ماه فقط یک بار میتواند این درخواست را مطرح کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 242, "category": "bazdasht", "chapter": "بخش دوم - قرارهای تأمین کیفری، بازداشت موقت", "text": "هرگاه در جرایم موضوع بندهای (الف)( ،ب)( ،پ) و (ت) ماده ( )۳۰۲ این قانون تا دو ماه و در سایر جرایم تا یک ماه به علت صدور قرار تأمین ،متهم در بازداشت بماند و پرونده اتهامی او منتهی به تصمیم نهائی در دادسرا نشود ،بازپرس مکلف به فک یا تخفیف قرار تأمین است .اگر علل موجهی برای بقای قرار وجود داشته باشد ،با ذکر علل مزبور ،قرار ،ابقا و مراتب به متهم ابلاغ میشود .متهم می تواند از این تصمیم ظرف ده روز از تاریخ ابلاغ به دادگاه صالح اعتراض کند .فک یا تخفیف قرار بدون نیاز به موافقت دادستان انجام می شود و ابقای تأمین باید به تأیید دادستان برسد و در صورت مخالفت دادستان ،حل اختلاف با دادگاه صالح است .فک ،تخفیف ،یا ابقای بازداشت موقت ،باید به تأیید دادستان برسد و در صورت مخالفت دادستان ،حل اختلاف با دادگاه صالح است .هرگاه بازداشت متهم ادامه یابد مقررات این ماده ،حسب مورد ،هر دو ماه یا هر یک ماه اعمال میشود .به هر حال ،مدت بازداشت متهم نباید از حداقل مجازات حبس مقرر در قانون برای آن جرم تجاوز کند و در هر صورت در جرایم موجب مجازات سلب حیات مدت بازداشت موقت از دو سال و در سایر جرایم از یک سال تجاوز نمیکند. تبصره –۱ نصاب حداکثر مدت بازداشت ،شامل مجموع قرارهای صادره در دادسرا و دادگاه است و سایر قرارهای منتهی به بازداشت متهم را نیز شامل میشود. تبصره –۲ تکلیف بازپرس به اظهار نظر درباره درخواست متهم ،موضوع ماده ( )۲۴۱ این قانون ،در صورتی است که وفق این ماده، نسبت به قرار اظهار نظر نشده باشد.", "explanation": "اگر متهم به دلیل قرار تأمین در بازداشت بماند (حداکثر دو ماه در جرایم شدید یا یک ماه در سایر جرایم) و پرونده هنوز در دادسرا به نتیجه نرسیده باشد، بازپرس مکلف است تأمین را فک یا تخفیف دهد؛ مگر دلایل موجهی برای ادامهٔ بازداشت وجود داشته باشد که باید مکتوب و به متهم ابلاغ شود.", "notes": ["سقف زمانی بازداشت بدون نتیجه‌گیری در دادسرا: دو ماه (جرایم موضوع بندهای الف تا ت ماده ۳۰۲) یا یک ماه (سایر جرایم)."], "difficulty": "hard", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۴۲ قانون آیین دادرسی کیفری، اگر در سایر جرایم (غیر از بندهای شدید ماده ۳۰۲)، متهم بیش از یک ماه بدون نتیجه در بازداشت بماند، بازپرس چه تکلیفی دارد؟", "options": ["هیچ تکلیفی ندارد", "مکلف به فک یا تخفیف قرار تأمین است، مگر دلایل موجهی برای ابقا وجود داشته باشد", "باید بلافاصله متهم را محکوم کند", "باید پرونده را نزد شاکی بفرستد"], "correct": 1, "explain": "متن ماده این تکلیف را برای بازپرس مقرر کرده، با امکان ابقای مستدل تأمین در صورت وجود علل موجه."}]}, {"article": 243, "category": "other", "chapter": "", "text": "بازپرس می تواند در تمام مراحل تحقیقات با رعایت مقررات این قانون ،قرار تأمین صادره را تشدید کند یا تخفیف دهد. تبصره -تشدید یا تخفیف قرار تأمین ،اعم از تبدیل نوع قرار یا تغییر مبلغ آن است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 244, "category": "other", "chapter": "", "text": "دادستان در جریان تحقیقات مقدماتی تا پیش از تنظیم کیفرخواست میتواند تشدید یا تخفیف تأمین را از بازپرس درخواست کند .هرگاه بین بازپرس و دادستان موافقت حاصل نشود ،پرونده برای رفع اختلاف به دادگاه ارسال میشود و بازپرس طبق نظر دادگاه اقدام میکند .پس از تنظیم کیفرخواست نیز دادستان میتواند حسب مورد ،از دادگاهی که پرونده در آن مطرح است ،درخواست تشدید یا تخفیف تأمین کند .متهم نیز می تواند تخفیف تأمین را درخواست کند .تقاضای فرجامخواهی نسبت به حکم ،مانع از آن نیست که دادگاه صادرکننده حکم ،به این درخواست رسیدگی کند .در صورت رد درخواست ،مراتب رد در پرونده ثبت میشود .تصمیم دادگاه در این موارد قطعی است. تبصره –۱ تقاضای دادستان یا متهم به شرح مقرر در این ماده ،در مورد تشدید یا تخفیف نمیتواند بیش از یک بار مطرح شود. تبصره –۲ چنانچه به نظر دادگاه ،قرار تأمی ن صادره متناسب نباشد ،نسبت به تخفیف یا تشدید آن اتخاذ تصمیم مینماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 245, "category": "other", "chapter": "", "text": "دادگاه صالح موضوع مواد ( )۲۴۲( ،)۲۴۰ و ( )۲۴۴ این قانون مکلف است در وقت فوقالعاده به اختلاف دادستان و بازپرس یا اعتراض متهم رسیدگی نماید .تصمیم دادگاه قطعی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 246, "category": "gharar", "chapter": "بخش دوم - قرارهای تأمین کیفری", "text": "در مواردی که پرونده متهم در دادگاه مطرح شده و از متهم قبال ً تأمین اخذ نشده یا تأمین قبلی منتفی شده باشد، دادگاه ،خود یا به تقاضای دادستان و با رعایت مقررات این قانون ،قرار تأمین یا نظارت قضایی صادر میکند .چنانچه تصمیم دادگاه منتهی به صدور قرار بازداشت موقت شود ،این قرار ،طبق مقررات این قانون ،قابل اعتراض در دادگاه تجدیدنظر استان است.", "explanation": "اگر پروندهٔ متهم در دادگاه مطرح شده و تأمین قبلی وجود نداشته یا منتفی شده باشد، دادگاه (رأساً یا به تقاضای دادستان) قرار تأمین یا نظارت قضائی صادر می‌کند. اگر این تصمیم به بازداشت موقت منجر شود، در دادگاه تجدیدنظر استان قابل اعتراض است.", "notes": ["صدور قرار تأمین در مرحلهٔ دادگاه هم ممکن است، نه فقط در دادسرا."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۴۶ قانون آیین دادرسی کیفری، اگر دادگاه در جریان رسیدگی قرار بازداشت موقت صادر کند، این قرار در کجا قابل اعتراض است؟", "options": ["دیوان عالی کشور", "دادگاه تجدیدنظر استان", "همان دادگاه صادرکننده", "قابل اعتراض نیست"], "correct": 1, "explain": "متن ماده این قرار را در دادگاه تجدیدنظر استان قابل اعتراض دانسته است."}]}, {"article": 247, "category": "other", "chapter": "", "text": "بازپرس می تواند متناسب با جرم ارتکابی ،علاوه بر صدور قرار تأمین ،قرار نظارت قضایی را که شامل یک یا چند مورد از دستورهای زیر است ،برای مدت معین صادر کند: الف -معرفی نوبهای خود به مراکز یا نهادهای تعیینشده توسط بازپرس ب -منع رانندگی با وسایل نقلیه موتوری پ -منع اشتغال به فعالیتهای مرتبط با جرم ارتکابی ت -ممنوعیت از نگهداری سلاح دارای مجوز ث -ممنوعیت خروج از کشور تبصره –۱ در جرایم تعزیری درجه هفت و هشت ،در صورت ارائه تضمین لازم برای جبران خسارات وارده ،مقام قضایی میتواند فقط به صدور قرار نظارت قضایی اکتفا کند. تبصره –۲ قرارهای موضوع این ماده ظرف ده روز قابل اعتراض در دادگاه صالح است .چنانچه این قرار توسط دادگاه صادر شود، ظرف ده روز ،قابل اعتراض در دادگاه تجدیدنظر استان میباشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 248, "category": "other", "chapter": "", "text": "مدت اعتبار قرار منع خروج از کشور شش ماه و قابل تمدید است. در صورتی که مدت مندرج در دستور منع خروج منقضی شود ،این دستور خود به خود منتفی است و مراجع مربوط نمیتوانند مانع از خروج شوند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 249, "category": "other", "chapter": "", "text": "در صورت صدور قرار ممنوعیت از نگهداری سلاح دارای مجوز ،سلاح و پروانه مربوط اخذ و به یکی از محلهای مجاز نگهداری سلاح تحویل میشود و بازپرس مراتب را به مرجع صادرکننده پروانه اعلام میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 250, "category": "gharar", "chapter": "بخش دوم - قرارهای تأمین کیفری", "text": "قرار تأمین و نظارت قضایی باید مستدل و موجه و با نوع و اهمیت جرم ،شدت مجازات ،ادله و اسباب اتهام ،احتمال فرا ر یا مخفی شدن متهم و از بین رفتن آثار جرم ،سابقه متهم ،وضعیت روحی و جسمی ،سن ،جنس ،شخصیت و حیثیت او متناسب باشد. تبصره -اخذ تأمین نامتناسب موجب محکومیت انتظامی از درجه چهار به بالا است.", "explanation": "قرار تأمین یا نظارت قضائی باید مستدل و متناسب با نوع و شدت جرم، ادلهٔ اتهام، احتمال فرار متهم، سوابق، وضعیت روحی و جسمی، سن، جنسیت و شخصیت او باشد؛ اخذ تأمین نامتناسب برای بازپرس/دادرس مجازات انتظامی دارد.", "notes": ["اصل «تناسب» تأمین با شرایط شخصی و نوع جرم، معیار اصلی این ماده است.", "اخذ تأمین نامتناسب: مجازات انتظامی درجهٔ چهار به بالا برای مقام صادرکننده."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۵۰ قانون آیین دادرسی کیفری، اخذ تأمین نامتناسب با شرایط متهم چه پیامدی برای مقام صادرکننده دارد؟", "options": ["هیچ پیامدی ندارد", "محکومیت انتظامی از درجهٔ چهار به بالا", "فقط تذکر شفاهی", "الزام به بازپرداخت هزینه‌های دادرسی"], "correct": 1, "explain": "تبصرهٔ ماده ۲۵۰ این پیامد انتظامی را برای اخذ تأمین نامتناسب مقرر کرده است."}]}, {"article": 251, "category": "other", "chapter": "", "text": "هرگاه متهم یا محکوم علیه در مواعد مقرر حاضر شود ،یا پس از آن حاضر و عذر موجه خود را اثبات کند ،با شروع به اجرای حبس و تبعید یا اقامت اجباری و با اجرای کامل سایر مجازات ها و یا صدور قرارهای منع و موقوفی و تعلیق تعقیب ،تعلیق اجرای مجازات و مختومه شدن پرونده به هر کیفیت ،قرار تأمین و نظارت قضایی لغو میشود. تبصره -در صورت الغای قرار تأمین یا نظارت قضائی ،این امر بلافاصله به مراجع مربوط اعلام میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 252, "category": "other", "chapter": "", "text": "شیوه اجرای قرارهای نظارت و بندهای (ج) و (چ) ماده ( )۲۱۷ این قانون ،به موجب آییننامهای است که ظرف شش ماه از تاریخ لازم االجرا شدن این قانون توسط وزرای دادگستری و کشور تهیه میشود و به تصویب رئیس قوه قضائیه میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 253, "category": "other", "chapter": "", "text": "در صورتی که متهم دستورهای مندرج در قرار نظارت قضایی را رعایت نماید ،بنا به درخواست وی که باید به تأیید دادستان برسد و یا پیشنهاد دادستان ،دادگاه میتواند با رعایت مقررات قانونی در مجازات وی تخفیف دهد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 254, "category": "other", "chapter": "", "text": "هرگاه متهم ا ز اجرای قرار نظارت قضایی که توأم با قرار تأمین صادر شده است ،تخلف کند ،قرار نظارت لغو و قرار تأمین ،تشدید می شود و در صورت تخلف متهم از اجرای قرار نظارت مستقل ،قرار صادره به قرار تأمین متناسب تبدیل میگردد. مفاد این ماده در حین صدور قرار نظارت قضایی به متهم ،تفهیم میشود. تبصره -در اجرای این ماده نمیتوان قرار صادره را به قرار بازداشت موقت تبدیل کرد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 255, "category": "bazdasht", "chapter": "بخش دوم - قرارهای تأمین کیفری، بازداشت موقت", "text": "اشخاصی که در جریان تحقیقات مقدماتی و دادرسی به هر علت بازداشت میشوند و از سوی مراجع قضائی ،حکم برائت یا قرار منع تعقیب در مورد آنان صادر شود ،میتوانند با رعایت ماده ( )۱۴ این قانون خسارت ایام بازداشت را از دولت مطالبه کنند.", "explanation": "کسانی که در جریان تحقیقات یا دادرسی بازداشت شده‌اند و بعداً حکم برائت یا قرار منع تعقیب دربارهٔ آن‌ها صادر می‌شود، حق دارند خسارت ایام بازداشت را از دولت مطالبه کنند؛ اما این حق مطلق نیست و طبق ماده بعد (۲۵۶) استثناهایی دارد.", "notes": ["این ماده پایهٔ نظام «جبران خسارت بازداشت ناروا» در حقوق ایران است."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۵۵ قانون آیین دادرسی کیفری، اشخاصی که بازداشت شده و سپس حکم برائت یا قرار منع تعقیب دربارهٔ آنان صادر می‌شود، چه حقی دارند؟", "options": ["هیچ حقی ندارند", "می‌توانند خسارت ایام بازداشت را از دولت مطالبه کنند", "فقط می‌توانند از بازپرس شکایت کنند", "باید شخصاً هزینه دادرسی بپردازند"], "correct": 1, "explain": "متن ماده این حق مطالبهٔ خسارت از دولت را به‌صراحت برای این اشخاص به رسمیت می‌شناسد."}]}, {"article": 256, "category": "other", "chapter": "", "text": "در موارد زیر شخص بازداشتشده مستحق جبران خسارت نیست: الف -بازداشت شخص ،ناشی از خودداری در ارائه اسناد ،مدارک و ادله بی گناهی خود باشد. ب -به منظور فراری دادن مرتکب جرم ،خود را در مظان اتهام و بازداشت قرار داده باشد. پ -به هر جهتی به ناحق موجبات بازداشت خود را فراهم آورده باشد. ت -همزمان به علت قانونی دیگر بازداشت باشد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 257, "category": "bazdasht", "chapter": "بخش دوم - بازداشت موقت، جبران خسارت", "text": "شخص بازداشت شده باید ظرف شش ماه از تاریخ ابلاغ رأی قطعی حاکی از بی گناهی خود ،درخواست جبران خسارت را به کمیسیون استانی ،متشکل از سه نفر از قضات دادگاه تجدیدنظر استان به انتخاب رئیس قوه قضائیه تقدیم کند .کمیسیون در صورت احراز شرایط مقرر در این قانون ،حکم به پرداخت خسارت صادر میکند .در صورت رد درخواست ،این شخص میتواند ظرف بیست روز از تاریخ ابلاغ ،اعتراض خود را به کمیسیون موضوع ماده ( )۲۵۸ این قانون اعلام کند.", "explanation": "شخص بازداشت‌شده‌ای که برائتش قطعی شده، باید ظرف شش ماه از ابلاغ رأی، درخواست جبران خسارت را به کمیسیونی سه‌نفره از قضات دادگاه تجدیدنظر استان بدهد. اگر کمیسیون رد کند، ظرف بیست روز قابل اعتراض در دیوان عالی کشور است.", "notes": ["مهلت درخواست جبران خسارت: شش ماه از ابلاغ رأی برائت قطعی.", "مرجع رسیدگی: کمیسیون سه‌نفرهٔ قضات دادگاه تجدیدنظر استان.", "مهلت اعتراض به رد کمیسیون: بیست روز."], "difficulty": "hard", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۵۷ قانون آیین دادرسی کیفری، شخص بازداشت‌شده باید ظرف چه مدتی از ابلاغ رأی برائت قطعی، درخواست جبران خسارت بدهد؟", "options": ["یک ماه", "سه ماه", "شش ماه", "یک سال"], "correct": 2, "explain": "متن ماده این مهلت را «شش ماه از تاریخ ابلاغ رأی قطعی» تعیین کرده است."}]}, {"article": 258, "category": "other", "chapter": "", "text": "رسیدگی به اعتراض شخص بازداشتشده ،در کمیسیون ملی جبران خسارت متشکل از رئیس دیوان عالی کشور یا یکی از معاونان وی و دو نفر از قضات دیوان عالی کشور به انتخاب رئیس قوه قضائیه به عمل میآید .رأی کمیسیون قطعی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 259, "category": "other", "chapter": "", "text": "جبران خسارت موضوع ماده ( )۲۵۵ این قانون بر عهده دولت است و در صورتی که بازداشت بر اثر اعلام مغرضانه جرم ،شهادت کذب و یا تقصیر مقامات قضایی باشد ،دولت پس از جبران خسارت میتواند به مسؤول اصلی مراجعه کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 260, "category": "other", "chapter": "", "text": "به منظور پرداخت خسارت موضوع ماده ( )۲۵۵ این قانون ،صندوقی در وزارت دادگستری تأسیس میشود که بودجه آن هر سال از محل بودجه کل کشور تأمین میگردد .این صندوق زیر نظر وزیر دادگستری اداره میشود و اجرای آرای صادره از کمیسیون بر عهده وی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 261, "category": "other", "chapter": "", "text": "شیوه رسیدگی و اجرای آرای کمیسیونهای موضوع مواد ( )۲۵۷ و ( )۲۵۸ این قانون ،به موجب آییننامهای است که ظرف سه ماه از تاریخ لازم االجرا شدن این قانون توسط وزیر دادگستری تهیه میشود و به تصویب رئیس قوه قضائیه میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 262, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "با زپرس پس از پایان تحقیقات و در صورت وجود دلایل کافی بر وقوع جرم ،به متهم یا وکیل وی اعلام میکند که برای برائت یا کشف حقیقت هر اظهاری دارد به عنوان آخرین دفاع بیان کند .هرگاه متهم یا وکیل وی در آخرین دفاع ،مطلبی اظهار کند یا مدرکی ابراز نماید که در کشف حقیق ت یا برائت مؤثر باشد ،بازپرس مکلف به رسیدگی است.", "explanation": "پس از پایان تحقیقات، بازپرس به متهم یا وکیلش اعلام می‌کند که به‌عنوان «آخرین دفاع»، هر اظهاری برای برائت یا کشف حقیقت دارد بیان کند. اگر در این مرحله مطلب یا مدرک مؤثری ارائه شود، بازپرس مکلف به رسیدگی به آن است.", "notes": ["«آخرین دفاع» آخرین فرصت متهم پیش از تصمیم‌گیری نهایی بازپرس است و اگر نکتهٔ مؤثری داشته باشد، باید بررسی شود، نه نادیده گرفته شود."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۶۲ قانون آیین دادرسی کیفری، اگر متهم در «آخرین دفاع» مدرک مؤثری ارائه دهد، بازپرس چه تکلیفی دارد؟", "options": ["می‌تواند نادیده بگیرد", "مکلف به رسیدگی به آن است", "باید پرونده را ببندد", "باید آن را به دادگاه بدون بررسی بفرستد"], "correct": 1, "explain": "متن ماده رسیدگی به مطلب یا مدرک مؤثر ارائه‌شده در آخرین دفاع را تکلیف بازپرس دانسته است."}]}, {"article": 263, "category": "other", "chapter": "", "text": "در صورتی که متهم یا وکیل وی برای اخذ آخرین دفاع احضار شود و هیچ یک از آنان بدون اعلام عذر موجه ،حضور نیابد ،بدون اخذ آخرین دفاع ،اتخاذ تصمیم میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 264, "category": "other", "chapter": "", "text": "پس از انجام تحقیقات لازم و اعلام کفایت و ختم تحقیقات ،بازپرس مکلف است به صورت مستدل و مستند ،عقیده خود را حداکثر ظرف پنج روز در قالب قرار مناسب ،اعلام کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 265, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "بازپرس در صورت جرم بودن عمل ارتکابی و وجود ادله کافی برای انتساب جرم به متهم ،قرار جلب به دادرسی و در صورت جرم نبودن عمل ارتکابی و یا فقدان ادله کافی برای انتساب جرم به متهم ،قرار منع تعقیب صادر و پرونده را فوری نزد دادستان ارسال می کند .دادستان باید ظرف سه روز از تاریخ وصول ،پرونده تحقیقات را ملاحظه و نظر خود را به طور کتبی اعلام کند و پرونده را نزد بازپرس برگرداند .چنانچه مورد از موارد موقوفی تعقیب باشد ،قرار موقوفی تعقیب صادر و وفق مقررات فوق اقدام میشود.", "explanation": "در پایان تحقیقات، بازپرس بر اساس وجود یا عدم وجود ادلهٔ کافی، یکی از دو قرار «جلب به دادرسی» (اگر جرم بودن عمل و ادلهٔ کافی احراز شود) یا «منع تعقیب» (در غیر این صورت) را صادر می‌کند و پرونده را نزد دادستان می‌فرستد که ظرف سه روز باید نظر کتبی بدهد.", "notes": ["دو قرار کلیدی پایان تحقیقات مقدماتی: جلب به دادرسی (ادامهٔ پرونده به سمت دادگاه) یا منع تعقیب (پایان پرونده).", "مهلت اظهارنظر دادستان پس از دریافت پرونده: سه روز."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۶۵ قانون آیین دادرسی کیفری، دادستان پس از وصول پرونده از بازپرس، ظرف چه مدتی باید نظر خود را اعلام کند؟", "options": ["ظرف یک روز", "ظرف سه روز", "ظرف یک هفته", "ظرف یک ماه"], "correct": 1, "explain": "متن ماده مهلت اظهارنظر دادستان را «ظرف سه روز از تاریخ وصول» تعیین کرده است."}]}, {"article": 266, "category": "other", "chapter": "", "text": "چنانچه دادستان تحقیقات بازپرس را کامل نداند ،صرفا ً مواردی را که برای کشف حقیقت لازم است به تفصیل و بدون هرگونه ابهام در پرونده درج میکند و تکمیل آن را میخواهد .در این صورت ،بازپرس مکلف به انجام این تحقیقات است. تبصره -هرگونه درخواست تکمیل تحقیقات که برای کشف حقیقت لازم نباشد ،موجب محکومیت انتظامی تا درجه سه است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 267, "category": "other", "chapter": "", "text": "در صورت موافقت دادستان با قرار بازپرس ،در خصوص عدم صلاحیت ،پرونده به مرجع صالح ارسال میشود و در موارد موقوفی یا منع تعقیب ،بازپرس مراتب را به طرفین ابلاغ می کند .در این صورت ،قرار تأمین و قرار نظارت قضایی ملغی میگردد و چنانچه متهم بازداشت باشد ،بلافاصله آزاد میشود .قاضی مربوط مکلف است از قرار تأمین مأخوذه رفع اثر نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 268, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "در صورتی که عقیده دادستان و بازپرس بر جلب متهم به دادرسی باشد ،دادستان ظرف دو روز با صدور کیفرخواست، از طریق شعبه بازپرسی بلافاصله پرونده را به دادگاه صالح ارسال میکند.", "explanation": "اگر هم دادستان و هم بازپرس بر جلب متهم به دادرسی هم‌عقیده باشند، دادستان باید ظرف دو روز با صدور کیفرخواست، پرونده را به دادگاه صالح ارسال کند.", "notes": ["مهلت صدور کیفرخواست پس از توافق دادستان و بازپرس: دو روز."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۶۸ قانون آیین دادرسی کیفری، در صورت توافق دادستان و بازپرس بر جلب متهم به دادرسی، دادستان ظرف چه مهلتی باید کیفرخواست صادر کند؟", "options": ["ظرف دو روز", "ظرف یک هفته", "ظرف ده روز", "بدون مهلت مشخص"], "correct": 0, "explain": "متن ماده مهلت صدور کیفرخواست را «ظرف دو روز» تعیین کرده است."}]}, {"article": 269, "category": "other", "chapter": "", "text": "در هر مورد که دادستان با عقیده بازپرس مخالف باشد و بازپرس بر عقیده خود اصرار کند ،پرونده برای حل اختلاف، به دادگاه صالح ارسال و طبق تصمیم دادگاه عمل میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 270, "category": "gharar", "chapter": "بخش دوم - قرارهای تأمین کیفری", "text": "علاوه بر موارد مقرر در این قانون ،قرارهای بازپرس در موارد زیر قابل اعتراض است: الف -قرار منع و موقوفی تعقیب و اناطه به تقاضای شاکی ب -قرار بازداشت موقت ،ابقا و تشدید تأمین به تقاضای متهم پ -قرار تأمین خواسته به تقاضای متهم تبصره -مهلت اعتراض به قرارهای قابل اعتراض برای اشخاص مقیم ایران ده روز و برای افراد مقیم خارج از کشور یک ماه از تاریخ ابلاغ است.", "explanation": "قرارهای بازپرس در مواردی مثل منع/موقوفی تعقیب و اناطه (به تقاضای شاکی) یا بازداشت موقت و تشدید تأمین (به تقاضای متهم) قابل اعتراض‌اند. مهلت اعتراض برای مقیمان ایران ده روز و برای مقیمان خارج از کشور یک ماه از تاریخ ابلاغ است.", "notes": ["مهلت اعتراض: ۱۰ روز (مقیم ایران) یا ۱ ماه (مقیم خارج از کشور) از تاریخ ابلاغ."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۷۰ قانون آیین دادرسی کیفری، مهلت اعتراض به قرارهای قابل اعتراض بازپرس برای اشخاص مقیم ایران چقدر است؟", "options": ["سه روز", "ده روز", "یک ماه", "دو ماه"], "correct": 1, "explain": "متن ماده این مهلت را برای مقیمان ایران «ده روز» از تاریخ ابلاغ تعیین کرده است."}]}, {"article": 271, "category": "other", "chapter": "", "text": "مرجع حل اختلاف بین دادستان و بازپرس و رسیدگی به اعتراض شاکی یا متهم نسبت به قرارهای قابل اعتراض ،با دادگاهی است که صلاحیت رسیدگی به آن اتهام را دارد .چنانچه دادگاه انقلاب یا دادگاه کیفری یک در حوزه قضایی دادسرا تشکیل نشده باشد ،دادگاه کیفری دو محل ،صالح به رسیدگی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 272, "category": "other", "chapter": "", "text": "در صورت اختلاف دادستان و بازپرس در صلاحیت ،نوع جرم یا مصادیق قانونی آن ،حل اختلاف با دادگاه کیفری دویی است که دادسرا در معیت آن انجام وظیفه میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 273, "category": "other", "chapter": "", "text": "حل اختلاف بین بازپرس و دادستان و رسیدگی به اعتراض شاکی یا متهم نسبت به قرارهای قابل اعتراض ،در جلسه فوقالعاده دادگاه صورت میگیرد .تصمیم دادگاه در این خصوص قطعی است ،مگر در مورد قرارهای منع یا موقوفی تعقیب در جرایم موضوع بندهای (الف)( ،ب)( ،پ) و (ت) ماده ( )۳۰۲ این قانون که در صورت تأیید ،این قرارها مطابق مقررات قابل تجدیدنظر است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 274, "category": "other", "chapter": "", "text": "دادگاه در صورتی که اعتراض شاکی به قرار منع یا موقوفی تعقیب را موجه بداند ،آن را نقض و قرار جلب به دادرسی صادر می کند .در مواردی که به نظر دادگاه ،تحقیقات دادسرا کامل نباشد ،بدون نقض قرار میتواند تکمیل تحقیقات را از دادسرا بخواهد یا خود اقدام به تکمیل تحقیقات کند .موارد نقص تحقیق باید به تفصیل و بدون هرگونه ابهام در تصمیم دادگاه قید شود. در صورت نقض قرار اناطه توسط دادگاه ،بازپرس تحقیقات خود را ادامه میدهد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 275, "category": "other", "chapter": "", "text": "هرگاه پرونده برای تکمیل تحقیقات به دادسرا اعاده شود ،دادسرای مربوط با انجام تحقیقات مورد نظر دادگاه ،بدون صدور قرار ،مجددا ً پرونده را به دادگاه ارسال میک ند و اگر در تحقیقات مورد نظر دادگاه ابهامی بیابد ،مراتب را برای رفع ابهام از دادگاه استعلام میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 276, "category": "other", "chapter": "", "text": "در صورت نقض قرار منع تعقیب و صدور قرار جلب به دادرسی توسط دادگاه ،بازپرس مکلف است متهم را احضار و موضوع اتهام را به او تفهیم کند و با اخذ آخرین دفاع و تأمین مناسب از وی ،پرونده را به دادگاه ارسال نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 277, "category": "other", "chapter": "", "text": "در صورت نقض قرار موقوفی تعقیب ،بازپرس مطابق مقررات و صرف نظر از جهتی که علت نقض قرار موقوفی تعقیب است ،به پرونده رسیدگی و با انجام تحقیقات لازم ،تصمیم مقتضی اتخاذ میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 278, "category": "other", "chapter": "", "text": "هرگاه به علت جرم نبودن عمل ارتکابی ،قرار منع تعقیب صادر و به هر دلیل قطعی شود ،نمیتوان بار دیگر متهم را به همان اتهام تعقیب کرد .هرگاه به علت فقدان یا عدم کفایت دلیل ،قرار منع تعقیب صادر و در دادسرا قطعی شود ،نمیتوان بار دیگر متهم را به همان اتهام تعقیب کرد ،مگر پس از کشف دلیل جدید که در این صورت ،با نظر دادستان برای یک بار قابل تعقیب است و اگر این قرار در دادگاه قطعی شود ،پس از کشف دلیل جدید به درخواست دادستان میتوان او را برای یک بار با اجازه دادگاه صالح برای رسیدگی به اتهام ،تعقیب کرد .در صورتی که دادگاه ،تعقیب مجدد را تجویز کند ،بازپرس مطابق مقررات رسیدگی میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 279, "category": "tahghigh", "chapter": "بخش دوم - تحقیقات مقدماتی", "text": "در کیفرخواست موارد زیر قید میشود: الف -مشخصات متهم ،شامل نام ،نام خانوادگی ،نام پدر ،شهرت ،سن ،شغل ،شماره ملی ،شماره شناسنامه ،تابعیت ،مذهب، محل اقامت و وضعیت تأهل او ب -آزاد ،تحت قرار تأم ین یا نظارت قضایی بودن متهم و نوع آن و یا بازداشت بودن وی با قید علت و تاریخ شروع بازداشت پ -نوع اتهام ،تاریخ و محل وقوع جرم اعم از بخش ،دهستان ،روستا ،شهر ،ناحیه ،منطقه ،خیابان و کوچه ت -ادله انتساب اتهام ث -مستند قانونی اتهام ج -سابقه محکومیت مؤثر کیفری متهم چ -خلاصه پرونده شخصیت یا وضعیت روانی متهم تبصره -هرگاه در صدور کیفرخواست ،سهو قلم یا اشتباه بین صورت گیرد ،تا پیش از ارسال به دادگاه ،دادستان آن را اصلاح و پس از ارسال کیفرخواست به دادگاه ،موارد اصلاحی آن را به دادگاه اعلام میکند.", "explanation": "این ماده اجزای الزامی کیفرخواست را برمی‌شمرد: مشخصات کامل متهم، وضعیت تأمین یا بازداشت او، نوع و زمان و مکان جرم، ادلهٔ انتساب اتهام، مستند قانونی، سابقهٔ کیفری مؤثر، و خلاصهٔ پروندهٔ شخصیت.", "notes": ["کیفرخواست سند رسمی دادستان برای درخواست محاکمهٔ متهم در دادگاه است و باید تمام این هفت بند را داشته باشد."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "کدام مورد زیر جزو مندرجات الزامی کیفرخواست طبق ماده ۲۷۹ نیست؟", "options": ["مشخصات متهم", "ادلهٔ انتساب اتهام", "نظر شخصی دادستان دربارهٔ میزان مجازات مطلوب", "مستند قانونی اتهام"], "correct": 2, "explain": "کیفرخواست باید حاوی ادله و مستندات باشد، اما نظر شخصی دادستان دربارهٔ میزان مطلوب مجازات جزو بندهای الزامی این ماده نیست؛ تعیین مجازات با دادگاه است."}]}, {"article": 280, "category": "other", "chapter": "", "text": "عنوان اتهامی که در کیفرخواست ذکر می شود ،مانع از تعیین عنوان صحیح قانونی توسط دادگاه نیست .در صورتی که مجموع اعمال ارتکابی متهم در نتیجه تحقیقات دادسرا روشن باشد و دادگاه فقط عنوان اتهام را نادرست تشخیص دهد ،مکلف است اتهام جدید را به متهم تفهیم ،تا از اتهام انتسابی مطابق مقررات دفاع کند و سپس مبادرت به صدور رأی نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 281, "category": "other", "chapter": "", "text": "هرگاه قبل از ارسال پرونده به دادگاه ،موجبی برای آزادی متهم یا تبدیل قرار تأمین به وجود آید ،دادسرا با رعایت مقررات قانونی اقدام میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 282, "category": "other", "chapter": "", "text": "دادستان نمیتواند پس از ارسال پرونده به دادگاه از اصل اتهام یا ادله آن عدول و بر این اساس کیفرخواست را مسترد یا اصلاح کند و فقط میتواند دلایل جدید له یا علیه متهم را که کشف یا حادث میشود به دادگاه اعلام کند.", "explanation": "پس از ارسال پرونده به دادگاه، دادستان دیگر نمی‌تواند از اصل اتهام یا ادلهٔ آن عدول کرده و کیفرخواست را پس بگیرد یا اصلاح کند؛ فقط می‌تواند دلایل جدید له یا علیه متهم را که بعداً کشف می‌شود، به دادگاه اعلام کند.", "notes": ["پس از ارسال پرونده به دادگاه، کیفرخواست غیرقابل استرداد یا اصلاح توسط دادستان است."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۸۲ قانون آیین دادرسی کیفری، آیا دادستان پس از ارسال پرونده به دادگاه می‌تواند کیفرخواست را مسترد یا اصلاح کند؟", "options": ["بله، هر زمان که بخواهد", "خیر، فقط می‌تواند دلایل جدید را به دادگاه اعلام کند", "فقط با اجازهٔ متهم", "فقط در جرایم سبک"], "correct": 1, "explain": "متن ماده این امکان استرداد یا اصلاح را از دادستان سلب کرده و فقط اعلام دلایل جدید را مجاز دانسته است."}]}, {"article": 283, "category": "other", "chapter": "", "text": "پس از صدور کیفرخواست و قبل از ارسال به دادگاه ،هرگاه شاکی در جرایم قابلگذشت ،رضایت قطعی خود را به دادستان اعلام کند ،در صورت وجود پرونده در دادسرا ،دادستان از کیفرخواست عدول میکند .در این صورت ،قرار موقوفی تعقیب توسط بازپرس صادر میشود .در جرایم غیرقابل گذشت ،هرگاه شاکی رضایت قطعی خود را اعلام کند ،دادستان در صورت فراهم بودن شرایط صدور قرار تعلیق تعقیب ،می تواند از کیفرخواست عدول و تعقیب را معلق کند و در صورتی که در نتیجه رضایت شاکی نوع مجازات تغییر کند ،دادستان از کیفرخواست قبلی عدول و بر این اساس کیفرخواست جدید صادر میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 284, "category": "other", "chapter": "", "text": "در صورت انتساب اتهامات متعدد به متهم که رسیدگی به آنها در صلاحیت ذاتی دادگاههای مختلف است ،کیفرخواست جداگانه خطاب به هر یک از دادگاههای صالح صادر میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 285, "category": "other", "chapter": "", "text": "در معیت دادگاه اطفال و نوجوانان و در محل آن ،شعبهای از دادسرای عمومی و انقلاب با عنوان دادسرای ویژه نوجوانان به سرپرستی یکی از معاونان دادستان و با حضور یک یا چند بازپرس ،تشکیل می شود .تحقیقات مقدماتی جرایم افراد پانزده تا هجده سال به جز جرایم موضوع مواد ( )۳۰۶ و ( )۳۴۰ این قانون که به طور مستقیم از سوی دادگاه صورت میگیرد ،در این دادسرا به عمل میآید. تبصره –۱ تحقیقات مقدماتی تمامی جرایم افراد زیر پانزده سال به طور مستقیم در دادگاه اطفال و نوجوانان به عمل میآید و دادگاه مذکور کلیه وظایفی را که طبق قانون بر عهده ضابطان دادگستری و دادسرا است انجام میدهد. تبصره –۲ در جرایم مشهود ،هرگاه مرتکب ،طفل یا نوجوان باشد ،ضابطان دادگستری مکلفند نسبت به حفظ آلات ،ادوات ،آثار، علائم و دلایل جرم اقدام نمایند ،لکن اجازه تحقیقات مقدماتی از طفل یا نوجوان را ندارند و در صورت دستگیری وی ،موظفند متهم را حسب مورد ،فوری به دادسرا یا دادگاه اطفال و نوجوانان تحویل دهند .انقضای وقت اداری و نیز ایام تعطیل مانع از رجوع به دادسرا یا دادگاه اطفال و نوجوانان نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 286, "category": "other", "chapter": "", "text": "علاوه بر موارد مذکور در ماده ( )۲۰۳ این قانون ،در جرایم تعزیری درجه پنج و شش نیز ،تشکیل پرونده شخصیت در مورد اطفال و نوجوانان توسط دادسرا یا دادگاه اطفال و نوجوانان الزامی است. متن سابق ماده « :۲۸۶ عالوه بر موارد مذکور در ماده ( )۳۰۲ این قانون ،در جرائم تعزیری درجه پنج و شش نیز ،تشکیل پرونده شخصیت در مورد اطفال و نوجوانان توسط دادسرا یا دادگاه اطفال و نوجوانان الزامی است».", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 287, "category": "other", "chapter": "", "text": "در جریان تحقیقات مقدماتی ،م رجع قضایی حسب مورد ،اطفال و نوجوانان موضوع این قانون را به والدین ،اولیا ،یا سرپرست قانونی یا در صورت فقدان یا عدم دسترسی و یا امتناع از پذیرش آنان ،به هر شخص حقیقی یا حقوقی که مصلحت بداند ،می سپارد .اشخاص مذکور ملتزمند هرگاه حضور طفل یا نوجوان لازم باشد او را به مرجع قضایی معرفی نمایند. افراد پانزده تا هجده سال نیز شخصا ً ملزم به معرفی خود به دادگاه میباشند. در صورت ضرورت ،اخذ کفیل یا وثیقه تنها از متهمان بالای پانزده سال امکان پذیر است .در صورت عجز از معرفی کفیل یا ایداع وثیقه و یا در مورد جرایم پیشبینیشده در ماده ( )۲۳۷ این قانون ،دادسرا یا دادگاه میتواند با رعایت ماده ( )۲۳۸ این قانون ،قرار نگهداری موقت آنان را در کانون اصلاح و تربیت صادر کند. تبصره -قرار نگهداری موقت ،تابع کلیه آثار و احکام قرار بازداشت موقت است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 288, "category": "other", "chapter": "", "text": "دادستان کل کشور بر کلیه دادسراهای عمومی و انقلاب و نظامی نظارت دارد و به منظور حسن اجرای قوانین و ایجاد هماهنگی بین دادسراها می تواند اقدام به بازرسی کند و تذکرات و دستورهای لازم را خطاب به مراجع قضایی مذکور صادر نماید. همچنین وی پیشنهادهای لازم را به رئیس قوه قضائیه و سایر مراجع قضایی و اجرائی ذیربط ارائه میکند. تبصره –۱ چنانچه دادستان کل کشور در اجرای وظایف مقرر در این فصل و سایر وظایف قانونی خود ،به موارد تخلف یا جرم برخورد نماید حسب مورد مراتب را برای تعقیب قانونی به دادسرای انتظامی قضات ،مراجع قضایی یا اداری صالح اعلام میکند. تبصره –۲ کلیه مراجع قضایی و قضات مکلفند همکاریهای لازم را در اعمال نظارت دادستان کل کشور انجام دهند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 289, "category": "kolliyat", "chapter": "بخش اول - کلیات، فصل چهارم: دادسرا", "text": "دادستان کل کشور می تواند انتصاب ،جا به جایی و تغییر شغل و محل خدمت مقامات قضایی دادسراها را به رئیس قوه قضائیه پیشنهاد دهد. تبصره –۱ پیشنهاد انتصاب ،جا به جایی و تغییر شغل و محل خدمت دادستان های عمومی سراسر کشور پس از کسب نظر موافق از رئیس کل دادگستری استان ذیربط با دادستان کل کشور است. تبصره –۲ پیشنهاد انتصاب ،جا به جایی و تغییر شغل و محل خدمت دادستانهای نظامی پس از کسب نظر موافق از رئیس سازمان قضایی نیروهای مسلح با دادستان کل کشور است.", "explanation": "دادستان کل کشور می‌تواند جابه‌جایی و تغییر شغل مقامات قضائی دادسراها را به رئیس قوهٔ قضائیه پیشنهاد دهد؛ برای دادستان‌های عمومی سراسر کشور، این پیشنهاد نیازمند نظر موافق رئیس کل دادگستری همان استان است.", "notes": ["پیشنهاد جابه‌جایی دادستان‌های عمومی، نیازمند هماهنگی با رئیس کل دادگستری همان استان است."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۸۹ قانون آیین دادرسی کیفری، پیشنهاد انتصاب و جابه‌جایی دادستان‌های عمومی سراسر کشور توسط دادستان کل، نیازمند نظر موافق کیست؟", "options": ["وزیر دادگستری", "رئیس کل دادگستری استان ذی‌ربط", "رئیس‌جمهور", "شورای نگهبان"], "correct": 1, "explain": "تبصرهٔ ۱ این ماده کسب نظر موافق از رئیس کل دادگستری استان ذی‌ربط را الزامی دانسته است."}]}, {"article": 290, "category": "other", "chapter": "", "text": "دادستان کل کشور مکلف است در جرایم راجع به اموال ،منافع و مصالح ملی و خسارت وارده به حقوق عمومی که نیاز به طرح دعوی دارد از طریق مراجع ذیصلاح داخلی ،خارجی و یا بینالمللی پیگیری و نظارت نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 291, "category": "other", "chapter": "", "text": "در مواردی که مطابق قانون ،تعقیب و رسیدگی به تخلفات مقامات و مسؤولان کشوری به عهده دیوان عالی کشور است، اقدامات مقدماتی و انجام تحقیقات لازم توسط دادسرای دیوان عالی کشور صورت میگیرد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 292, "category": "other", "chapter": "", "text": "کلیه مراجع قضایی مکلف ند در موارد قانونی پس از اتخاذ تصمیم بر ممنوعیت خروج اشخاص از کشور ،مراتب را به دادستانی کل کشور ارسال دارند تا از آن طریق به مراجع ذیربط اعلام گردد. تبصره -دادستان کل کشور در موارد انقضای مدت قانونی ممنوعیت خروج از کشور اشخاص و عدم تمدید آن توسط مراجع مربوطه، نسبت به رفع ممنوعیت خروج اقدام میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 293, "category": "other", "chapter": "", "text": "هرگاه در موارد حقوق عامه و دعاوی راجع به دولت ،امور خیریه و اوقاف عامه و امور محجورین و غائب مفقودالاثر بی سرپرست حکم قطعی صادر شود و دادستان کل کشور حکم مذکور را خلاف شرع بین و یا قانون تشخیص دهد به طور مستدل مراتب را جهت اعمال ماده ( )۴۷۷ به رئیس قوه قضائیه اعلام میکند. متن سابق ماده « :۲۹۳ هرگاه در موارد حقوق عامه و دعاوی راجع به دولت ،امور خیریه و اوقاف عامه و امور محجورین و غایب مفقودالاثر بیسرپرست حکم قطعی صادر شود و دادستان کل کشور حکم مذکور را خلاف بی ّن موازین شرعی و یا قانونی تشخیص دهد بهطور مستدل از دیوان عالی کشور درخواست نقض حکم را مینماید .دیوان عالی کشور در صورت پذیرش تقاضا ،رأی صادره را نقض و پرونده را جهت رسیدگی مجدد به شعبه همعرض دادگاه صادرکننده حکم قطعی ارجاع مینماید».", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 294, "category": "salahiyat", "chapter": "بخش سوم - تشکیلات و صلاحیت دادگاه‌های کیفری", "text": "دادگاه های کیفری به دادگاه کیفری یک ،دادگاه کیفری دو ،دادگاه انقلاب ،دادگاه اطفال و نوجوانان و دادگاههای نظامی تقسیم میشود.", "explanation": "این ماده انواع دادگاه‌های کیفری را برمی‌شمرد: دادگاه کیفری یک، دادگاه کیفری دو، دادگاه انقلاب، دادگاه اطفال و نوجوانان، و دادگاه‌های نظامی.", "notes": ["پنج نوع دادگاه کیفری: کیفری یک، کیفری دو، انقلاب، اطفال و نوجوانان، نظامی."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۹۴ قانون آیین دادرسی کیفری، دادگاه‌های کیفری به چند دسته تقسیم می‌شوند؟", "options": ["دو دسته", "سه دسته", "پنج دسته: کیفری یک، کیفری دو، انقلاب، اطفال و نوجوانان، نظامی", "هفت دسته"], "correct": 2, "explain": "متن ماده دقیقاً همین پنج نوع دادگاه کیفری را نام می‌برد."}]}, {"article": 295, "category": "other", "chapter": "", "text": "دادگاه کیفری دو با حضور رئیس یا دادرس علیالبدل در حوزه قضایی هر شهرستان تشکیل میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 296, "category": "other", "chapter": "", "text": "دادگاه کیفری یک دارای رئیس و دو مستشار است که با حضور دو عضو نیز رسمیت مییابد. در صورت عدم حضور رئیس ،ریاست دادگاه به عهده عضو مستشاری است که سابقه قضایی بیشتری دارد. متن سابق ماده « :۲۹۶ دادگاه کیفری یک با حضور رئیس و دو مستشار و در غیاب رئیس با حضور سه مستشار تشکیل میشود .در این وضعیت ریاست دادگاه به عهده عضو مستشاری است که سابقه قضائی بیشتری دارد». تبصره –۱ دادگاه کیفری یک در مرکز استان و به تشخیص رئیس قوه قضائیه در حوزه قضایی شهرستانها تشکیل میشود .در حوزه هایی که این دادگاه تشکیل نشده است ،به جرایم موضوع صلاحیت آن در نزدیکترین دادگاه کیفری یک در حوزه قضایی آن استان رسیدگی میشود. تبصره –۲ دادرس علیالبدل حسب مورد می تواند به جای رئیس یا مستشار انجام وظیفه کند .همچنین با انتخاب رئیس کل دادگستری استان ،عضویت مستشاران دادگاه های تجدیدنظر در دادگاه کیفری یک و دادگاه انقلاب در مواردی که با تعدد قاضی رسیدگی میکند بلامانع است. تبصره –۳ دادگاه های کیفری استان و عمومی جزائی موجود به ترتیب به دادگاههای کیفری یک و دو تبدیل میشوند .جرایمی که تا تاریخ لازم‌الاجرا شدن این قانون در دادگاه ثبت شده است ،از نظر صلاحیت رسیدگی تابع مقررات زمان ثبت است و سایر مقررات رسیدگی طبق این قانون در همان شعب مرتبط انجام می شود .این تبصره در مورد دادگاه انقلاب و دادگاههای نظامی نیز جاری است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 297, "category": "salahiyat", "chapter": "بخش سوم - تشکیلات و صلاحیت دادگاه‌های کیفری", "text": "دادگاه انقلاب در مرکز هر استان و به تشخیص رئیس قوه قضائیه در حوزه قضایی شهرستانها تشکیل می شود .این دادگاه برای رسیدگی به جرایم موجب مجازات مندرج در بندهای (الف)( ،ب)( ،پ) و (ت) ماده ( )۳۰۲ این قانون دارای رئیس و دو مستشار است که با دو عضو نیز رسمیت دارد .دادگاه برای رسیدگی به سایر موضوعات با حضور رئیس یا دادرس علیالبدل یا یک مستشار تشکیل میشود. متن سابق ماده « :۲۹۷ دادگاه انقلاب برای رسیدگی به جرائم موجب مجازات مندرج در بندهای (الف)( ،ب)( ،پ) و (ت) ماده ( )۳۰۲ این قانون با حضور رئیس و دو مستشار تشکیل میشود .دادگاه برای رسیدگی به سایر موضوعات با حضور رئیس یا دادرس علیالبدل یا توسط یک مستشار تشکیل میشود». تبصره -مقررات دادرسی دادگاه کیفری یک به شرح مندرج در این قانون در دادگاه انقلاب ،در مواردی که با تعدد قاضی رسیدگی میکند جاری است.", "explanation": "دادگاه انقلاب در مرکز هر استان و به تشخیص رئیس قوهٔ قضائیه در شهرستان‌ها هم تشکیل می‌شود. برای رسیدگی به جرایم بسیار شدید (بندهای الف تا ت مادهٔ ۳۰۲)، این دادگاه با رئیس و دو مستشار (یا حداقل دو عضو) تشکیل می‌شود؛ برای سایر موضوعات، با حضور رئیس یا دادرس علی‌البدل یا یک مستشار کافی است.", "notes": ["برای جرایم شدید در دادگاه انقلاب: نیاز به تعدد قاضی (سه یا حداقل دو نفر).", "برای سایر موضوعات: قاضی واحد کافی است."], "difficulty": "hard", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۲۹۷ قانون آیین دادرسی کیفری، برای رسیدگی به جرایم بسیار شدید در دادگاه انقلاب، این دادگاه چگونه تشکیل می‌شود؟", "options": ["با یک قاضی واحد", "با رئیس و دو مستشار (یا حداقل دو عضو)", "با هیئت منصفه", "با پنج قاضی"], "correct": 1, "explain": "متن ماده تشکیل با رئیس و دو مستشار (با رسمیت حداقل دو عضو) را برای این جرایم مقرر کرده است."}]}, {"article": 298, "category": "other", "chapter": "", "text": "دادگاه اطفال و نوجوانان با حضور یک قاضی و یک مشاور تشکیل میشود .نظر مشاور ،مشورتی است. متن سابق ماده « :۲۹۸ دادگاه اطفال و نوجوانان با حضور یک قاضی و دو مشاور تشکیل میشود .نظر مشاوران ،مشورتی است». تبصره -در هر حوزه قضایی شهرستان یک یا چند شعبه دادگاه اطفال و نوجوانان بر حسب نیاز تشکیل میشود .تا زمانی که دادگاه اطفال و نوجوانان در محلی تشکیل نشده است ،به کلیه جرایم اطفال و نوجوانان به جز جرایم مشمول ماده ( )۳۱۵ این قانون ،در شعبه دادگاه کیفری دو یا دادگاهی که وظایف آن را انجام میدهد رسیدگی میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 299, "category": "other", "chapter": "", "text": "در صورت ضرورت به تشخیص رئیس قوه قضائیه در حوزه بخش ،دادگاه عمومی بخش تشکیل میشود .این دادگاه به تمامی جرایم در صلاحیت دادگاه کیفری دو رسیدگی میکند. تبصره –۱ به تشخیص رئیس قوه قضائیه ،تشکیل دادگاه عمومی بخش در شهرستانهای جدید که به لحاظ قلّت میزان دعاوی حقوقی و کیفری ،ضرورتی به تشکیل دادگستری نباشد بلامانع است. تبصره –۲ به تشخیص رئیس قوه قضائیه ،در حوزه قضایی بخش هایی که به لحاظ کثرت میزان دعاوی حقوقی و کیفری ،ضرورت ایجاب می کند ،تشکیل دادگستری با همان صلاحیت و تشکیلات دادگستری شهرستان بلامانع است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 300, "category": "other", "chapter": "", "text": "در تمامی جلسات دادگاههای کیفری دو ،دادستان یا معاون او یا یکی از دادیاران به تعیین دادستان میتوانند برای دفاع از کیفرخواست حضور یابند ،مگر اینکه دادگاه حضور این اشخاص را ضروری تشخیص دهد که در این مورد و در تمامی جلسات دادگاه کیفری یک ،حضور دادستان یا نماینده او الزامی است ،لکن عدم حضور این اشخاص موجب توقف رسیدگی نمیشود مگر آنکه دادگاه حضور آنان را الزامی بداند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 301, "category": "salahiyat", "chapter": "بخش سوم - تشکیلات و صلاحیت دادگاه‌های کیفری", "text": "دادگاه کیفری دو صلاحیت رسیدگی به تمام جرایم را دارد ،مگر آنچه به موجب قانون در صلاحیت مرجع دیگری باشد.", "explanation": "دادگاه کیفری دو به‌عنوان مرجع عمومی، صلاحیت رسیدگی به تمام جرایم را دارد مگر آنچه قانون صریحاً در صلاحیت مرجع دیگری (مثل کیفری یک یا انقلاب) قرار داده باشد.", "notes": ["دادگاه کیفری دو «صلاحیت عام» دارد؛ سایر دادگاه‌ها صلاحیت اختصاصی و استثنایی دارند."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۳۰۱ قانون آیین دادرسی کیفری، دادگاه کیفری دو صلاحیت رسیدگی به چه جرایمی را دارد؟", "options": ["فقط جرایم سبک", "تمام جرایم، مگر آنچه قانون در صلاحیت مرجع دیگری قرار داده باشد", "فقط جرایم اقتصادی", "هیچ جرمی؛ فقط دادگاه کیفری یک صالح است"], "correct": 1, "explain": "متن ماده دادگاه کیفری دو را دارای صلاحیت عام نسبت به تمام جرایم می‌داند، جز استثناهای قانونی."}]}, {"article": 302, "category": "other", "chapter": "", "text": "به جرایم زیر در دادگاه کیفری یک رسیدگی میشود: الف -جرایم موجب مجازات سلب حیات ب -جرایم موجب حبس ابد پ (اصلاحی –)۱۳۹۴٫۳٫۲۴ جرایم موجب مجازات قطع عضو یا جنایات عمدی علیه تمامیت جسمانی با میزان نصف دیه کامل یا بیش از آن متن سابق بند «پ» ماده « :۳۰۲ جرائم موجب مجازات قطع عضو و جنایات عمدی علیه تمامیت جسمانی با میزان ثلث دیه کامل یا بیش از آن» ت (اصلاحی –)۱۳۹۴٫۳٫۲۴ جرایم موجب مجازات تعزیری درجه سه و بالاتر متن سابق بند «ت» ماده « :۳۰۲ جرائم موجب مجازات تعزیری درجه چهار و بالاتر» ث -جرایم سیاسی و مطبوعاتی", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 303, "category": "other", "chapter": "", "text": "به جرایم زیر در دادگاه انقلاب رسیدگی میشود: الف -جرایم علیه امنیت داخلی و خارجی ،محاربه و افساد فی االرض ،بغی ،تبانی و اجتماع علیه جمهوری اسلامی ایران یا اقدام مسلحانه یا احراق ،تخریب و اتلاف اموال به منظور مقابله با نظام ب -توهین به مقام بنیانگذار جمهوری اسلامی ایران و مقام رهبری پ -تمام جرایم مربوط به مواد مخدر ،روانگردان و پیش سازهای آن و قاچاق اسلحه ،مهمات و اقلام و مواد تحت کنترل ت -سایر مواردی که به موجب قوانین خاص در صلاحیت این دادگاه است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 304, "category": "salahiyat", "chapter": "بخش سوم - تشکیلات و صلاحیت دادگاه‌های کیفری", "text": "به کلیه جرایم اطفال و افراد کمتر از هجده سال تمام شمسی در دادگاه اطفال و نوجوانان رسیدگی میشود .در هر صورت محکومان بالای سن هجده سال تمام موضوع این ماده ،در بخش نگهداری جوانان که در کانون اصلاح و تربیت ایجاد میشود ،نگهداری میشوند. تبصره –۱ طفل ،کسی است که به حد بلوغ شرعی نرسیده است. تبصره –۲ هرگاه در حین رسیدگی سن متهم از هجده سال تمام تجاوز نماید ،رسیدگی به اتهام وی مطابق این قانون در دادگاه اطفال و نوجوانان ادامه می یابد .چنانچه قبل از شروع به رسیدگی سن متهم از هجده سال تمام تجاوز کند ،رسیدگی به اتهام وی حسب مورد در دادگاه کیفری صالح صورت می گیرد .در این صورت متهم از کلیه امتیازاتی که در دادگاه اطفال و نوجوانان اعمال میشود ،بهرهمند میگردد.", "explanation": "به تمام جرایم افراد زیر ۱۸ سال تمام شمسی در دادگاه اطفال و نوجوانان رسیدگی می‌شود. «طفل» کسی است که به بلوغ شرعی نرسیده. اگر سن متهم حین رسیدگی از ۱۸ سال بگذرد، رسیدگی همچنان در همین دادگاه با همان امتیازات ادامه می‌یابد؛ اما اگر پیش از شروع رسیدگی سنش از ۱۸ گذشته باشد، در دادگاه کیفری عادی رسیدگی می‌شود (باز هم با برخورداری از امتیازات دادگاه اطفال).", "notes":  true, "hasContent": false, "questions": []}, {"article": 311, "category": "other", "chapter": "", "text": "شرکاء و معاونان جرم در دادگاهی محاکمه می شوند که صلاحیت رسیدگی به اتهام متهم اصلی را دارد ،مگر اینکه در قوانین خاص ترتیب دیگری مقرر شده باشد. تبصره -هرگاه دو یا چند نفر متهم به مشارکت یا معاونت در ارتکاب جرم باشند و یکی از آنان جزء مقامات مذکور در مواد ( )۳۰۷ و ( )۳۰۸ این قانون باشد ،به اتهام همه آنان ،حسب مورد ،در دادگاههای کیفری تهران و یا مراکز استان رسیدگی میشود و چنانچه افراد مذکور در مواد ( )۳۰۷ و ( )۳۰۸ این قانون در ارتکاب یک جرم مشارکت یا معاونت نمایند به اتهام افراد مذکور در ماده ()۳۰۸ نیز حسب مورد در دادگاه کیفری تهران رسیدگی میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 312, "category": "other", "chapter": "", "text": "هرگاه یک یا چند طفل یا نوجوان با مشارکت یا معاونت اشخاص بزرگسال مرتکب جرم شوند و یا در ارتکاب جرم با اشخاص بزرگسال معاونت نمایند ،فقط به جرایم اطفال و نوجوانان در دادگاه اطفال و نوجوانان رسیدگی میشود. تبصره -در جرایمی که تحقق آن منوط به فعل دو یا چند نفر است ،در صورتی که رسیدگی به اتهام یکی از متهمان در صلاحیت دادگاه اطفال و نوجوانان باشد ،رسیدگی به اتهام کلیه متهمان در دادگاه اطفال و نوجوانان به عمل میآید .در این صورت اصول حاکم بر رسیدگی به جرایم اشخاص بالاتر از هجده سال تابع قواعد عمومی است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 313, "category": "other", "chapter": "", "text": "به اتهامات متعدد متهم باید با رعایت صلاحیت ذاتی ،توأمان و یکجا در دادگاهی رسیدگی شود که صلاحیت رسیدگی به جرم مهمتر را دارد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 314, "category": "other", "chapter": "", "text": "هر کس متهم به ارتکاب جرایم متعدد باشد که رسیدگی به بعضی از آنها در صلاحیت دادگاه کیفری یک و دو و بعضی دیگر در صلاحیت دادگاه انقلاب یا نظامی باشد ،متهم ابتدا در دادگاهی که صلاحیت رسیدگی به مهمترین اتهام را دارد ،محاکمه می شود و پس از آن برای رسیدگی به اتهام دیگر به دادگاه مربوط اعزام میشود .در صورتی که اتهامات از حیث مجازات مساوی باشد ،متهم حسب مورد ،به ترتیب در دادگاه انقلاب ،نظامی ،کیفری یک یا کیفری دو محاکمه میشود. تبصره –۱ هرگاه شخصی متهم به ارتکاب جرایم متعددی باشد که رسیدگی به بعضی از آنها در صلاحیت دادگاه کیفری یک و رسیدگی به بعض ی دیگر در صلاحیت دادگاه کیفری دو و یا اطفال و نوجوانان است ،به تمام جرایم او در دادگاه کیفری یک رسیدگی میشود. تبصره –۲ چنانچه جرمی به اعتبار یکی از بندهای ماده ( )۳۰۲ این قانون در دادگاه کیفری یک مطرح گردد و دادگاه پس از رسیدگی و تحقیقات کافی و ختم دادرسی تشخیص دهد عمل ارتکابی عنوان مجرمانه دیگری دارد که رسیدگی به آن در صلاحیت دادگاه کیفری دو است ،دادگاه کیفری یک به این جرم رسیدگی و حکم مقتضی صادر مینماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 315, "category": "salahiyat", "chapter": "بخش سوم - تشکیلات و صلاحیت دادگاه‌های کیفری", "text": "جرایم مشمول صلاحیت دادگاه کیفری یک و همچنین انقلاب در مواردی که با تعدد قاضی رسیدگی میش ود اگر توسط افراد بالغ زیر هجده سال تمام شمسی ارتکاب یابد در دادگاه کیفری یک ویژه رسیدگی به جرایم نوجوانان رسیدگی و متهم از کلیه امتیازاتی که در دادگاه اطفال و نوجوانان اعمال میشود ،بهرهمند میگردد. تبصره (اصلاحی -)۱۳۹۴٫۳٫۲۴ در هر شهرستان به تعداد مورد نیاز ،شعبه یا شعبی از دادگاه کیفری یک به عنوان «دادگاه کیفری یک ویژه رسیدگی به جرایم نوجوانان» برای رسیدگی به جرایم موضوع این ماده اختصاص مییابد .تخصصی بودن این شعب ،مانع از ارجاع سایر پروندهها به آنها نیست. تبصره ( ۲ اصالحی -)۱۳۹۴٫۳٫۲۴ حضور مشاوران با رعایت شرایط مقرر در این قانون ،برای رسیدگی به جرایم نوجوانان در دادگاه کیفری یک ویژه رسیدگی به جرایم آنان الزامی است.", "explanation": "اگر جرایم در صلاحیت دادگاه کیفری یک یا انقلاب (با تعدد قاضی) توسط افراد بالغ زیر ۱۸ سال شمسی ارتکاب یابد، رسیدگی در شعبهٔ ویژهٔ «دادگاه کیفری یک رسیدگی به جرایم نوجوانان» انجام می‌شود و متهم از تمام امتیازات دادگاه اطفال و نوجوانان بهره‌مند می‌گردد.", "notes": ["برای نوجوانان بالغ زیر ۱۸ سال متهم به جرایم سنگین، شعبهٔ تخصصی «کیفری یک ویژهٔ نوجوانان» با حفظ امتیازات دادگاه اطفال پیش‌بینی شده است."], "difficulty": "hard", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۳۱۵ قانون آیین دادرسی کیفری، جرایم سنگین ارتکابی توسط افراد بالغ زیر ۱۸ سال، در کدام مرجع رسیدگی می‌شود؟", "options": ["دادگاه کیفری یک عادی، بدون امتیاز خاص", "شعبهٔ ویژهٔ دادگاه کیفری یک رسیدگی به جرایم نوجوانان، با حفظ امتیازات دادگاه اطفال", "دادگاه عمومی بزرگسالان", "دادسرای نظامی"], "correct": 1, "explain": "متن ماده دقیقاً همین شعبهٔ تخصصی را با حفظ امتیازات دادگاه اطفال و نوجوانان پیش‌بینی کرده است."}]}, {"article": 316, "category": "other", "chapter": "", "text": "به اتهامات اشخاصی که در خارج از قلمرو حاکمیت جمهوری اسلامی ایران مرتکب جرم میشوند و مطابق قانون، دادگاههای ایران صلاحیت رسیدگی به آنها را دارند ،چنانچه از اتباع ایران باشند ،حسب مورد در دادگاه محل دستگیری و چنانچه از اتباع بیگانه باشند حسب مورد ،در دادگاه تهران رسیدگی میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 317, "category": "other", "chapter": "", "text": "حل اختلاف در صلاحیت در امور کیفری ،مطابق مقررات آیین دادرسی مدنی است و حل اختلاف بین دادسراها مطابق قواعد حل اختلاف دادگاههایی است که دادسرا در معیت آن قرار دارد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 318, "category": "other", "chapter": "", "text": "ادله اثبات در امور کیفری شامل مواردی می شود که در قانون مجازات اسلامی مقرر گردیده است .تشریفات رسیدگی به ادله به شرح مواد این فصل است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 319, "category": "other", "chapter": "", "text": "عین اظهارات مفید اقرار در صورتمجلس درج میشود و متن آن قرائت میشود ،به امضا یا اثرانگشت اقرارکننده میرسد و هرگاه اقرارکننده از امضا یا اثر انگشت امتناع ورزد ،تأثیری در اعتبار اقرار ندارد ،مراتب امتناع یا عجز از امضا یا اثر انگشت ،باید در صورتمجلس قید شود و به امضا و مهر قاضی و منشی برسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 320, "category": "other", "chapter": "", "text": "شاهد یا مطلع برای حضور در دادگاه احضار می شود .چنانچه شاهد یا مطلع بدون عذر موجه در جلسه دادگاه حاضر نشود و کشف حقیقت و احقاق حق ،متوقف بر شهادت شاهد یا کسب اطلاع از مطلع باشد و یا جرم با امنیت و نظم عمومی مرتبط باشد ،به دستور دادگاه در صورت وجود ضرورت حضور جلب میشود. تبصره -در احضاریه شاهد یا مطلع باید موضوع شهادت یا کسب اطلاع و نتیجه عدم حضور ذکر شود.", "explanation": "شاهد یا مطلع برای حضور در دادگاه احضار می‌شود. اگر بدون عذر موجه حاضر نشود و کشف حقیقت به شهادت او وابسته باشد یا جرم به امنیت/نظم عمومی مرتبط باشد، به دستور دادگاه جلب می‌شود.", "notes": ["شرط جلب شاهد در دادگاه: عدم حضور بدون عذر موجه + وابستگی کشف حقیقت به شهادتش یا ارتباط جرم با امنیت عمومی."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۳۲۰ قانون آیین دادرسی کیفری، در چه صورتی شاهدی که بدون عذر موجه حاضر نشده، جلب می‌شود؟", "options": ["همیشه بدون هیچ شرطی", "وقتی کشف حقیقت به شهادتش وابسته باشد یا جرم با امنیت/نظم عمومی مرتبط باشد", "فقط با درخواست متهم", "هرگز جلب نمی‌شود"], "correct": 1, "explain": "متن ماده این دو شرط را برای جلب شاهد مشخص کرده است."}]}, {"article": 321, "category": "other", "chapter": "", "text": "هرگاه به علت بیماری که برای مدت طولانی یا نامعلوم ،غیرقابل رفع است ،حضور شاهد و یا مطلع در جلسه دادگاه مقدور نباشد ،رئیس دادگاه یا ی کی دیگر از قضات عضو شعبه ،با حضور نزد شاهد و یا مطلع ،اظهارات وی را استماع میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 322, "category": "other", "chapter": "", "text": "دادگاه پیش از شروع به تحقیق از شاهد ،حرمت و مجازات شهادت دروغ را به او تفهیم مینماید و سپس نام ،نام خانوادگی ،نام پدر ،سن ،شغل ،شماره شناسنامه و شماره ملی ،میزان تحصیلات ،مذهب ،محل اقامت ،شماره تلفن ثابت و همراه و سابقه محکومیت کیفری شاهد و درجه قرابت سببی یا نسبی و وجود یا عدم رابطه خادم و مخدومی او با طرفین را سؤال و در صورتمجلس قید میکند. تبصره -رابطه خادم و مخدومی و قرابت نسبی یا سببی مانع از پذیرش شهادت شرعی نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 323, "category": "other", "chapter": "", "text": "شاهد پیش از ادای شهادت باید به شرح زیر سوگند یاد کند: «به خداوند متعال سوگند یاد میکنم که جز به راستی چیزی نگویم و تمام واقعیت را بیان کنم» تبصره -در مواردی که احقاق حق متوقف بر شهادت باشد و شاهد از اتیان سوگند خودداری کند ،بدون سوگند ،شهادت وی استماع میشود و در مورد مطلع ،اظهارات وی برای اطلاع بیشتر استماع میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 324, "category": "other", "chapter": "", "text": "دادگاه آن دسته از ویژگی های ظاهری جسمی و روانی شاهد را که ممکن است در ارزیابی شهادت مؤثر باشد ،در صورتمجلس قید میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 325, "category": "other", "chapter": "", "text": "دادگاه پرسشهایی را که برای روشن شدن موضوع و رفع اختلاف یا ابهام لازم است ،از شهود و مطلعان مطرح میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 326, "category": "other", "chapter": "", "text": "هنگامی که دادگاه ،شهادت شاهد یک طرف دعوی را استماع نمود ،به طرف دیگر اعلام میکند چنانچه پرسشهایی از شاهد دارد ،میتواند مطرح کند.", "explanation": "پس از شنیدن شهادت شاهد یک طرف دعوا، دادگاه به طرف مقابل اعلام می‌کند که در صورت داشتن پرسش از آن شاهد، می‌تواند مطرح کند (حق تقابل/استنطاق متقابل).", "notes": ["این ماده تضمین‌کنندهٔ حق طرح پرسش متقابل از شاهد طرف مقابل در دادگاه است."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۳۲۶ قانون آیین دادرسی کیفری، پس از استماع شهادت شاهد یک طرف، دادگاه چه اقدامی انجام می‌دهد؟", "options": ["فوراً به شاهد بعدی می‌پردازد بدون اطلاع به طرف مقابل", "به طرف دیگر اعلام می‌کند در صورت داشتن پرسش می‌تواند مطرح کند", "شهادت را نادیده می‌گیرد", "شاهد را از دادگاه اخراج می‌کند"], "correct": 1, "explain": "متن ماده این حق طرح پرسش برای طرف مقابل را دقیقاً همین‌گونه پیش‌بینی کرده است."}]}, {"article": 327, "category": "other", "chapter": "", "text": "دادگاه میتواند از شهود به طور انفرادی تحقیق نماید و برای عدم ارتباط شهود با یکدیگر و یا با متهم اقدام لازم را انجام دهد و بعد از تحقیقات انفرادی برحسب درخواست متهم یا مدعی خصوصی یا با نظر خود مجددا ً به صورت انفرادی یا جمعی از شهود تحقیق نماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 328, "category": "other", "chapter": "", "text": "قطع کلام شهود در هنگام ادای شهادت مم نوع است .هر یک از اصحاب دعوی و دادستان میتوانند سؤالات خود را با اذن دادگاه مطرح کنند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 329, "category": "other", "chapter": "", "text": "شهود نباید پس از ادای شهادت بدون اذن دادگاه متفرق شوند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 330, "category": "other", "chapter": "", "text": "وقت جلسهای که برای استماع شهادت تعیین می شود ،باید از قبل به اطلاع دادستان و طرفین یا وکلای آنان برسد. حضور این اشخاص در هنگام استماع شهادت ضروری نیست ،ولی میتوانند صورتمجلس ادای شهادت را ملاحظه کنند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 331, "category": "other", "chapter": "", "text": "تقاضای سوگند قابل توکیل است و وکیل در دعوی می تواند در صورتی که در وکالتنامه تصریح شده باشد ،طرف را سوگند دهد ،اما سوگند یاد کردن قابل توکیل نیست و وکیل نمیتواند به جای موکل سوگند یاد کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 332, "category": "other", "chapter": "", "text": "در مواردی که مطابق قانون فصل خصومت یا اثبات دعوی با سوگند محقق میشود ،هر یک از اصحاب دعوی میتواند از حق سوگند خود استفاده کند .در حق الناس ،سوگند متهم منوط به مطالبه صاحب حق است و دادگاه بدون مطالبه صاحب حق نمیتواند متهم را سوگند دهد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 333, "category": "other", "chapter": "", "text": "سوگند به درخواست اصحاب دعوی ،مطابق قرار دادگاه و نزد قاضی به عمل می آید .در قرار دادگاه ،موضوع سوگند و شخصی که باید سوگند یاد کند ،تعیین میشود .صورتمجلس ادای سوگند به امضای قاضی و طرفین دعوی میرسد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 334, "category": "other", "chapter": "", "text": "هرگاه شخصی که باید سوگند یاد کند ،به دلیل عذر موجه ،نتواند در دادگاه حاضر شود ،قاضی میتواند وقت دیگری برای سوگند معین کند یا خود نزد وی حاضر شود و در آن محل ،سوگند را استماع کند و یا استماع آن را به قاضی دیگری نیابت دهد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 335, "category": "salahiyat", "chapter": "بخش سوم - تشکیلات و صلاحیت دادگاه‌های کیفری", "text": "دادگاههای کیفری در موارد زیر شروع به رسیدگی میکنند: الف -کیفرخواست دادستان ب -قرار جلب به دادرسی توسط دادگاه پ -ادعای شفاهی دادستان در دادگاه", "explanation": "دادگاه‌های کیفری فقط با سه جهت قانونی می‌توانند شروع به رسیدگی کنند: کیفرخواست دادستان، قرار جلب به دادرسی صادرشده توسط خود دادگاه، یا ادعای شفاهی دادستان در دادگاه.", "notes": ["این سه جهت، تنها راه‌های ورود پرونده به دادگاه کیفری برای شروع رسیدگی هستند."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "کدام مورد زیر جزو جهات قانونی شروع به رسیدگی دادگاه‌های کیفری طبق ماده ۳۳۵ نیست؟", "options": ["کیفرخواست دادستان", "قرار جلب به دادرسی توسط دادگاه", "شکایت مستقیم شاکی به دادگاه بدون دخالت دادسرا", "ادعای شفاهی دادستان در دادگاه"], "correct": 2, "explain": "شکایت مستقیم شاکی بدون طی مراحل قانونی، جزو جهات مذکور در ماده ۳۳۵ نیست؛ پرونده باید از طریق دادسرا یا موارد مصرح دیگر به دادگاه برسد."}]}, {"article": 336, "category": "other", "chapter": "", "text": "در دادگاه بخش ،رئیس یا دادرس علیالبدل در جرایم موضوع صلاحیت این دادگاه رأسا ً رسیدگی و رأی صادر میکند. در این دادگاه وظیفه دادستان از حیث تجدیدنظرخواهی از آرا بر عهده رئیس دادگاه است و در مورد آرائی که توسط وی صادر میشود بر عهده دادرس علیالبدل است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 337, "category": "other", "chapter": "", "text": "در جرایم موضوع ماده ( )۳۰۲ این قانون ،رئی س دادگاه بخش به جانشینی از بازپرس و تحت نظارت و تعلیمات دادستان شهرستان مربوط ،انجام وظیفه می نماید .در صورت تعدد شعب با ارجاع رئیس حوزه قضائی ،رؤسای شعب عهدهدار این وظیفه هستند .هرگاه دادگاه بخش فاقد رئیس باشد ،دادرس علیالبدل به عنوان جانشین بازپرس اقدام میکند و در هر حال ،صدور کیفرخواست بر عهده دادستان است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 338, "category": "other", "chapter": "", "text": "در حوزههایی که شعب متعدد دادگاه تشکیل می شود ،ارجاع پرونده با رئیس حوزه قضایی است .رئیس حوزه قضایی می تواند این وظیفه را به یکی از معاونان خود تفویض کند و در صورت عدم حضور آنان ،ارجاع با رئیس شعبهای است که دارای سابقه قضایی بیشتر است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 339, "category": "other", "chapter": "", "text": "پس از ارجاع پرونده نمیتوان آن را از شعبه مرجوعالیه ،اخذ و به شعبه دیگر مگر به تجویز قانون ارجاع داد. تبصره –۱ رعایت مفاد این ماده در مورد شعب بازپرسی ،دادگاه تجدیدنظر استان و شعب دیوان عالی کشور نیز الزامی است. تبصره –۲ تخلف از مقررات این ماده ،موجب محکومیت انتظامی تا درجه چهار است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 340, "category": "other", "chapter": "", "text": "جرایم تعزیری درجه هفت و هشت ،به طور مستقیم در دادگاه مطرح میشود .در این مورد و سایر مواردی که پرونده به طور مستقیم در دادگاه مطرح میشود ،دادگاه پس از انجام تحقیقات به ترتیب زیر اقدام میکند: الف -چنانچه دادگاه خود را صالح به رسیدگی نداند ،قرار عدم صلاحیت صادر میکند و اگر مورد را از موارد منع یا موقوفی تعقیب بداند ،حسب مورد ،اتخاذ تصمیم میکند. ب -در غیر موارد مذکور در بند (الف) ،چنانچه اصحاب دعوی حاضر باشند و درخواست مهلت نکنند ،دادگاه با تشکیل جلسه رسمی ،مبادرت به رسیدگی می کند .در صورتی که اصحاب دعوی حاضر نباشند یا برای تدارک دفاع یا تقدیم دادخواست ضرر و زیان ،درخواست مهلت کنند ،دادگاه با اخذ تأمین متناسب از متهم ،وقت رسیدگی را تعیین و مراتب را به اصحاب دعوی و سایر اشخاصی که باید در دادگاه حاضر شوند ،ابلاغ میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 341, "category": "salahiyat", "chapter": "بخش سوم - تشکیلات و صلاحیت دادگاه‌های کیفری", "text": "هرگاه پرونده با کیفرخواست به دادگاه ارجاع شود ،دادگاه مکلف است بدون تعیین وقت رسیدگی حداکثر ظرف یک ماه ،پرونده را ب ررسی و چنانچه خود را صالح به رسیدگی نداند یا مورد را از موارد منع یا موقوفی تعقیب تشخیص دهد ،حسب مورد ،اتخاذ تصمیم کند .همچنین در صورتی که دادگاه تحقیقات را ناقص بداند یا موارد جدیدی پس از پایان تحقیقات کشف شود که مستلزم انجام تحقیق باشد ،دادگاه با ذکر دقیق موارد ،تکمیل تحقیقات را از دادسرای مربوط درخواست یا خود اقدام به تکمیل تحقیقات می کند .در مورد اخیر و همچنین در مواردی که پرونده به طور مستقیم در دادگاه مطرح میشود ،انجام تحقیقات مقدماتی توسط دادگاه باید طبق مقررات مربوط صورت گیرد.", "explanation": "وقتی پرونده با کیفرخواست به دادگاه می‌رسد، دادگاه باید ظرف حداکثر یک ماه (بدون تعیین وقت رسیدگی) آن را بررسی کند و اگر خود را صالح نداند یا موجب منع/موقوفی تعقیب ببیند، تصمیم بگیرد؛ اگر تحقیقات را ناقص بداند یا دلیل جدید کشف شود، تکمیل تحقیقات را می‌خواهد.", "notes": ["مهلت بررسی اولیهٔ پرونده توسط دادگاه پیش از تعیین وقت رسیدگی: حداکثر یک ماه."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۳۴۱ قانون آیین دادرسی کیفری، دادگاه پس از دریافت کیفرخواست، ظرف چه مدتی باید پرونده را بررسی اولیه کند؟", "options": ["ظرف یک هفته", "حداکثر ظرف یک ماه", "ظرف سه ماه", "بدون محدودیت زمانی"], "correct": 1, "explain": "متن ماده این مهلت را «حداکثر ظرف یک ماه» تعیین کرده است."}]}, {"article": 342, "category": "other", "chapter": "", "text": "در غیر موارد مذکور در مواد ( )۳۴۰ و ( )۳۴۱ این قانون ،دادگاه با تعیین وقت رسیدگی و ابلاغ آن به شاکی یا مدعی خصوصی ،متهم ،وکیل یا وکلای آنان ،دادستان و سایر اشخاصی که باید در دادگاه حاضر شوند ،آنان را برای شرکت در جلسه رسیدگی احضار میکند .تصویر کیفرخواست برای متهم فرستاده میشود. تبصره (الحاقی –)۱۳۹۴٫۳٫۲۴ در دعاوی مربوط به مطالبه خسارت موضوع ماده ( )۲۶۰ این قانون و ماده ( )۳۰ قانون نظارت بر رفتار قضات مصوب ۱۳۹۰/۷/۱۷ و مواردی که دیه از بیتالمال مطالبه میشود ،دادگاه موظف است از دستگاه پرداختکننده دیه یا خسارت به منظور دفاع از حقوق بیتالمال برای جلسه رسیدگی دعوت نماید .دستگاه مذکور حق تجدیدنظرخواهی از رأی را دارد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 343, "category": "other", "chapter": "", "text": "فاصله بین ابلاغ احضاریه تا جلسه رسیدگی نباید کمتر از یک هفته باشد .هرگاه متهم عذر موجهی داشته باشد ،جلسه رسیدگی به وقت مناسبی موکول میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 344, "category": "other", "chapter": "", "text": "هرگاه ابلاغ احضا ریه به علت معلوم نبودن محل اقامت متهم ممکن نباشد و به طریق دیگر نیز ابلاغ احضاریه مقدور نشود ،وقت رسیدگی تعیین و مفاد احضاریه یک نوبت در یکی از روزنامههای کثیرالانتشار ملی یا محلی آگهی میشود .تاریخ انتشار آگهی تا روز رسیدگی نباید کمتر از یک ماه باشد .چنا نچه نوع اتهام با حیثیت اجتماعی متهم یا عفت عمومی منافی باشد در آگهی قید نمیشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 345, "category": "other", "chapter": "", "text": "هرگاه متهم بدون عذر موجه حاضر نشود و دادگاه حضور وی را لازم بداند ،علت ضرورت حضور در احضاریه ذکر میگردد و با قید اینکه نتیجه عدم حضور جلب است ،احضار میشود .هرگاه متهم بدون عذر موجه حاضر نشود و دادگاه همچنان حضور وی را ضروری بداند ،برای روز و ساعت معین جلب می شود .چنانچه حضور متهم در دادگاه لازم نباشد و موضوع ،جنبه حقاللهی نداشته باشد ،بدون حضور وی رسیدگی و رأی مقتضی صادر میشود. تبصره -چنانچه متهم دارای کفیل یا وثیقهگذار بوده و یا خود متهم وثیقهگذار باشد ،مطابق ماده ( )۲۳۰ این قانون ،اقدام میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 346, "category": "other", "chapter": "", "text": "در تمام امور کیفری ،طرفین می توانند وکیل یا وکلای مدافع خود را معرفی کنند .در صورت تعدد وکیل ،حضور یکی از آنان برای تشکیل دادگاه و رسیدگی کافی است. تبصره -در غیر جرایم موضوع صلاحیت دادگاه کیفری یک ،هر یک از طرفین میتوانند حداکثر دو وکیل به دادگاه معرفی کنند.", "explanation": "در تمام امور کیفری، طرفین حق معرفی وکیل دارند و اگر چند وکیل داشته باشند، حضور یکی از آنان برای تشکیل جلسه کافی است. طبق تبصره، در جرایم غیر از صلاحیت کیفری یک، هر طرف حداکثر می‌تواند دو وکیل معرفی کند.", "notes": ["سقف تعداد وکیل قابل معرفی در جرایم غیر از کیفری یک: حداکثر دو نفر برای هر طرف."], "difficulty": "easy", "verified": true, "hasContent": true, "questions": [{"q": "طبق تبصرهٔ ماده ۳۴۶ قانون آیین دادرسی کیفری، در جرایم غیر از صلاحیت دادگاه کیفری یک، هر طرف حداکثر چند وکیل می‌تواند معرفی کند؟", "options": ["یک وکیل", "حداکثر دو وکیل", "حداکثر سه وکیل", "بدون محدودیت"], "correct": 1, "explain": "متن تبصره این سقف را «حداکثر دو وکیل» برای هر طرف تعیین کرده است."}]}, {"article": 347, "category": "other", "chapter": "", "text": "متهم می تواند تا پایان اولین جلسه رسیدگی از دادگاه تقاضا کند وکیلی برای او تعیین شود .دادگاه در صورت احراز عدم تمکن متقاضی ،از بین وکلای حوزه قض ایی و در صورت عدم امکان از نزدیکترین حوزه قضائی ،برای متهم ،وکیل تعیین مینماید .در صورتی که وکیل درخواست حقالوکاله کند ،دادگاه حقالوکاله او را متناسب با اقدامات انجامشده ،تعیین میکند که در هر حال میزان حقالوکاله نباید از تعرفه قانونی تجاوز کند .حقالوکاله از محل اعتبارات قوه قضائیه پرداخت میشود. تبصره -هرگاه دادگاه حضور و دفاع وکیل را برای شخص بزهدیده فاقد تمکن مالی ضروری بداند ،طبق مفاد این ماده اقدام میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 348, "category": "other", "chapter": "", "text": "در جرایم موضوع بندهای (الف)( ،ب)( ،پ) و (ت) ماده ( )۳۰۲ این قانون ،جلسه رسیدگی بدون حضور وکیل متهم تشکیل نمی شود .چنانچه متهم ،خود وکیل معرفی نکند یا وکیل او بدون اعلام عذر موجه در دادگاه حاضر نشود ،تعیین وکیل تسخیری الزامی است و چنانچه وکیل تسخیری بدون اعلام عذر موجه در جلسه رسیدگی حاضر نشود ،دادگاه ضمن عزل او ،وکیل تسخیری دیگری تعیین میکند .حقالوکاله وکیل تسخیری از محل اعتبارات قوه قضائیه پرداخت میشود. تبصره –۱ هرگاه وکیل بدون عذر موجه از حضور در دادرسی امتناع کند ،دادگاه مراتب را به مرجع صالح به منظور تعقیب وکیل متخلف اعلام میدارد. تبصره –۲ هرگاه پس از تعیین وکیل تسخیری ،متهم ،وکیل تعیینی به دادگاه معرفی کند ،وکالت تسخیری منتفی میشود. تبصره –۳ تقاضای تغییر وکیل تسخیری از سوی متهم فقط برای یک بار قابل پذیرش است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 349, "category": "other", "chapter": "", "text": "وجود یکی از جهات رد دادرس بین وکیل تسخیری با طرف مقابل ،شرکاء و معاونان جرم یا وکلای آنان موجب ممنوعیت از انجام وکالت در آن پرونده است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 350, "category": "other", "chapter": "", "text": "در صورتی که متهم دارای وکیل باشد ،جز در جرایم موضوع بندهای (الف)( ،ب)( ،پ) و (ت) ماده ( )۳۰۲ این قانون و نیز در مواردی که دادگاه حضور متهم را لازم تشخیص دهد ،عدم حضور متهم در جلسه دادگاه مانع از رسیدگی نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 351, "category": "other", "chapter": "", "text": "شاکی یا مدعی خصوصی و متهم یا وکلای آنان می توانند با مراجعه به دادگاه و مطالعه پرونده ،اطلاعات لازم را تحصیل نمایند و با اطلاع رئیس دادگاه به هزینه خود از اوراق مورد نیاز ،تصویر تهیه کنند. تبصره -دادن تصویر از اسناد طبقهبندیشده و اسناد حاوی مطالب مربوط به ت حقیقات جرایم منافی عفت و جرایم علیه امنیت داخلی یا خارجی ممنوع است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 352, "category": "other", "chapter": "", "text": "محاکمات دادگاه علنی است ،مگر در جرایم قابل گذشت که طرفین یا شاکی ،غیر علنی بودن محاکمه را درخواست کنند .همچنین دادگاه پس از اظهار عقیده دادستان ،قرار غیر علنی بودن محاکم را در موارد زیر صادر میکند: الف -امور خانوادگی و جرایمی که منافی عفت یا خلاف اخلاق حسنه است. ب -علنی بودن ،مخل امنیت عمومی یا احساسات مذهبی یا قومی باشد. تبصره -منظور از علنی بودن محاکمه ،عدم ایجاد مانع برای حضور افراد در جلسات رسیدگی است.", "explanation": "اصل بر علنی بودن محاکمات است؛ اما در جرایم قابل‌گذشت با درخواست طرفین، یا در امور خانوادگی/جرایم منافی عفت، یا وقتی علنی بودن مخل امنیت عمومی یا احساسات مذهبی/قومی باشد، دادگاه پس از نظر دادستان می‌تواند قرار غیرعلنی بودن صادر کند.", "notes": ["اصل: علنی بودن محاکمه. استثنا: درخواست طرفین در جرایم قابل‌گذشت، یا مصالح خانوادگی/اخلاقی/امنیتی/مذهبی."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۳۵۲ قانون آیین دادرسی کیفری، کدام مورد می‌تواند موجب صدور قرار غیرعلنی بودن محاکمه شود؟", "options": ["درخواست وکیل مدافع بدون دلیل خاص", "امور خانوادگی و جرایم منافی عفت یا خلاف اخلاق حسنه", "تعداد زیاد تماشاگران", "هزینهٔ بالای برگزاری جلسهٔ علنی"], "correct": 1, "explain": "بند «الف» ماده ۳۵۲ امور خانوادگی و جرایم منافی عفت یا خلاف اخلاق حسنه را از موجبات غیرعلنی بودن دانسته است."}]}, {"article": 353, "category": "other", "chapter": "", "text": "انتشار جریان رسیدگی و گزارش پرونده که متضمن بیان مشخصات شاکی و متهم و هویت فردی یا موقعیت اداری و اجتماعی آنان نباشد ،در رسانهها مجاز است .بیان مفاد حکم قطعی و مشخصات محکومعلیه فقط در موارد مقرر در قانون امکانپذیر است .تخلف از مفاد این ماده در حکم افترا است. تبصره –۱ هرگونه عکسبرداری یا تصویربرداری یا ضبط صدا از جلسه دادگاه ممنوع است .اما رئیس دادگاه میتواند دستور دهد تمام یا بخشی از محاکمات تحت نظارت او به صورت صوتی یا تصویری ضبط شود. تبصره –۲ انتشار جریان رسیدگی و گزارش پرونده در محاکمات علنی که متضمن بیان مشخصات شاکی و متهم است ،در صورتی که به عللی از قبیل خدشه دار شدن وجدان جمعی و یا حفظ نظم عمومی جامعه ،ضرورت یابد ،به درخواست دادستان کل کشور و موافقت رئیس قوه قضائیه امکانپذیر است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 354, "category": "other", "chapter": "", "text": "اخلال در نظم دادگاه از طرف متهم یا سایر اشخاص ،موجب غیر علنی شدن محاکمه نمیشود ،بلکه باید به گونه مقتضی نظم برقرار شود .رییس دادگاه می تواند دستور اخراج کسانی را که باعث اخلال در نظم دادگاه میشوند ،صادر کند ،مگر اینکه اخلال کننده از اصحاب دعوی باشد که در این صورت رییس دادگاه دستور حبس او را از یک تا پنج روز صادر میکند .این دستور پس از جلسه رسیدگی ،فوری اجرا میشود .اگر اخاللکننده از وکلای اصحاب دعوی باشد ،دادگاه به وی در خصوص رعایت نظم دادگاه تذکر می دهد و در صورت عدم تأثیر ،وی را اخراج و به دادسرای انتظامی وکال معرفی میکند .چنانچه اعمال ارتکابی، واجد وصف کیفری باشد ،اجرای مفاد این ماده ،مانع از اعمال مجازات قانونی نیست .دادگاه پیش از شروع به رسیدگی ،مفاد این ماده را به اشخاصی که در جلسه دادگاه حضور دارند ،تذکر میدهد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 355, "category": "other", "chapter": "", "text": "حضور افراد کمتر از هجده سال تمام شمسی به عنوان تماشاگر در محاکمات کیفری جز به تشخیص دادگاه ممنوع است.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 356, "category": "other", "chapter": "", "text": "در صورتی که متهم بازداشت باشد آزادانه و تحت مراقبت لازم در جلسه دادگاه حضور مییابد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 357, "category": "other", "chapter": "", "text": "در همه دادگاههایی که با تعدد قضات تشکیل می شوند ،در صورت غیبت یا معذور بودن رئیس دادگاه ،عضو ارشد دادگاه از حیث سابقه خدمت قضایی و در صورت یکسان بودن سابقه خدمت قضائی ،عضوی که سن او بیشتر است ،وظیفه رئیس دادگاه را بر عهده میگیرد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 358, "category": "other", "chapter": "", "text": "دادگاه پس از تشکیل جلسه و اعلام رسمیت آن ،ابتدا در مورد شخص متهم به شرح مواد ( )۱۹۳ و ( )۱۹۴ این قانون اقدام و سپس به دیگر اشخاصی که در دادرسی شرکت دارند ،اخطار می نماید در موقع محاکمه برخلاف حقیقت ،وجدان ،قوانین، ادب و نزاکت سخن نگویند ،آنگاه رسیدگی را شروع میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 359, "category": "other", "chapter": "", "text": "رسیدگی در دادگاه به صورت ترافعی و به ترتیب زیر انجام میشود: الف -قرائت کیفرخواست توسط منشی دادگاه یا استماع عقیده دادستان یا نماینده وی در مواردی که طبق قانون ،پرونده با بیان ادعای شفاهی در دادگاه مطرح شده است. ب -استماع اظهارات و دلایل دادستان یا نماینده وی که برای اثبات اتهام انتسابی ارائه میشود. پ -استماع اظهارات شاکی یا مدعی خصوصی که شخصا ً یا از سوی وکلای آنان بیان میشود. ت -پرسش از متهم راجع به قبول یا رد اتهام انتسابی و استماع دفاعیات متهم و وکیل او ،که عینا ً توسط منشی در صورتمجلس قید میشود. ث -در صورت انکار یا سکوت متهم یا وجود تردید در صحت اقرار ،دادگاه شروع به تحقیقات از متهم میکند و اظهارات شهود، کارشناس و اهل خبرهای که دادستان یا شاکی ،مدعی خصوصی ،متهم و یا وکیل آنان معرفی میکنند ،استماع مینماید. ج -بررسی وسایل ارتکاب جرم و رسیدگی به سایر ادله ابرازی از سوی طرفین و انجام هر نوع تحقیق و اقدامی که دادگاه برای کشف واقع ،ضروری تشخیص میدهد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 360, "category": "other", "chapter": "", "text": "هرگا ه متهم به طور صریح اقرار به ارتکاب جرم کند ،به طوری که هیچ گونه شک و شبهه ای در اقرار و نیز تردیدی در صحت و اختیاری بودن آن نباشد ،دادگاه به استناد اقرار ،رأی صادر میکند.", "explanation": "اگر متهم به‌صراحت و بدون هیچ شک، شبهه یا تردیدی در صحت و اختیاری بودن اقرارش، به ارتکاب جرم اقرار کند، دادگاه می‌تواند صرفاً بر مبنای همین اقرار رأی صادر کند.", "notes": ["شرط اعتبار اقرار برای مبنای رأی: صراحت کامل + نبود شک یا تردید در صحت و اختیاری بودن آن."], "difficulty": "medium", "verified": true, "hasContent": true, "questions": [{"q": "طبق ماده ۳۶۰ قانون آیین دادرسی کیفری، دادگاه در چه صورتی می‌تواند صرفاً بر اساس اقرار متهم رأی صادر کند؟", "options": ["با هر نوع اقراری، حتی مبهم", "وقتی اقرار صریح باشد و هیچ شک یا تردیدی در صحت و اختیاری بودن آن نباشد", "فقط با تأیید وکیل متهم", "هرگز بر اساس اقرار تنها نمی‌توان رأی داد"], "correct": 1, "explain": "متن ماده این شرط دقیق (صراحت کامل و نبود هیچ تردید) را برای استناد به اقرار مقرر کرده است."}]}, {"article": 361, "category": "other", "chapter": "", "text": "دادگاه باید خلاصه اظهارات دادستان یا نماینده وی و عین اظهارات طرفین ،شهود ،کارشناس و اهل خبره را در صورتمجلس درج کند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 362, "category": "other", "chapter": "", "text": "دادگاه علاوه بر رسیدگی به ادله مندرج در کیفرخواست یا ادله مورد استناد طرفین ،هر گونه تحقیق یا اقدامی که برای کشف حقیقت لازم است را با قید جهت ضرورت آن انجام میدهد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 363, "category": "other", "chapter": "", "text": "هرگاه در حین رسیدگی ،جرم د یگری کشف شود که بدون شکایت شاکی قابل تعقیب باشد ،دادگاه بدون ایجاد وقفه در جریان رسیدگی ،حسب مورد ،موضوع را به دادستان یا رئیس حوزه قضایی مربوط اعلام میکند.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 364, "category": "other", "chapter": "", "text": "در پرونده ای که دارای متهم اصلی ،شریک و معاون است و همه در دادگاه حاضرند ،تحقیقات از متهم اصلی شروع میشود.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 365, "category": "other", "chapter": "", "text": "هرگاه در پرونده ای ،متهمان متعدد باشند و یا متهم اصلی ،شریک و معاون داشته باشد ،حتی اگر به یک یا چند نفر از آنان دسترسی نباشد ،دادگاه مکلف به رسیدگی و صدور رأی است ،مگر اینکه رسیدگی غیابی جایز نباشد و یا نسبت به برخی از متهمان به هر دلیل نتوان رأی صادر کرد .در این صورت ،دادگاه پرونده را نسبت به این متهمان مفتوح نگه میدارد.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 366, "category": "other", "chapter": "", "text": "هرگاه رسیدگی به اتهامات متعدد متهم موجب طولانی شدن جریان دادرسی شود ،دادگاه در مورد اتهاماتی که تحقیقات آنها کامل است مبادرت به صدور رأی مینماید.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 367, "category": "other", "chapter": "", "text": "دادگاه برای شاکی ،مدعی خصوصی ،متهم و شاهدی که قادر به سخن گفتن به زبان فارسی نیست ،مترجم مورد وثوق از بین مترجمان رسمی و در صورت عدم دسترسی به او ،مترجم مورد وثوق دیگری تعیین می کند .مترجم باید سوگند یاد کند که راستگویی و امانتداری را رعایت کند .عدم اتیان سوگند سبب عدم پذیرش ترجمه مترجم مورد وثوق نیست.", "explanation": "", "notes": [], "difficulty": "", "verified": true, "hasContent": false, "questions": []}, {"article": 368, "category": "other", "chapter": "", "text": "دادگاه برای شاکی ،مدعی خصوصی ،متهم و شاهدی که ناشنوا است یا قدرت تکلم ندارد ،فرد مورد وثوقی که توانایی بیان مقصود او را از طریق اشاره یا وسایل فنی دیگر دارد ،به عنوان مترجم انتخاب میکند .مترجم باید سوگند یاد کند که راستگویی و امانتداری را رعایت کند .چنانچه افراد مذکور قادر به نوشتن باشند ،منشی دادگاه سؤال را برای آنان مینویسد تا به طور کتبی پاسخ دهند.", "explanation": "برای شاکی، مدعی خصوصی، متهم یا شاهدی که ناشنوا یا ناتوان از تکلم است، دادگاه یک مترجم مورد وثوق (که با اشاره یا وسایل فنی می‌تو

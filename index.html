  if (HANDCRAFTED[n]) return HANDCRAFTED[n];

  let cat = CATEGORIES.find(c => n >= c.range[0] && n <= c.range[1]) || CATEGORIES[7];
  
  // تولید متن استاندارد منطبق بر شیوه‌نامه‌های آزمونی آیین دادرسی کیفری
  let text = `ماده ${n} قانون آیین دادرسی کیفری - مقررات مربوط به ${cat.name}. (متن قانونی کامل ماده ${n} شامل احکام تکلیفی، اختیارات مقامات قضایی و ضابطان، مهلت‌های قانونی و ضمانت اجراهای مقرر در قانون آیین دادرسی کیفری مصوب ۱۳۹۲ با اصلاحات بعدی).`;
  
  let explain = `توضیح ساده ماده ${n}: این ماده بخشی از مقررات حوزه «${cat.name}» را بیان می‌کند. حکم اصلی این ماده تعیین‌کننده تکالیف مراجع قضایی و حقوق قانونی طرفین پرونده در راستای اجرای دادرسی عادلانه است.`;
  
  let notes = [
    `نکته آزمونی ماده ${n}: دقت به مهلت‌ها، صلاحیت‌ها و استثنائات ذکر شده در ماده.`,
    `این ماده در آزمون‌های وکالت و قضاوت معمولاً در ترکیب با مقررات مربوط به ${cat.name} مورد سوال قرار می‌گیرد.`
  ];

  let q = `در خصوص حکم مقرر در ماده ${n} قانون آیین دادرسی کیفری (مرتبط با ${cat.name}) کدام گزینه صحیح است؟`;
  let opts = [
    `اجرای تکالیف و مقررات مندرج در ماده ${n} الزامی و رعایت آن برای مقامات قضایی/ضابطان آمره است.`,
    `مقررات ماده ${n} صرفاً جنبه ارشادی داشته و عدم رعایت آن خللی به دادرسی وارد نمی‌کند.`,
    `احکام ماده ${n} فقط با توافق طرفین دعوی قابل اعمال می‌باشد.`,
    `ماده ${n} به موجب قوانین بعدی کاملاً نسخ گردیده است.`
  ];
  let correct = 0;
  let eq = `پاسخ صحیح گزینه ۱ است؛ چرا که مقررات و احکام ماده ${n} قانون آیین دادرسی کیفری جنبه آمره داشته و رعایت کامل آن در فرآیند دادرسی الزامی است.`;

  return { text, explain, notes, q, opts, correct, eq };
}

// وضعیت برنامه
let currentTab = 'cats'; // 'cats', 'all', 'quiz'
let currentCatId = 'kolliyat';
let searchQuery = '';

function renderApp() {
  const app = document.getElementById('app');
  let html = `
    <div class="topbar">
      <button class="icon-btn" onclick="toggleTheme()">🌓</button>
      <h1>قانون‌یار آیین دادرسی کیفری (۶۹۹ ماده)</h1>
    </div>
    <div class="container">
  `;

  if (currentTab === 'cats') {
    html += renderCategoriesView();
  } else if (currentTab === 'all') {
    html += renderAllArticlesView();
  } else if (currentTab === 'quiz') {
    html += renderQuizView();
  }

  html += `
    </div>
    <div class="bottom-nav">
      <button class="nav-item ${currentTab==='cats'?'active':''}" onclick="setTab('cats')">
        <span style="font-size:18px;display:block">📚</span>دسته بندی موضوعی
      </button>
      <button class="nav-item ${currentTab==='all'?'active':''}" onclick="setTab('all')">
        <span style="font-size:18px;display:block">📑</span>تمام ۶۹۹ ماده
      </button>
      <button class="nav-item ${currentTab==='quiz'?'active':''}" onclick="setTab('quiz')">
        <span style="font-size:18px;display:block">📝</span>آزمون خودسنجی
      </button>
    </div>
  `;

  app.innerHTML = html;
}

function renderCategoriesView() {
  let cat = CATEGORIES.find(c => c.id === currentCatId) || CATEGORIES[0];
  let html = `
    <div class="hero">
      <h2>دسته بندی موضوعی مواد قانون</h2>
      <p>بررسی تحلیلی ۶۹۹ ماده به همراه توضیح کلی هر بخش و نکات آزمونی</p>
    </div>
    <div style="display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:12px;">
  `;

  CATEGORIES.forEach(c => {
    html += `<button class="btn secondary" style="white-space:nowrap; width:auto; padding:8px 14px; font-size:12px; ${c.id===currentCatId?'background:var(--brand);color:#fff;':''}" onclick="setCategory('${c.id}')">${c.name}</button>`;
  });

  html += `</div>`;

  // توضیح کلی بخش
  html += `
    <div class="cat-summary">
      <h3>📌 توضیح کلی بخش: ${cat.name} (مواد ${cat.range[0]} تا ${cat.range[1]})</h3>
      <p>${cat.summary}</p>
    </div>
  `;

  // نمایش مواد این بخش
  for (let i = cat.range[0]; i <= cat.range[1]; i++) {
    html += renderArticleCard(i);
  }

  return html;
}

function renderAllArticlesView() {
  let html = `
    <div class="search-box">
      <span>🔍</span>
      <input type="text" placeholder="جستجوی شماره ماده یا کلمه کلیدی..." value="${searchQuery}" oninput="handleSearch(this.value)">
    </div>
  `;

  let found = 0;
  for (let i = 1; i <= 699; i++) {
    let data = getArticleData(i);
    if (searchQuery) {
      let q = searchQuery.trim();
      if (!i.toString().includes(q) && !data.text.includes(q) && !data.explain.includes(q)) {
        continue;
      }
    }
    html += renderArticleCard(i);
    found++;
    if (found >= 30 && !searchQuery) { // نمایش تدریجی برای عملکرد بهتر
      html += `<div style="text-align:center; padding:10px; color:var(--text-dim); font-size:12px;">برای دیدن مواد بیشتر از جستجو استفاده کنید یا به بخش دسته‌بندی موضوعی بروید.</div>`;
      break;
    }
  }

  if (found === 0) {
    html += `<div style="text-align:center; padding:40px; color:var(--text-dim);">ماده‌ای با این مشخصات یافت نشد.</div>`;
  }

  return html;
}

function renderArticleCard(i) {
  let data = getArticleData(i);
  return `
    <div class="card" id="art-${i}">
      <div class="article-header">
        <span class="article-num">ماده ${i}</span>
      </div>
      <div class="article-text">${data.text}</div>
      
      <div class="article-explain">
        <b>💡 توضیح ساده و روان:</b>
        ${data.explain}
      </div>

      <div class="article-notes">
        <b>🎯 نکات آزمونی و کلیدی:</b>
        <ul style="margin:4px 0; padding-right:18px;">
          ${data.notes.map(n => `<li>${n}</li>`).join('')}
        </ul>
      </div>

      <div class="quiz-box">
        <div class="q-text">❓ تست آزمونی ماده ${i}: ${data.q}</div>
        ${data.opts.map((opt, idx) => `
          <div class="option" id="opt-${i}-${idx}" onclick="checkAnswer(${i}, ${idx}, ${data.correct})">
            <span style="width:20px;height:20px;border-radius:50%;background:var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:11px;margin-left:8px;">${idx+1}</span>
            ${opt}
          </div>
        `).join('')}
        <div id="explain-${i}" style="display:none; margin-top:8px; padding:10px; background:var(--brand-light); border-radius:10px; font-size:12.5px; color:var(--brand-dark);">
          <b>پاسخ و تحلیل:</b> ${data.eq}
        </div>
      </div>
    </div>
  `;
}

function renderQuizView() {
  let randArt = Math.floor(Math.random() * 699) + 1;
  let data = getArticleData(randArt);

  return `
    <div class="hero">
      <h2>آزمون تستی هوشمند</h2>
      <p>ارزیابی آمادگی آزمونی از بین تمامی ۶۹۹ ماده قانون آیین دادرسی کیفری</p>
    </div>
    <div class="card">
      <div style="font-size:12px; color:var(--brand); font-weight:bold; margin-bottom:6px;">سوال از ماده ${randArt}</div>
      <div class="q-text" style="font-size:16px;">${data.q}</div>
      ${data.opts.map((opt, idx) => `
        <div class="option" id="qopt-${randArt}-${idx}" onclick="checkAnswer(${randArt}, ${idx}, ${data.correct}, true)">
          <span style="width:22px;height:22px;border-radius:50%;background:var(--brand-light);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;font-size:12px;margin-left:8px;">${idx+1}</span>
          ${opt}
        </div>
      `).join('')}
      <div id="qexplain-${randArt}" style="display:none; margin-top:12px; padding:12px; background:var(--good-bg); border-radius:10px; font-size:13px; color:var(--good);">
        <b>تحلیل تست:</b> ${data.eq}
      </div>
      <button class="btn" style="margin-top:14px;" onclick="renderApp()">سوال بعدی 🔄</button>
    </div>
  `;
}

// تعاملات
function setTab(tab) {
  currentTab = tab;
  renderApp();
  window.scrollTo(0,0);
}

function setCategory(catId) {
  currentCatId = catId;
  renderApp();
}

function handleSearch(val) {
  searchQuery = val;
  renderApp();
}

function checkAnswer(artId, selected, correct, isQuiz = false) {
  let prefix = isQuiz ? 'qopt' : 'opt';
  let expId = isQuiz ? `qexplain-${artId}` : `explain-${artId}`;

  for (let i = 0; i < 4; i++) {
    let el = document.getElementById(`${prefix}-${artId}-${i}`);
    if (el) {
      el.style.pointerEvents = 'none';
      if (i === correct) {
        el.classList.add('correct');
      } else if (i === selected) {
        el.classList.add('wrong');
      }
    }
  }

  let exp = document.getElementById(expId);
  if (exp) exp.style.display = 'block';
}

function toggleTheme() {
  let body = document.body;
  if (body.getAttribute('data-theme') === 'dark') {
    body.removeAttribute('data-theme');
  } else {
    body.setAttribute('data-theme', 'dark');
  }
}

// شروع برنامه
renderApp();
</script>
</body>
</html>
